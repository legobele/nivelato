<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="manifest.json" />
<title>Nivelato - Users</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0f;
    --card: #101013;
    --line: #2a2a2e;
    --line-soft: #1f1f23;
    --text: #f1f1f2;
    --muted: #9a9aa0;
    --faint: #6d6d74;
    --blue: #1e9df0;
    --teal1: #2dd4bf;
    --teal2: #1e9df0;
    --red: #e03131;
    --red-dark: #b3271e;
    --green: #51cf66;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .shell { display: flex; min-height: 100vh; }

  /* ---------- sidebar (shared component with updates.html) ---------- */
  .sidebar {
    width: 300px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #0b0b0d;
  }
  .org-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 6px 16px;
  }
  .org-avatar {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    letter-spacing: 1px;
  }
  .org-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .org-version { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .nav-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    text-align: center;
    text-decoration: none;
  }
  .nav-btn.soon { color: var(--muted); cursor: default; }
  .nav-btn .soon-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--faint);
    border: 1px solid var(--line-soft);
    border-radius: 9999px;
    padding: 1px 7px;
  }
  .nav-btn.active {
    border-color: var(--line);
    background: var(--card);
    cursor: default;
  }
  .nav-btn.active .nav-label { font-weight: 700; }
  .nav-btn.active .nav-sub {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .nav-btn .dot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
  }
  .nav-btn .dot.on { background: var(--blue); border-color: var(--blue); }

  /* ---------- user list column ---------- */
  .users-col {
    width: 340px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .users-title { font-size: 13px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .12em; padding: 4px 6px 0; }
  .user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    background: transparent;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }
  .user-card:hover { border-color: var(--faint); }
  .user-card.selected {
    background: linear-gradient(135deg, var(--teal1), var(--teal2));
    border-color: transparent;
  }
  .user-card.selected .u-name, .user-card.selected .u-email { color: #06281f; }
  .u-avatar {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    position: relative;
  }
  .u-online {
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--bg);
  }
  .user-card.selected .u-online { border-color: transparent; }
  .u-meta { min-width: 0; flex: 1; }
  .u-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .u-email {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  /* ---------- detail panel ---------- */
  .detail {
    flex: 1;
    padding: 40px 36px;
    min-width: 0;
  }
  .detail-head { text-align: center; margin-bottom: 28px; }
  .detail-name { font-size: 20px; font-weight: 700; }
  .detail-email { font-size: 14px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 880px;
    margin: 0 auto;
  }
  .panel {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--card);
    padding: 20px 22px;
  }
  .panel h3 { font-size: 15px; font-weight: 700; margin: 0 0 14px; text-align: center; }
  .proj-row {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .proj-thumb {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 10px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--faint);
    font-weight: 600;
  }
  .proj-name { font-size: 14px; font-weight: 600; }
  .proj-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty { text-align: center; color: var(--faint); font-size: 13px; padding: 18px 0; }

  /* toggle switches */
  .perm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
  }
  .perm-row:last-of-type { border-bottom: 0; }
  .toggle {
    position: relative;
    width: 52px;
    height: 30px;
    flex: none;
    border-radius: 9999px;
    border: 0;
    background: #3a3a40;
    cursor: pointer;
    transition: background .15s;
  }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s;
  }
  .toggle.on { background: var(--green); }
  .toggle.on .knob { left: 25px; }
  .toggle:disabled { opacity: .55; cursor: default; }

  .btn {
    display: block;
    width: 100%;
    padding: 13px 16px;
    border-radius: 9999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn:hover { border-color: var(--faint); }
  .btn-danger {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    max-width: 880px;
    margin: 24px auto 0;
    padding: 15px 16px;
    font-size: 15px;
  }
  .btn-danger:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn-danger:disabled { opacity: .5; cursor: default; }
  .delete-note { text-align: center; color: var(--faint); font-size: 12px; margin-top: 10px; }
  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 60px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
    max-width: 560px;
    margin: 60px auto;
  }
  .perm-note { font-size: 12px; color: var(--faint); text-align: center; margin-top: 10px; }

  @media (max-width: 1100px) {
    .detail-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: 16px;
    }
    .sidebar .nav-btn { display: none; }
    .org-head { padding: 0; }
    .org-avatar { width: 48px; height: 48px; font-size: 16px; }
    .users-col {
      width: 100%;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      max-height: none;
    }
    .detail { padding: 24px 16px; }
  }
</style>
<link rel="stylesheet" href="./qgc-theme.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Company navigation">
    <div class="org-head">
      <div class="org-avatar" id="org-avatar">--</div>
      <div>
        <div class="org-name" id="org-name">Loading...</div>
        <div class="org-version" id="org-version">Nivelato</div>
      </div>
    </div>
    <button class="nav-btn active" aria-current="page"><span class="nav-label">Users</span></button>
    <button class="nav-btn soon" disabled>Projects<span class="soon-badge">soon</span></button>
    <button class="nav-btn soon" disabled>Billing<span class="soon-badge">soon</span></button>
    <a class="nav-btn" href="/company/updates" id="nav-updates">
      <span class="nav-label">Updates</span>
      <span class="nav-sub" id="updates-sub">Checking...</span>
      <span class="dot" id="updates-dot"></span>
    </a>
  </aside>

  <section class="users-col" aria-label="Company users">
    <div class="users-title">Team</div>
    <div id="user-list"><div class="state-loading">Loading users...</div></div>
  </section>

  <main class="detail" id="detail"><div class="state-loading">Select a user to see details.</div></main>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, getDocs, collection, query, where, updateDoc
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { startPresence, getOnlineUsers } from './presence.js';
import { PERM_DEFS, makePermChecker, orgHasQuotes } from './permissions.js';
import { ensureFlowClaims } from './geo.js';

const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

// English labels for the 10 permission keys (PERM_DEFS order).
const PERM_LABELS_EN = {
  viewDashboard: 'View dashboard',
  createMeasurements: 'Create measurements',
  viewOwnMeasurements: 'View own measurements',
  editOwnMeasurements: 'Edit own measurements',
  viewOthersMeasurements: "View others' measurements",
  editOthersMeasurements: "Edit others' measurements",
  managePriceList: 'Manage price list',
  createQuotes: 'Create quotes',
  approveQuotes: 'Approve quotes',
  userManagement: 'Manage users'
};
const PERM_KEYS = PERM_DEFS.map(d => d.key);
const QUOTE_KEYS = ['managePriceList', 'createQuotes', 'approveQuotes'];
const PERMS_PREVIEW = 3;

const AVATAR_COLORS = ['#e64980', '#1e9df0', '#51cf66', '#9775fa', '#f06595', '#ffa94d', '#3bc9db', '#748ffc'];
function avatarColor(uid) {
  let h = 0;
  for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initialsOf(name, email) {
  const src = String(name || '').trim() || String(email || '').split('@')[0] || '?';
  const words = src.split(/[\s._-]+/).filter(Boolean);
  const first = (words[0] && words[0][0]) || '?';
  const second = words.length > 1 ? (words[1][0] || '') : ((words[0] && words[0][1]) || '');
  return (first + second).toUpperCase();
}
function roleLabel(role) {
  const r = String(role || 'medidor');
  return r.charAt(0).toUpperCase() + r.slice(1);
}

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;
let members = [];
let selectedUid = null;
let onlineUids = new Set();
let expandedProjects = false;
let expandedPerms = false;

const isOwner = () => currentUserData && currentUserData.role === 'owner';
const dataVersion = () => (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
const memberById = (uid) => members.find(m => m.uid === uid);

function renderSidebar() {
  const name = orgData && orgData.name ? orgData.name : 'Company';
  document.getElementById('org-avatar').textContent = initialsOf(name);
  document.getElementById('org-name').textContent = name;
  document.getElementById('org-version').textContent = 'Nivelato v' + dataVersion();
}

async function renderUpdatesDot() {
  const sub = document.getElementById('updates-sub');
  const dot = document.getElementById('updates-dot');
  try {
    const latestSnap = await getDoc(doc(db, 'app_updates', 'latest'));
    const latest = latestSnap.exists() ? latestSnap.data() : null;
    const pending = latest && latest.version && dataVersion() !== String(latest.version);
    sub.textContent = pending ? 'New version available' : 'Up to date';
    dot.classList.toggle('on', !!pending);
  } catch (_) {
    sub.textContent = '';
  }
}

function sortedMembers() {
  return [...members].sort((a, b) => {
    const ao = a.role === 'owner' ? 0 : 1;
    const bo = b.role === 'owner' ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return String(a.name || a.email || '').localeCompare(String(b.name || b.email || ''));
  });
}

function displayName(m) {
  if (m.uid === (currentUser && currentUser.uid)) return roleLabel(m.role) + ' (you)';
  return m.name || m.email || 'Unknown user';
}

function renderList() {
  const list = document.getElementById('user-list');
  if (!members.length) {
    list.innerHTML = '<div class="empty">No team members yet.</div>';
    return;
  }
  list.innerHTML = sortedMembers().map((m) => {
    const sel = m.uid === selectedUid ? ' selected' : '';
    const online = onlineUids.has(m.uid) ? '<span class="u-online"></span>' : '';
    return `<button class="user-card${sel}" data-uid="${escapeHtml(m.uid)}">
      <span class="u-avatar" style="background:${avatarColor(m.uid)}">${escapeHtml(initialsOf(m.name, m.email))}${online}</span>
      <span class="u-meta">
        <span class="u-name">${escapeHtml(displayName(m))}</span>
        <span class="u-email">${escapeHtml(m.email || '')}</span>
      </span>
    </button>`;
  }).join('');
  list.querySelectorAll('.user-card').forEach((el) => {
    el.addEventListener('click', () => {
      selectedUid = el.getAttribute('data-uid');
      expandedProjects = false;
      expandedPerms = false;
      renderList();
      renderDetail();
    });
  });
}

async function loadProjects(uid) {
  // "Projects by {name}": group the user's jobs by project (fallback: customer).
  // Each job is one measured opening, so the count is honest "measured spaces".
  try {
    const qs = await getDocs(query(collection(db, 'orgs', orgId, 'jobs'), where('installerUid', '==', uid)));
    const groups = new Map();
    qs.forEach((d) => {
      const j = d.data();
      if (j.status === 'draft') return;
      const key = j.project || j.customer || 'Untitled';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(j);
    });
    return [...groups.entries()]
      .map(([name, jobs]) => ({ name, count: jobs.length }))
      .sort((a, b) => b.count - a.count);
  } catch (e) {
    console.warn('[Nivelato] could not load jobs:', e.message);
    return null; // null = load failed (vs [] = none)
  }
}

function renderDetail() {
  const detail = document.getElementById('detail');
  const m = memberById(selectedUid);
  if (!m) {
    detail.innerHTML = '<div class="state-loading">Select a user to see details.</div>';
    return;
  }
  const name = m.name || m.email || 'Unknown user';
  detail.innerHTML = `
    <div class="detail-head">
      <div class="detail-name">${escapeHtml(name)}</div>
      <div class="detail-email">${escapeHtml(m.email || '')}</div>
    </div>
    <div class="detail-grid">
      <div class="panel" id="projects-panel">
        <h3>Projects by ${escapeHtml(String(name).split(' ')[0])}</h3>
        <div id="projects-body"><div class="empty">Loading projects...</div></div>
      </div>
      <div class="panel" id="perms-panel">
        <h3>Permissions</h3>
        <div id="perms-body"></div>
        ${isOwner() ? '' : '<div class="perm-note">Only owners can change permissions.</div>'}
      </div>
    </div>
    <div id="delete-zone"></div>
  `;
  renderProjects(m);
  renderPerms(m);
  renderDelete(m);
}

async function renderProjects(m) {
  const body = document.getElementById('projects-body');
  if (!body) return;
  const groups = await loadProjects(m.uid);
  if (!body.isConnected) return;
  if (groups === null) {
    body.innerHTML = '<div class="empty">Could not load projects.</div>';
    return;
  }
  if (!groups.length) {
    body.innerHTML = '<div class="empty">No projects yet.</div>';
    return;
  }
  const visible = expandedProjects ? groups : groups.slice(0, 3);
  body.innerHTML = visible.map((g) => `
    <div class="proj-row">
      <div class="proj-thumb">IMG</div>
      <div>
        <div class="proj-name">${escapeHtml(g.name)}</div>
        <div class="proj-sub">${g.count} measured space${g.count === 1 ? '' : 's'}</div>
      </div>
    </div>`).join('') +
    (groups.length > 3 ? `<button class="btn" id="btn-more-projects">${expandedProjects ? 'Show less' : 'View more'}</button>` : '');
  const btn = document.getElementById('btn-more-projects');
  if (btn) btn.addEventListener('click', () => { expandedProjects = !expandedProjects; renderProjects(m); });
}

function renderPerms(m) {
  const body = document.getElementById('perms-body');
  if (!body) return;
  const checker = makePermChecker(m);
  // orgs sin quoting (QGC): no se muestran los permisos de precios/cotizaciones
  const allKeys = orgHasQuotes(m) ? PERM_KEYS : PERM_KEYS.filter(k => !QUOTE_KEYS.includes(k));
  const keys = expandedPerms ? allKeys : allKeys.slice(0, PERMS_PREVIEW);
  const canEdit = isOwner();
  body.innerHTML = keys.map((k) => {
    const on = !!checker(k);
    return `<div class="perm-row">
      <span>${escapeHtml(PERM_LABELS_EN[k] || k)}</span>
      <button class="toggle${on ? ' on' : ''}" data-key="${escapeHtml(k)}" ${canEdit ? '' : 'disabled'}
        aria-pressed="${on}" aria-label="${escapeHtml(PERM_LABELS_EN[k] || k)}">
        <span class="knob"></span>
      </button>
    </div>`;
  }).join('') +
  (allKeys.length > PERMS_PREVIEW
    ? `<button class="btn" id="btn-all-perms">${expandedPerms ? 'Show less' : 'View all'}</button>`
    : '');
  const btnAll = document.getElementById('btn-all-perms');
  if (btnAll) btnAll.addEventListener('click', () => { expandedPerms = !expandedPerms; renderPerms(m); });
  if (canEdit) {
    body.querySelectorAll('.toggle').forEach((t) => {
      t.addEventListener('click', async () => {
        const key = t.getAttribute('data-key');
        const cur = memberById(m.uid);
        const nowOn = !!makePermChecker(cur)(key);
        t.disabled = true;
        try {
          await updateDoc(doc(db, 'users', m.uid), { ['permissions.' + key]: !nowOn });
          cur.permissions = { ...(cur.permissions || {}), [key]: !nowOn };
        } catch (e) {
          alert('Could not update permission: ' + (e.message || 'unknown error'));
        }
        renderPerms(memberById(m.uid));
      });
    });
  }
}

function renderDelete(m) {
  const zone = document.getElementById('delete-zone');
  if (!zone || !isOwner()) return;
  const isSelf = m.uid === (currentUser && currentUser.uid);
  const isOrgOwner = orgData && orgData.ownerId === m.uid;
  if (isSelf || isOrgOwner) {
    zone.innerHTML = `<div class="delete-note">${isSelf ? 'You cannot remove your own account here.' : 'The organization owner cannot be removed.'}</div>`;
    return;
  }
  zone.innerHTML = `
    <button class="btn btn-danger" id="btn-delete-user">Delete user</button>
    <div class="delete-note">This deactivates the account immediately. One click to confirm, no maze.</div>`;
  document.getElementById('btn-delete-user').addEventListener('click', async () => {
    const label = m.name || m.email || 'this user';
    if (!confirm('Remove ' + label + ' from the company? They will lose access immediately.')) return;
    const btn = document.getElementById('btn-delete-user');
    btn.disabled = true;
    btn.textContent = 'Removing...';
    try {
      await updateDoc(doc(db, 'users', m.uid), { disabled: true });
      members = members.filter((x) => x.uid !== m.uid);
      selectedUid = members.length ? sortedMembers()[0].uid : null;
      expandedProjects = false;
      expandedPerms = false;
      renderList();
      renderDetail();
    } catch (e) {
      alert('Could not remove user: ' + (e.message || 'unknown error'));
      btn.disabled = false;
      btn.textContent = 'Delete user';
    }
  });
}

async function refreshOnline() {
  try {
    const online = await getOnlineUsers(orgId);
    onlineUids = new Set(online.map((u) => u.uid));
    renderList();
  } catch (_) { /* online dots are a nice-to-have */ }
}

// ---- auth + data ----
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  // Mint flow claims: rules require them for org data reads.
  try { await ensureFlowClaims(); } catch (_) { /* fails soft */ }
  currentUser = user;

  // Backup theme pass: in case the fast path or doc-based check could not run.
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) {
    alert('We could not find your user profile. Please sign in again to repair it.');
    window.location.href = 'https://login.nivelatolabs.com/?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  orgId = currentUserData.orgId;

  if (!makePermChecker(currentUserData)('userManagement')) {
    window.location.href = '/account/settings';
    return;
  }

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  try {
    const orgSnap = await getDoc(doc(db, 'orgs', orgId));
    orgData = orgSnap.exists() ? orgSnap.data() : {};
  } catch (e) {
    document.getElementById('user-list').innerHTML =
      `<div class="state-error">Could not load company data: ${escapeHtml(e.message || 'unknown error')}</div>`;
    return;
  }
  renderSidebar();
  renderUpdatesDot();

  try {
    const qs = await getDocs(query(collection(db, 'users'), where('orgId', '==', orgId)));
    members = qs.docs
      .map((d) => ({ uid: d.id, ...d.data() }))
      .filter((m) => m.disabled !== true);
  } catch (e) {
    document.getElementById('user-list').innerHTML =
      `<div class="state-error">Could not load users: ${escapeHtml(e.message || 'unknown error')}</div>`;
    return;
  }

  if (members.length) selectedUid = sortedMembers()[0].uid;
  renderList();
  renderDetail();
  refreshOnline();
  setInterval(refreshOnline, 60000);
});
</script>
</body>
</html>
