<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script src="/company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0e0e10" />
<link rel="manifest" href="/manifest.json" />
<title>Nivelato - Usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/niv-dark.css" />
<link rel="stylesheet" href="/qgc-theme.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--niv-bg);
    color: var(--niv-text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- layout: chrome module hosts + main column ---------- */
  .ov-shell { display: flex; flex: 1; min-height: 0; padding: 30px; gap: 30px; }
  #chrome-sidebar { width: 300px; flex: none; align-self: stretch; min-height: 0; }
  .ov-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .ov-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .ov-head-text { flex: 1; min-width: 200px; }
  .ov-head .niv-page-title { margin: 0 0 4px; }
  .ov-head .niv-page-sub { margin-bottom: 0; }
  .ov-manage { flex: none; }
  .ov-search { margin-bottom: 16px; }
  .ov-search .niv-field { margin-bottom: 0; }
  .ov-content { display: flex; gap: 20px; flex: 1; min-height: 0; align-items: stretch; }

  /* ---------- directory list ---------- */
  .ov-list-col {
    width: 340px; flex: none; min-height: 0; overflow-y: auto;
    border: 1px solid var(--niv-border); border-radius: var(--niv-radius);
    background: var(--niv-surface); padding: 18px 14px;
  }
  .ov-list-title {
    font-size: 13px; font-weight: 600; color: var(--niv-text-dim);
    text-transform: uppercase; letter-spacing: .12em; padding: 2px 6px 12px;
  }
  .ov-list-col .niv-user-row { width: 100%; font-family: inherit; text-align: left; color: var(--niv-text); }
  .ov-avatar-wrap { position: relative; flex: none; }
  .ov-online {
    position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--niv-green); border: 2px solid var(--niv-surface);
  }
  .niv-user-row.selected .ov-online { border-color: transparent; }
  .ov-row-meta { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .ov-row-email { display: block; }
  .ov-row-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ov-row-name .niv-user-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ov-row-email { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov-chip {
    flex: none; font-size: 11px; font-weight: 700; padding: 2px 9px;
    border-radius: var(--niv-pill); border: 1px solid var(--niv-border-soft);
    color: var(--niv-text-dim); background: var(--niv-surface-2); white-space: nowrap;
  }
  .ov-chip.pending { color: #fbbf24; border-color: rgba(230, 119, 0, 0.6); background: rgba(230, 119, 0, 0.15); }
  .ov-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .niv-user-row.selected .ov-chip { color: #06281f; border-color: transparent; background: rgba(255, 255, 255, 0.25); }

  /* ---------- detail panel ---------- */
  .ov-detail {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto;
    border: 1px solid var(--niv-border); border-radius: var(--niv-radius);
    background: var(--niv-surface); padding: 26px;
  }
  .ov-detail-head { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
  .ov-detail-head .niv-user-avatar { width: 56px; height: 56px; font-size: 19px; }
  .ov-detail-name { font-size: 20px; font-weight: 700; word-break: break-word; }
  .ov-detail-email { font-size: 14px; color: var(--niv-text-dim); margin-top: 3px; word-break: break-all; }
  .ov-detail .niv-card { background: var(--niv-surface-2); }
  .ov-detail .niv-card:last-child { margin-bottom: 0; }
  .ov-status-on { color: #4ade80; font-weight: 600; }
  .ov-status-pending { color: #fbbf24; font-weight: 600; }
  .ov-perm-chip {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 500;
    color: var(--niv-text); padding: 4px 10px; background: var(--niv-surface);
    border-radius: 8px; border: 1px solid var(--niv-border-soft);
  }
  .ov-proj-row {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--niv-border-soft); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .ov-proj-row:last-child { margin-bottom: 0; }
  .ov-proj-name { font-size: 14px; font-weight: 600; word-break: break-word; }
  .ov-proj-sub { font-size: 12px; color: var(--niv-text-dim); margin-top: 2px; }
  .ov-empty { text-align: center; color: var(--niv-text-dim); font-size: 13px; padding: 18px 0; }
  .ov-state { text-align: center; color: var(--niv-text-dim); font-size: 14px; padding: 48px 16px; }
  .ov-error {
    border: 1px solid rgba(229, 72, 77, 0.55); background: rgba(229, 72, 77, 0.12);
    color: #f87171; border-radius: 12px; padding: 16px 18px; font-size: 14px;
    text-align: center; max-width: 560px; margin: 48px auto;
  }
  .ov-retry { margin-top: 12px; }

  @media (max-width: 900px) {
    body { height: auto; overflow: visible; }
    .ov-shell { flex-direction: column; flex: none; padding: 12px; gap: 16px; }
    #chrome-sidebar { width: 100%; height: 380px; flex: none; }
    .ov-main { min-height: 0; }
    .ov-content { flex-direction: column; flex: none; }
    .ov-list-col { width: 100%; overflow-y: visible; }
    .ov-detail { overflow-y: visible; padding: 20px 16px; }
  }

  /* Embed mode (?embed=1, used by the dashboard users view): no chrome of
     its own at all, the page is only the directory area. The class goes on
     <html> before first paint (script below) so it is born chrome-less.
     The header is chrome too: the host shell owns the page title and the
     Manage users action (its toggle swaps this frame between overview and
     administration in place), so the view's own title and Manage door
     stay hidden here — two headers and two Manage buttons stacked was
     the bug. Only the subline (org name, member count, online count)
     remains, as the subline under the shell's header. Standalone /users
     keeps the full header, title and door included. */
  html.embed-users #chrome-topbar, html.embed-users #chrome-sidebar { display: none !important; }
  html.embed-users #ov-title, html.embed-users #ov-manage { display: none !important; }
  html.embed-users body { height: 100vh; overflow: hidden; }
  html.embed-users .ov-shell { padding: 18px; gap: 18px; }
  html.embed-users .ov-head { margin-bottom: 10px; }

  /* Admin context (served at /company/users): never offer the Manage
     users door — it points at /company/users, this very page. */
  html.admin-context #ov-manage { display: none !important; }

  /* Permission editor (detail panel): toggle rows in the same visual
     language as the administration page's switches. */
  .ov-edit-perms { margin-top: 14px; }
  .ov-perm-rows { display: flex; flex-direction: column; gap: 4px; }
  .ov-perm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 2px; }
  .ov-perm-row span { font-size: 14px; }
  .ov-toggle { width: 46px; height: 26px; flex: none; border-radius: 999px; border: 1px solid var(--niv-border); background: var(--niv-surface); position: relative; cursor: pointer; padding: 0; }
  .ov-toggle .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--niv-text-dim); transition: left .15s ease, background .15s ease; }
  .ov-toggle.on { background: var(--niv-accent, #1e9df0); border-color: transparent; }
  .ov-toggle.on .knob { left: 22px; background: #fff; }
  .ov-edit-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
</style>
<script>
  try {
    var _embed = new URLSearchParams(window.location.search).get('embed');
    if (_embed === '1' || _embed === 'users') document.documentElement.classList.add('embed-users');
    /* Admin context: this document served AT /company/users is the
       administration destination itself; the Manage users door in the
       header would link back to this very page (see CSS below). */
    if (window.location.pathname.replace(/\/+$/, '') === '/company/users') document.documentElement.classList.add('admin-context');
  } catch (e) {}
</script>
</head>
<body>
<div id="chrome-topbar"></div>
<div class="ov-shell">
  <div id="chrome-sidebar" aria-label="Nivelato"></div>

  <main class="ov-main">
    <div class="ov-head">
      <div class="ov-head-text">
        <h1 class="niv-page-title" id="ov-title">Usuarios</h1>
        <div class="niv-page-sub" id="ov-sub"></div>
      </div>
      <a class="niv-btn-pill niv-btn-primary ov-manage" id="ov-manage" href="/company/users" target="_top" style="display:none">Gestionar usuarios</a>
    </div>

    <div class="niv-card" id="ov-denied" style="display:none">
      <div class="niv-card-title" id="ov-denied-title">Sin acceso</div>
      <div class="niv-card-desc" id="ov-denied-desc" style="margin-bottom:0">Tu cuenta no tiene acceso al directorio de usuarios de esta compañía.</div>
    </div>

    <div id="ov-area">
      <div class="ov-search">
        <div class="niv-field">
          <input id="ov-search-input" type="search" autocomplete="off" placeholder="Buscar por nombre, correo o rol" aria-label="Buscar usuarios" />
        </div>
      </div>
      <div class="ov-content">
        <section class="ov-list-col" aria-label="Usuarios" id="ov-list-col">
          <div class="ov-list-title" id="ov-list-title">Equipo</div>
          <div id="ov-list"><div class="ov-state" id="ov-list-loading">Cargando usuarios...</div></div>
        </section>
        <section class="ov-detail" id="ov-detail" aria-label="Detalle de usuario">
          <div class="ov-state" id="ov-detail-loading">Selecciona un usuario para ver los detalles.</div>
        </section>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, getDocs, collection, query, where, updateDoc
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { startPresence, getOnlineUsers } from '/presence.js';
import { PERM_DEFS, makePermChecker, orgHasQuotes } from '/permissions.js';
import { ensureFlowClaims, routeAfterGate } from '/geo.js';

const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

/* Language: complete EN/ES pairs for every string this page renders.
   Resolution follows the locked order (niv-user.js): the signed-in
   user's saved language (users/{uid}.language) first, then the
   nivelato-login-lang local chain, then Spanish, the product default. */
let LANG = 'es';
try {
  const _ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
    const _ls = window.localStorage.getItem('nivelato-login-lang');
    LANG = (_ck === 'es' || _ck === 'en') ? _ck : ((_ls === 'es' || _ls === 'en') ? _ls : 'es');
} catch (e) {}
const STR = {
  es: {
    pageTitle: 'Nivelato - Usuarios', title: 'Usuarios',
    subWithOrg: '{org} · {count}', subNoOrg: '{count}',
    membersOne: '1 miembro', membersMany: '{n} miembros',
    onlineNow: '{n} en línea ahora',
    manage: 'Gestionar usuarios', team: 'Equipo',
    searchPh: 'Buscar por nombre, correo o rol', searchAria: 'Buscar usuarios',
    listAria: 'Usuarios', detailAria: 'Detalle de usuario',
    loadingUsers: 'Cargando usuarios...', selectUser: 'Selecciona un usuario para ver los detalles.',
    noMembers: 'Todavía no hay miembros en el equipo.', noResults: 'Ningún usuario coincide con tu búsqueda.',
    unknownUser: 'Usuario desconocido', you: ' (tú)',
    roles: { owner: 'Dueño / Admin', supervisor: 'Supervisor', cotizador: 'Cotizador', medidor: 'Técnico medidor' },
    noRole: 'Sin rol',
    status: 'Estado', statusActive: 'Activo', statusPending: 'Pendiente de aprobación',
    presence: 'Presencia', online: 'En línea ahora', offline: 'No está en línea',
    email: 'Correo', role: 'Rol',
    permsTitle: 'Permisos', permsDesc: 'Lo que este usuario puede hacer, según su rol y sus permisos guardados.',
    permsNone: 'Ningún permiso activo.',
    editPerms: 'Editar permisos', savePerms: 'Guardar permisos', cancelEdit: 'Cancelar',
    permSaveFailed: 'No se pudieron guardar los permisos: {msg}',
    permLabels: Object.fromEntries(PERM_DEFS.map(d => [d.key, d.label])),
    projectsTitle: 'Proyectos', projectsDesc: 'Proyectos con espacios medidos por este usuario.',
    loadingProjects: 'Cargando proyectos...', couldNotProjects: 'No se pudieron cargar los proyectos.',
    noProjects: 'Todavía no hay proyectos.', measuredSpace: 'espacio medido', measuredSpaces: 'espacios medidos',
    deniedTitle: 'Sin acceso',
    deniedDesc: 'Tu cuenta no tiene acceso al directorio de usuarios de esta compañía.',
    loadErrorTitle: 'Algo salió mal',
    couldNotUsers: 'No se pudieron cargar los usuarios: {msg}',
    couldNotProfile: 'No se pudo cargar tu perfil de usuario: {msg}',
    missingProfile: 'No pudimos encontrar tu perfil de usuario. Inicia sesión de nuevo para repararlo.',
    noOrg: 'Tu perfil de usuario no tiene una compañía asignada.',
    unknownError: 'error desconocido', retry: 'Reintentar'
  },
  en: {
    pageTitle: 'Nivelato - Users', title: 'Users',
    subWithOrg: '{org} · {count}', subNoOrg: '{count}',
    membersOne: '1 member', membersMany: '{n} members',
    onlineNow: '{n} online now',
    manage: 'Manage users', team: 'Team',
    searchPh: 'Search by name, email or role', searchAria: 'Search users',
    listAria: 'Users', detailAria: 'User detail',
    loadingUsers: 'Loading users...', selectUser: 'Select a user to see details.',
    noMembers: 'No team members yet.', noResults: 'No user matches your search.',
    unknownUser: 'Unknown user', you: ' (you)',
    roles: { owner: 'Owner / Admin', supervisor: 'Supervisor', cotizador: 'Quoter', medidor: 'Measuring technician' },
    noRole: 'No role',
    status: 'Status', statusActive: 'Active', statusPending: 'Pending approval',
    presence: 'Presence', online: 'Online now', offline: 'Not online',
    email: 'Email', role: 'Role',
    permsTitle: 'Permissions', permsDesc: 'What this user can do, from their role and saved permissions.',
    permsNone: 'No active permissions.',
    editPerms: 'Edit permissions', savePerms: 'Save permissions', cancelEdit: 'Cancel',
    permSaveFailed: 'Could not save permissions: {msg}',
    permLabels: {
      viewDashboard: 'View dashboard', createMeasurements: 'Create measurements',
      viewOwnMeasurements: 'View own measurements', editOwnMeasurements: 'Edit own measurements',
      viewOthersMeasurements: "View others' measurements", editOthersMeasurements: "Edit others' measurements",
      managePriceList: 'Manage price list', createQuotes: 'Create quotes',
      approveQuotes: 'Approve quotes', userManagement: 'Manage users'
    },
    projectsTitle: 'Projects', projectsDesc: 'Projects with spaces measured by this user.',
    loadingProjects: 'Loading projects...', couldNotProjects: 'Could not load projects.',
    noProjects: 'No projects yet.', measuredSpace: 'measured space', measuredSpaces: 'measured spaces',
    deniedTitle: 'No access',
    deniedDesc: 'Your account does not have access to this company user directory.',
    loadErrorTitle: 'Something went wrong',
    couldNotUsers: 'Could not load users: {msg}',
    couldNotProfile: 'Could not load your user profile: {msg}',
    missingProfile: 'We could not find your user profile. Please sign in again to repair it.',
    noOrg: 'Your user profile has no company assigned.',
    unknownError: 'unknown error', retry: 'Retry'
  }
};
const t = (key, vars) => {
  let out = (STR[LANG] && STR[LANG][key]) || STR.es[key] || key;
  if (vars) for (const k of Object.keys(vars)) out = out.replace('{' + k + '}', String(vars[k]));
  return out;
};
const roleLabel = (m) => {
  const r = m && (m.role || m.installerRole);
  return (STR[LANG].roles && STR[LANG].roles[r]) || r || t('noRole');
};

const AVATAR_COLORS = ['#e64980', '#1e9df0', '#51cf66', '#9775fa', '#f06595', '#ffa94d', '#3bc9db', '#748ffc'];
function avatarColor(uid) {
  let h = 0;
  for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initialsOf(name, email) {
  const src = String(name || '').trim() || String(email || '').split('@')[0] || '?';
  const words = src.split(/[\s._-]+/).filter(Boolean);
  const first = (words[0] && words[0][0]) || '?';
  const second = words.length > 1 ? (words[1][0] || '') : ((words[0] && words[0][1]) || '');
  return (first + second).toUpperCase();
}
function avatarHtml(m, extraClass) {
  const cls = 'niv-user-avatar' + (extraClass ? ' ' + extraClass : '');
  if (m.photoURL) {
    return '<span class="' + cls + '"><img src="' + escapeHtml(m.photoURL) + '" alt="" /></span>';
  }
  return '<span class="' + cls + '" style="background:' + avatarColor(m.uid) + '">'
    + escapeHtml(initialsOf(m.name, m.email)) + '</span>';
}

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgName = '';
let members = [];
let selectedUid = null;
try { selectedUid = new URLSearchParams(window.location.search).get('user'); } catch (e) {}
let onlineUids = new Set();
let onlineLoaded = false;
let searchText = '';
let _can = () => false;
/* In-flight guards: rapid repeat loads for the same block are ignored. */
const _inFlight = new Set();
function guardEnter(key) { if (_inFlight.has(key)) return false; _inFlight.add(key); return true; }
function guardExit(key) { _inFlight.delete(key); }

const statusOf = (m) => (m.disabled === true ? 'pending' : 'active');
function sortedMembers() {
  return [...members].sort((a, b) => {
    const ao = a.role === 'owner' ? 0 : 1;
    const bo = b.role === 'owner' ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return String(a.name || a.email || '').localeCompare(String(b.name || b.email || ''));
  });
}
function displayName(m) {
  const self = m.uid === (currentUser && currentUser.uid);
  const base = m.name || m.email || t('unknownUser');
  return self ? base + t('you') : base;
}
function memberById(uid) { return members.find((m) => m.uid === uid); }

function applyStaticLang() {
  document.title = t('pageTitle');
  try { document.documentElement.setAttribute('lang', LANG); } catch (e) {}
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set('ov-title', t('title'));
  set('ov-manage', t('manage'));
  set('ov-list-title', t('team'));
  set('ov-denied-title', t('deniedTitle'));
  set('ov-denied-desc', t('deniedDesc'));
  const input = document.getElementById('ov-search-input');
  if (input) { input.placeholder = t('searchPh'); input.setAttribute('aria-label', t('searchAria')); }
  const lc = document.getElementById('ov-list-col');
  if (lc) lc.setAttribute('aria-label', t('listAria'));
  const dt = document.getElementById('ov-detail');
  if (dt) dt.setAttribute('aria-label', t('detailAria'));
  const ll = document.getElementById('ov-list-loading');
  if (ll) ll.textContent = t('loadingUsers');
  const dl = document.getElementById('ov-detail-loading');
  if (dl) dl.textContent = t('selectUser');
  renderSub();
}
function renderSub() {
  const sub = document.getElementById('ov-sub');
  if (!sub) return;
  const count = members.length === 1 ? t('membersOne') : t('membersMany', { n: members.length });
  let txt = orgName ? t('subWithOrg', { org: orgName, count }) : t('subNoOrg', { count });
  if (onlineLoaded) txt += ' · ' + t('onlineNow', { n: onlineUids.size });
  sub.textContent = txt;
}

function visibleMembers() {
  const q = searchText.trim().toLowerCase();
  const all = sortedMembers();
  if (!q) return all;
  return all.filter((m) => {
    const hay = [m.name || '', m.email || '', roleLabel(m)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function renderList() {
  const list = document.getElementById('ov-list');
  if (!list) return;
  if (!members.length) {
    list.innerHTML = '<div class="ov-empty">' + escapeHtml(t('noMembers')) + '</div>';
    return;
  }
  const vis = visibleMembers();
  if (!vis.length) {
    list.innerHTML = '<div class="ov-empty">' + escapeHtml(t('noResults')) + '</div>';
    return;
  }
  list.innerHTML = vis.map((m) => {
    const sel = m.uid === selectedUid ? ' selected' : '';
    const online = onlineUids.has(m.uid) ? '<span class="ov-online"></span>' : '';
    const pending = statusOf(m) === 'pending'
      ? '<span class="ov-chip pending">' + escapeHtml(t('statusPending')) + '</span>' : '';
    return '<button class="niv-user-row' + sel + '" data-uid="' + escapeHtml(m.uid) + '">'
      + '<span class="ov-avatar-wrap">' + avatarHtml(m) + online + '</span>'
      + '<span class="ov-row-meta">'
      + '<span class="ov-row-name"><span class="niv-user-name">' + escapeHtml(displayName(m)) + '</span></span>'
      + '<span class="niv-user-email ov-row-email">' + escapeHtml(m.email || '') + '</span>'
      + '<span class="ov-chip-row"><span class="ov-chip">' + escapeHtml(roleLabel(m)) + '</span>' + pending + '</span>'
      + '</span>'
      + '</button>';
  }).join('');
  list.querySelectorAll('.niv-user-row').forEach((el) => {
    el.addEventListener('click', () => {
      selectUser(el.getAttribute('data-uid'), true);
    });
  });
}

function selectUser(uid, fromClick) {
  if (permEdit && permEdit.uid !== uid) permEdit = null;
  selectedUid = uid;
  try {
    const url = new URL(window.location.href);
    if (uid) url.searchParams.set('user', uid); else url.searchParams.delete('user');
    window.history.replaceState(null, '', url.toString());
  } catch (e) {}
  renderList();
  renderDetail();
  if (fromClick && window.innerWidth <= 900) {
    const detail = document.getElementById('ov-detail');
    if (detail) detail.scrollIntoView({ block: 'start' });
  }
}

/* Projects block data: the same jobs grouping the administration detail
   uses (orgs/{orgId}/jobs where installerUid == uid, drafts skipped,
   grouped by project, falling back to customer). Only called when the
   viewer's own permissions allow seeing that user's measurements. */
async function loadProjects(uid) {
  try {
    const qs = await getDocs(query(collection(db, 'orgs', orgId, 'jobs'), where('installerUid', '==', uid)));
    const groups = new Map();
    qs.forEach((d) => {
      const j = d.data();
      if (j.status === 'draft') return;
      const key = j.project || j.customer || 'Untitled';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(j);
    });
    return [...groups.entries()].map(([name, jobs]) => ({ name, count: jobs.length }))
      .sort((a, b) => b.count - a.count);
  } catch (e) {
    console.warn('[Nivelato] could not load jobs:', e.message);
    return null;
  }
}

function canSeeProjects(m) {
  if (!m) return false;
  const isSelf = m.uid === (currentUser && currentUser.uid);
  return isSelf ? _can('viewOwnMeasurements') : _can('viewOthersMeasurements');
}
function canSeePerms(m) {
  if (!m) return false;
  return m.uid === (currentUser && currentUser.uid) || _can('userManagement');
}

function renderDetail() {
  const detail = document.getElementById('ov-detail');
  if (!detail) return;
  const m = memberById(selectedUid);
  if (!m) {
    detail.innerHTML = '<div class="ov-state">' + escapeHtml(t('selectUser')) + '</div>';
    return;
  }
  const pending = statusOf(m) === 'pending';
  const online = onlineUids.has(m.uid);
  let html = ''
    + '<div class="ov-detail-head">' + avatarHtml(m)
    + '<div><div class="ov-detail-name">' + escapeHtml(displayName(m)) + '</div>'
    + '<div class="ov-detail-email">' + escapeHtml(m.email || '') + '</div></div></div>'
    + '<div class="niv-card">'
    + infoRow(t('email'), m.email || '')
    + infoRow(t('role'), roleLabel(m))
    + infoRow(t('status'), '<span class="' + (pending ? 'ov-status-pending' : 'ov-status-on') + '">'
      + escapeHtml(pending ? t('statusPending') : t('statusActive')) + '</span>', true)
    + infoRow(t('presence'), '<span id="ov-presence-value">' + escapeHtml(online ? t('online') : t('offline')) + '</span>', true)
    + '</div>';
  if (canSeePerms(m)) {
    html += '<div class="niv-card"><div class="niv-card-title">' + escapeHtml(t('permsTitle')) + '</div>'
      + '<div class="niv-card-desc">' + escapeHtml(t('permsDesc')) + '</div>';
    if (permEdit && permEdit.uid === m.uid) {
      html += '<div class="ov-perm-rows">' + permEditorRowsHtml(m) + '</div>'
        + '<div class="ov-edit-actions">'
        + '<button class="niv-btn-pill niv-btn-primary" id="ov-perms-save">' + escapeHtml(t('savePerms')) + '</button>'
        + '<button class="niv-btn-pill" id="ov-perms-cancel">' + escapeHtml(t('cancelEdit')) + '</button>'
        + '</div>';
    } else {
      html += '<div class="niv-perm-grid">' + permsChipsHtml(m) + '</div>';
      if (canEditPerms()) {
        html += '<button class="niv-btn-pill ov-edit-perms" id="ov-perms-edit">' + escapeHtml(t('editPerms')) + '</button>';
      }
    }
    html += '</div>';
  }
  if (canSeeProjects(m)) {
    html += '<div class="niv-card"><div class="niv-card-title">' + escapeHtml(t('projectsTitle')) + '</div>'
      + '<div class="niv-card-desc">' + escapeHtml(t('projectsDesc')) + '</div>'
      + '<div id="ov-projects-body"><div class="ov-empty">' + escapeHtml(t('loadingProjects')) + '</div></div></div>';
  }
  detail.innerHTML = html;
  const editBtn = document.getElementById('ov-perms-edit');
  if (editBtn) editBtn.addEventListener('click', () => startPermEdit(m));
  if (permEdit && permEdit.uid === m.uid) wirePermEditor(m);
  if (canSeeProjects(m)) renderProjects(m);
}
function infoRow(label, value, rawHtml) {
  return '<div class="niv-info-row"><div class="niv-info-label">' + escapeHtml(label) + '</div>'
    + '<div class="niv-info-value">' + (rawHtml ? value : escapeHtml(value)) + '</div></div>';
}
function permKeysFor(m) {
  return PERM_DEFS.map((d) => d.key)
    .filter((k) => orgHasQuotes(m) || !['managePriceList', 'createQuotes', 'approveQuotes'].includes(k));
}
function permsChipsHtml(m) {
  const checker = makePermChecker(m);
  const keys = permKeysFor(m)
    .filter((k) => { try { return !!checker(k); } catch (e) { return false; } });
  if (!keys.length) return '<span class="ov-empty" style="padding:0">' + escapeHtml(t('permsNone')) + '</span>';
  return keys.map((k) => '<span class="ov-perm-chip">'
    + escapeHtml((STR[LANG].permLabels && STR[LANG].permLabels[k]) || k) + '</span>').join('');
}

/* ---- permission editing ----
   Same storage and read model the administration page
   (company/users.html) uses: explicit booleans at
   users/{uid}.permissions.<key>, read back through makePermChecker
   (explicit flag wins, then the owner grant, then the role fallback).
   Firestore rules allow that write only for the org owner, so the
   affordance is gated on the userManagement capability AND the owner
   role — the combination that can actually save. Saving re-renders
   the detail, so the chips reflect the new saved state. */
let permEdit = null;
function canEditPerms() {
  return !!(_can && _can('userManagement') && currentUserData && currentUserData.role === 'owner');
}
function startPermEdit(m) {
  const checker = makePermChecker(m);
  const values = {};
  permKeysFor(m).forEach((k) => { values[k] = !!checker(k); });
  permEdit = { uid: m.uid, values };
  renderDetail();
}
function permEditorRowsHtml(m) {
  return permKeysFor(m).map((k) => {
    const on = !!(permEdit.values && permEdit.values[k]);
    const label = (STR[LANG].permLabels && STR[LANG].permLabels[k]) || k;
    return '<div class="ov-perm-row"><span>' + escapeHtml(label) + '</span>'
      + '<button class="ov-toggle' + (on ? ' on' : '') + '" data-key="' + escapeHtml(k) + '" aria-pressed="' + on
      + '" aria-label="' + escapeHtml(label) + '"><span class="knob"></span></button></div>';
  }).join('');
}
function wirePermEditor(m) {
  document.querySelectorAll('#ov-detail .ov-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-key');
      permEdit.values[k] = !permEdit.values[k];
      btn.classList.toggle('on', permEdit.values[k]);
      btn.setAttribute('aria-pressed', String(permEdit.values[k]));
    });
  });
  const cancel = document.getElementById('ov-perms-cancel');
  if (cancel) cancel.addEventListener('click', () => { permEdit = null; renderDetail(); });
  const save = document.getElementById('ov-perms-save');
  if (save) save.addEventListener('click', () => savePermEdit(m, save));
}
async function savePermEdit(m, btn) {
  if (!permEdit || !guardEnter('perm-save:' + m.uid)) return;
  const checker = makePermChecker(m);
  const updates = {};
  const saved = {};
  Object.keys(permEdit.values).forEach((k) => {
    if (!!checker(k) !== !!permEdit.values[k]) {
      updates['permissions.' + k] = !!permEdit.values[k];
      saved[k] = !!permEdit.values[k];
    }
  });
  if (!Object.keys(updates).length) {
    permEdit = null;
    guardExit('perm-save:' + m.uid);
    renderDetail();
    return;
  }
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'users', m.uid), updates);
    m.permissions = { ...(m.permissions || {}), ...saved };
    permEdit = null;
    renderDetail();
  } catch (e) {
    alert(t('permSaveFailed', { msg: e.message || t('unknownError') }));
    btn.disabled = false;
  } finally {
    guardExit('perm-save:' + m.uid);
  }
}
async function renderProjects(m) {
  const body = document.getElementById('ov-projects-body');
  if (!body) return;
  if (!guardEnter('projects:' + m.uid)) return;
  const groups = await loadProjects(m.uid);
  guardExit('projects:' + m.uid);
  if (!body.isConnected) return;
  if (selectedUid !== m.uid) return;
  if (groups === null) {
    body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('couldNotProjects')) + '</div>';
    return;
  }
  if (!groups.length) {
    body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('noProjects')) + '</div>';
    return;
  }
  body.innerHTML = groups.map((g) =>
    '<div class="ov-proj-row"><div><div class="ov-proj-name">' + escapeHtml(g.name) + '</div>'
    + '<div class="ov-proj-sub">' + g.count + ' '
    + escapeHtml(g.count === 1 ? t('measuredSpace') : t('measuredSpaces')) + '</div></div></div>'
  ).join('');
}

async function refreshOnline() {
  try {
    const online = await getOnlineUsers(orgId);
    onlineUids = new Set(online.map((u) => u.uid));
    onlineLoaded = true;
    renderSub();
    renderList();
    const pv = document.getElementById('ov-presence-value');
    if (pv && selectedUid) pv.textContent = onlineUids.has(selectedUid) ? t('online') : t('offline');
  } catch (_) { /* online state is a nice-to-have */ }
}

function showLoadError(msg) {
  window.__nivUsersBooted = true;
  const area = document.getElementById('ov-area');
  if (area) area.style.display = 'none';
  const sub = document.getElementById('ov-sub');
  if (sub) sub.textContent = '';
  const denied = document.getElementById('ov-denied');
  if (!denied) return;
  denied.style.display = 'block';
  const title = document.getElementById('ov-denied-title');
  if (title) title.textContent = t('loadErrorTitle');
  const desc = document.getElementById('ov-denied-desc');
  if (desc) {
    desc.textContent = msg;
    const br = document.createElement('br');
    const btn = document.createElement('button');
    btn.className = 'niv-btn-pill ov-retry';
    btn.textContent = t('retry');
    btn.addEventListener('click', () => window.location.reload());
    desc.appendChild(br);
    desc.appendChild(btn);
  }
}
function showDenied() {
  window.__nivUsersBooted = true;
  const area = document.getElementById('ov-area');
  if (area) area.style.display = 'none';
  const sub = document.getElementById('ov-sub');
  if (sub) sub.textContent = '';
  const denied = document.getElementById('ov-denied');
  if (denied) denied.style.display = 'block';
}

const searchInput = document.getElementById('ov-search-input');
if (searchInput) {
  searchInput.addEventListener('input', () => { searchText = searchInput.value || ''; renderList(); });
}

/* ---- auth + data ----
   Access (the overview's own enforcement, per modules/README.md):
   signed-in active members of the org. The members list query is the
   exact one the administration page and the dashboard run
   (users where orgId == the viewer's orgId), which firestore.rules
   allows to any active same-org member, so this page can never expose
   a user the viewer could not already list elsewhere. On top of that,
   the page requires the viewDashboard permission through the shared
   checker (explicit flag wins, then the owner grant, then the role
   fallback, which grants it to every role). Non-permitted viewers get
   the denied card the company settings page gives its non-permitted
   viewers, and no members query runs for them. */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  try {
    const gate = await ensureFlowClaims();
    if (gate && gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
  } catch (_) { /* fails soft */ }
  currentUser = user;

  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  let userSnap;
  try {
    userSnap = await getDoc(doc(db, 'users', user.uid));
  } catch (e) {
    showLoadError(t('couldNotProfile', { msg: e.message || t('unknownError') }));
    return;
  }
  if (!userSnap.exists()) {
    alert(t('missingProfile'));
    window.location.href = 'https://login.nivelatolabs.com/?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  if (currentUserData.language === 'es' || currentUserData.language === 'en') {
    LANG = currentUserData.language;
    try { if (window.NivSettings && window.NivSettings.setLang) window.NivSettings.setLang(LANG); } catch (_) {}
    try { if (window.__nivSidebarHandle && window.__nivSidebarHandle.setLang) window.__nivSidebarHandle.setLang(LANG); } catch (_) {}
  }
  orgId = currentUserData.orgId;
  if (!orgId) { showLoadError(t('noOrg')); return; }
  _can = makePermChecker(currentUserData);

  const isActiveMember = currentUserData.disabled !== true && currentUserData.disabled !== 'rejected';
  if (!isActiveMember || !_can('viewDashboard')) { applyStaticLang(); showDenied(); return; }

  applyStaticLang();
  if (_can('userManagement')) {
    const mg = document.getElementById('ov-manage');
    if (mg) mg.style.display = '';
  }

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  /* Org name for the header only; a failed org read falls back to the
     count alone, it never blocks the directory. */
  try {
    const orgSnap = await getDoc(doc(db, 'orgs', orgId));
    if (orgSnap.exists()) orgName = orgSnap.data().name || '';
  } catch (e) {
    console.warn('[Nivelato] could not load org name:', e.message);
  }
  renderSub();

  let qs;
  try {
    qs = await getDocs(query(collection(db, 'users'), where('orgId', '==', orgId)));
  } catch (e) {
    showLoadError(t('couldNotUsers', { msg: e.message || t('unknownError') }));
    return;
  }
  members = qs.docs
    .map((d) => ({ uid: d.id, ...d.data() }))
    .filter((m) => m.disabled !== 'rejected');

  window.__nivUsersBooted = true;
  renderSub();
  if (!memberById(selectedUid)) {
    selectedUid = members.length ? sortedMembers()[0].uid : null;
  }
  renderList();
  renderDetail();
  refreshOnline();
  setInterval(refreshOnline, 60000);
});
applyStaticLang();
</script>
<script src="/niv-settings.js"></script>
<script src="/modules/shell-bridge.js"></script>
<script>
  /* Chrome modules: sidebar (target=shell, this page is its Usuarios
     door at /users) and, per the shell rule, the top bar ONLY at 901px
     and up, never on mobile. Embed mode mounts neither: it is
     chrome-less. Language follows the local chain here; the sidebar
     module resolves the signed-in user's language itself for its own
     gate, and the bridge init carries this page's resolved language. */
  (function () {
    var embed = false;
    try {
      var e = new URLSearchParams(window.location.search).get('embed');
      embed = e === '1' || e === 'users';
    } catch (err) {}
    if (embed || !window.NivShell) return;
    var lang = 'es';
    try {
      var ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      var ls = window.localStorage.getItem('nivelato-login-lang');
      lang = (ck === 'es' || ck === 'en') ? ck : ((ls === 'es' || ls === 'en') ? ls : 'es');
    } catch (err2) {}
    window.__nivSidebarHandle = window.NivShell.mountSidebar('#chrome-sidebar', { target: 'shell', active: 'users', lang: lang });
    if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
      window.NivShell.mountTopbar('#chrome-topbar', { active: 'users' });
    }
  })();
</script>
<script>
  /* Boot watchdog: if the module script cannot run at all, the directory
     would otherwise sit on the loading text forever. After a grace
     period, an unbooted page replaces it with an honest error plus a
     retry, in the language of the local chain. */
  setTimeout(function () {
    if (window.__nivUsersBooted) return;
    var es = true;
    try {
      var ls = window.localStorage.getItem('nivelato-login-lang');
      var ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      es = (ck || ls || 'es') !== 'en';
    } catch (e) {}
    var msg = es ? 'No se pudieron cargar los usuarios. Revisa tu conexión e inténtalo de nuevo.'
                 : 'Could not load users. Check your connection and try again.';
    var retry = es ? 'Reintentar' : 'Retry';
    var list = document.getElementById('ov-list');
    if (list) {
      list.innerHTML = '<div class="ov-error">' + msg + '<br><button class="niv-btn-pill ov-retry" onclick="window.location.reload()">' + retry + '</button></div>';
    }
  }, 15000);
</script>
<script src="/press-yaoi.js"></script>
<script src="/nav-referrer.js"></script>
