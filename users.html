<style>

    flex-direction: column;

  /* ---------- layout: chrome module hosts + main column ---------- */
  .ov-shell { display: flex; flex: 1; min-height: 0; padding: 30px; gap: 30px; }

  .ov-head .niv-page-sub { margin-bottom: 0; }

  .ov-search { margin-bottom: 16px; }

    font-family: var(--niv-font-mono); font-size: 0.72rem; font-weight: 500; color: var(--niv-text-dim);

  .ov-row-email { display: block; }
  .ov-row-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ov-row-name .niv-user-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ov-row-email { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    flex: none; font-size: 11px; font-weight: 700; padding: 2px 9px;
    border-radius: var(--niv-pill); border: 1px solid var(--niv-border-soft);
    color: var(--niv-text-dim); background: var(--niv-surface-2); white-space: nowrap;

  .niv-user-row.selected .ov-chip { color: #050505; border-color: transparent; background: rgba(255, 255, 255, 0.25); }

  .ov-detail {

  .ov-detail-email { font-size: 14px; color: var(--niv-text-dim); margin-top: 3px; word-break: break-all; }

  .dev-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

     <html> before first paint (script below) so it is born chrome-less.
     The header is chrome too: the host shell owns the page title and the
     Manage users action (its toggle swaps this frame between overview and
     administration in place), so the view's own title and Manage door
     stay hidden here — two headers and two Manage buttons stacked was
     the bug. Only the subline (org name, member count, online count)
     remains, as the subline under the shell's header. Standalone /users
     keeps the full header, title and door included. */
  html.embed-users #chrome-topbar, html.embed-users #chrome-sidebar { display: none !important; }

  html.embed-users .ov-head { margin-bottom: 10px; }

  html.admin-context #ov-manage { display: none !important; }

  .ov-perm-rows { display: flex; flex-direction: column; gap: 4px; }

  .ov-toggle { width: 46px; height: 26px; flex: none; border-radius: 999px; border: 1px solid var(--niv-border); background: var(--niv-surface); position: relative; cursor: pointer; padding: 0; }
  .ov-toggle .knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--niv-text-dim); transition: left .15s ease, background .15s ease; }
  .ov-toggle.on { background: var(--niv-accent, #fafafa); border-color: transparent; }
  /* On-state pairing: the track is the light accent, so the knob is
     near-black (white on the light track was invisible). */
  .ov-toggle.on .knob { left: 22px; background: #050505; }
  .ov-edit-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

<script>
  try {
    var _embed = new URLSearchParams(window.location.search).get('embed');

       administration destination itself; the Manage users door in the

    if (window.location.pathname.replace(/\/+$/, '') === '/company/users') document.documentElement.classList.add('admin-context');

function avatarColor(uid) {
  let h = 0;
  for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initialsOf(name, email) {
  const src = String(name || '').trim() || String(email || '').split('@')[0] || '?';
  const words = src.split(/[\s._-]+/).filter(Boolean);
  const first = (words[0] && words[0][0]) || '?';
  const second = words.length > 1 ? (words[1][0] || '') : ((words[0] && words[0][1]) || '');
  return (first + second).toUpperCase();
}
function avatarHtml(m, extraClass) {
  const cls = 'niv-user-avatar' + (extraClass ? ' ' + extraClass : '');
  if (m.photoURL) {
    return '<span class="' + cls + '"><img src="' + escapeHtml(m.photoURL) + '" alt="" /></span>';
  }
  return '<span class="' + cls + '" style="background:' + avatarColor(m.uid) + '">'
    + escapeHtml(initialsOf(m.name, m.email)) + '</span>';
}

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgName = '';
let members = [];
let selectedUid = null;
try { selectedUid = new URLSearchParams(window.location.search).get('user'); } catch (e) {}
let onlineUids = new Set();
let onlineLoaded = false;
let searchText = '';
let _can = () => false;
/* In-flight guards: rapid repeat loads for the same block are ignored. */
const _inFlight = new Set();
function guardEnter(key) { if (_inFlight.has(key)) return false; _inFlight.add(key); return true; }
function guardExit(key) { _inFlight.delete(key); }

const statusOf = (m) => (m.disabled === true ? 'pending' : 'active');
function sortedMembers() {
  return [...members].sort((a, b) => {
    const ao = a.role === 'owner' ? 0 : 1;

function displayName(m) {

function visibleMembers() {

function selectUser(uid, fromClick) {

/* Projects block data: the same jobs grouping the administration detail
   uses (orgs/{orgId}/jobs where installerUid == uid, drafts skipped,
   grouped by project, falling back to customer). Only called when the
   viewer's own permissions allow seeing that user's measurements. */
async function loadProjects(uid) {
  try {
    const qs = await getDocs(query(collection(db, 'orgs', orgId, 'jobs'), where('installerUid', '==', uid)));
    const groups = new Map();
    qs.forEach((d) => {
      const j = d.data();
      if (j.status === 'draft') return;
      const key = j.project || j.customer || 'Untitled';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(j);
    });
    return [...groups.entries()].map(([name, jobs]) => ({ name, count: jobs.length }))
      .sort((a, b) => b.count - a.count);
  } catch (e) {
    console.warn('[Nivelato] could not load jobs:', e.message);
    return null;
  }
}

/* ---- registered devices (item 25) ----
   Ported from company/users.html's detail panel: the read goes through
   the owner-scoped listUserDevices callable (devices/{id} is not
   client-readable by rules). Own devices rename through renameDevice;
   a member's devices rename through the org-scoped renameMemberDevice.
   The server enforces the owner rule either way. */
let expandedDevices = false;
async function renderDevices(m) {
  const body = document.getElementById('ov-devices-body');
  const title = document.getElementById('ov-devices-title');
  if (!body) return;
  if (!guardEnter('devices:' + m.uid)) return;
  body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('loadingDevices')) + '</div>';
  try {
    const fn = httpsCallable(getFunctions(auth.app, 'us-central1'), 'listUserDevices');
    const { data } = await fn({ uid: m.uid });
    if (!body.isConnected) { guardExit('devices:' + m.uid); return; }
    const devices = (data && data.devices) || [];
    const limit = (data && data.limit) || 5;
    if (title) title.textContent = t('devices') + ' (' + devices.length + '/' + limit + ')';
    if (!devices.length) {
      body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('noDevices')) + '</div>';
      guardExit('devices:' + m.uid);
      renderEnroll(m, 0);
      return;
    }
    guardExit('devices:' + m.uid);
    const visible = expandedDevices ? devices : devices.slice(0, limit);
    const isSelfView = m.uid === (currentUser && currentUser.uid);
    const canRename = isSelfView || _can('userManagement');
    body.innerHTML = visible.map((d) => {
      const name = d.displayName || t('unnamedDevice');
      const modelBits = [d.brand, d.model].filter(Boolean).join(' ');
      const sub = modelBits || (d.appVersionName ? 'Nivelato v' + d.appVersionName : 'Nivelato');
      const linked = d.linkedAt
        ? new Date(d.linkedAt).toLocaleDateString(LANG === 'es' ? 'es' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '';
      return '<div class="dev-row' + (d.outdated ? ' outdated' : '') + '">'
        + '<div class="dev-icon" aria-hidden="true"></div>'
        + '<div class="dev-meta">'
        + '<div class="dev-name"><span class="dev-name-text">' + escapeHtml(name) + '</span>'
        + (d.outdated ? '<span class="dev-warn">' + escapeHtml(t('updateAvailable')) + '</span>' : '')
        + (canRename ? '<button class="dev-rename" data-rename="' + escapeHtml(d.uuid) + '">' + escapeHtml(t('rename')) + '</button>' : '')
        + '</div>'
        + '<div class="dev-sub">' + escapeHtml(sub) + (linked ? ' · ' + escapeHtml(t('linked')) + ' ' + escapeHtml(linked) : '') + '</div>'
        + '<div class="dev-edit-slot"></div>'
        + '</div></div>';
    }).join('') +
    (devices.length > limit ? '<button class="niv-btn-pill" id="ov-btn-more-devices">' + escapeHtml(expandedDevices ? t('showLess') : t('viewMore')) + '</button>' : '');
    const more = document.getElementById('ov-btn-more-devices');
    if (more) more.addEventListener('click', () => { expandedDevices = !expandedDevices; renderDevices(m); });
    body.querySelectorAll('[data-rename]').forEach((btn) => {
      btn.addEventListener('click', () => openDeviceRename(btn, m));
    });
    renderEnroll(m, devices.length);
  } catch (e) {
    guardExit('devices:' + m.uid);
    if (body.isConnected) body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('couldNotDevices')) + '</div>';
    renderEnroll(m, null);
  }
}

// ---- enrollment card (spec section 2.6) -------------------------------
// QR + OTP, the SAME single-use token in two presentation forms. Shown
// prominent when the employee has no registered device; collapsed
// behind a "link another device" button once devices exist. The token
// itself is server-minted (createEnrollmentToken); this card never
// stores or re-reads a code, so a fresh generate supersedes the old one
// and the old one is gone from here the moment it does.
async function renderEnroll(m, deviceCount) {
  const body = document.getElementById('ov-enroll-body');
  if (!body || !m.email) return;
  if (!guardEnter('enroll:' + m.uid)) return;
  try {
    const statusFn = httpsCallable(getFunctions(auth.app, 'us-central1'), 'getEnrollmentTokenStatus');
    const { data } = await statusFn({ orgId, email: m.email });
    guardExit('enroll:' + m.uid);
    if (!body.isConnected) return;
    paintEnroll(body, m, (data && data.status) || 'none', data || {}, deviceCount === 0);
  } catch (e) {
    guardExit('enroll:' + m.uid);
    if (body.isConnected) paintEnroll(body, m, 'none', {}, deviceCount === 0);
  }
}

function paintEnroll(body, m, status, info, prominent) {
  let statusText = t('enrollNone');
  if (status === 'pending') {
    statusText = info.expiresAt
      ? t('enrollActive', { date: new Date(info.expiresAt).toLocaleDateString() })
      : t('enrollActive', { date: '' });
  } else if (status === 'used') statusText = t('enrollUsed');
  else if (status === 'revoked') statusText = t('enrollRevoked');
  const genLabel = prominent
    ? (status === 'none' ? t('enrollGenerate') : t('enrollRegenerate'))
    : t('linkAnother');
  body.innerHTML = '<div class="enroll-status">' + escapeHtml(statusText) + '</div>'
    + '<div class="enroll-actions"><button type="button" class="niv-btn-pill' + (prominent ? ' niv-btn-primary' : '') + '" id="ov-enroll-gen">'
    + escapeHtml(genLabel) + '</button></div>'
    + '<div id="ov-enroll-result"></div>';
  const gen = document.getElementById('ov-enroll-gen');
  if (gen) gen.addEventListener('click', function () { generateEnroll(m); });
}

async function generateEnroll(m) {
  const result = document.getElementById('ov-enroll-result');
  const gen = document.getElementById('ov-enroll-gen');
  if (!result) return;
  if (gen) { gen.disabled = true; gen.textContent = t('enrollWorking'); }
  try {
    const createTok = httpsCallable(getFunctions(auth.app, 'us-central1'), 'createEnrollmentToken');
    const { data } = await createTok({ orgId, email: m.email });
    if (!result.isConnected) return;
    const when = data.expiresAt ? new Date(data.expiresAt).toLocaleDateString() : '';
    result.innerHTML = '<div style="margin-top:14px">'
      + (data.qrSvg ? '<div class="enroll-qr">' + data.qrSvg + '</div>' : '')
      + '<div class="enroll-otp-label">' + escapeHtml(t('enrollOtpLabel')) + '</div>'
      + '<div class="enroll-otp">' + escapeHtml(data.codeDisplay || data.code || '') + '</div>'
      + (when ? '<div class="enroll-expiry">' + escapeHtml(t('enrollExpires', { date: when })) + '</div>' : '')
      + '<div class="enroll-actions">'
      + '<button type="button" class="niv-btn-pill" id="ov-enroll-copylink">' + escapeHtml(t('copyLink')) + '</button>'
      + '<button type="button" class="niv-btn-pill" id="ov-enroll-copycode">' + escapeHtml(t('copyCode')) + '</button>'
      + '</div></div>';
    const cl = document.getElementById('ov-enroll-copylink');
    if (cl) cl.addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(data.url); cl.textContent = t('copiedLink'); } catch (_) {}
    });
    const cc = document.getElementById('ov-enroll-copycode');
    if (cc) cc.addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(data.codeDisplay || data.code || ''); cc.textContent = t('copiedCode'); } catch (_) {}
    });
  } catch (e) {
    if (result.isConnected) {
      result.innerHTML = '<div class="enroll-status" style="color:#f87171;margin-top:12px">' + escapeHtml(t('enrollFailed')) + '</div>';
    }
  } finally {
    if (gen && gen.isConnected) { gen.disabled = false; gen.textContent = t('enrollRegenerate'); }
  }
}

function openDeviceRename(btn, m) {
  const row = btn.closest('.dev-row');
  const slot = row && row.querySelector('.dev-edit-slot');
  if (!slot || slot.dataset.open === '1') return;
  slot.dataset.open = '1';
  const uuid = btn.getAttribute('data-rename');
  const nameEl = row.querySelector('.dev-name-text');
  const current = nameEl ? nameEl.textContent.trim() : '';
  slot.innerHTML = '<div class="dev-edit">'
    + '<input type="text" maxlength="60" value="' + escapeHtml(current === t('unnamedDevice') ? '' : current) + '" placeholder="' + escapeHtml(t('deviceName')) + '" aria-label="' + escapeHtml(t('deviceName')) + '" />'
    + '<button class="dev-save">' + escapeHtml(t('save')) + '</button>'
    + '<button class="dev-cancel">' + escapeHtml(t('cancel')) + '</button>'
    + '</div>';
  const input = slot.querySelector('input');
  input.focus();
  input.select();
  slot.querySelector('.dev-cancel').addEventListener('click', () => renderDevices(m));
  slot.querySelector('.dev-save').addEventListener('click', async () => {
    const saveBtn = slot.querySelector('.dev-save');
    if (saveBtn.disabled || !guardEnter('rename:' + uuid)) return;
    saveBtn.disabled = true;
    saveBtn.textContent = t('saving');
    try {
      const isSelfView = m.uid === (currentUser && currentUser.uid);
      const fn = httpsCallable(getFunctions(auth.app, 'us-central1'),
        isSelfView ? 'renameDevice' : 'renameMemberDevice');
      const payload = isSelfView
        ? { deviceUuid: uuid, displayName: input.value.trim() }
        : { uid: m.uid, deviceUuid: uuid, displayName: input.value.trim() };
      await fn(payload);
      guardExit('rename:' + uuid);
      renderDevices(m);
    } catch (e) {
      guardExit('rename:' + uuid);
      alert(t('renameFailed', { msg: e.message || t('unknownError') }));
      saveBtn.disabled = false;
      saveBtn.textContent = t('save');
    }
  });
}

/* ---- permission editing ----
   Same storage and read model the administration page
   (company/users.html) uses: explicit booleans at
   users/{uid}.permissions.<key>, read back through makePermChecker
   (explicit flag wins, then the owner grant, then the role fallback).
   Firestore rules allow that write only for the org owner, so the
   affordance is gated on the userManagement capability AND the owner
   role — the combination that can actually save. Saving re-renders
   the detail, so the chips reflect the new saved state. */
let permEdit = null;
function canEditPerms() {
  return !!(_can && _can('userManagement') && currentUserData && currentUserData.role === 'owner');
}
function startPermEdit(m) {
  const checker = makePermChecker(m);
  const values = {};
  permKeysFor(m).forEach((k) => { values[k] = !!checker(k); });
  permEdit = { uid: m.uid, values };
  renderDetail();
}
function permEditorRowsHtml(m) {
  return permKeysFor(m).map((k) => {
    const on = !!(permEdit.values && permEdit.values[k]);
    const label = (STR[LANG].permLabels && STR[LANG].permLabels[k]) || k;
    return '<div class="ov-perm-row"><span>' + escapeHtml(label) + '</span>'
      + '<button class="ov-toggle' + (on ? ' on' : '') + '" data-key="' + escapeHtml(k) + '" aria-pressed="' + on
      + '" aria-label="' + escapeHtml(label) + '"><span class="knob"></span></button></div>';
  }).join('');
}
function wirePermEditor(m) {
  document.querySelectorAll('#ov-detail .ov-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-key');
      permEdit.values[k] = !permEdit.values[k];
      btn.classList.toggle('on', permEdit.values[k]);
      btn.setAttribute('aria-pressed', String(permEdit.values[k]));
    });
  });
  const cancel = document.getElementById('ov-perms-cancel');
  if (cancel) cancel.addEventListener('click', () => { permEdit = null; renderDetail(); });
  const save = document.getElementById('ov-perms-save');
  if (save) save.addEventListener('click', () => savePermEdit(m, save));
}
async function savePermEdit(m, btn) {
  if (!permEdit || !guardEnter('perm-save:' + m.uid)) return;
  const checker = makePermChecker(m);
  const updates = {};
  const saved = {};
  Object.keys(permEdit.values).forEach((k) => {
    if (!!checker(k) !== !!permEdit.values[k]) {
      updates['permissions.' + k] = !!permEdit.values[k];
      saved[k] = !!permEdit.values[k];
    }
  });
  if (!Object.keys(updates).length) {
    permEdit = null;
    guardExit('perm-save:' + m.uid);
    renderDetail();
    return;
  }
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'users', m.uid), updates);
    m.permissions = { ...(m.permissions || {}), ...saved };
    permEdit = null;
    renderDetail();
  } catch (e) {
    alert(t('permSaveFailed', { msg: e.message || t('unknownError') }));
    btn.disabled = false;
  } finally {
    guardExit('perm-save:' + m.uid);
  }
}
async function renderProjects(m) {
  const body = document.getElementById('ov-projects-body');
  if (!body) return;
  if (!guardEnter('projects:' + m.uid)) return;
  const groups = await loadProjects(m.uid);
  guardExit('projects:' + m.uid);
  if (!body.isConnected) return;
  if (selectedUid !== m.uid) return;
  if (groups === null) {
    body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('couldNotProjects')) + '</div>';
    return;
  }
  if (!groups.length) {
    body.innerHTML = '<div class="ov-empty">' + escapeHtml(t('noProjects')) + '</div>';
    return;
  }
  body.innerHTML = groups.map((g) =>
    '<div class="ov-proj-row"><div><div class="ov-proj-name">' + escapeHtml(g.name) + '</div>'
    + '<div class="ov-proj-sub">' + g.count + ' '
    + escapeHtml(g.count === 1 ? t('measuredSpace') : t('measuredSpaces')) + '</div></div></div>'
  ).join('');
}

async function refreshOnline() {
  try {
    const online = await getOnlineUsers(orgId);
    onlineUids = new Set(online.map((u) => u.uid));
    onlineLoaded = true;
    renderSub();
    renderList();
    const pv = document.getElementById('ov-presence-value');
    if (pv && selectedUid) pv.textContent = onlineUids.has(selectedUid) ? t('online') : t('offline');
  } catch (_) { /* online state is a nice-to-have */ }
}

function showLoadError(msg) {
  window.__nivUsersBooted = true;
  const area = document.getElementById('ov-area');
  if (area) area.style.display = 'none';
  const sub = document.getElementById('ov-sub');
  if (sub) sub.textContent = '';
  const denied = document.getElementById('ov-denied');
  if (!denied) return;
  denied.style.display = 'block';
  const title = document.getElementById('ov-denied-title');
  if (title) title.textContent = t('loadErrorTitle');
  const desc = document.getElementById('ov-denied-desc');
  if (desc) {
    desc.textContent = msg;
    const br = document.createElement('br');
    const btn = document.createElement('button');
    btn.className = 'niv-btn-pill ov-retry';
    btn.textContent = t('retry');
    btn.addEventListener('click', () => window.location.reload());
    desc.appendChild(br);
    desc.appendChild(btn);
  }
}
function showDenied() {
  window.__nivUsersBooted = true;
  const area = document.getElementById('ov-area');
  if (area) area.style.display = 'none';
  const sub = document.getElementById('ov-sub');
  if (sub) sub.textContent = '';
  const denied = document.getElementById('ov-denied');
  if (denied) denied.style.display = 'block';
}

const searchInput = document.getElementById('ov-search-input');
if (searchInput) {
  searchInput.addEventListener('input', () => { searchText = searchInput.value || ''; renderList(); });
}

/* ---- auth + data ----
   Access (the overview's own enforcement, per modules/README.md):
   signed-in active members of the org. The members list query is the
   exact one the administration page and the dashboard run
   (users where orgId == the viewer's orgId), which firestore.rules
   allows to any active same-org member, so this page can never expose
   a user the viewer could not already list elsewhere. On top of that,
   the page requires the viewDashboard permission through the shared
   checker (explicit flag wins, then the owner grant, then the role
   fallback, which grants it to every role). Non-permitted viewers get
   the denied card the company settings page gives its non-permitted
   viewers, and no members query runs for them. */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  try {
    const gate = await ensureFlowClaims();
    if (gate && gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
  } catch (_) { /* fails soft */ }
  currentUser = user;

  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  let userSnap;
  try {
    userSnap = await getDoc(doc(db, 'users', user.uid));
  } catch (e) {
    showLoadError(t('couldNotProfile', { msg: e.message || t('unknownError') }));
    return;
  }
  if (!userSnap.exists()) {
    alert(t('missingProfile'));
    window.location.href = 'https://login.nivelatolabs.com/?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  if (currentUserData.language === 'es' || currentUserData.language === 'en') {
    LANG = currentUserData.language;
    try { if (window.NivSettings && window.NivSettings.setLang) window.NivSettings.setLang(LANG); } catch (_) {}
    try { if (window.__nivSidebarHandle && window.__nivSidebarHandle.setLang) window.__nivSidebarHandle.setLang(LANG); } catch (_) {}
  }
  orgId = currentUserData.orgId;
  if (!orgId) { showLoadError(t('noOrg')); return; }
  _can = makePermChecker(currentUserData);

  const isActiveMember = currentUserData.disabled !== true && currentUserData.disabled !== 'rejected';
  if (!isActiveMember || !_can('viewDashboard')) { applyStaticLang(); showDenied(); return; }

  applyStaticLang();
  if (_can('userManagement')) {
    const mg = document.getElementById('ov-manage');
    if (mg) mg.style.display = '';
  }

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  /* Org name for the header only; a failed org read falls back to the
     count alone, it never blocks the directory. */
  try {
    const orgSnap = await getDoc(doc(db, 'orgs', orgId));
    if (orgSnap.exists()) orgName = orgSnap.data().name || '';
  } catch (e) {
    console.warn('[Nivelato] could not load org name:', e.message);
  }
  renderSub();

  let qs;
  try {
    qs = await getDocs(query(collection(db, 'users'), where('orgId', '==', orgId)));
  } catch (e) {
    showLoadError(t('couldNotUsers', { msg: e.message || t('unknownError') }));
    return;
  }
  members = qs.docs
    .map((d) => ({ uid: d.id, ...d.data() }))
    .filter((m) => m.disabled !== 'rejected');

  window.__nivUsersBooted = true;
  renderSub();
  if (!memberById(selectedUid)) {
    selectedUid = members.length ? sortedMembers()[0].uid : null;
  }
  renderList();
  renderDetail();
  refreshOnline();
  setInterval(refreshOnline, 60000);
});
applyStaticLang();
</script>
<script src="/niv-settings.js"></script>
<script src="/modules/shell-bridge.js"></script>
<script>
  /* Chrome modules: sidebar (target=shell, this page is its Usuarios
     door at /users) and, per the shell rule, the top bar ONLY at 901px
     and up, never on mobile. Embed mode mounts neither: it is
     chrome-less. Language follows the local chain here; the sidebar
     module resolves the signed-in user's language itself for its own
     gate, and the bridge init carries this page's resolved language. */
  (function () {
    var embed = false;
    try {
      var e = new URLSearchParams(window.location.search).get('embed');
      embed = e === '1' || e === 'users';
    } catch (err) {}
    if (embed || !window.NivShell) return;
    var lang = 'es';
    try {
      var ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      var ls = window.localStorage.getItem('nivelato-login-lang');
      lang = (ck === 'es' || ck === 'en') ? ck : ((ls === 'es' || ls === 'en') ? ls : 'es');
    } catch (err2) {}
    window.__nivSidebarHandle = window.NivShell.mountSidebar('#chrome-sidebar', { target: 'shell', active: 'users', lang: lang });
    if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
      /* Default (dashboard-family) context, NOT 'settings': the settings
         context renders nothing by design (modules/README.md), which
         left this page's topbar permanently empty. This page is a
         dashboard view (shell sidebar, active 'users'), so it mounts
         the bar the same way the dashboard family does. */
      window.NivShell.mountTopbar('#chrome-topbar', { active: 'users' });
    }
  })();
</script>
<script>
  /* Boot watchdog: if the module script cannot run at all, the directory
     would otherwise sit on the loading text forever. After a grace
     period, an unbooted page replaces it with an honest error plus a
     retry, in the language of the local chain. */
  setTimeout(function () {
    if (window.__nivUsersBooted) return;
    var es = true;
    try {
      var ls = window.localStorage.getItem('nivelato-login-lang');
      var ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      es = (ck || ls || 'es') !== 'en';
    } catch (e) {}
    var msg = es ? 'No se pudieron cargar los usuarios. Revisa tu conexión e inténtalo de nuevo.'
                 : 'Could not load users. Check your connection and try again.';
    var retry = es ? 'Reintentar' : 'Retry';
    var list = document.getElementById('ov-list');
    if (list) {
      list.innerHTML = '<div class="ov-error">' + msg + '<br><button class="niv-btn-pill ov-retry" onclick="window.location.reload()">' + retry + '</button></div>';
    }
  }, 15000);
</script>
