<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#121212">
<title>Nivelato — Sin conexión</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #f8f9fa;
    color: #212529;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    gap: 14px;
  }
  .icon { font-size: 56px; }
  h2 { font-size: 20px; font-weight: 700; }
  p { font-size: 14px; color: #495057; max-width: 360px; line-height: 1.6; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: #0c6b3c;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
  }
  .btn:active { background: #095c33; }
</style>
<link rel="stylesheet" href="./qgc-theme.css">
</head>
<body>
  <!-- Offline notice page: the service worker's navigation fallback when the
       network is down (see sw.js). Precached, so it always loads offline. -->
  <div class="icon">📶</div>
  <h2>Sin conexión</h2>
  <p>Estás offline. Reconecta a internet y vuelve a intentarlo — la app se cargará de nuevo.</p>
  <button class="btn" type="button" onclick="location.reload()">Reintentar</button>
</body>
</html>
