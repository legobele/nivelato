<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Nivelato — Foto con medidas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #0f1216; color: #fff; overflow: hidden; }
  #app-shell { display: flex; flex-direction: column; height: 100dvh; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #171b21; border-bottom: 1px solid #262c35; flex-shrink: 0; gap: 10px; }
  .header-titles { min-width: 0; }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8b93a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .header-btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; background: #262c35; color: #fff; }
  .header-btn.primary { background: #1971c2; }
  .header-btn:hover { filter: brightness(1.15); }
  .header-btn:disabled { opacity: 0.4; cursor: default; }

  /* STAGE */
  #stage { flex: 1; position: relative; overflow: hidden; background: #0f1216; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #photo-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; touch-action: none; }

  /* EMPTY STATE */
  #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8b93a1; text-align: center; padding: 24px; }
  #empty-state .big { font-size: 44px; }
  .btn-photo { padding: 14px 22px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; background: #1971c2; color: #fff; }
  .btn-photo.ghost { background: #262c35; }

  /* TOOLBAR */
  #toolbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: #171b21; border-top: 1px solid #262c35; flex-shrink: 0; overflow-x: auto; flex-wrap: wrap; }
  .tool-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border: 1px solid #262c35; border-radius: 8px; background: transparent; color: #8b93a1; font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer; }
  .tool-btn .ico { font-size: 15px; }
  .tool-btn.active { background: #1d3a5c; border-color: #1971c2; color: #fff; }
  .tool-sep { width: 1px; height: 26px; background: #262c35; flex-shrink: 0; }

  /* LOUPE */
  #loupe-canvas { display: none; position: fixed; width: 160px; height: 160px; border-radius: 50%; box-shadow: 0 4px 24px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.7); pointer-events: none; z-index: 5; background:#000; }

  /* LABEL MODAL */
  #label-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  #label-modal.open { display: flex; }
  .label-card { background: #171b21; border: 1px solid #262c35; border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; }
  .label-card h3 { font-size: 15px; margin-bottom: 12px; }
  .label-card input { width: 100%; padding: 10px 12px; border: 1px solid #3a4350; border-radius: 8px; background: #0f1216; color: #fff; font-size: 15px; font-family: inherit; margin-bottom: 12px; outline: none; }
  .label-card input:focus { border-color: #1971c2; }
  .label-actions { display: flex; gap: 8px; }
  .label-actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-ok { background: #1971c2; color: #fff; }
  .btn-cancel { background: #262c35; color: #8b93a1; }
  .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .quick-chips button { padding: 6px 10px; border: 1px solid #3a4350; border-radius: 6px; background: transparent; color: #c9ced6; font-size: 12px; font-family: inherit; cursor: pointer; }
  .quick-chips button:hover { border-color: #1971c2; color: #fff; }

  /* HINT */
  #hint-bar { font-size: 11px; color: #8b93a1; text-align: center; padding: 8px 16px; background: #171b21; border-top: 1px solid #262c35; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app-shell">
  <header>
    <div class="header-titles">
      <div class="header-title">Foto con medidas</div>
      <div class="header-sub" id="header-sub">Alinea el marco con la abertura</div>
    </div>
    <div class="header-btns">
      <button class="header-btn" id="btn-reset" disabled>↩️ Marco</button>
      <button class="header-btn primary" id="btn-done" disabled>✓ Usar esta foto</button>
    </div>
  </header>

  <div id="stage">
    <div id="empty-state">
      <div class="big">📷</div>
      <div>Agrega una foto del hueco para marcar las medidas.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button class="btn-photo" id="btn-camera">Tomar foto</button>
        <button class="btn-photo ghost" id="btn-gallery">Elegir de galería</button>
      </div>
    </div>
    <canvas id="photo-canvas" style="display:none;touch-action:none;"></canvas>
    <canvas id="loupe-canvas"></canvas>
  </div>

  <div id="toolbar" style="display:none;">
    <button class="tool-btn" id="tool-line" data-tool="line"><span class="ico">📏</span>Línea</button>
    <button class="tool-btn" id="tool-arrow" data-tool="arrow"><span class="ico">↔️</span>Flecha</button>
    <button class="tool-btn" id="tool-text" data-tool="text"><span class="ico">🔤</span>Texto</button>
    <span class="tool-sep"></span>
    <button class="tool-btn" id="btn-undo"><span class="ico">↩️</span>Deshacer</button>
  </div>

  <div id="hint-bar"></div>
</div>

<div id="label-modal">
  <div class="label-card">
    <h3 id="label-title">Texto</h3>
    <div class="quick-chips" id="quick-chips"></div>
    <input id="label-input" placeholder="Texto" maxlength="40" />
    <div class="label-actions">
      <button class="btn-cancel" id="btn-label-cancel">Cancelar</button>
      <button class="btn-ok" id="btn-label-ok">Agregar</button>
    </div>
  </div>
</div>

<input type="file" id="file-input-camera" accept="image/*" capture="environment" style="display:none" />
<input type="file" id="file-input-gallery" accept="image/*" style="display:none" />

<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const canvas = document.getElementById('photo-canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const hintBar = document.getElementById('hint-bar');
const btnDone = document.getElementById('btn-done');
const btnReset = document.getElementById('btn-reset');
const loupeCanvas = document.getElementById('loupe-canvas');
const loupeCtx = loupeCanvas.getContext('2d');
const LOUPE = 160;
const LOUPE_ZOOM = 3;

let img = null;
let baseW = 0, baseH = 0;
let scale = 1;
let corners = null;
let dragging = null;
let activePointer = null;
let measurements = {};
let currentTool = 'none';        // 'none' | 'line' | 'arrow' | 'text'
let drawingShape = null;         // { type, a } while drawing a line/arrow
let customStrokes = [];          // custom line/arrow/text annotations (image px)
let pendingLabel = null;         // { type, a, b } waiting on modal
let quickLabels = [];
let frameNorm = null;

// ── helpers ──
function setHint(t) { hintBar.textContent = t; }

function toImageCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function fmtInches(v) {
  if (!v && v !== 0) return null;
  const whole = Math.floor(v);
  const frac = v - whole;
  let s = '';
  const map = [[0.5,'1/2'],[0.25,'1/4'],[0.75,'3/4'],[0.333,'1/3'],[0.667,'2/3'],[0.125,'1/8'],[0.375,'3/8'],[0.625,'5/8'],[0.875,'7/8'],[0.0625,'1/16'],[0.1875,'3/16'],[0.3125,'5/16'],[0.4375,'7/16'],[0.5625,'9/16'],[0.6875,'11/16'],[0.8125,'13/16'],[0.9375,'15/16']];
  for (const [f, str] of map) {
    if (Math.abs(frac - f) < 0.03) { s = str; break; }
  }
  if (!s && frac > 0.02) s = Math.round(frac * 16) + '/16';
  return (whole > 0 || !s) ? (whole + (s ? ' ' + s : '')) : s;
}

// ── frame geometry (normalized 0..1, mirrors the main graph) ──
function computeFrameNorm(m) {
  const pIv = m.paredIzq || 0, pDv = m.paredDer || 0, tcv = m.techo || 0, psv = m.piso || 0;
  const padX = 0.13, padY = 0.15;
  const bx = padX, by = padY, bw = 1 - 2*padX, bh = 1 - 2*padY;
  const EXAG = Math.min(bw, bh) * 0.15;
  const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
  const pIMax = Math.max(pIv, 1), pDMax = Math.max(pDv, 1), tMax = Math.max(tcv, 1), pMax = Math.max(psv, 1);
  const leftOffsetTop   = clamp((pIv / pIMax) * EXAG, EXAG);
  const rightOffsetTop  = -clamp((pDv / pDMax) * EXAG, EXAG);
  const topOffsetRight  = clamp((tcv / tMax) * EXAG * (bh / bw), EXAG);
  const bottomOffsetRight = clamp((psv / pMax) * EXAG * (bh / bw), EXAG);
  const anchoBot = m.anchoBot || 36;
  const altoIzq  = m.altoIzq  || 84;
  const anchoTop = m.anchoTop || Math.max(0, anchoBot - pIv - pDv);
  const altoDer  = m.altoDer  || Math.max(0, altoIzq - tcv - psv);
  return {
    TL: { x: bx + leftOffsetTop, y: by },
    TR: { x: bx + bw + rightOffsetTop, y: by + topOffsetRight },
    BR: { x: bx + bw + rightOffsetTop, y: by + bh + bottomOffsetRight },
    BL: { x: bx + leftOffsetTop, y: by + bh },
    anchoBot, anchoTop, altoIzq, altoDer
  };
}

function cornersFromNorm(g) {
  const xs = [g.TL.x, g.TR.x, g.BR.x, g.BL.x];
  const ys = [g.TL.y, g.TR.y, g.BR.y, g.BL.y];
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const nw = maxX - minX, nh = maxY - minY;
  const ratio = nw > 0 && nh > 0 ? nh / nw : 1;
  let w = baseW * 0.72;
  let h = w * ratio;
  if (h > baseH * 0.72) { h = baseH * 0.72; w = h / ratio; }
  const scaleX = w / nw, scaleY = h / nh;
  const cx = baseW / 2, cy = baseH / 2;
  const offX = cx - (minX + maxX) / 2 * scaleX;
  const offY = cy - (minY + maxY) / 2 * scaleY;
  const map = (p) => ({ x: p.x * scaleX + offX, y: p.y * scaleY + offY });
  return { TL: map(g.TL), TR: map(g.TR), BR: map(g.BR), BL: map(g.BL) };
}

// ── rendering ──
const LINE_COLOR = '#f59f00';
const LINE_WIDTH = 5;
const TEXT_COLOR = '#ffffff';
const PILL_COLOR = 'rgba(0,0,0,0.75)';
const FILL_COLOR = 'rgba(255,255,255,0.08)';

function pillPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawLabel(c, text, x, y, angle, size) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.font = 'bold ' + size + 'px Inter, system-ui, sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const w = c.measureText(text).width;
  pillPath(c, -w/2 - 8, -size/2 - 6, w + 16, size + 12, 7);
  c.fillStyle = PILL_COLOR;
  c.fill();
  c.fillStyle = TEXT_COLOR;
  c.fillText(text, 0, 1);
  c.restore();
}

// LABEL SIZE: a readable fixed size in image px, scaled to the photo.
// ~36px on a 1400px image, ~22px on a 700px image → always legible.
function labelFontSize() {
  return Math.max(22, baseW * 0.026);
}

// dimension line with offset, label parallel & centered
function drawDimLinePx(c, a, b, off, label) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const perp = { x: -Math.sin(ang), y: Math.cos(ang) };
  const o = off * Math.hypot(baseW, baseH) * 0.035;
  const a2 = { x: a.x + perp.x * o, y: a.y + perp.y * o };
  const b2 = { x: b.x + perp.x * o, y: b.y + perp.y * o };
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = LINE_WIDTH;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(a2.x, a2.y);
  c.lineTo(b2.x, b2.y);
  c.stroke();
  // end ticks
  const tlen = Math.max(8, labelFontSize() * 0.4);
  c.lineWidth = 3;
  for (const p of [a2, b2]) {
    c.beginPath();
    c.moveTo(p.x - tlen * Math.cos(ang - Math.PI/2), p.y - tlen * Math.sin(ang - Math.PI/2));
    c.lineTo(p.x + tlen * Math.cos(ang - Math.PI/2), p.y + tlen * Math.sin(ang - Math.PI/2));
    c.stroke();
  }
  if (label) {
    const mid = { x: (a2.x + b2.x) / 2, y: (a2.y + b2.y) / 2 };
    drawLabel(c, label, mid.x, mid.y, ang, labelFontSize());
  }
}

function drawArrowLine(c, a, b, label) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = LINE_WIDTH;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(a.x, a.y);
  c.lineTo(b.x, b.y);
  c.stroke();
  // arrowhead
  const head = Math.max(14, labelFontSize() * 0.6);
  c.beginPath();
  c.moveTo(b.x, b.y);
  c.lineTo(b.x - head * Math.cos(ang - 0.45), b.y - head * Math.sin(ang - 0.45));
  c.moveTo(b.x, b.y);
  c.lineTo(b.x - head * Math.cos(ang + 0.45), b.y - head * Math.sin(ang + 0.45));
  c.stroke();
  if (label) {
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    drawLabel(c, label, mid.x, mid.y, ang, labelFontSize());
  }
}

function drawTextAnno(c, s) {
  drawLabel(c, s.label, s.x, s.y, 0, labelFontSize());
}

function renderFrame(c, corners, opts) {
  const pts = [corners.TL, corners.TR, corners.BR, corners.BL];
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath();
  c.fillStyle = FILL_COLOR;
  c.fill();
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = LINE_WIDTH;
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath();
  c.stroke();

  const g = frameNorm;
  const o = 0;  // dimension lines exactly ON the frame borders
  drawDimLinePx(c, corners.BL, corners.BR,  o, fmtInches(g.anchoBot) + '"');
  drawDimLinePx(c, corners.TL, corners.TR, -o, fmtInches(g.anchoTop) + '"');
  drawDimLinePx(c, corners.TL, corners.BL, -o, fmtInches(g.altoIzq) + '"');
  drawDimLinePx(c, corners.TR, corners.BR,  o, fmtInches(g.altoDer) + '"');

  if (opts && opts.handles) drawHandles(c);
}

function drawHandles(c) {
  const r = Math.max(10, baseW * 0.018);
  for (const k of ['TL', 'TR', 'BR', 'BL']) {
    const p = corners[k];
    c.beginPath();
    c.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.fill();
    c.beginPath();
    c.arc(p.x, p.y, r, 0, Math.PI * 2);
    c.fillStyle = '#fff';
    c.fill();
    c.lineWidth = 2.5;
    c.strokeStyle = LINE_COLOR;
    c.stroke();
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(p.x - r * 0.6, p.y); c.lineTo(p.x + r * 0.6, p.y);
    c.moveTo(p.x, p.y - r * 0.6); c.lineTo(p.x, p.y + r * 0.6);
    c.stroke();
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, baseW, baseH);
  if (corners) renderFrame(ctx, corners, { handles: true });
  // custom strokes
  for (const s of customStrokes) {
    if (s.type === 'line') drawArrowLine(ctx, s.a, s.b, s.label);
    else if (s.type === 'arrow') drawArrowLine(ctx, s.a, s.b, s.label);
    else if (s.type === 'text') drawTextAnno(ctx, s);
  }
  // in-progress shape
  if (drawingShape) {
    drawArrowLine(ctx, drawingShape.a, drawingShape.b, null);
  }
}

// ── corner init / reset ──
function resetCorners() {
  if (!frameNorm) frameNorm = computeFrameNorm(measurements);
  corners = cornersFromNorm(frameNorm);
  redraw();
}

// ── image loading ──
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
});

document.getElementById('btn-camera').addEventListener('click', () => {
  document.getElementById('file-input-camera').click();
});
document.getElementById('btn-gallery').addEventListener('click', () => {
  document.getElementById('file-input-gallery').click();
});

['file-input-camera', 'file-input-gallery'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => loadImage(ev.target.result);
    reader.readAsDataURL(f);
    el.value = '';
  });
});

function loadImage(dataUrl) {
  const im = new Image();
  im.onload = () => {
    img = im;
    baseW = im.naturalWidth;
    baseH = im.naturalHeight;
    const maxEdge = 1600;
    if (Math.max(baseW, baseH) > maxEdge) {
      const r = maxEdge / Math.max(baseW, baseH);
      baseW = Math.round(baseW * r);
      baseH = Math.round(baseH * r);
    }
    canvas.width = baseW;
    canvas.height = baseH;
    const stageRect = stage.getBoundingClientRect();
    const pad = 8;
    scale = Math.min((stageRect.width - pad) / baseW, (stageRect.height - pad) / baseH);
    canvas.style.width = (baseW * scale) + 'px';
    canvas.style.height = (baseH * scale) + 'px';
    canvas.style.display = 'block';
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    btnDone.disabled = false;
    btnReset.disabled = false;
    resetCorners();
    setHint('Arrastra los puntos de las esquinas para alinear el marco. Usa las herramientas para añadir líneas o texto.');
  };
  im.src = dataUrl;
}

// ── hit testing / dragging ──
function hitHandle(e) {
  if (!corners) return null;
  const p = toImageCoords(e);
  const tol = 26 / scale;
  let best = null, bestD = tol;
  for (const k of ['TL', 'TR', 'BR', 'BL']) {
    const hp = corners[k];
    const d = Math.hypot(hp.x - p.x, hp.y - p.y);
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
}

// ── loupe: sample the actual displayed canvas region ──
function showLoupe(clientX, clientY) {
  if (!img) return;
  loupeCanvas.style.display = 'block';
  const p = toImageCoords({ clientX, clientY });
  const r = LOUPE / 2;
  loupeCanvas.width = LOUPE;
  loupeCanvas.height = LOUPE;
  loupeCtx.clearRect(0, 0, LOUPE, LOUPE);
  loupeCtx.save();
  loupeCtx.beginPath();
  loupeCtx.arc(r, r, r - 2, 0, Math.PI * 2);
  loupeCtx.clip();
  // draw zoomed region of the IMAGE (the actual pixels under the cursor)
  // srcR: image-px radius such that 2*srcR maps to LOUPE at LOUPE_ZOOM*scale
  // (must match the overlay transform below, or the frame/handles drift)
  const srcR = LOUPE / (2 * LOUPE_ZOOM * scale);
  loupeCtx.drawImage(img,
    p.x - srcR, p.y - srcR, srcR * 2, srcR * 2,
    0, 0, LOUPE, LOUPE);
  // draw frame + dims on top, transformed to the loupe space (no handle circles)
  loupeCtx.save();
  loupeCtx.translate(r, r);
  loupeCtx.scale(LOUPE_ZOOM * scale, LOUPE_ZOOM * scale);
  loupeCtx.translate(-p.x, -p.y);
  if (corners) renderFrame(loupeCtx, corners, { handles: false });
  for (const s of customStrokes) {
    if (s.type === 'line' || s.type === 'arrow') drawArrowLine(loupeCtx, s.a, s.b, s.label);
    else if (s.type === 'text') drawTextAnno(loupeCtx, s);
  }
  loupeCtx.restore();
  loupeCtx.restore();
  // crosshair (lines only — no circle)
  loupeCtx.strokeStyle = 'rgba(255,255,255,0.9)';
  loupeCtx.lineWidth = 1;
  loupeCtx.beginPath();
  loupeCtx.moveTo(r, r - 9); loupeCtx.lineTo(r, r + 9);
  loupeCtx.moveTo(r - 9, r); loupeCtx.lineTo(r + 9, r);
  loupeCtx.stroke();
  // position
  let lx = clientX + 26, ly = clientY - LOUPE - 14;
  if (lx + LOUPE > window.innerWidth) lx = clientX - LOUPE - 26;
  if (ly < 0) ly = clientY + 26;
  loupeCanvas.style.left = lx + 'px';
  loupeCanvas.style.top = ly + 'px';
  loupeCanvas.style.width = LOUPE + 'px';
  loupeCanvas.style.height = LOUPE + 'px';
}

function hideLoupe() {
  loupeCanvas.style.display = 'none';
}

// ── pointer handlers ──
canvas.addEventListener('pointerdown', (e) => {
  if (!img) return;
  e.preventDefault();
  const p = toImageCoords(e);
  if (currentTool === 'line' || currentTool === 'arrow') {
    drawingShape = { type: currentTool, a: p, b: p };
    activePointer = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (currentTool === 'text') {
    pendingLabel = { type: 'text', a: p };
    openLabelModal('Texto', []);
    return;
  }
  // frame corner drag (default)
  const h = hitHandle(e);
  if (h) {
    dragging = h;
    activePointer = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    setHint('Arrastra para mover la esquina');
    showLoupe(e.clientX, e.clientY);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!img) return;
  if (drawingShape && e.pointerId === activePointer) {
    e.preventDefault();
    drawingShape.b = toImageCoords(e);
    redraw();
    return;
  }
  if (!dragging || e.pointerId !== activePointer) return;
  e.preventDefault();
  const p = toImageCoords(e);
  corners[dragging] = { x: Math.max(0, Math.min(baseW, p.x)), y: Math.max(0, Math.min(baseH, p.y)) };
  redraw();
  showLoupe(e.clientX, e.clientY);
});

canvas.addEventListener('pointerup', (e) => {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  hideLoupe();
  if (drawingShape) {
    const len = Math.hypot(drawingShape.b.x - drawingShape.a.x, drawingShape.b.y - drawingShape.a.y);
    if (len > 8) {
      pendingLabel = { type: drawingShape.type, a: drawingShape.a, b: drawingShape.b };
      openLabelModal(drawingShape.type === 'arrow' ? 'Etiqueta de flecha' : 'Etiqueta de línea', quickLabels);
    }
    drawingShape = null;
    redraw();
    return;
  }
  if (dragging) {
    dragging = null;
    setHint('Arrastra los puntos de las esquinas para alinear el marco. Usa las herramientas para añadir líneas o texto.');
  }
});

// ── label modal ──
function openLabelModal(title, chips) {
  document.getElementById('label-title').textContent = title;
  const chipBox = document.getElementById('quick-chips');
  chipBox.innerHTML = '';
  (chips || []).forEach(l => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = l;
    b.onclick = () => { document.getElementById('label-input').value = l; };
    chipBox.appendChild(b);
  });
  document.getElementById('label-input').value = '';
  document.getElementById('label-modal').classList.add('open');
  setTimeout(() => document.getElementById('label-input').focus(), 50);
}

document.getElementById('btn-label-ok').addEventListener('click', () => {
  const val = document.getElementById('label-input').value.trim();
  document.getElementById('label-modal').classList.remove('open');
  if (!pendingLabel) return;
  const pl = pendingLabel;
  pendingLabel = null;
  if (pl.type === 'text') {
    // text without content is pointless — drop it
    if (!val) { redraw(); return; }
    customStrokes.push({ type: 'text', x: pl.a.x, y: pl.a.y, label: val });
  } else {
    // line/arrow persist even without a label
    customStrokes.push({ type: pl.type, a: pl.a, b: pl.b, label: val || null });
  }
  redraw();
});
document.getElementById('btn-label-cancel').addEventListener('click', () => {
  document.getElementById('label-modal').classList.remove('open');
  pendingLabel = null;
  redraw();
});

// ── toolbar ──
document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
  b.addEventListener('click', () => {
    currentTool = b.dataset.tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    setHint({
      line: 'Arrastra para dibujar una línea de medida',
      arrow: 'Arrastra para dibujar una flecha',
      text: 'Toca la foto para agregar texto'
    }[currentTool]);
  });
});
document.getElementById('btn-undo').addEventListener('click', () => {
  if (customStrokes.length) { customStrokes.pop(); redraw(); }
});

btnReset.addEventListener('click', () => {
  if (!img) return;
  resetCorners();
  setHint('Marco restablecido');
});

// ── done → composite + send back ──
btnDone.addEventListener('click', () => {
  if (!img) return;
  btnDone.disabled = true;
  btnDone.textContent = 'Generando…';
  const out = document.createElement('canvas');
  out.width = baseW; out.height = baseH;
  const octx = out.getContext('2d');
  octx.drawImage(img, 0, 0, baseW, baseH);
  if (corners) renderFrame(octx, corners, { handles: false });
  for (const s of customStrokes) {
    if (s.type === 'line' || s.type === 'arrow') drawArrowLine(octx, s.a, s.b, s.label);
    else if (s.type === 'text') drawTextAnno(octx, s);
  }
  const dataUrl = out.toDataURL('image/jpeg', 0.9);
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NIVELATO_ANNOTATED_PHOTO', dataUrl }, '*');
    } else if (window.opener) {
      window.opener.postMessage({ type: 'NIVELATO_ANNOTATED_PHOTO', dataUrl }, '*');
      window.close();
    } else {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'nivelato-medidas.jpg';
      a.click();
      btnDone.disabled = false;
      btnDone.textContent = '✓ Usar esta foto';
    }
  } catch (e) {
    btnDone.disabled = false;
    btnDone.textContent = '✓ Usar esta foto';
    alert('Error al enviar la foto: ' + e.message);
  }
});

// ── measurements handoff from the flow ──
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'NIVELATO_MEASUREMENTS') {
    measurements = {
      anchoBot: e.data.anchoBot,
      anchoTop: e.data.anchoTop,
      altoIzq: e.data.altoIzq,
      altoDer: e.data.altoDer,
      paredIzq: parseLabel(e.data.paredIzq),
      paredDer: parseLabel(e.data.paredDer),
      techo: parseLabel(e.data.techo),
      piso: parseLabel(e.data.piso)
    };
    quickLabels = [];
    const push = (v) => { if (v) quickLabels.push(v); };
    push(e.data.anchoBot ? fmtInches(e.data.anchoBot) + '"' : null);
    push(e.data.anchoTop ? fmtInches(e.data.anchoTop) + '"' : null);
    push(e.data.altoIzq ? fmtInches(e.data.altoIzq) + '"' : null);
    push(e.data.altoDer ? fmtInches(e.data.altoDer) + '"' : null);
    push(e.data.paredIzq); push(e.data.paredDer); push(e.data.techo); push(e.data.piso);
    if (e.data.customer) quickLabels.push(e.data.customer);
    document.getElementById('header-sub').textContent = 'Medidas cargadas — alinea el marco';
    frameNorm = computeFrameNorm(measurements);
    if (img) { resetCorners(); setHint('Arrastra los puntos de las esquinas para alinear el marco. Usa las herramientas para añadir líneas o texto.'); }
  }
});

function parseLabel(s) {
  if (!s) return 0;
  const m = s.match(/(\d+)(?:\s+(\d+)\/(\d+))?/);
  if (!m) return 0;
  return (parseInt(m[1]) || 0) + ((parseInt(m[2]) || 0) / (parseInt(m[3]) || 1));
}

// ── test hook ──
window.__photoTestState = () => ({
  hasImage: !!img,
  baseW, baseH,
  hasFrame: !!corners,
  measurements: Object.assign({}, measurements),
  corners: corners ? Object.assign({}, corners) : null,
  customStrokes: customStrokes.length
});

window.__hitTest = (clientX, clientY) => {
  const rect = canvas.getBoundingClientRect();
  const e = { clientX, clientY };
  const hit = hitHandle(e);
  return { hit, toImg: toImageCoords(e), scale };
};
</script>
