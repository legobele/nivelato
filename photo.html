<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Nivelato — Foto con medidas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #0f1216; color: #fff; overflow: hidden; }
  #app-shell { display: flex; flex-direction: column; height: 100dvh; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #171b21; border-bottom: 1px solid #262c35; flex-shrink: 0; gap: 10px; }
  .header-titles { min-width: 0; }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8b93a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .header-btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; background: #262c35; color: #fff; }
  .header-btn.primary { background: #1971c2; }
  .header-btn:hover { filter: brightness(1.15); }
  .header-btn:disabled { opacity: 0.4; cursor: default; }

  /* STAGE */
  #stage { flex: 1; position: relative; overflow: hidden; background: #0f1216; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #photo-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; touch-action: none; }

  /* EMPTY STATE */
  #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8b93a1; text-align: center; padding: 24px; }
  #empty-state .big { font-size: 44px; }
  .btn-photo { padding: 14px 22px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; background: #1971c2; color: #fff; }
  .btn-photo.ghost { background: #262c35; }

  /* HINT BAR */
  #hint-bar { font-size: 11px; color: #8b93a1; text-align: center; padding: 8px 16px; background: #171b21; border-top: 1px solid #262c35; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app-shell">
  <header>
    <div class="header-titles">
      <div class="header-title">Foto con medidas</div>
      <div class="header-sub" id="header-sub">Alinea el marco con la abertura</div>
    </div>
    <div class="header-btns">
      <button class="header-btn" id="btn-reset" disabled>↩️ Marco</button>
      <button class="header-btn primary" id="btn-done" disabled>✓ Usar esta foto</button>
    </div>
  </header>

  <div id="stage">
    <div id="empty-state">
      <div class="big">📷</div>
      <div>Agrega una foto del hueco para marcar las medidas.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button class="btn-photo" id="btn-camera">Tomar foto</button>
        <button class="btn-photo ghost" id="btn-gallery">Elegir de galería</button>
      </div>
    </div>
    <canvas id="photo-canvas" style="display:none;touch-action:none;"></canvas>
  </div>

  <div id="hint-bar"></div>
</div>

<input type="file" id="file-input" accept="image/*" style="display:none" />

<script type="module">
import { auth } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const canvas = document.getElementById('photo-canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const hintBar = document.getElementById('hint-bar');
const btnDone = document.getElementById('btn-done');
const btnReset = document.getElementById('btn-reset');
const fileInput = document.getElementById('file-input');

let img = null;
let baseW = 0, baseH = 0;
let scale = 1;
let corners = null;              // { TL, TR, BR, BL } in image px (draggable)
let dragging = null;             // 'TL' | 'TR' | 'BR' | 'BL' | null
let activePointer = null;
let measurements = {};           // anchoBot, anchoTop, altoIzq, altoDer, paredIzq, ...

// ── helpers ──
function setHint(t) { hintBar.textContent = t; }

function toImageCoords(e) {
  const rect = canvas.getBoundingClientRect();
  // ratio mapping handles any CSS scaling/centering (fixes offset bug)
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function fmtInches(v) {
  if (!v && v !== 0) return null;
  const whole = Math.floor(v);
  const frac = v - whole;
  let s = '';
  const map = [[0.5,'1/2'],[0.25,'1/4'],[0.75,'3/4'],[0.333,'1/3'],[0.667,'2/3'],[0.125,'1/8'],[0.375,'3/8'],[0.625,'5/8'],[0.875,'7/8'],[0.0625,'1/16'],[0.1875,'3/16'],[0.3125,'5/16'],[0.4375,'7/16'],[0.5625,'9/16'],[0.6875,'11/16'],[0.8125,'13/16'],[0.9375,'15/16']];
  for (const [f, str] of map) {
    if (Math.abs(frac - f) < 0.03) { s = str; break; }
  }
  if (!s && frac > 0.02) s = Math.round(frac * 16) + '/16';
  return (whole > 0 || !s) ? (whole + (s ? ' ' + s : '')) : s;
}

// ── homography: unit square → quad corners ──
function solveHomography(c) {
  const pts = [c.TL, c.TR, c.BR, c.BL];
  const sq = [[0,0],[1,0],[1,1],[0,1]];
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = sq[i];
    const u = pts[i].x, v = pts[i].y;
    A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);
  }
  const n = 8;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < n; col++) {
    let piv = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    [M[col], M[piv]] = [M[piv], M[col]];
    const pv = M[col][col];
    if (Math.abs(pv) < 1e-9) return null;
    for (let c2 = col; c2 <= n; c2++) M[col][c2] /= pv;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = M[r][col];
      for (let c2 = col; c2 <= n; c2++) M[r][c2] -= f * M[col][c2];
    }
  }
  return M.map(row => row[n]); // [h11 h12 h13 h21 h22 h23 h31 h32]
}

function mapPoint(H, x, y) {
  const w = H[6]*x + H[7]*y + 1;
  return { x: (H[0]*x + H[1]*y + H[2]) / w, y: (H[3]*x + H[4]*y + H[5]) / w };
}

function localScale(H, x, y) {
  const p = mapPoint(H, x, y);
  const px = mapPoint(H, x + 0.02, y);
  const py = mapPoint(H, x, y + 0.02);
  return (Math.hypot(px.x - p.x, px.y - p.y) + Math.hypot(py.x - p.y, py.y - p.y)) / 0.04;
}

// ── frame geometry (normalized 0..1, mirrors the main graph) ──
function frameGeometry(m) {
  const pIv = m.paredIzq || 0, pDv = m.paredDer || 0, tcv = m.techo || 0, psv = m.piso || 0;
  const padX = 0.13, padY = 0.15;
  const bx = padX, by = padY, bw = 1 - 2*padX, bh = 1 - 2*padY;
  const EXAG = Math.min(bw, bh) * 0.15;
  const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
  const pIMax = Math.max(pIv, 1), pDMax = Math.max(pDv, 1), tMax = Math.max(tcv, 1), pMax = Math.max(psv, 1);
  const leftOffsetTop   = clamp((pIv / pIMax) * EXAG, EXAG);
  const rightOffsetTop  = -clamp((pDv / pDMax) * EXAG, EXAG);
  const topOffsetRight  = clamp((tcv / tMax) * EXAG * (bh / bw), EXAG);
  const bottomOffsetRight = clamp((psv / pMax) * EXAG * (bh / bw), EXAG);
  const TL = { x: bx + leftOffsetTop, y: by };
  const TR = { x: bx + bw + rightOffsetTop, y: by + topOffsetRight };
  const BR = { x: bx + bw + rightOffsetTop, y: by + bh + bottomOffsetRight };
  const BL = { x: bx + leftOffsetTop, y: by + bh };
  const anchoBot = m.anchoBot || 36;
  const altoIzq  = m.altoIzq  || 84;
  const anchoTop = m.anchoTop || Math.max(0, anchoBot - pIv - pDv);
  const altoDer  = m.altoDer  || Math.max(0, altoIzq - tcv - psv);
  return { TL, TR, BR, BL, anchoBot, anchoTop, altoIzq, altoDer };
}

// ── rendering ──
const LINE_COLOR = '#f59f00';        // amber — high contrast on photos
const LINE_WIDTH = 4;
const TEXT_COLOR = '#ffffff';
const PILL_COLOR = 'rgba(0,0,0,0.72)';
const FILL_COLOR = 'rgba(255,255,255,0.08)';
const DIM_OFFSET = 0.05;             // normalized distance of dim lines from frame

function pillPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawLabel(c, text, x, y, angle, size) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.font = 'bold ' + size + 'px Inter, system-ui, sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const w = c.measureText(text).width;
  pillPath(c, -w/2 - 7, -size/2 - 5, w + 14, size + 10, 6);
  c.fillStyle = PILL_COLOR;
  c.fill();
  c.fillStyle = TEXT_COLOR;
  c.fillText(text, 0, 1);
  c.restore();
}

function drawDimLine(c, H, p1n, p2n, label, labelSize) {
  const a = mapPoint(H, p1n.x, p1n.y);
  const b = mapPoint(H, p2n.x, p2n.y);
  // line
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = LINE_WIDTH;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(a.x, a.y);
  c.lineTo(b.x, b.y);
  c.stroke();
  // end ticks (perpendicular)
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const tlen = Math.max(7, labelSize * 0.55);
  c.lineWidth = 2.5;
  for (const p of [a, b]) {
    c.beginPath();
    c.moveTo(p.x - tlen * Math.cos(ang - Math.PI/2), p.y - tlen * Math.sin(ang - Math.PI/2));
    c.lineTo(p.x + tlen * Math.cos(ang - Math.PI/2), p.y + tlen * Math.sin(ang - Math.PI/2));
    c.stroke();
  }
  // label parallel to the line, centered
  if (label) {
    const mid = { x: (p1n.x + p2n.x) / 2, y: (p1n.y + p2n.y) / 2 };
    const m = mapPoint(H, mid.x, mid.y);
    const s = localScale(H, mid.x, mid.y);
    drawLabel(c, label, m.x, m.y, ang, labelSize * s);
  }
}

function renderFrame(c, H, g, opts) {
  const pts = [g.TL, g.TR, g.BR, g.BL].map(p => mapPoint(H, p.x, p.y));
  // translucent fill over the frame region
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath();
  c.fillStyle = FILL_COLOR;
  c.fill();
  // frame edges
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = LINE_WIDTH;
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath();
  c.stroke();

  const labelSize = 0.034; // normalized font size (scaled by homography)
  const o = DIM_OFFSET;
  // dimension lines: bottom, top, left, right
  drawDimLine(c, H, { x: g.BL.x, y: g.BL.y + o }, { x: g.BR.x, y: g.BR.y + o }, fmtInches(g.anchoBot) + '"', labelSize);
  drawDimLine(c, H, { x: g.TL.x, y: g.TL.y - o }, { x: g.TR.x, y: g.TR.y - o }, fmtInches(g.anchoTop) + '"', labelSize);
  drawDimLine(c, H, { x: g.TL.x - o, y: g.TL.y }, { x: g.BL.x - o, y: g.BL.y }, fmtInches(g.altoIzq) + '"', labelSize);
  drawDimLine(c, H, { x: g.TR.x + o, y: g.TR.y }, { x: g.BR.x + o, y: g.BR.y }, fmtInches(g.altoDer) + '"', labelSize);

  if (opts && opts.handles) drawHandles(c, H);
}

function drawHandles(c, H) {
  const g = frameGeometry(measurements);
  const r = Math.max(9, baseW * 0.015);
  for (const k of ['TL', 'TR', 'BR', 'BL']) {
    const p = mapPoint(H, g[k].x, g[k].y);
    c.beginPath();
    c.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.fill();
    c.beginPath();
    c.arc(p.x, p.y, r, 0, Math.PI * 2);
    c.fillStyle = '#fff';
    c.fill();
    c.lineWidth = 2.5;
    c.strokeStyle = LINE_COLOR;
    c.stroke();
    // crosshair
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(p.x - r * 0.6, p.y); c.lineTo(p.x + r * 0.6, p.y);
    c.moveTo(p.x, p.y - r * 0.6); c.lineTo(p.x, p.y + r * 0.6);
    c.stroke();
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, baseW, baseH);
  if (!corners) return;
  const H = solveHomography(corners);
  if (!H) return;
  const g = frameGeometry(measurements);
  renderFrame(ctx, H, g, { handles: true });
}

// ── corner init / reset ──
function resetCorners() {
  const g = frameGeometry(measurements);
  const ratio = g.altoIzq / g.anchoBot; // height : width
  let w = baseW * 0.72;
  let h = w * ratio;
  if (h > baseH * 0.72) { h = baseH * 0.72; w = h / ratio; }
  const cx = baseW / 2, cy = baseH / 2;
  corners = {
    TL: { x: cx - w/2, y: cy - h/2 },
    TR: { x: cx + w/2, y: cy - h/2 },
    BR: { x: cx + w/2, y: cy + h/2 },
    BL: { x: cx - w/2, y: cy + h/2 }
  };
  redraw();
}

// ── image loading ──
onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
});

document.getElementById('btn-camera').addEventListener('click', () => {
  fileInput.setAttribute('capture', 'environment');
  fileInput.click();
});
document.getElementById('btn-gallery').addEventListener('click', () => {
  fileInput.removeAttribute('capture');
  fileInput.click();
});

fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadImage(ev.target.result);
  reader.readAsDataURL(f);
  fileInput.value = '';
});

function loadImage(dataUrl) {
  const im = new Image();
  im.onload = () => {
    img = im;
    baseW = im.naturalWidth;
    baseH = im.naturalHeight;
    const maxEdge = 1600;
    if (Math.max(baseW, baseH) > maxEdge) {
      const r = maxEdge / Math.max(baseW, baseH);
      baseW = Math.round(baseW * r);
      baseH = Math.round(baseH * r);
    }
    canvas.width = baseW;
    canvas.height = baseH;
    const stageRect = stage.getBoundingClientRect();
    const pad = 8;
    scale = Math.min((stageRect.width - pad) / baseW, (stageRect.height - pad) / baseH);
    canvas.style.width = (baseW * scale) + 'px';
    canvas.style.height = (baseH * scale) + 'px';
    canvas.style.display = 'block';
    document.getElementById('empty-state').style.display = 'none';
    btnDone.disabled = false;
    btnReset.disabled = false;
    resetCorners();
    setHint('Arrastra los puntos de las esquinas para alinear el marco con la abertura');
  };
  im.src = dataUrl;
}

// ── corner dragging ──
function hitHandle(e) {
  if (!corners) return null;
  const H = solveHomography(corners);
  if (!H) return null;
  const g = frameGeometry(measurements);
  const p = toImageCoords(e);
  const tol = 24 / scale;
  let best = null, bestD = tol;
  for (const k of ['TL', 'TR', 'BR', 'BL']) {
    const hp = mapPoint(H, g[k].x, g[k].y);
    const d = Math.hypot(hp.x - p.x, hp.y - p.y);
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
}

canvas.addEventListener('pointerdown', (e) => {
  if (!img || !corners) return;
  e.preventDefault();
  const h = hitHandle(e);
  if (h) {
    dragging = h;
    activePointer = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    setHint('Arrastra para mover la esquina');
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!img || !dragging || e.pointerId !== activePointer) return;
  e.preventDefault();
  const p = toImageCoords(e);
  corners[dragging] = { x: Math.max(0, Math.min(baseW, p.x)), y: Math.max(0, Math.min(baseH, p.y)) };
  redraw();
});

canvas.addEventListener('pointerup', (e) => {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (dragging) {
    dragging = null;
    setHint('Arrastra los puntos de las esquinas para alinear el marco con la abertura');
  }
});

btnReset.addEventListener('click', () => {
  if (!img) return;
  resetCorners();
  setHint('Marco restablecido');
});

// ── done → composite + send back ──
btnDone.addEventListener('click', () => {
  if (!img || !corners) return;
  btnDone.disabled = true;
  btnDone.textContent = 'Generando…';
  const out = document.createElement('canvas');
  out.width = baseW; out.height = baseH;
  const octx = out.getContext('2d');
  octx.drawImage(img, 0, 0, baseW, baseH);
  const H = solveHomography(corners);
  if (H) renderFrame(octx, H, frameGeometry(measurements), { handles: false });
  const dataUrl = out.toDataURL('image/jpeg', 0.9);
  try {
    if (window.opener) {
      window.opener.postMessage({ type: 'NIVELATO_ANNOTATED_PHOTO', dataUrl }, '*');
      window.close();
    } else if (window.parent !== window) {
      window.parent.postMessage({ type: 'NIVELATO_ANNOTATED_PHOTO', dataUrl }, '*');
      window.close();
    } else {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'nivelato-medidas.jpg';
      a.click();
      btnDone.disabled = false;
      btnDone.textContent = '✓ Usar esta foto';
    }
  } catch (e) {
    btnDone.disabled = false;
    btnDone.textContent = '✓ Usar esta foto';
    alert('Error al enviar la foto: ' + e.message);
  }
});

// ── measurements handoff from the flow ──
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'NIVELATO_MEASUREMENTS') {
    measurements = {
      anchoBot: e.data.anchoBot,
      anchoTop: e.data.anchoTop,
      altoIzq: e.data.altoIzq,
      altoDer: e.data.altoDer,
      paredIzq: parseLabel(e.data.paredIzq),
      paredDer: parseLabel(e.data.paredDer),
      techo: parseLabel(e.data.techo),
      piso: parseLabel(e.data.piso)
    };
    document.getElementById('header-sub').textContent = 'Medidas cargadas — alinea el marco';
    if (img) { resetCorners(); setHint('Arrastra los puntos de las esquinas para alinear el marco con la abertura'); }
  }
});

// desnivel labels like "⟩ 1/2" or "↓ 3/4" → numeric inches
function parseLabel(s) {
  if (!s) return 0;
  const m = s.match(/(\d+)(?:\s+(\d+)\/(\d+))?/);
  if (!m) return 0;
  return (parseInt(m[1]) || 0) + ((parseInt(m[2]) || 0) / (parseInt(m[3]) || 1));
}

// ── test hook ──
window.__photoTestState = () => ({
  hasImage: !!img,
  baseW, baseH,
  hasFrame: !!corners,
  measurements: Object.assign({}, measurements),
  corners: corners ? Object.assign({}, corners) : null
});

// debug: expose hitHandle so tests can verify corner detection
window.__hitTest = (clientX, clientY) => {
  const rect = canvas.getBoundingClientRect();
  const e = { clientX, clientY };
  const hit = hitHandle(e);
  return { hit, toImg: toImageCoords(e), scale };
};
</script>
</body>
</html>
