<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="/manifest.json" />
<title>Nivelato - Usuarios de la compañía</title>
<meta name="description" content="Usuarios de la compañía en Nivelato: administra los miembros de tu taller, sus roles y sus permisos de acceso.">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/niv-dark.css" />
<style>
  :root {
    --bg: #0d0d0f;
    --card: #101013;
    --line: #2a2a2e;
    --line-soft: #1f1f23;
    --text: #f1f1f2;
    --muted: #9a9aa0;
    --faint: #6d6d74;
    --red: #e03131;
    --red-dark: #b3271e;
    --green: #51cf66;
    --radius-lg: 14px;
    --radius-md: 6px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Tarjetas flotantes, igual que el dashboard: nada toca los bordes. */
  .shell { display: flex; flex: 1; min-height: 0; padding: 30px; gap: 30px; box-sizing: border-box; }

  /* ---------- sidebar: chrome module host (modules/sidebar.html) ----------
     The sidebar is the shared module mounted through shell-bridge.js into
     #chrome-sidebar; the module document loads /niv-dark.css absolutely
     itself, so the sidebar can never render unstyled because of this
     page's own stylesheet paths. */
  #chrome-sidebar { width: 300px; flex: none; align-self: stretch; min-height: 0; }
  #chrome-sidebar .niv-shell-frame { height: 100%; }

  /* ---------- user list column ---------- */
  .users-col {
    width: 340px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #0b0b0d;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    max-height: none;
  }
  /* items 24/28: this list speaks the main sidebar's design language:
     flat rows (no boxed tiles), the panel section-header treatment,
     row rhythm from padding, hover as a surface lift. The list
     container is a flex column so rows never sit flush-stacked. */
  #user-list { display: flex; flex-direction: column; }
  .users-title { font-size: 13px; font-weight: 500; color: var(--faint); margin-bottom: 8px; padding-left: 4px; }
  .user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 6px;
    border: none;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }
  .user-card:hover { background: #17171a; }
  /* item 26: per-user settings column (the module sidebar owns all
     cross-page navigation; this column is local actions only) */
  .user-settings-col {
    width: 260px; flex: none;
    border: 1px solid var(--line); border-radius: var(--radius-md);
    background: #0b0b0d; padding: 24px 18px; overflow-y: auto;
  }
  .user-settings-name { font-size: 14px; font-weight: 600; margin-bottom: 12px; word-break: break-word; }
  .user-settings-col .btn-danger { width: 100%; }
  @media (max-width: 1180px) {
    .shell { flex-wrap: wrap; }
    .detail { flex-basis: 100%; }
  }
  .user-card.selected {
    background: linear-gradient(135deg, #fafafa, #c9c9ce);
    border-color: transparent;
  }
  .user-card.selected .u-name, .user-card.selected .u-email { color: #050505; }
  .u-avatar {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    position: relative;
  }
  .u-online {
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--bg);
  }
  .user-card.selected .u-online { border-color: transparent; }
  .u-meta { min-width: 0; flex: 1; }
  .u-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .u-email {
    display: block;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  /* ---------- detail panel ---------- */
  .detail {
    flex: 1;
    padding: 40px 36px;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #0b0b0d;
    overflow-y: auto;
  }
  .detail-head { text-align: center; margin-bottom: 28px; }
  .detail-name { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .detail-email { font-size: 14px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 880px;
    margin: 0 auto;
  }
  .panel {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--card);
    padding: 20px 22px;
  }
  .panel h3 { font-size: 15px; font-weight: 700; margin: 0 0 14px; text-align: center; }
  .proj-row {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .proj-thumb {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 10px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--faint);
    font-weight: 600;
  }
  .proj-name { font-size: 14px; font-weight: 600; }
  .proj-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty { text-align: center; color: var(--faint); font-size: 13px; padding: 18px 0; }

  /* toggle switches */
  .perm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
  }
  .perm-row:last-of-type { border-bottom: 0; }
  .toggle {
    position: relative;
    width: 52px;
    height: 30px;
    flex: none;
    border-radius: 9999px;
    border: 0;
    background: #3a3a40;
    cursor: pointer;
    transition: background .15s;
  }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s;
  }
  .toggle.on { background: #fafafa; }
  .toggle.on .knob { background: #050505; }
  .toggle.on .knob { left: 25px; }
  .toggle:disabled { opacity: .55; cursor: default; }

  .btn {
    display: block;
    width: 100%;
    padding: 13px 16px;
    border-radius: 6px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn:hover { border-color: var(--faint); }
  .btn-danger {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    max-width: 880px;
    margin: 24px auto 0;
    padding: 15px 16px;
    font-size: 15px;
  }
  .btn-danger:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .btn-danger:disabled { opacity: .5; cursor: default; }
  .delete-note { text-align: center; color: var(--faint); font-size: 12px; margin-top: 10px; }
  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 60px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
    max-width: 560px;
    margin: 60px auto;
  }
  .perm-note { font-size: 12px; color: var(--faint); text-align: center; margin-top: 10px; }
  .btn-retry { display: inline-block; margin-top: 12px; padding: 9px 22px; border-radius: 6px; border: 1.5px solid var(--line); background: transparent; color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-retry:hover { border-color: var(--faint); }

  /* detail header: name with the email in parens on the same line */
  .detail-name .detail-email-inline {
    font-size: 15px;
    color: var(--muted);
    font-weight: 500;
    word-break: break-all;
  }

  /* ---------- registered devices panel ---------- */
  .devices-panel { max-width: 880px; margin: 20px auto 0; }
  .dev-row {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .dev-row.outdated { border-color: #8a6d1f; }
  .dev-icon {
    width: 26px;
    height: 44px;
    flex: none;
    border: 1.5px solid var(--faint);
    border-radius: 6px;
    position: relative;
  }
  .dev-icon::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 3px;
    transform: translateX(-50%);
    width: 10px;
    height: 2px;
    background: var(--faint);
    border-radius: 2px;
  }
  .dev-meta { min-width: 0; flex: 1; }
  .dev-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dev-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dev-warn {
    font-size: 11px;
    font-weight: 700;
    color: #ffd43b;
    border: 1px solid #8a6d1f;
    border-radius: 9999px;
    padding: 1px 8px;
  }
  .dev-rename {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 9999px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .dev-rename:hover { color: var(--text); border-color: var(--faint); }
  .dev-edit { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .dev-edit input {
    flex: 1;
    min-width: 140px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  .dev-edit button {
    padding: 8px 14px;
    border-radius: 9999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .dev-edit button:disabled { opacity: .55; cursor: default; }

  /* ---------- per-user detail: identity rows, permission chips,
     enrollment card (ported from users.html, local tokens) ---------- */
  .info-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .info-row:last-child { border-bottom: 0; }
  .info-row .k { color: var(--muted); width: 110px; flex: none; }
  .info-row .v { min-width: 0; word-break: break-word; }
  .status-on { color: var(--green); font-weight: 600; }
  .status-pending { color: #fbbf24; font-weight: 600; }
  .perm-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .perm-chip {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 500;
    color: var(--text); padding: 4px 10px; background: #0b0b0d;
    border-radius: 8px; border: 1px solid var(--line);
  }
  .btn-accent { background: #fafafa; border-color: transparent; color: #050505; }
  .btn-accent:hover { border-color: transparent; background: #e4e4e7; }
  .enroll-status { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .enroll-qr { background: #fff; border-radius: 12px; padding: 10px; line-height: 0; width: 52%; max-width: 240px; margin: 4px auto 14px; box-sizing: border-box; }
  .enroll-qr svg { width: 100%; height: auto; display: block; }
  .enroll-otp-label { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .enroll-otp { text-align: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 17px; font-weight: 600; letter-spacing: .08em; margin: 6px 0 4px; word-break: break-all; }
  .enroll-expiry { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .enroll-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .enroll-actions .btn { width: auto; margin-top: 0; }

  @media (max-width: 1100px) {
    .detail-grid { grid-template-columns: 1fr; }
  }
  .niv-mobile-nav-toggle { display: none; }
  @media (max-width: 900px) {
    body { height: auto; overflow: visible; }
    .shell { flex-direction: column; flex: none; padding: 12px; gap: 16px; }
    /* M49/m36: compact mobile nav (hamburger bar, sidebar on tap)
       instead of the 380px stacked sidebar card above the user list. */
    .niv-mobile-nav-toggle {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 48px; padding: 12px 16px;
      background: var(--card); color: var(--text);
      border: 1.5px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      box-sizing: border-box; text-align: left; margin: 12px 12px 0; width: calc(100% - 24px);
    }
    #chrome-sidebar { display: none; width: 100%; height: min(560px, calc(100dvh - 140px)); flex: none; }
    body.niv-nav-open #chrome-sidebar { display: block; }
    .users-col {
      width: 100%;
      max-height: none;
    }
    .detail { padding: 24px 16px; }
  }

  /* modo incrustado (?embed=users): solo el area de gestion de usuarios.
     Desaparecen la barra superior propia y la barra lateral de ajustes;
     la pagina desplaza por dentro de sus columnas, sin barra doble. */
  html.embed-users #chrome-topbar, html.embed-users #chrome-sidebar { display: none !important; }
  html.embed-users body { height: 100vh; overflow: hidden; }
  html.embed-users .shell { padding: 18px; gap: 18px; flex: 1; min-height: 0; }
</style>
<script>
  /* Modo incrustado: la clase va en <html> antes del primer pintado para
     que la pagina nazca ya recortada al area de gestion. */
  try { if (new URLSearchParams(window.location.search).get('embed') === 'users') document.documentElement.classList.add('embed-users'); } catch (e) {}
</script>
</head>

<div class="shell">

  <!-- Item 26: fourth sidebar, the selected user's settings panel.
       Per-user account actions live here (today: the removal zone);
       per-user security controls (2FA and similar) belong here as
       they are built. Per-user DATA lives in the Usuarios tab
       (item 25). -->

    <div class="users-title" id="user-settings-title">Ajustes del usuario</div>
    <div class="user-settings-name" id="user-settings-name"></div>
    <div class="delete-note" id="user-settings-empty" style="text-align:left">Selecciona un usuario.</div>
    <div id="delete-zone"></div>
  </aside>

  <main class="detail" id="detail"><div class="state-loading" id="detail-loading">Select a user to see details.</div></main>
</div>

/* One honest error surface for every load failure: the message plus a
   retry that reloads the page. Used by every gate in the boot path so no
   failure can leave the pane sitting on the loading text forever. */
function showLoadError(msg) {
  window.__nivUsersBooted = true;
  const list = document.getElementById('user-list');
  if (list) {
    list.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'state-error';
    box.textContent = msg;
    const br = document.createElement('br');
    const btn = document.createElement('button');
    btn.className = 'btn-retry';
    btn.textContent = t('retry');
    btn.addEventListener('click', () => window.location.reload());
    box.appendChild(br);
    box.appendChild(btn);
    list.appendChild(box);
  }
  const detail = document.getElementById('detail');
  if (detail) detail.innerHTML = '<div class="state-loading">' + escapeHtml(msg) + '</div>';
}

// Permission labels for the 10 permission keys (PERM_DEFS order), EN + ES.
const PERM_LABELS = { en: {
  viewDashboard: 'View dashboard',
  createMeasurements: 'Create measurements',
  viewOwnMeasurements: 'View own measurements',
  editOwnMeasurements: 'Edit own measurements',
  viewOthersMeasurements: "View others' measurements",
  editOthersMeasurements: "Edit others' measurements",

  createQuotes: 'Create quotes',
  approveQuotes: 'Approve quotes',
  userManagement: 'Manage users'
}, es: Object.fromEntries(PERM_DEFS.map(d => [d.key, d.label])) };
const permLabel = (k) => (PERM_LABELS[LANG] && PERM_LABELS[LANG][k]) || PERM_LABELS.en[k] || k;
const PERM_KEYS = PERM_DEFS.map(d => d.key);
const QUOTE_KEYS = ['managePriceList', 'createQuotes', 'approveQuotes'];

const AVATAR_COLORS = ['#3a3a40', '#2e2e33', '#45454c', '#26262b', '#52525a', '#1f1f23', '#63636c', '#333338'];
function avatarColor(uid) {
  let h = 0;
  for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initialsOf(name, email) {
  const src = String(name || '').trim() || String(email || '').split('@')[0] || '?';
  const words = src.split(/[\s._-]+/).filter(Boolean);
  const first = (words[0] && words[0][0]) || '?';
  const second = words.length > 1 ? (words[1][0] || '') : ((words[0] && words[0][1]) || '');
  return (first + second).toUpperCase();
}
function roleLabel(role) {
  const r = String(role || 'medidor');
  return r.charAt(0).toUpperCase() + r.slice(1);
}
/* In-flight guards for the async action buttons (mash guard): a second
   activation while a write is pending is ignored, and every handler
   re-enables its control when it settles, success or failure. */
const _inFlight = new Set();
function guardEnter(key) { if (_inFlight.has(key)) return false; _inFlight.add(key); return true; }
function guardExit(key) { _inFlight.delete(key); }

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;
let members = [];
let selectedUid = null;
let onlineUids = new Set();
let expandedProjects = false;
let expandedPerms = false;
let expandedDevices = false;

const isOwner = () => currentUserData && currentUserData.role === 'owner';
// Mirrors the server owner rule (org doc ownerId, or the owner role).
const viewerIsOrgOwner = () => isOwner() || !!(orgData && currentUser && orgData.ownerId === currentUser.uid);
const dataVersion = () => (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
const memberById = (uid) => members.find(m => m.uid === uid);

function sortedMembers() {
  return [...members].sort((a, b) => {
    const ao = a.role === 'owner' ? 0 : 1;
    const bo = b.role === 'owner' ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return String(a.name || a.email || '').localeCompare(String(b.name || b.email || ''));
  });
}

function displayName(m) {
  // p29: always the person's actual name (the owner included). The role
  // is shown by the detail panel and role controls, not in place of a name.
  const self = m.uid === (currentUser && currentUser.uid);
  const base = m.name || m.email || t('unknownUser');
  return self ? base + t('you') : base;
}

function renderList() {
  const list = document.getElementById('user-list');

  list.innerHTML = sortedMembers().map((m) => {
    const sel = m.uid === selectedUid ? ' selected' : '';

    return `<button class="user-card${sel}" data-uid="${escapeHtml(m.uid)}">
      <span class="u-avatar" style="background:${avatarColor(m.uid)}">${escapeHtml(initialsOf(m.name, m.email))}${online}</span>

/* ---- per-user detail: the SAME substance as users.html renderDetail
   (identity, permissions with editing, projects, registered devices,
   and the section 2.6 enrollment card), implemented with the same
   data paths and the same component logic, adapted only to this
   page's local classes/tokens. The viewer's checker (_can) is set
   from the signed-in user's doc in the auth handler below. ---- */
let _can = () => false;
let permEdit = null;
const statusOf = (m) => (m.disabled === true ? 'pending' : 'active');
function canSeeProjects(m) {
  if (!m) return false;
  const isSelf = m.uid === (currentUser && currentUser.uid);
  return isSelf ? _can('viewOwnMeasurements') : _can('viewOthersMeasurements');
}
function canSeePerms(m) {
  if (!m) return false;
  return m.uid === (currentUser && currentUser.uid) || _can('userManagement');

function canEditPerms() {

}
function infoRow(label, valueHtml) {
  return `<div class="info-row"><span class="k">${escapeHtml(label)}</span><span class="v">${valueHtml}</span></div>`;
}
function permKeysFor(m) {
  return PERM_DEFS.map((d) => d.key)
    .filter((k) => orgHasQuotes(m) || !QUOTE_KEYS.includes(k));
}
function permsChipsHtml(m) {
  const checker = makePermChecker(m);
  const keys = permKeysFor(m)
    .filter((k) => { try { return !!checker(k); } catch (e) { return false; } });
  if (!keys.length) return '<span class="empty" style="padding:0">' + escapeHtml(t('permsNone')) + '</span>';
  return keys.map((k) => '<span class="perm-chip">' + escapeHtml(permLabel(k)) + '</span>').join('');
}
function permEditorRowsHtml(m) {
  return permKeysFor(m).map((k) => {
    const on = !!(permEdit.values && permEdit.values[k]);
    return `<div class="perm-row"><span>${escapeHtml(permLabel(k))}</span>`
      + `<button type="button" class="toggle${on ? ' on' : ''}" data-key="${escapeHtml(k)}" aria-pressed="${on}" aria-label="${escapeHtml(permLabel(k))}"><span class="knob"></span></button></div>`;
  }).join('');
}
function startPermEdit(m) {
  const checker = makePermChecker(m);
  const values = {};
  permKeysFor(m).forEach((k) => { values[k] = !!checker(k); });
  permEdit = { uid: m.uid, values };
  renderDetail();

function wirePermEditor(m) {
  document.querySelectorAll('#detail .toggle[data-key]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-key');
      permEdit.values[k] = !permEdit.values[k];
      btn.classList.toggle('on', permEdit.values[k]);
      btn.setAttribute('aria-pressed', String(permEdit.values[k]));
    });
  });
  const cancel = document.getElementById('co-perms-cancel');
  if (cancel) cancel.addEventListener('click', () => { permEdit = null; renderDetail(); });
  const save = document.getElementById('co-perms-save');
  if (save) save.addEventListener('click', () => savePermEdit(m, save));
}
async function savePermEdit(m, btn) {
  if (!permEdit || !guardEnter('perm-save:' + m.uid)) return;
  const checker = makePermChecker(m);
  const updates = {};
  const saved = {};
  Object.keys(permEdit.values).forEach((k) => {
    if (!!checker(k) !== !!permEdit.values[k]) {
      updates['permissions.' + k] = !!permEdit.values[k];
      saved[k] = !!permEdit.values[k];
    }
  });
  if (!Object.keys(updates).length) {
    permEdit = null;
    guardExit('perm-save:' + m.uid);
    renderDetail();
    return;
  }
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'users', m.uid), updates);
    m.permissions = { ...(m.permissions || {}), ...saved };
    permEdit = null;
    renderDetail();
  } catch (e) {
    alert(t('permSaveFailed', { msg: e.message || t('unknownError') }));
    btn.disabled = false;
  } finally {
    guardExit('perm-save:' + m.uid);
  }
}
async function loadProjects(uid) {
  try {
    const qs = await getDocs(query(collection(db, 'orgs', orgId, 'jobs'), where('installerUid', '==', uid)));
    const groups = new Map();
    qs.forEach((d) => {
      const j = d.data();
      if (j.status === 'draft') return;
      const key = j.project || j.customer || 'Untitled';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(j);
    });
    return [...groups.entries()].map(([name, jobs]) => ({ name, count: jobs.length }))
      .sort((a, b) => b.count - a.count);
  } catch (e) {
    console.warn('[Nivelato] could not load jobs:', e.message);
    return null;
  }
}
async function renderProjects(m) {
  const body = document.getElementById('co-projects-body');
  if (!body) return;
  if (!guardEnter('projects:' + m.uid)) return;
  const groups = await loadProjects(m.uid);
  guardExit('projects:' + m.uid);
  if (!body.isConnected || selectedUid !== m.uid) return;
  if (groups === null) {
    body.innerHTML = '<div class="empty">' + escapeHtml(t('couldNotProjects')) + '</div>';
    return;
  }
  if (!groups.length) {
    body.innerHTML = '<div class="empty">' + escapeHtml(t('noProjects')) + '</div>';
    return;
  }
  body.innerHTML = groups.map((g) =>
    `<div class="proj-row"><div class="proj-thumb">${escapeHtml(initialsOf(g.name, ''))}</div>`
    + `<div><div class="proj-name">${escapeHtml(g.name)}</div>`
    + `<div class="proj-sub">${g.count} ${escapeHtml(g.count === 1 ? t('measuredSpace') : t('measuredSpaces'))}</div></div></div>`
  ).join('');
}

// Registered devices for the selected user (same implementation as
// users.html): the read goes through the owner-scoped listUserDevices
// callable (devices/{id} is not client-readable by rules). Renaming
// your own devices uses renameDevice (device-owner-only on the
// server); the org owner also gets the Rename action on member
// devices, saved through renameMemberDevice, which applies the same
// org-owner rule server-side.
async function renderDevices(m) {
  const body = document.getElementById('co-devices-body');
  const title = document.getElementById('co-devices-title');
  if (!body) return;
  if (!guardEnter('devices:' + m.uid)) return;
  body.innerHTML = '<div class="empty">' + escapeHtml(t('loadingDevices')) + '</div>';
  try {
    const fn = httpsCallable(getFunctions(auth.app, 'us-central1'), 'listUserDevices');
    const { data } = await fn({ uid: m.uid });
    if (!body.isConnected) { guardExit('devices:' + m.uid); return; }
    const devices = (data && data.devices) || [];
    const limit = (data && data.limit) || 5;
    if (title) title.textContent = t('devices') + ' (' + devices.length + '/' + limit + ')';
    if (!devices.length) {
      body.innerHTML = '<div class="empty">' + escapeHtml(t('noDevices')) + '</div>';
      guardExit('devices:' + m.uid);
      renderEnroll(m, 0);
      return;
    }
    guardExit('devices:' + m.uid);
    const visible = expandedDevices ? devices : devices.slice(0, limit);
    const isSelfView = m.uid === (currentUser && currentUser.uid);
    const canRename = isSelfView || _can('userManagement');
    body.innerHTML = visible.map((d) => {
      const name = d.displayName || t('unnamedDevice');
      const modelBits = [d.brand, d.model].filter(Boolean).join(' ');
      const sub = modelBits || (d.appVersionName ? 'Nivelato v' + d.appVersionName : 'Nivelato');
      const linked = d.linkedAt
        ? new Date(d.linkedAt).toLocaleDateString(LANG === 'es' ? 'es' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '';
      return `<div class="dev-row${d.outdated ? ' outdated' : ''}">
        <div class="dev-icon" aria-hidden="true"></div>
        <div class="dev-meta">
          <div class="dev-name"><span class="dev-name-text">${escapeHtml(name)}</span>
          ${d.outdated ? `<span class="dev-warn">${escapeHtml(t('updateAvailable'))}</span>` : ''}
          ${canRename ? `<button class="dev-rename" data-rename="${escapeHtml(d.uuid)}">${escapeHtml(t('rename'))}</button>` : ''}
          </div>
          <div class="dev-sub">${escapeHtml(sub)}${linked ? ' · ' + escapeHtml(t('linked')) + ' ' + escapeHtml(linked) : ''}</div>
          <div class="dev-edit-slot"></div>
        </div></div>`;
    }).join('') +
    (devices.length > limit ? `<button class="btn" id="co-btn-more-devices">${escapeHtml(expandedDevices ? t('showLess') : t('viewMore'))}</button>` : '');
    const more = document.getElementById('co-btn-more-devices');
    if (more) more.addEventListener('click', () => { expandedDevices = !expandedDevices; renderDevices(m); });
    body.querySelectorAll('[data-rename]').forEach((btn) => {
      btn.addEventListener('click', () => openDeviceRename(btn, m));
    });
    renderEnroll(m, devices.length);
  } catch (e) {
    guardExit('devices:' + m.uid);
    if (body.isConnected) body.innerHTML = '<div class="empty">' + escapeHtml(t('couldNotDevices')) + '</div>';
    renderEnroll(m, null);
  }
}

function openDeviceRename(btn, m) {
  const row = btn.closest('.dev-row');
  const slot = row && row.querySelector('.dev-edit-slot');
  if (!slot || slot.dataset.open === '1') return;
  slot.dataset.open = '1';
  const uuid = btn.getAttribute('data-rename');
  const nameEl = row.querySelector('.dev-name-text');
  const current = nameEl ? nameEl.textContent.trim() : '';
  slot.innerHTML = `<div class="dev-edit">
    <input type="text" maxlength="60" value="${escapeHtml(current === t('unnamedDevice') ? '' : current)}" placeholder="${escapeHtml(t('deviceName'))}" aria-label="${escapeHtml(t('deviceName'))}" />
    <button class="dev-save">${escapeHtml(t('save'))}</button>
    <button class="dev-cancel">${escapeHtml(t('cancel'))}</button>
    </div>`;
  const input = slot.querySelector('input');
  input.focus();
  input.select();
  slot.querySelector('.dev-cancel').addEventListener('click', () => renderDevices(m));
  slot.querySelector('.dev-save').addEventListener('click', async () => {
    const saveBtn = slot.querySelector('.dev-save');
    if (saveBtn.disabled || !guardEnter('rename:' + uuid)) return;
    saveBtn.disabled = true;
    saveBtn.textContent = t('saving');
    try {
      const isSelfView = m.uid === (currentUser && currentUser.uid);
      const fn = httpsCallable(getFunctions(auth.app, 'us-central1'),
        isSelfView ? 'renameDevice' : 'renameMemberDevice');
      const payload = isSelfView
        ? { deviceUuid: uuid, displayName: input.value.trim() }
        : { uid: m.uid, deviceUuid: uuid, displayName: input.value.trim() };
      await fn(payload);
      guardExit('rename:' + uuid);
      renderDevices(m);
    } catch (e) {
      guardExit('rename:' + uuid);
      alert(t('renameFailed', { msg: e.message || t('unknownError') }));
      saveBtn.disabled = false;
      saveBtn.textContent = t('save');
    }
  });
}

// ---- enrollment card (spec section 2.6; same implementation as
// users.html) ---------------------------------------------------------
// QR + typed code, the SAME single-use token in two forms. Prominent
// Generate when the employee has no registered device; a plain
// "Link another device" button once devices exist (the tile appears
// only after it is pressed). The token is server-minted
// (createEnrollmentToken) and never stored or re-read here.
async function renderEnroll(m, deviceCount) {
  const body = document.getElementById('co-enroll-body');
  if (!body || !m.email) return;
  if (!guardEnter('enroll:' + m.uid)) return;
  try {
    const statusFn = httpsCallable(getFunctions(auth.app, 'us-central1'), 'getEnrollmentTokenStatus');
    const { data } = await statusFn({ orgId, email: m.email });
    guardExit('enroll:' + m.uid);
    if (!body.isConnected) return;
    paintEnroll(body, m, (data && data.status) || 'none', data || {}, deviceCount === 0);
  } catch (e) {
    guardExit('enroll:' + m.uid);
    if (body.isConnected) paintEnroll(body, m, 'none', {}, deviceCount === 0);
  }
}

function paintEnroll(body, m, status, info, prominent) {
  let statusText = t('enrollNone');
  if (status === 'pending') {
    statusText = info.expiresAt
      ? t('enrollActive', { date: new Date(info.expiresAt).toLocaleDateString() })
      : t('enrollActive', { date: '' });
  } else if (status === 'used') statusText = t('enrollUsed');
  else if (status === 'revoked') statusText = t('enrollRevoked');
  const genLabel = prominent
    ? (status === 'none' ? t('enrollGenerate') : t('enrollRegenerate'))
    : t('linkAnother');
  body.innerHTML = '<div class="enroll-status">' + escapeHtml(statusText) + '</div>'
    + '<div class="enroll-actions"><button type="button" class="btn' + (prominent ? ' btn-accent' : '') + '" id="co-enroll-gen">'
    + escapeHtml(genLabel) + '</button></div>'
    + '<div id="co-enroll-result"></div>';
  const gen = document.getElementById('co-enroll-gen');
  if (gen) gen.addEventListener('click', function () { generateEnroll(m); });
}

async function generateEnroll(m) {
  const result = document.getElementById('co-enroll-result');
  const gen = document.getElementById('co-enroll-gen');
  if (!result) return;
  if (gen) { gen.disabled = true; gen.textContent = t('enrollWorking'); }
  try {
    const createTok = httpsCallable(getFunctions(auth.app, 'us-central1'), 'createEnrollmentToken');
    const { data } = await createTok({ orgId, email: m.email });
    if (!result.isConnected) return;
    const when = data.expiresAt ? new Date(data.expiresAt).toLocaleDateString() : '';
    result.innerHTML = '<div style="margin-top:14px">'
      + (data.qrSvg ? '<div class="enroll-qr">' + data.qrSvg + '</div>' : '')
      + '<div class="enroll-otp-label">' + escapeHtml(t('enrollOtpLabel')) + '</div>'
      + '<div class="enroll-otp">' + escapeHtml(data.codeDisplay || data.code || '') + '</div>'
      + (when ? '<div class="enroll-expiry">' + escapeHtml(t('enrollExpires', { date: when })) + '</div>' : '')
      + '<div class="enroll-actions">'
      + '<button type="button" class="btn" id="co-enroll-copylink">' + escapeHtml(t('copyLink')) + '</button>'
      + '<button type="button" class="btn" id="co-enroll-copycode">' + escapeHtml(t('copyCode')) + '</button>'
      + '</div></div>';
    const cl = document.getElementById('co-enroll-copylink');
    if (cl) cl.addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(data.url); cl.textContent = t('copiedLink'); } catch (_) {}
    });
    const cc = document.getElementById('co-enroll-copycode');
    if (cc) cc.addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(data.codeDisplay || data.code || ''); cc.textContent = t('copiedCode'); } catch (_) {}
    });
  } catch (e) {
    if (result.isConnected) {
      result.innerHTML = '<div class="enroll-status" style="color:#f0a3a3;margin-top:12px">' + escapeHtml(t('enrollFailed')) + '</div>';
    }
  } finally {
    if (gen && gen.isConnected) { gen.disabled = false; gen.textContent = t('enrollRegenerate'); }
  }
}




function renderDelete(m) {
  const zone = document.getElementById('delete-zone');
  if (!zone || !isOwner()) return;
  const isSelf = m.uid === (currentUser && currentUser.uid);
  const isOrgOwner = orgData && orgData.ownerId === m.uid;
  if (isSelf || isOrgOwner) {
    zone.innerHTML = `<div class="delete-note">${isSelf ? escapeHtml(t('cannotRemoveSelf')) : escapeHtml(t('cannotRemoveOwner'))}</div>`;
    return;
  }
  zone.innerHTML = `
    <button class="btn btn-danger" id="btn-delete-user">${escapeHtml(t('deleteUser'))}</button>
    <div class="delete-note">${escapeHtml(t('deleteNote'))}</div>`;
  document.getElementById('btn-delete-user').addEventListener('click', async () => {
    const btn = document.getElementById('btn-delete-user');
    if (!btn || btn.disabled || !guardEnter('delete:' + m.uid)) return;
    const label = m.name || m.email || t('unknownUser');
    if (!confirm(t('confirmRemove', { label }))) { guardExit('delete:' + m.uid); return; }
    btn.disabled = true;
    btn.textContent = t('removing');
    try {
      await updateDoc(doc(db, 'users', m.uid), { disabled: true });
      members = members.filter((x) => x.uid !== m.uid);
      selectedUid = members.length ? sortedMembers()[0].uid : null;
      expandedProjects = false;
      expandedPerms = false;
      guardExit('delete:' + m.uid);
      renderList();
      renderDetail();
    } catch (e) {
      guardExit('delete:' + m.uid);
      alert(t('removeFailed', { msg: e.message || t('unknownError') }));
      btn.disabled = false;
      btn.textContent = t('deleteUser');
    }
  });
}

async function refreshOnline() {
  try {
    const online = await getOnlineUsers(orgId);
    onlineUids = new Set(online.map((u) => u.uid));
    renderList();
    const pv = document.getElementById('co-presence-value');
    if (pv && selectedUid) pv.textContent = onlineUids.has(selectedUid) ? t('online') : t('offline');
  } catch (_) { /* online dots are a nice-to-have */ }
}

// ---- auth + data ----
/* First render gate, traced: onAuthStateChanged fires, flow claims are
   minted (soft fail), then the viewer's own users/{uid} doc is read.
   That read is the gate for everything below it: the manager check, the
   org read and the members query all need its orgId. In the previous
   version the read sat OUTSIDE any try/catch, so a single rejection
   (permission-denied before claims landed, a dropped connection) became
   an unhandled rejection in this async callback and the pane stayed on
   the static "Loading users..." text forever: the org and members reads
   each had error surfaces, but they were never reached. Every gate now
   routes failures to showLoadError (message plus retry), and the boot
   watchdog in the page covers the module failing to load at all. */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  // Mint flow claims: rules require them for org data reads.
  // Route to geo-blocked on fresh block/review verdicts (same as login.html).
  try {
    const gate = await ensureFlowClaims();
    if (gate && gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
  } catch (_) { /* fails soft */ }
  currentUser = user;

  // Backup theme pass: in case the fast path or doc-based check could not run.
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  let userSnap;
  try {
    userSnap = await getDoc(doc(db, 'users', user.uid));
  } catch (e) {
    showLoadError(t('couldNotProfile', { msg: e.message || t('unknownError') }));
    return;
  }
  if (!userSnap.exists()) {
    alert(t('missingProfile'));
    window.location.href = 'https://login.nivelatolabs.com/?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  // The saved language wins for this page's strings from here on.
  if (currentUserData.language === 'es' || currentUserData.language === 'en') {
    LANG = currentUserData.language;
    try { if (window.NivSettings && window.NivSettings.setLang) window.NivSettings.setLang(LANG); } catch (_) {}
    try { if (window.__nivSidebarHandle && window.__nivSidebarHandle.setLang) window.__nivSidebarHandle.setLang(LANG); } catch (_) {}
  }
  applyStaticLang();
  orgId = currentUserData.orgId;
  if (!orgId) {
    showLoadError(t('noOrg'));
    return;
  }

  _can = makePermChecker(currentUserData);
  if (!_can('userManagement')) {
    if (window.nivSaveSettingsReferrer) window.nivSaveSettingsReferrer();
    window.location.href = '/account/settings';
    return;
  }

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  try {
    const orgSnap = await getDoc(doc(db, 'orgs', orgId));
    orgData = orgSnap.exists() ? orgSnap.data() : {};
  } catch (e) {
    showLoadError(t('couldNotCompany', { msg: e.message || t('unknownError') }));
    return;
  }
  /* The org head that this page used to render into its own sidebar is
     rendered by the sidebar module now; the module reads the same org
     doc itself. */

  try {
    const qs = await getDocs(query(collection(db, 'users'), where('orgId', '==', orgId)));
    members = qs.docs
      .map((d) => ({ uid: d.id, ...d.data() }))
      .filter((m) => m.disabled !== true);
  } catch (e) {
    showLoadError(t('couldNotUsers', { msg: e.message || t('unknownError') }));
    return;
  }

  window.__nivUsersBooted = true;
  if (members.length) selectedUid = sortedMembers()[0].uid;
  renderList();
  renderDetail();
  refreshOnline();
  setInterval(refreshOnline, 60000);
});
</script>
<script src="/niv-settings.js"></script>
<script src="/modules/shell-bridge.js"></script>
<script>
  /* Item 26: this view auto-collapses the main sidebar to its icon
     rail to make room for the extra columns. The stored compact
     preference is the module's own switch: remember the prior value,
     force compact on for this view only, restore it on the way out.
     A leftover session flag (a tab that died mid-visit) preserves the
     ORIGINAL prior value, so the restore stays truthful. */
  (function () {
    try {
      if (!window.NivSettings) return;
      var KEY = 'niv-users-autocompact-prior';
      var prior = window.sessionStorage.getItem(KEY);
      if (prior === null) {
        prior = window.NivSettings.getCompact() ? '1' : '0';
        window.sessionStorage.setItem(KEY, prior);
      }
      window.NivSettings.setCompact(true);
      window.addEventListener('pagehide', function () {
        try { window.NivSettings.setCompact(prior === '1'); } catch (e) {}
      });
    } catch (e) { /* the view also works with the sidebar expanded */ }
  })();
</script>
<script>
  /* Chrome modules: sidebar (target=company, this page is the Users door)
     and, per the shell rule, the top bar ONLY at >=901px (never on mobile)
     and never in embed mode, which is chrome-less from before first paint. */
  (function () {
    var embed = false;
    try { embed = new URLSearchParams(window.location.search).get('embed') === 'users'; } catch (e) {}
    if (embed || !window.NivShell) return;
    var lang = 'es';
    try {
      var ck = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      var ls = window.localStorage.getItem('nivelato-login-lang');
      lang = (ck === 'es' || ck === 'en') ? ck : ((ls === 'es' || ls === 'en') ? ls : 'es');
    } catch (e) {}
    window.__nivSidebarHandle = window.NivShell.mountSidebar('#chrome-sidebar', { target: 'company', active: 'users', lang: lang });
    if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
      /* Default (dashboard-family) context, NOT 'settings': the settings
         context renders nothing by design (modules/README.md), which
         left this page's topbar permanently empty. */
      window.NivShell.mountTopbar('#chrome-topbar', { active: 'users' });
    }
  })();
</script>
<script>
  /* Boot watchdog: if the module script cannot run at all (a failed
     import, a blocked CDN script), the list would otherwise sit on
     "Loading users..." forever with no error surface. After a grace
     period, an unbooted page replaces the loading text with an honest
     error plus a retry. The module sets window.__nivUsersBooted as soon
     as the first render lands (or a handled error state is shown). */
  setTimeout(function () {
    if (window.__nivUsersBooted) return;
    var es = true;
    try {
      var ck2 = (document.cookie.match(/(?:^|; )nivelato-login-lang=(es|en)/) || [])[1];
      var ls2 = window.localStorage.getItem('nivelato-login-lang');
      es = ((ck2 === 'es' || ck2 === 'en') ? ck2 : ((ls2 === 'es' || ls2 === 'en') ? ls2 : 'es')) === 'es';
    } catch (e) {}
    var msg = es ? 'No se pudieron cargar los usuarios. Revisa tu conexión e inténtalo de nuevo.'
                 : 'Could not load users. Check your connection and try again.';
    var retry = es ? 'Reintentar' : 'Retry';
    var list = document.getElementById('user-list');
    if (list) {
      list.innerHTML = '<div class="state-error">' + msg + '<br><button class="btn-retry" onclick="window.location.reload()">' + retry + '</button></div>';
    }
    var detail = document.getElementById('detail');
    if (detail) detail.innerHTML = '<div class="state-loading">' + msg + '</div>';
  }, 15000);
</script>

<script>
  /* M49: compact mobile nav toggle (see the <=900px CSS in this page).
     Desktop never shows the button; on mobile it expands/collapses the
     settings sidebar host. */
  (function () {
    var btn = document.getElementById('niv-mobile-nav-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var open = document.body.classList.toggle('niv-nav-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
