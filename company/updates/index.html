<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--
  Clean URL stub for /company/updates (finding B2).
  The real updates page is updates.html at the repo root. GitHub Pages
  serves this directory index at /company/updates and at
  /company/updates/, and the redirect lands on /updates.html, the URL
  that already works in production today.
  Production note: the app and dashboard Cloudflare Workers live outside
  this repo. If a worker still answers /company/updates itself, it must
  map the path to updates.html (or to this stub) instead of falling
  through to the legacy index.html wizard. See ROUTING_FIX_NOTES.md.
-->
<meta http-equiv="refresh" content="0; url=/updates.html" />
<link rel="canonical" href="/updates.html" />
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Nivelato - Actualizaciones</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: #0e0e10; color: #f5f5f7; margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { background: #17171a; border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 36px 32px; max-width: 440px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 15px; color: #a7a7ad; line-height: 1.6; margin: 0; }
  a { color: #4dabf7; }
</style>
<script>
  // Preserve the query string and hash across the redirect, the same way
  // ayuda.html preserves its anchor: settings pages read view and embed
  // parameters from the query string, and dropping them would change what
  // the destination page renders.
  location.replace('/updates.html' + location.search + location.hash);
</script>
</head>
<body>
  <div class="card">
    <h1>Actualizaciones</h1>
    <p>Te estamos redirigiendo a <a href="/updates.html">la página de actualizaciones</a>…</p>
  </div>
</body>
</html>
