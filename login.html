<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Nivelato - Iniciar sesión</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
    :root{
      --bg:#0b0b0e; --bg2:#121216; --card:#16161c; --line:#232329;
      --ink:#f2f1ec; --muted:#a7a7b3; --dim:#6d6d78;
      --amber:#f5a524; --amber2:#ffcf5c;
      --red:#ff8787; --green:#69db7c; --green-deep:#2b8a3e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    /* amber radial glow, same language as the homepage hero */
    body::before {
      content: "";
      position: fixed;
      top: -140px;
      right: -140px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(245,165,36,.13), transparent 65%);
      pointer-events: none;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .logo .adot { color: var(--amber); }
    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .exclusivity-note {
      font-size: 12px;
      color: var(--green);
      background: rgba(105,219,124,.07);
      border: 1px solid rgba(105,219,124,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .pricing-note {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .geo-note {
      font-size: 12px;
      color: var(--amber2);
      background: rgba(245,165,36,.07);
      border: 1px solid rgba(245,165,36,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .geo-note a { color: var(--amber2); }
    .geo-note button { color: inherit; }
    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      /* button reset — tabs are real <button>s for keyboard access */
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab:hover { color: var(--muted); }
    .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
    .tab.active.qgi-tab { color: var(--green); border-bottom-color: var(--green); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input::placeholder { color: var(--dim); }
    .field input:focus { border-color: var(--amber); }
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--ink);
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--amber);
      color: #141414;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-primary:hover { background: var(--amber2); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { background: #3a3a42; color: var(--dim); cursor: not-allowed; }
    .btn-primary.qgi-btn { background: var(--green-deep); color: #fff; }
    .btn-primary.qgi-btn:hover { background: #237a36; }
    .btn-primary.qgi-btn:disabled { background: #3a3a42; color: var(--dim); }
    .forgot-link { font-size: 13px; color: var(--amber2); text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    .error-msg {
      background: rgba(255,135,135,.08);
      border: 1px solid rgba(255,135,135,.35);
      color: var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      line-height: 1.5;
    }
    .error-msg.visible { display: block; }
    .signup-note {
      font-size: 12px;
      color: var(--dim);
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }
    .travel-body {
      font-size: 14px;
      color: var(--dim);
      line-height: 1.6;
      margin: 0 0 20px;
      text-align: center;
    }
    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
      z-index: 2;
    }
    .lang-toggle:hover { color: var(--ink); border-color: var(--dim); }
    .lang-toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    /* ---- QGC "depressing gray" theme ----
       Applied to <body> whenever QGI mode is active. Everything goes gray:
       page, card, tabs, inputs, buttons. The QGC logo is stretched
       fullscreen behind it all (aspect ratio intentionally distorted). */
    body.qgc-theme { background: #2a2a2e; }
    body.qgc-theme::before {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./qgc-logo.jpg');
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }
    body.qgc-theme .card {
      background: #3a3a3e;
      border-color: #55555c;
      padding: 24px 26px;
      /* never push a page-level scrollbar: scroll inside the card instead */
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
    }
    body.qgc-theme .logo { color: #f2f1ec; }
    body.qgc-theme .logo .adot { color: #8e8e99; }
    body.qgc-theme .tagline { color: #b9b9c2; margin-bottom: 18px; }
    body.qgc-theme .tab-row { border-bottom-color: #55555c; margin-bottom: 18px; }
    body.qgc-theme .tab { color: #8e8e99; }
    body.qgc-theme .tab:hover { color: #b9b9c2; }
    body.qgc-theme .tab.active,
    body.qgc-theme .tab.active.qgi-tab { color: #e8e8ec; border-bottom-color: #8e8e99; }
    body.qgc-theme .field label { color: #b9b9c2; }
    body.qgc-theme .field input {
      background: #2a2a2e;
      border-color: #55555c;
      color: #f2f1ec;
    }
    body.qgc-theme .field input::placeholder { color: #6d6d78; }
    body.qgc-theme .field input:focus { border-color: #8e8e99; }
    body.qgc-theme .field input:-webkit-autofill {
      -webkit-text-fill-color: #f2f1ec;
      -webkit-box-shadow: 0 0 0 1000px #2a2a2e inset;
    }
    body.qgc-theme .btn-primary,
    body.qgc-theme .btn-primary.qgi-btn { background: #63636b; color: #f2f1ec; }
    body.qgc-theme .btn-primary:hover,
    body.qgc-theme .btn-primary.qgi-btn:hover { background: #75757e; }
    body.qgc-theme .btn-primary:disabled,
    body.qgc-theme .btn-primary.qgi-btn:disabled { background: #2a2a2e; color: #6d6d78; }
    body.qgc-theme .forgot-link { color: #b9b9c2; }
    body.qgc-theme .exclusivity-note {
      color: #d8d8de;
      background: rgba(255,255,255,.05);
      border-color: #55555c;
    }
    body.qgc-theme .geo-note {
      color: #d8d8de;
      background: rgba(255,255,255,.05);
      border-color: #55555c;
    }
    body.qgc-theme .geo-note a,
    body.qgc-theme .geo-note button { color: #e8e8ec; }
    body.qgc-theme .signup-note { color: #8e8e99; }
    body.qgc-theme .travel-body { color: #a7a7b3; }
    body.qgc-theme .lang-toggle { border-color: #55555c; color: #b9b9c2; }
    body.qgc-theme .lang-toggle:hover { color: #f2f1ec; border-color: #8e8e99; }
    body.qgc-theme .lang-toggle:focus-visible { outline-color: #8e8e99; }
    body.qgc-theme .error-msg {
      background: rgba(255,255,255,.05);
      border-color: #77777f;
      color: #f2f1ec;
    }
    /* ---- Split layout: brand panel + accounts/form panel (mockup) ---- */
    .card.split-card { max-width: 780px; }
    .split { display: flex; gap: 24px; align-items: stretch; }
    .brand-panel {
      flex: 0 0 280px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 24px;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
    }
    .brand-panel .logo { font-size: 32px; }
    .brand-panel .tagline { margin-bottom: 0; }
    .brand-logo-box {
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .main-panel { flex: 1; min-width: 0; }
    .accounts-section { margin-bottom: 20px; }
    .accounts-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 12px;
    }
    .account-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 16px 10px 10px;
      margin-bottom: 10px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: border-color 0.15s;
    }
    .account-pill:last-child { margin-bottom: 0; }
    .account-pill:hover { border-color: var(--dim); }
    .account-pill:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .account-avatar {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--line);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }
    .account-meta { min-width: 0; display: flex; flex-direction: column; }
    .account-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-kind {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 680px) {
      .split { flex-direction: column; }
      .brand-panel { flex: none; }
      .brand-logo-box { aspect-ratio: 16 / 8; }
    }
    /* QGC gray theme for the split layout */
    body.qgc-theme .brand-panel { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .brand-logo-box { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .accounts-title { color: #b9b9c2; }
    body.qgc-theme .account-pill { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .account-pill:hover { border-color: #8e8e99; }
    body.qgc-theme .account-pill:focus-visible { outline-color: #8e8e99; }
    body.qgc-theme .account-avatar { background: #55555c; color: #f2f1ec; }
    body.qgc-theme .account-name { color: #f2f1ec; }
    body.qgc-theme .account-kind { color: #b9b9c2; }
    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 32px 22px; }
    }
  </style>

</head>
<body>
<!-- M17: the default (external) form is STATIC HTML — first paint never waits
     on any network (module imports or the ipapi.co geo lookup). The module
     below hydrates it, then swaps the flow UI in the background if geo says
     otherwise. -->
<div class="card split-card" id="app-card">
  <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Switch to English">🌐 EN</button>
  <div class="split">
    <div class="brand-panel">
      <h1 class="logo">Nivelato<span class="adot">.</span></h1>
      <div class="tagline" data-i18n="tagline">Mediciones de campo, niveladas.</div>
      <div class="brand-logo-box"><img src="./icon-192.png" alt="Nivelato" /></div>
    </div>
    <div class="main-panel">
      <div class="accounts-section" id="accounts-section" style="display:none">
        <div class="accounts-title" data-i18n="used_accounts">Cuentas usadas</div>
        <div id="accounts-list"></div>
      </div>
      <div class="pricing-note" data-i18n="pricing_note">Para Ultra, paga desde la app en tu teléfono (Google Play).</div>

      <div class="tab-row" role="tablist" data-i18n-aria="tablist_label" aria-label="Iniciar sesión o solicitar acceso">
    <button type="button" role="tab" aria-selected="true" class="tab active" id="tab-login" data-i18n="tab_login">Iniciar sesión</button>
    <button type="button" role="tab" aria-selected="false" class="tab" id="tab-signup" data-i18n="tab_signup">Solicitar acceso</button>
  </div>

  <div id="form-login">
    <form id="login-form" autocomplete="on" onsubmit="return false">
      <div class="field">
        <label for="login-email" data-i18n="label_email">Correo electrónico</label>
        <input type="email" id="login-email" name="email" data-i18n-ph="ph_email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-pass" data-i18n="label_password">Contraseña</label>
        <input type="password" id="login-pass" name="password" data-i18n-ph="ph_password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" id="btn-login" type="submit" data-i18n="btn_login">Entrar</button>
    </form>
    <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" class="forgot-link" data-i18n="forgot">¿Olvidaste tu contraseña?</a></div>
    <div class="error-msg" id="login-error" role="alert"></div>
  </div>

  <div id="form-signup" style="display:none">
    <form id="signup-form" autocomplete="on" onsubmit="return false">
      <div class="field">
        <label for="signup-name" data-i18n="label_name">Nombre completo</label>
        <input type="text" id="signup-name" name="name" data-i18n-ph="ph_name" placeholder="Juan Pérez" autocomplete="name" />
      </div>
      <div class="field">
        <label for="signup-email" data-i18n="label_email">Correo electrónico</label>
        <input type="email" id="signup-email" name="email" data-i18n-ph="ph_email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="signup-pass" data-i18n="label_password">Contraseña</label>
        <input type="password" id="signup-pass" name="password" data-i18n-ph="ph_pass_min" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="signup-orgname" data-i18n="label_shop">Nombre del taller</label>
        <input type="text" id="signup-orgname" name="organization" data-i18n-ph="ph_shop" placeholder="Vidriería Ejemplo" autocomplete="organization" />
      </div>
      <button class="btn-primary" id="btn-signup" type="submit" data-i18n="btn_signup">Solicitar acceso</button>
    </form>
    <div class="error-msg" id="signup-error" role="alert"></div>
      <div class="signup-note" data-i18n="signup_note">Tu solicitud será revisada. Te avisaremos cuando tengas acceso.</div>
      </div>
    </div>
  </div>
</div>

    var STORE_KEY = 'nivelato-login-lang';
    function detectLang() {
      try {
        var s = localStorage.getItem(STORE_KEY);
        if (s === 'es' || s === 'en') return s;
      } catch (_) { /* storage unavailable */ }
      try {
        var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
        if (nav === 'en' || nav.indexOf('en-') === 0) return 'en';
      } catch (_) { /* ignore */ }
      return 'es';
    }
    var lang = detectLang();
    function t(key) {
      var d = DICT[lang] || DICT.es;
      if (d && d[key] !== undefined) return d[key];
      return DICT.es[key] !== undefined ? DICT.es[key] : key;
    }
    function applyLang() {
      try { document.documentElement.setAttribute('lang', lang); } catch (_) {}
      try { document.title = t('page_title'); } catch (_) {}
      var btn = document.getElementById('lang-toggle');
      if (btn) {
        btn.innerHTML = '🌐 ' + (lang === 'es' ? 'EN' : 'ES');
        var al = t(lang === 'es' ? 'lang_toggle_to_en' : 'lang_toggle_to_es');
        btn.setAttribute('aria-label', al);
        btn.setAttribute('title', al);
      }
      var els = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < els.length; i++) {
        var k = els[i].getAttribute('data-i18n');
        if (els[i].hasAttribute('data-i18n-html')) els[i].innerHTML = t(k);
        else els[i].textContent = t(k);
      }
      var phs = document.querySelectorAll('[data-i18n-ph]');
      for (var j = 0; j < phs.length; j++) {
        phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
      }
      var aras = document.querySelectorAll('[data-i18n-aria]');
      for (var m = 0; m < aras.length; m++) {
        aras[m].setAttribute('aria-label', t(aras[m].getAttribute('data-i18n-aria')));
      }
      // watchdog banner, if visible: rebuild it in the current language
      var bw = document.getElementById('boot-warn');
      if (bw) {
        bw.innerHTML = '';
        bw.appendChild(document.createTextNode(t('boot_a')));
        var rb = document.createElement('button');
        rb.type = 'button';
        rb.id = 'boot-retry';
        rb.setAttribute('style', 'text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0');
        rb.textContent = t('boot_reload');
        rb.addEventListener('click', function () { window.location.reload(); });
        bw.appendChild(rb);
        bw.appendChild(document.createTextNode(t('boot_b')));
      }
    }
    function setLang(l) {
      if (l !== 'es' && l !== 'en') return;
      if (l === lang) return;
      lang = l;
      try { localStorage.setItem(STORE_KEY, l); } catch (_) { /* ignore */ }
      applyLang();
      // let the ES module re-render its dynamic strings (form, notices,
      // save-login prompt, pending screen) in the new language
      if (window.__nivelatoOnLangChange) {
        try { window.__nivelatoOnLangChange(l); } catch (_) { /* ignore */ }
      }
    }
    window.nivT = t;
    window.nivApplyLang = applyLang;
    window.nivGetLang = function () { return lang; };
    window.setLang = setLang;

    // ---- Pre-boot tab fallback ----
    // The module rebinds the tabs to its own switchTab once loaded; until
    // then this global keeps them working on first paint. The chosen tab is
    // stashed so the module can honor it on boot.
    window.switchTab = function (tab) {
      window.__nivelatoTab = tab;
      var fl = document.getElementById('form-login');
      var fs = document.getElementById('form-signup');
      var tl = document.getElementById('tab-login');
      var ts = document.getElementById('tab-signup');
      if (fl) fl.style.display = tab === 'login' ? '' : 'none';
      if (fs) fs.style.display = tab === 'signup' ? '' : 'none';
      if (tl) {
        tl.classList.toggle('active', tab === 'login');
        tl.setAttribute('aria-selected', tab === 'login' ? 'true' : 'false');
      }
      if (ts) {
        ts.classList.toggle('active', tab === 'signup');
        ts.setAttribute('aria-selected', tab === 'signup' ? 'true' : 'false');
      }
    };

    // Delegated: survives the module's innerHTML re-renders.
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('#lang-toggle') : null;
      if (el) {
        e.preventDefault();
        setLang(lang === 'es' ? 'en' : 'es');
        return;
      }
      var tl = e.target && e.target.closest ? e.target.closest('#tab-login') : null;
      var ts = e.target && e.target.closest ? e.target.closest('#tab-signup') : null;
      if (tl) window.switchTab('login');
      else if (ts) window.switchTab('signup');
    });

    // Apply the stored/device language to the static HTML immediately.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyLang);
    } else {
      applyLang();
    }
  })();
</script>

<script>
  console.log('[Nivelato] Cargando backend... (módulo JS)');
  // M17 watchdog (classic script — arms at parse time, needs no imports):
  // if the module below hasn't booted within 9s (stalled CDN / blocked
  // network), show a non-blocking warning instead of hanging silently.
  // The static form above stays visible and usable the whole time.
  setTimeout(function () {
    if (window.__nivelatoBooted) return;
    var card = document.getElementById('app-card');
    if (card && !document.getElementById('boot-warn')) {
      var t = window.nivT || function (k) { return k; };
      var w = document.createElement('div');
      w.id = 'boot-warn';
      w.className = 'geo-note';
      w.setAttribute('role', 'alert');
      w.appendChild(document.createTextNode(t('boot_a')));
      var rb = document.createElement('button');
      rb.type = 'button';
      rb.id = 'boot-retry';
      rb.setAttribute('style', 'text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0');
      rb.textContent = t('boot_reload');
      rb.addEventListener('click', function () { window.location.reload(); });
      w.appendChild(rb);
      w.appendChild(document.createTextNode(t('boot_b')));
      card.prepend(w);
    }
  }, 60000);
</script>

<script type="module">
  import { auth, db, centralFunctions } from './firebase-config.js';
  import {
    signInWithEmailAndPassword,

    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import {
    doc, setDoc, getDoc, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
  import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
  import { detectCountry, flowModeForCountry, ensureFlowClaims, routeAfterGate } from './geo.js';

  console.log('[Nivelato] Cargando backend... imports listos, inicializando');

  // Correo de bienvenida: la app lo pide explícito tras el signup para que
  // funcione igual en el backend default y en backends propios (BYOB).
  // Best effort, nunca bloquea el registro.
  async function maybeSendWelcome(email, name, uid) {
    try {
      await setDoc(doc(db, 'notification_prefs', uid), {
        welcomeEmail: true, newProject: true, projectEdit: true, quoteReady: true,
        updatedAt: serverTimestamp()
      }, { merge: true });
      const prefs = (await getDoc(doc(db, 'notification_prefs', uid))).data() || {};
      if (prefs.welcomeEmail === false) return;
      await httpsCallable(centralFunctions, 'requestWelcomeEmail')({ email, name });
    } catch (e) {
      console.warn('[Nivelato] welcome email skipped:', e.message);
    }
  }

  // Restablecer contraseña: primero el flujo propio (remitente
  // noreply@nivelatolabs.com); si la cuenta vive en un backend propio,
  // el servidor central no la conoce y caemos al correo default de Firebase.
  async function doForgotPassword() {
    const t = window.nivT;
    const email = prompt(t('forgot_prompt'));
    if (!email || !email.trim()) return;
    try {
      await httpsCallable(centralFunctions, 'requestPasswordReset')({ email: email.trim() });
      alert(t('forgot_sent'));
    } catch (err) {
      if (err.code === 'functions/not-found') {
        try {
          await sendPasswordResetEmail(auth, email.trim());
          alert(t('forgot_sent'));
        } catch (e2) {
          alert(t('forgot_failed') + friendlyError(e2.code));
        }
      } else {
        alert(t('forgot_failed') + (err.message || t('forgot_unknown')));
      }
    }
  }

  window.__nivelatoBooted = true;
  console.log('[Nivelato] Cargando backend... Firebase listo');
  console.log('[Nivelato] Backend listo');

  // remove it — the page is fully functional now.
  var bw = document.getElementById('boot-warn');
  if (bw) bw.remove();

  // ---- Geo-gated UI (spec §6) ----
  // The default form is static HTML above, so geo NEVER gates first paint.
  // Geo resolves in the background after paint; if the real flow differs from
  // what's rendered, the UI is swapped then. Enforcement stays server-side
  // in the flowGate callable — the client lookup is routing-only, so
  // render-first is safe. Unknown geo → external (§6.3).
  // Web login (login.nivelatolabs.com) is always generic Nivelato branding:
  // no QGC-specific options, flows, or mentions. The QGI employee flow
  // stays in the codebase, but this page never renders it.
  const WEB_LOGIN_GENERIC = true;
  function flowFromCookie() {
    if (WEB_LOGIN_GENERIC) return 'external';
    const m = document.cookie.match(/(?:^|;\s*)nl_flow=(qgi|external)/);
    return m ? m[1] : null;
  }

  // QGC device trust: once a device signs in successfully in QGC mode, it is
  // remembered in localStorage. On later visits the flag forces QGC mode
  // directly, skipping geo-detection entirely (covers iCloud Private Relay
  // and VPN cases where geo fails but the device already proved it is QGC).
  // Device-level trust: never cleared on sign-out, only on storage clear.
  const QGC_AUTHED_KEY = 'nivelato_qgc_authed';

    try { return localStorage.getItem(QGC_AUTHED_KEY) === '1'; } catch (_) { return false; }

  // makes the grant redundant, so it never needs explicit clearing.
  const QGC_TRAVEL_KEY = 'nivelato_qgc_travel_until';

    try { return parseInt(localStorage.getItem(QGC_TRAVEL_KEY) || '0', 10) > Date.now(); }

  const USED_ACCOUNTS_KEY = 'nivelato_used_accounts';

      const raw = localStorage.getItem(USED_ACCOUNTS_KEY);
      const arr = raw ? JSON.parse(raw) : [];

    } catch (_) { return []; }

      const norm = String(email || '').trim().toLowerCase();

        return String(a.email || '').toLowerCase() !== norm;

      rest.unshift({ email: norm, displayName: String(displayName || '').trim(), kind: kind || 'personal', ts: Date.now() });
      localStorage.setItem(USED_ACCOUNTS_KEY, JSON.stringify(rest.slice(0, MAX_USED_ACCOUNTS)));
    } catch (_) { /* ignore */ }
  }

  // ---- Cross-origin SSO handoff ----
  // This page lives on login.nivelatolabs.com; the app lives on
  // app.nivelatolabs.com (and dashboard.nivelatolabs.com). Firebase Auth
  // sessions are origin-scoped, so after a successful sign-in here we mint
  // a short-lived custom token for the same uid and hand it to the app's
  // sso.html, which signs in there and lands on `next`.
  const APP_ORIGIN = 'https://app.nivelatolabs.com';
  const SSO_ORIGINS = [APP_ORIGIN, 'https://dashboard.nivelatolabs.com'];
  function sanitizeNext(n) {
    if (typeof n !== 'string' || !(n = n.trim())) return null;
    if (n.charAt(0) === '/') {
      if (n.charAt(1) === '/' || /[\s\\]/.test(n)) return null;
      return n;
    }
    try {
      const u = new URL(n);
      if (u.protocol !== 'https:') return null;
      if (SSO_ORIGINS.indexOf(u.origin) === -1) return null;
      return u.toString();
    } catch (_) { return null; }
  }
  // Returns true when the handoff navigation started, false when minting
  // the token failed (caller shows the form error; the user stays put).
  async function ssoHandoff(defaultNext) {
    const next = sanitizeNext(new URLSearchParams(window.location.search).get('next')) || defaultNext;
    if (window.location.origin === APP_ORIGIN) {
      window.location.href = next;
      return true;
    }
    try {
      const { data } = await httpsCallable(centralFunctions, 'mintSsoToken')({});
      const token = data && data.customToken;
      if (!token) throw new Error('empty-token');
      window.location.href = APP_ORIGIN + '/sso.html?ctoken=' + encodeURIComponent(token)
        + '&next=' + encodeURIComponent(next);
      return true;
    } catch (e) {
      console.error('[Nivelato] SSO handoff failed:', (e && e.code) || e);
      return false;
    }
  }
  function ssoFailed(errEl) {
    errEl.textContent = window.nivT('sso_failed');
    errEl.classList.add('visible');
  }

    const userDoc = await getDoc(doc(db, 'users', auth.currentUser.uid));
    const role = userDoc.data()?.role;

    if (btn) { btn.disabled = false; btn.textContent = window.nivT('btn_login'); }

    : Promise.race([
        detectCountry(),
        new Promise((resolve) => setTimeout(() => resolve(null), 7000)),
      ]);
  countryPromise.then((cc) => {
    country = cc;
    var effectivePR = (cc === 'PR') || tzIsPR;
    if (trustedDev) {
      // A travel grant acquired after boot (e.g. via link redeem) supersedes geo.
      if (qgcTravelValid()) return;
      if (effectivePR) {
        travelShown = false;
        travelSent = false;
        if (!QGI) renderForm('qgi', true);
        showPrNotice();
      } else if (cc && cc !== 'PR') {
        if (!travelShown && !pendingShown && !savePromptShown && !authBusy) showTravelUI();
      }
      // cc null: geo inconclusive, device trust stands as rendered.
      return;
    }
    var effectiveCountry = effectivePR ? 'PR' : cc;
    const mode = flowFromCookie() || flowModeForCountry(effectiveCountry);
    if (mode !== (QGI ? 'qgi' : 'external')) renderForm(mode, true);
    if (cc === null && !flowFromCookie() && !tzIsPR) showGeoNotice();
    if (effectivePR) showPrNotice();
  });
  }
</script>
</body>
</html>
