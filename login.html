<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Nivelato — Iniciar sesión</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1971c2;
      letter-spacing: -0.5px;
      margin: 0 0 6px;
    }
    .logo.qgi { color: #0c6b3c; }
    .tagline {
      font-size: 13px;
      color: #868e96;
      margin-bottom: 32px;
    }
    .exclusivity-note {
      font-size: 12px;
      color: #0c6b3c;
      background: #ebfbee;
      border: 1px solid #b2d8b2;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .pricing-note {
      font-size: 12px;
      color: #495057;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .pricing-note b { color: #1971c2; }
    .geo-note {
      font-size: 12px;
      color: #856404;
      background: #fff9db;
      border: 1px solid #ffec99;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .tab-row {
      display: flex;
      border-bottom: 2px solid #e9ecef;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #868e96;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
      /* button reset — tabs are real <button>s for keyboard access */
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab.active { color: #1971c2; border-bottom-color: #1971c2; }
    .tab.active.qgi-tab { color: #0c6b3c; border-bottom-color: #0c6b3c; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #495057; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dee2e6;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #1971c2; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #1971c2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1864ab; }
    .btn-primary:disabled { background: #a5d8ff; cursor: not-allowed; }
    .btn-primary.qgi-btn { background: #0c6b3c; }
    .btn-primary.qgi-btn:hover { background: #095c33; }
    .btn-primary.qgi-btn:disabled { background: #a9d3b8; }
    .error-msg {
      background: #fff5f5;
      border: 1px solid #ffc9c9;
      color: #c92a2a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }
    .signup-note {
      font-size: 12px;
      color: #868e96;
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<!-- M17: the default (external) form is STATIC HTML — first paint never waits
     on any network (module imports or the ipapi.co geo lookup). The module
     below hydrates it, then swaps the flow UI in the background if geo says
     otherwise. -->
<div class="card" id="app-card">
  <h1 class="logo">Nivelato</h1>
  <div class="tagline">Mediciones de campo, niveladas.</div>
  <div class="pricing-note">Para Ultra, paga desde la app en tu teléfono (Google Play).</div>

  <div class="tab-row" role="tablist" aria-label="Iniciar sesión o crear cuenta">
    <button type="button" role="tab" aria-selected="true" class="tab active" id="tab-login">Iniciar sesión</button>
    <button type="button" role="tab" aria-selected="false" class="tab" id="tab-signup">Crear cuenta</button>
  </div>

  <div id="form-login">
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" name="email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" name="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" id="btn-login" type="submit">Entrar</button>
    </form>
    <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" style="font-size:13px;color:#1971c2;">¿Olvidaste tu contraseña?</a></div>
    <div class="error-msg" id="login-error" role="alert"></div>
  </div>

  <div id="form-signup" style="display:none">
    <form id="signup-form" autocomplete="on">
      <div class="field">
        <label for="signup-name">Nombre completo</label>
        <input type="text" id="signup-name" name="name" placeholder="Juan Pérez" autocomplete="name" />
      </div>
      <div class="field">
        <label for="signup-email">Correo electrónico</label>
        <input type="email" id="signup-email" name="email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="signup-pass">Contraseña</label>
        <input type="password" id="signup-pass" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="signup-orgname">Nombre del taller</label>
        <input type="text" id="signup-orgname" name="organization" placeholder="Vidriería Ejemplo" autocomplete="organization" />
      </div>
      <button class="btn-primary" id="btn-signup" type="submit">Empezar prueba gratis</button>
    </form>
    <div class="error-msg" id="signup-error" role="alert"></div>
    <div class="signup-note">Al registrarte se crea tu taller con 30 días / 200 guardados de prueba.</div>
  </div>
</div>

<script>
  // M17 watchdog (classic script — arms at parse time, needs no imports):
  // if the module below hasn't booted within 9s (stalled CDN / blocked
  // network), show a non-blocking warning instead of hanging silently.
  // The static form above stays visible and usable the whole time.
  setTimeout(function () {
    if (window.__nivelatoBooted) return;
    var card = document.getElementById('app-card');
    if (card && !document.getElementById('boot-warn')) {
      var w = document.createElement('div');
      w.id = 'boot-warn';
      w.className = 'geo-note';
      w.setAttribute('role', 'alert');
      w.innerHTML = 'El inicio de sesión está tardando más de lo normal (¿conexión lenta?). Puedes esperar o <button type="button" id="boot-retry" style="text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0">recargar la página</button>.';
      card.prepend(w);
      document.getElementById('boot-retry').addEventListener('click', function () {
        window.location.reload();
      });
    }
  }, 60000);
</script>

<script type="module">
  import { auth, db, centralFunctions } from './firebase-config.js';
  import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
    signOut,
    onAuthStateChanged,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import {
    doc, setDoc, getDoc, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
  import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
  import { detectCountry, flowModeForCountry, ensureFlowClaims, routeAfterGate } from './geo.js';

  // Correo de bienvenida: la app lo pide explícito tras el signup para que
  // funcione igual en el backend default y en backends propios (BYOB).
  // Best effort, nunca bloquea el registro.
  async function maybeSendWelcome(email, name, uid) {
    try {
      await setDoc(doc(db, 'notification_prefs', uid), {
        welcomeEmail: true, newProject: true, projectEdit: true, quoteReady: true,
        updatedAt: serverTimestamp()
      }, { merge: true });
      const prefs = (await getDoc(doc(db, 'notification_prefs', uid))).data() || {};
      if (prefs.welcomeEmail === false) return;
      await httpsCallable(centralFunctions, 'requestWelcomeEmail')({ email, name });
    } catch (e) {
      console.warn('[Nivelato] welcome email skipped:', e.message);
    }
  }

  // Restablecer contraseña: primero el flujo propio (remitente
  // noreply@nivelatolabs.com); si la cuenta vive en un backend propio,
  // el servidor central no la conoce y caemos al correo default de Firebase.
  async function doForgotPassword() {
    const email = prompt('Escribe tu correo para enviarte el enlace:');
    if (!email || !email.trim()) return;
    try {
      await httpsCallable(centralFunctions, 'requestPasswordReset')({ email: email.trim() });
      alert('Revisa tu correo, te enviamos el enlace para restablecer tu contraseña.');
    } catch (err) {
      if (err.code === 'functions/not-found') {
        try {
          await sendPasswordResetEmail(auth, email.trim());
          alert('Revisa tu correo, te enviamos el enlace para restablecer tu contraseña.');
        } catch (e2) {
          alert('No se pudo enviar el correo: ' + friendlyError(e2.code));
        }
      } else {
        alert('No se pudo enviar el correo: ' + (err.message || 'error desconocido'));
      }
    }
  }

  window.__nivelatoBooted = true;
  // If the watchdog banner fired on a slow connection but we booted anyway,
  // remove it — the page is fully functional now.
  var bw = document.getElementById('boot-warn');
  if (bw) bw.remove();

  // ---- Geo-gated UI (spec §6) ----
  // The default form is static HTML above, so geo NEVER gates first paint.
  // Geo resolves in the background after paint; if the real flow differs from
  // what's rendered, the UI is swapped then. Enforcement stays server-side
  // in the flowGate callable — the client lookup is routing-only, so
  // render-first is safe. Unknown geo → external (§6.3).
  // Web login (login.nivelatolabs.com) is always generic Nivelato branding:
  // no QGC-specific options, flows, or mentions. The QGI employee flow
  // stays in the codebase, but this page never renders it.
  const WEB_LOGIN_GENERIC = true;
  function flowFromCookie() {
    if (WEB_LOGIN_GENERIC) return 'external';
    const m = document.cookie.match(/(?:^|;\s*)nl_flow=(qgi|external)/);
    return m ? m[1] : null;
  }

  let QGI = false;        // currently rendered flow
  let country = null;     // resolved async; null until geo settles
  let currentTab = 'login';
  let pendingShown = false;
  let authInitDone = false;
  let authBusy = false;   // a login/signup submit is in flight

  const VALUE_IDS = ['login-email', 'login-pass', 'signup-name', 'signup-email',
                     'signup-pass', 'signup-orgcode', 'signup-orgname'];
  function collectValues() {
    const v = {};
    for (const id of VALUE_IDS) {
      const el = document.getElementById(id);
      if (el) v[id] = el.value;
    }
    return v;
  }

  function formHTML(qgi) {
    return `
    <h1 class="logo${qgi ? ' qgi' : ''}">${qgi ? 'Quality Glass' : 'Nivelato'}</h1>
    <div class="tagline">${qgi
      ? 'Nivelato — exclusivo de Quality Glass en Puerto Rico'
      : 'Mediciones de campo, niveladas.'}</div>
    ${qgi ? `<div class="exclusivity-note">En Puerto Rico, Nivelato es de uso <b>exclusivo de Quality Glass</b>. El registro es solo para empleados.</div>` : ''}
    ${!qgi ? `<div class="pricing-note">Para Ultra, paga desde la app en tu teléfono (Google Play).</div>` : ''}

    <div class="tab-row" role="tablist" aria-label="Iniciar sesión o crear cuenta">
      <button type="button" role="tab" aria-selected="true" class="tab active${qgi ? ' qgi-tab' : ''}" id="tab-login">Iniciar sesión</button>
      <button type="button" role="tab" aria-selected="false" class="tab${qgi ? ' qgi-tab' : ''}" id="tab-signup">${qgi ? 'Soy empleado' : 'Crear cuenta'}</button>
    </div>

    <div id="form-login">
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" name="email" placeholder="correo@taller.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" name="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-primary${qgi ? ' qgi-btn' : ''}" id="btn-login" type="submit">Entrar</button>
      </form>
      <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" style="font-size:13px;color:#1971c2;">¿Olvidaste tu contraseña?</a></div>
      <div class="error-msg" id="login-error" role="alert"></div>
    </div>

    <div id="form-signup" style="display:none">
      <form id="signup-form" autocomplete="on">
        <div class="field">
          <label for="signup-name">Nombre completo</label>
          <input type="text" id="signup-name" name="name" placeholder="Juan Pérez" autocomplete="name" />
        </div>
        <div class="field">
          <label for="signup-email">Correo electrónico</label>
          <input type="email" id="signup-email" name="email" placeholder="correo@taller.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-pass">Contraseña</label>
          <input type="password" id="signup-pass" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        </div>
        ${qgi ? `
        <div class="field">
          <label for="signup-orgcode">Código de empleado <span style="color:#868e96;font-weight:400">(te lo da tu supervisor)</span></label>
          <input type="text" id="signup-orgcode" placeholder="ABC123" autocomplete="off" style="text-transform:uppercase" />
        </div>` : `
        <div class="field">
          <label for="signup-orgname">Nombre del taller</label>
          <input type="text" id="signup-orgname" name="organization" placeholder="Vidriería Ejemplo" autocomplete="organization" />
        </div>`}
        <button class="btn-primary${qgi ? ' qgi-btn' : ''}" id="btn-signup" type="submit">${qgi ? 'Solicitar acceso' : 'Empezar prueba gratis'}</button>
      </form>
      <div class="error-msg" id="signup-error" role="alert"></div>
      <div class="signup-note">${qgi
        ? 'Las cuentas nuevas las aprueba <b>Daniel Lebrón</b>. Te avisaremos cuando tengas acceso.'
        : 'Al registrarte se crea tu taller con 30 días / 200 guardados de prueba.'}</div>
    </div>`;
  }

  function renderForm(mode, keepState = false) {
    const prev = keepState ? collectValues() : {};
    const prevTab = currentTab;
    QGI = (mode === 'qgi');
    document.getElementById('app-card').innerHTML = formHTML(QGI);
    for (const id of Object.keys(prev)) {
      const el = document.getElementById(id);
      if (el) el.value = prev[id];
    }
    document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
    document.getElementById('tab-signup').addEventListener('click', () => switchTab('signup'));
    document.getElementById('login-form').addEventListener('submit', doLogin);
    document.getElementById('signup-form').addEventListener('submit', doSignup);
    const forgot = document.getElementById('forgot-link');
    if (forgot) forgot.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });
    switchTab(prevTab);
  }

  function showGeoNotice() {
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('geo-note')) return;
    const note = document.createElement('div');
    note.id = 'geo-note';
    note.className = 'geo-note';
    note.textContent = 'No pudimos detectar tu ubicación; estás viendo la versión general de Nivelato.';
    card.prepend(note);
  }

  // PR company-use notice: in Puerto Rico only QGC employees may use Nivelato
  // as a company; everyone else gets pointed at the free Play Store app.
  function showPrNotice() {
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('pr-note')) return;
    const note = document.createElement('div');
    note.id = 'pr-note';
    note.className = 'geo-note';
    note.setAttribute('role', 'alert');
    note.innerHTML = 'En Puerto Rico, el uso empresarial de Nivelato es exclusivo para empleados de Quality Glass. Los demás pueden usar la app gratuita: <a href="https://play.google.com/store/apps/details?id=com.nivelato.app" style="font-weight:700;color:#1971c2">Descargar en Google Play</a>.';
    card.prepend(note);
  }

  // settings.html redirects here with ?missingProfile=1 when the signed-in
  // account has no users/{uid} doc — surface it instead of failing silently.
  function showMissingProfileNotice() {
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('profile-note')) return;
    const note = document.createElement('div');
    note.id = 'profile-note';
    note.className = 'geo-note';
    note.setAttribute('role', 'alert');
    note.textContent = 'No encontramos tu perfil de usuario. Vuelve a iniciar sesión para repararlo.';
    card.prepend(note);
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('form-login').style.display  = tab === 'login'  ? '' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
    const tl = document.getElementById('tab-login');
    const ts = document.getElementById('tab-signup');
    tl.classList.toggle('active', tab === 'login');
    ts.classList.toggle('active', tab === 'signup');
    tl.setAttribute('aria-selected', tab === 'login' ? 'true' : 'false');
    ts.setAttribute('aria-selected', tab === 'signup' ? 'true' : 'false');
  }

  function showPendingApproval() {
    pendingShown = true;
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;font-family:Inter,sans-serif;gap:16px;padding:32px;text-align:center"><div style="font-size:48px">⏳</div><h2>Cuenta creada</h2><p style="color:#868e96;max-width:320px">Tu cuenta está pendiente de aprobación por el dueño del taller. Te avisarán cuando tengas acceso.</p><button id="btn-logout" class="btn-primary" style="max-width:240px">Cerrar sesión</button></div>';
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try { await signOut(auth); } catch (_) { /* already signed out */ }
      window.location.href = 'login.html';
    });
  }

  // ---- Cross-origin SSO handoff ----
  // This page lives on login.nivelatolabs.com; the app lives on
  // app.nivelatolabs.com (and dashboard.nivelatolabs.com). Firebase Auth
  // sessions are origin-scoped, so after a successful sign-in here we mint
  // a short-lived custom token for the same uid and hand it to the app's
  // sso.html, which signs in there and lands on `next`.
  const APP_ORIGIN = 'https://app.nivelatolabs.com';
  const SSO_ORIGINS = [APP_ORIGIN, 'https://dashboard.nivelatolabs.com'];
  function sanitizeNext(n) {
    if (typeof n !== 'string' || !(n = n.trim())) return null;
    if (n.charAt(0) === '/') {
      if (n.charAt(1) === '/' || /[\s\\]/.test(n)) return null;
      return n;
    }
    try {
      const u = new URL(n);
      if (u.protocol !== 'https:') return null;
      if (SSO_ORIGINS.indexOf(u.origin) === -1) return null;
      return u.toString();
    } catch (_) { return null; }
  }
  // Returns true when the handoff navigation started, false when minting
  // the token failed (caller shows the form error; the user stays put).
  async function ssoHandoff(defaultNext) {
    const next = sanitizeNext(new URLSearchParams(window.location.search).get('next')) || defaultNext;
    if (window.location.origin === APP_ORIGIN) {
      window.location.href = next;
      return true;
    }
    try {
      const { data } = await httpsCallable(centralFunctions, 'mintSsoToken')({});
      const token = data && data.customToken;
      if (!token) throw new Error('empty-token');
      window.location.href = APP_ORIGIN + '/sso.html?ctoken=' + encodeURIComponent(token)
        + '&next=' + encodeURIComponent(next);
      return true;
    } catch (e) {
      console.error('[Nivelato] SSO handoff failed:', (e && e.code) || e);
      return false;
    }
  }
  function ssoFailed(errEl) {
    errEl.textContent = 'No se pudo completar el inicio de sesión. Intenta de nuevo.';
    errEl.classList.add('visible');
  }

  async function postAuthRedirect() {
    // flowGate → claims → verdict routing, then SSO handoff to the app.
    const gate = await ensureFlowClaims();
    if (gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
    const userDoc = await getDoc(doc(db, 'users', auth.currentUser.uid));
    const role = userDoc.data()?.role;
    const dest = (role === 'owner' || role === 'cotizador') ? '/dashboard.html' : '/index.html';
    if (await ssoHandoff(dest)) return;
    // Token mint failed (e.g. functions not deployed yet): stay on the form.
    ssoFailed(document.getElementById('login-error'));
    const btn = document.getElementById('btn-login');
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
    authBusy = false;
  }

  async function doLogin(e) {
    e.preventDefault();
    authBusy = true;
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    errEl.classList.remove('visible');
    try {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
      await postAuthRedirect();
    } catch(err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      authBusy = false;
    }
  }

  async function doSignup(e) {
    e.preventDefault();
    authBusy = true;
    const btn = document.getElementById('btn-signup');
    const errEl = document.getElementById('signup-error');
    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';
    errEl.classList.remove('visible');
    try {
      const name  = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass  = document.getElementById('signup-pass').value;
      if (!name) throw { code: 'missing-name' };

      if (QGI) {
        // ---- QGI employee join: invite code → Daniel's approval queue ----
        const joinCode = document.getElementById('signup-orgcode').value.trim().toUpperCase();
        if (!joinCode) throw { code: 'missing-code' };
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        // Auth is live, so the mid-signup org read is allowed by the rules.
        const orgSnap = await getDoc(doc(db, 'orgs', joinCode));
        if (!orgSnap.exists() || orgSnap.data().flow !== 'qgi') {
          await cred.user.delete();
          throw { code: 'invalid-code' };
        }
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, role: 'medidor', orgId: joinCode,
          disabled: true, geoStatus: 'pending',
          createdAt: serverTimestamp()
        });
        await maybeSendWelcome(email, name, cred.user.uid);
        const gate = await ensureFlowClaims();
        if (gate.ok && routeAfterGate(gate.verdict, gate.reason)) return;
        showPendingApproval();
        return;
      }

      // ---- External trial signup: 30 days / 200 saves, no card (Phase 3:
      // Stripe Checkout replaces this with server-side provisioning) ----
      const orgName = document.getElementById('signup-orgname').value.trim();
      if (!orgName) throw { code: 'missing-orgname' };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      const orgId = cred.user.uid.slice(0, 6).toUpperCase();
      try {
        await setDoc(doc(db, 'orgs', orgId), {
          name: orgName,
          ownerId: cred.user.uid,
          joinCode: orgId,
          flow: 'external',
          versionPolicy: 'external-hybrid',
          licenseStatus: 'trialing',
          trialEndsAt: Timestamp.fromDate(new Date(Date.now() + 30 * 24 * 3600 * 1000)),
          trialSavesUsed: 0,
          seats: 1,
          homeRegion: country || 'unknown',
          createdAt: serverTimestamp(),
          userCount: 1
        });
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, role: 'owner', orgId,
          createdAt: serverTimestamp()
        });
      } catch(fsErr) {
        console.error('Firestore write failed:', fsErr.code, fsErr.message);
        alert(`¡Auth OK pero Firestore falló!\n\nError: ${fsErr.code}\n\nTu UID: ${cred.user.uid}\nTu código: ${orgId}\n\nRevisa las Rules en Firebase Console.`);
        await ssoHandoff('/dashboard.html');
        return;
      }
      const gate = await ensureFlowClaims();
      if (gate.ok && routeAfterGate(gate.verdict, gate.reason)) return;
      alert(`¡Cuenta creada!\n\nCódigo de tu taller: ${orgId}\n\nDáselo a tus empleados para que puedan registrarse.\n\nPrueba: 30 días o 200 guardados.`);
      await maybeSendWelcome(email, name, cred.user.uid);
      if (!(await ssoHandoff('/dashboard.html'))) {
        errEl.textContent = 'La cuenta se creó, pero no se pudo completar el inicio de sesión. Intenta entrar de nuevo.';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Empezar prueba gratis';
        authBusy = false;
      }
    } catch(err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = QGI ? 'Solicitar acceso' : 'Empezar prueba gratis';
      authBusy = false;
    }
  }

  function friendlyError(code) {
    const map = {
      'auth/invalid-email':          'Correo electrónico inválido.',
      'auth/user-not-found':         'No existe una cuenta con ese correo.',
      'auth/wrong-password':         'Contraseña incorrecta.',
      'auth/invalid-credential':     'Correo o contraseña incorrectos.',
      'auth/missing-password':       'Ingresa tu contraseña. Si usaste autocompletado, escríbela manualmente.',
      'auth/missing-email':          'Ingresa tu correo electrónico.',
      'auth/email-already-in-use':   'Ya existe una cuenta con ese correo.',
      'auth/weak-password':          'La contraseña debe tener al menos 6 caracteres.',
      'auth/too-many-requests':      'Demasiados intentos. Intenta más tarde.',
      'missing-name':                'Ingresa tu nombre completo.',
      'missing-orgname':             'Ingresa el nombre del taller.',
      'missing-code':                'Ingresa el código de empleado.',
      'invalid-code':                'Código inválido. Verifica con tu supervisor.',
    };
    return map[code] || `Error: ${code}`;
  }

  // ---- Init: hydrate the static form. NO network is awaited here. ----
  renderForm(flowFromCookie() || 'external', true);
  if (new URLSearchParams(location.search).get('missingProfile') === '1') showMissingProfileNotice();

  // (a) Already signed in? Send them to the app. Ignores the initial
  // null-fire while the persisted session restores, and stays out of the
  // way of in-flight login/signup submits and the pending-approval screen.
  onAuthStateChanged(auth, (user) => {
    if (authInitDone || authBusy || pendingShown) return;
    if (user) { authInitDone = true; postAuthRedirect(); }
  });

  // ---- Background geo (post-paint): swap the flow UI only if it differs.
  // Hard 7s cap so a hung lookup can never stall the page; on failure the
  // already-visible form stays, with a non-blocking notice. ----
  Promise.race([
    detectCountry(),
    new Promise((resolve) => setTimeout(() => resolve(null), 7000)),
  ]).then((cc) => {
    country = cc;
    const mode = flowFromCookie() || flowModeForCountry(country);
    if (mode !== (QGI ? 'qgi' : 'external')) renderForm(mode, true);
    if (country === null && !flowFromCookie()) showGeoNotice();
    if (country === 'PR') showPrNotice();
  });
</script>
</body>
</html>
