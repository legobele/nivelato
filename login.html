<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Nivelato - Iniciar sesión</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
    :root{
      --bg:#0b0b0e; --bg2:#121216; --card:#16161c; --line:#232329;
      --ink:#f2f1ec; --muted:#a7a7b3; --dim:#6d6d78;
      --amber:#f5a524; --amber2:#ffcf5c;
      --red:#ff8787; --green:#69db7c; --green-deep:#2b8a3e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    /* amber radial glow, same language as the homepage hero */
    body::before {
      content: "";
      position: fixed;
      top: -140px;
      right: -140px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(245,165,36,.13), transparent 65%);
      pointer-events: none;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .logo .adot { color: var(--amber); }
    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .exclusivity-note {
      font-size: 12px;
      color: var(--green);
      background: rgba(105,219,124,.07);
      border: 1px solid rgba(105,219,124,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .pricing-note {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .geo-note {
      font-size: 12px;
      color: var(--amber2);
      background: rgba(245,165,36,.07);
      border: 1px solid rgba(245,165,36,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .geo-note a { color: var(--amber2); }
    .geo-note button { color: inherit; }
    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      /* button reset — tabs are real <button>s for keyboard access */
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab:hover { color: var(--muted); }
    .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
    .tab.active.qgi-tab { color: var(--green); border-bottom-color: var(--green); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input::placeholder { color: var(--dim); }
    .field input:focus { border-color: var(--amber); }
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--ink);
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--amber);
      color: #141414;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-primary:hover { background: var(--amber2); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { background: #3a3a42; color: var(--dim); cursor: not-allowed; }
    .btn-primary.qgi-btn { background: var(--green-deep); color: #fff; }
    .btn-primary.qgi-btn:hover { background: #237a36; }
    .btn-primary.qgi-btn:disabled { background: #3a3a42; color: var(--dim); }
    .forgot-link { font-size: 13px; color: var(--amber2); text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    .error-msg {
      background: rgba(255,135,135,.08);
      border: 1px solid rgba(255,135,135,.35);
      color: var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      line-height: 1.5;
    }
    .error-msg.visible { display: block; }
    .signup-note {
      font-size: 12px;
      color: var(--dim);
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }
    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
      z-index: 2;
    }
    .lang-toggle:hover { color: var(--ink); border-color: var(--dim); }
    .lang-toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 32px 22px; }
    }
  </style>

</head>
<body>
<!-- M17: the default (external) form is STATIC HTML — first paint never waits
     on any network (module imports or the ipapi.co geo lookup). The module
     below hydrates it, then swaps the flow UI in the background if geo says
     otherwise. -->
<div class="card" id="app-card">
  <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Switch to English">🌐 EN</button>
  <h1 class="logo">Nivelato<span class="adot">.</span></h1>
  <div class="tagline" data-i18n="tagline">Mediciones de campo, niveladas.</div>
  <div class="pricing-note" data-i18n="pricing_note">Para Ultra, paga desde la app en tu teléfono (Google Play).</div>

  <div class="tab-row" role="tablist" data-i18n-aria="tablist_label" aria-label="Iniciar sesión o solicitar acceso">
    <button type="button" role="tab" aria-selected="true" class="tab active" id="tab-login" data-i18n="tab_login">Iniciar sesión</button>
    <button type="button" role="tab" aria-selected="false" class="tab" id="tab-signup" data-i18n="tab_signup">Solicitar acceso</button>
  </div>

  <div id="form-login">
    <form id="login-form" autocomplete="on" onsubmit="return false">
      <div class="field">
        <label for="login-email" data-i18n="label_email">Correo electrónico</label>
        <input type="email" id="login-email" name="email" data-i18n-ph="ph_email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-pass" data-i18n="label_password">Contraseña</label>
        <input type="password" id="login-pass" name="password" data-i18n-ph="ph_password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" id="btn-login" type="submit" data-i18n="btn_login">Entrar</button>
    </form>
    <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" class="forgot-link" data-i18n="forgot">¿Olvidaste tu contraseña?</a></div>
    <div class="error-msg" id="login-error" role="alert"></div>
  </div>

  <div id="form-signup" style="display:none">
    <form id="signup-form" autocomplete="on" onsubmit="return false">
      <div class="field">
        <label for="signup-name" data-i18n="label_name">Nombre completo</label>
        <input type="text" id="signup-name" name="name" data-i18n-ph="ph_name" placeholder="Juan Pérez" autocomplete="name" />
      </div>
      <div class="field">
        <label for="signup-email" data-i18n="label_email">Correo electrónico</label>
        <input type="email" id="signup-email" name="email" data-i18n-ph="ph_email" placeholder="correo@taller.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="signup-pass" data-i18n="label_password">Contraseña</label>
        <input type="password" id="signup-pass" name="password" data-i18n-ph="ph_pass_min" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="signup-orgname" data-i18n="label_shop">Nombre del taller</label>
        <input type="text" id="signup-orgname" name="organization" data-i18n-ph="ph_shop" placeholder="Vidriería Ejemplo" autocomplete="organization" />
      </div>
      <button class="btn-primary" id="btn-signup" type="submit" data-i18n="btn_signup">Solicitar acceso</button>
    </form>
    <div class="error-msg" id="signup-error" role="alert"></div>
    <div class="signup-note" data-i18n="signup_note">Tu solicitud será revisada. Te avisaremos cuando tengas acceso.</div>
  </div>
</div>

<script>
  // ---- Nivelato login i18n (classic script — zero network dependencies) ----
  // Dictionary + language state live here so the language toggle and the tab

    var DICT = {

      en: {

        label_empcode_html: 'Employee code <span style="color:#868e96;font-weight:400">(ask your supervisor for it)</span>',
        ph_email: 'email@shop.com',
        ph_password: '••••••••',

        btn_login: 'Sign in',
        btn_login_busy: 'Signing in...',
        btn_signup: 'Request access',
        btn_signup_busy: 'Creating account...',

        signup_note: 'Your request will be reviewed. We will let you know when you have access.',

        pr_note_1: 'In Puerto Rico, business use of Nivelato is exclusive to Quality Glass employees. ',
        pr_note_2: 'Everyone else can use the free app: ',

        forgot_sent: 'Check your email, we sent you the link to reset your password.',
        forgot_failed: 'Could not send the email: ',
        forgot_unknown: 'unknown error',
        sso_failed: 'Could not complete sign-in. Try again.',
        fs_fail: 'Auth OK but Firestore failed!\n\nError: ',
        fs_fail_uid: '\n\nYour UID: ',
        fs_fail_rules: '\n\nCheck the Rules in Firebase Console.',

        err_user_not_found: 'No account exists with that email.',
        err_wrong_password: 'Incorrect password.',
        err_invalid_credential: 'Incorrect email or password.',
        err_missing_password: 'Enter your password. If you used autocomplete, type it manually.',
        err_missing_email: 'Enter your email address.',
        err_email_in_use: 'An account with that email already exists.',
        err_weak_password: 'Password must be at least 6 characters.',

    };
    var STORE_KEY = 'nivelato-login-lang';
    function detectLang() {
      try {
        var s = localStorage.getItem(STORE_KEY);
        if (s === 'es' || s === 'en') return s;
      } catch (_) { /* storage unavailable */ }
      try {
        var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
        if (nav === 'en' || nav.indexOf('en-') === 0) return 'en';
      } catch (_) { /* ignore */ }
      return 'es';
    }
    var lang = detectLang();
    function t(key) {
      var d = DICT[lang] || DICT.es;
      if (d && d[key] !== undefined) return d[key];
      return DICT.es[key] !== undefined ? DICT.es[key] : key;
    }
    function applyLang() {
      try { document.documentElement.setAttribute('lang', lang); } catch (_) {}
      try { document.title = t('page_title'); } catch (_) {}
      var btn = document.getElementById('lang-toggle');
      if (btn) {
        btn.innerHTML = '🌐 ' + (lang === 'es' ? 'EN' : 'ES');
        var al = t(lang === 'es' ? 'lang_toggle_to_en' : 'lang_toggle_to_es');
        btn.setAttribute('aria-label', al);
        btn.setAttribute('title', al);
      }
      var els = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < els.length; i++) {
        var k = els[i].getAttribute('data-i18n');
        if (els[i].hasAttribute('data-i18n-html')) els[i].innerHTML = t(k);
        else els[i].textContent = t(k);
      }
      var phs = document.querySelectorAll('[data-i18n-ph]');
      for (var j = 0; j < phs.length; j++) {
        phs[j].setAttribute('placeholder', t(phs[j].getAttribute('data-i18n-ph')));
      }
      var aras = document.querySelectorAll('[data-i18n-aria]');
      for (var m = 0; m < aras.length; m++) {
        aras[m].setAttribute('aria-label', t(aras[m].getAttribute('data-i18n-aria')));
      }
      // watchdog banner, if visible: rebuild it in the current language
      var bw = document.getElementById('boot-warn');
      if (bw) {
        bw.innerHTML = '';
        bw.appendChild(document.createTextNode(t('boot_a')));
        var rb = document.createElement('button');
        rb.type = 'button';
        rb.id = 'boot-retry';
        rb.setAttribute('style', 'text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0');
        rb.textContent = t('boot_reload');
        rb.addEventListener('click', function () { window.location.reload(); });
        bw.appendChild(rb);
        bw.appendChild(document.createTextNode(t('boot_b')));
      }
    }
    function setLang(l) {
      if (l !== 'es' && l !== 'en') return;
      if (l === lang) return;
      lang = l;
      try { localStorage.setItem(STORE_KEY, l); } catch (_) { /* ignore */ }
      applyLang();
      // let the ES module re-render its dynamic strings (form, notices,
      // save-login prompt, pending screen) in the new language
      if (window.__nivelatoOnLangChange) {
        try { window.__nivelatoOnLangChange(l); } catch (_) { /* ignore */ }
      }
    }
    window.nivT = t;
    window.nivApplyLang = applyLang;
    window.nivGetLang = function () { return lang; };
    window.setLang = setLang;

    // ---- Pre-boot tab fallback ----
    // The module rebinds the tabs to its own switchTab once loaded; until
    // then this global keeps them working on first paint. The chosen tab is
    // stashed so the module can honor it on boot.
    window.switchTab = function (tab) {
      window.__nivelatoTab = tab;
      var fl = document.getElementById('form-login');
      var fs = document.getElementById('form-signup');
      var tl = document.getElementById('tab-login');
      var ts = document.getElementById('tab-signup');
      if (fl) fl.style.display = tab === 'login' ? '' : 'none';
      if (fs) fs.style.display = tab === 'signup' ? '' : 'none';
      if (tl) {
        tl.classList.toggle('active', tab === 'login');
        tl.setAttribute('aria-selected', tab === 'login' ? 'true' : 'false');
      }
      if (ts) {
        ts.classList.toggle('active', tab === 'signup');
        ts.setAttribute('aria-selected', tab === 'signup' ? 'true' : 'false');
      }
    };

    // Delegated: survives the module's innerHTML re-renders.
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('#lang-toggle') : null;
      if (el) {
        e.preventDefault();
        setLang(lang === 'es' ? 'en' : 'es');
        return;
      }
      var tl = e.target && e.target.closest ? e.target.closest('#tab-login') : null;
      var ts = e.target && e.target.closest ? e.target.closest('#tab-signup') : null;
      if (tl) window.switchTab('login');
      else if (ts) window.switchTab('signup');
    });

    // Apply the stored/device language to the static HTML immediately.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyLang);
    } else {
      applyLang();
    }
  })();
</script>

<script>
  console.log('[Nivelato] Cargando backend... (módulo JS)');
  // M17 watchdog (classic script — arms at parse time, needs no imports):
  // if the module below hasn't booted within 9s (stalled CDN / blocked
  // network), show a non-blocking warning instead of hanging silently.
  // The static form above stays visible and usable the whole time.
  setTimeout(function () {
    if (window.__nivelatoBooted) return;
    var card = document.getElementById('app-card');
    if (card && !document.getElementById('boot-warn')) {
      var t = window.nivT || function (k) { return k; };
      var w = document.createElement('div');
      w.id = 'boot-warn';
      w.className = 'geo-note';
      w.setAttribute('role', 'alert');
      w.appendChild(document.createTextNode(t('boot_a')));
      var rb = document.createElement('button');
      rb.type = 'button';
      rb.id = 'boot-retry';
      rb.setAttribute('style', 'text-decoration:underline;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0');
      rb.textContent = t('boot_reload');
      rb.addEventListener('click', function () { window.location.reload(); });
      w.appendChild(rb);
      w.appendChild(document.createTextNode(t('boot_b')));
      card.prepend(w);
    }
  }, 60000);
</script>

<script type="module">
  import { auth, db, centralFunctions } from './firebase-config.js';
  import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
    signOut,
    onAuthStateChanged,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import {
    doc, setDoc, getDoc, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
  import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
  import { detectCountry, flowModeForCountry, ensureFlowClaims, routeAfterGate } from './geo.js';

  console.log('[Nivelato] Cargando backend... imports listos, inicializando');

  // Correo de bienvenida: la app lo pide explícito tras el signup para que
  // funcione igual en el backend default y en backends propios (BYOB).
  // Best effort, nunca bloquea el registro.
  async function maybeSendWelcome(email, name, uid) {
    try {
      await setDoc(doc(db, 'notification_prefs', uid), {
        welcomeEmail: true, newProject: true, projectEdit: true, quoteReady: true,
        updatedAt: serverTimestamp()
      }, { merge: true });
      const prefs = (await getDoc(doc(db, 'notification_prefs', uid))).data() || {};
      if (prefs.welcomeEmail === false) return;
      await httpsCallable(centralFunctions, 'requestWelcomeEmail')({ email, name });
    } catch (e) {
      console.warn('[Nivelato] welcome email skipped:', e.message);
    }
  }

  // Restablecer contraseña: primero el flujo propio (remitente
  // noreply@nivelatolabs.com); si la cuenta vive en un backend propio,
  // el servidor central no la conoce y caemos al correo default de Firebase.
  async function doForgotPassword() {
    const t = window.nivT;
    const email = prompt(t('forgot_prompt'));
    if (!email || !email.trim()) return;
    try {
      await httpsCallable(centralFunctions, 'requestPasswordReset')({ email: email.trim() });
      alert(t('forgot_sent'));
    } catch (err) {
      if (err.code === 'functions/not-found') {
        try {
          await sendPasswordResetEmail(auth, email.trim());
          alert(t('forgot_sent'));
        } catch (e2) {
          alert(t('forgot_failed') + friendlyError(e2.code));
        }
      } else {
        alert(t('forgot_failed') + (err.message || t('forgot_unknown')));
      }
    }
  }

  window.__nivelatoBooted = true;
  console.log('[Nivelato] Cargando backend... Firebase listo');
  console.log('[Nivelato] Backend listo');
  // If the watchdog banner fired on a slow connection but we booted anyway,
  // remove it — the page is fully functional now.
  var bw = document.getElementById('boot-warn');
  if (bw) bw.remove();

  // ---- Geo-gated UI (spec §6) ----
  // The default form is static HTML above, so geo NEVER gates first paint.
  // Geo resolves in the background after paint; if the real flow differs from
  // what's rendered, the UI is swapped then. Enforcement stays server-side
  // in the flowGate callable — the client lookup is routing-only, so
  // render-first is safe. Unknown geo → external (§6.3).
  // Web login (login.nivelatolabs.com) is always generic Nivelato branding:
  // no QGC-specific options, flows, or mentions. The QGI employee flow
  // stays in the codebase, but this page never renders it.
  const WEB_LOGIN_GENERIC = true;
  function flowFromCookie() {
    if (WEB_LOGIN_GENERIC) return 'external';
    const m = document.cookie.match(/(?:^|;\s*)nl_flow=(qgi|external)/);
    return m ? m[1] : null;
  }

  let QGI = false;        // currently rendered flow
  let country = null;     // resolved async; null until geo settles
  let currentTab = window.__nivelatoTab || 'login';
  let pendingShown = false;
  let authInitDone = false;
  let authBusy = false;   // a login/signup submit is in flight
  let savePromptShown = false;  // the "save login?" prompt replaced the card
  let prNoticeOn = false, geoNoticeOn = false, profileNoticeOn = false;

  const VALUE_IDS = ['login-email', 'login-pass', 'signup-name', 'signup-email',
                     'signup-pass', 'signup-orgcode', 'signup-orgname'];
  function collectValues() {
    const v = {};
    for (const id of VALUE_IDS) {
      const el = document.getElementById(id);
      if (el) v[id] = el.value;
    }
    return v;
  }

  function formHTML(qgi) {
    return `
    <button type="button" id="lang-toggle" class="lang-toggle"></button>
    <h1 class="logo${qgi ? ' qgi' : ''}">${qgi ? 'Quality Glass' : 'Nivelato<span class="adot">.</span>'}</h1>
    <div class="tagline" data-i18n="${qgi ? 'tagline_qgi' : 'tagline'}"></div>
    ${qgi ? `<div class="exclusivity-note" data-i18n="exclusivity_note_html" data-i18n-html="1"></div>` : ''}
    ${!qgi ? `<div class="pricing-note" data-i18n="pricing_note"></div>` : ''}

    <div class="tab-row" role="tablist" data-i18n-aria="tablist_label">
      <button type="button" role="tab" aria-selected="true" class="tab active${qgi ? ' qgi-tab' : ''}" id="tab-login" data-i18n="tab_login"></button>
      <button type="button" role="tab" aria-selected="false" class="tab${qgi ? ' qgi-tab' : ''}" id="tab-signup" data-i18n="tab_signup"></button>
    </div>

    <div id="form-login">
      <form id="login-form" autocomplete="on" onsubmit="return false">
        <div class="field">
          <label for="login-email" data-i18n="label_email"></label>
          <input type="email" id="login-email" name="email" data-i18n-ph="ph_email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-pass" data-i18n="label_password"></label>
          <input type="password" id="login-pass" name="password" data-i18n-ph="ph_password" autocomplete="current-password" />
        </div>
        <button class="btn-primary${qgi ? ' qgi-btn' : ''}" id="btn-login" type="submit" data-i18n="btn_login"></button>
      </form>
      <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" class="forgot-link" data-i18n="forgot"></a></div>
      <div class="error-msg" id="login-error" role="alert"></div>
    </div>

    <div id="form-signup" style="display:none">
      <form id="signup-form" autocomplete="on" onsubmit="return false">
        <div class="field">
          <label for="signup-name" data-i18n="label_name"></label>
          <input type="text" id="signup-name" name="name" data-i18n-ph="ph_name" autocomplete="name" />
        </div>
        <div class="field">
          <label for="signup-email" data-i18n="label_email"></label>
          <input type="email" id="signup-email" name="email" data-i18n-ph="ph_email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-pass" data-i18n="label_password"></label>
          <input type="password" id="signup-pass" name="password" data-i18n-ph="ph_pass_min" autocomplete="new-password" />
        </div>
        ${qgi ? `
        <div class="field">
          <label for="signup-orgcode" data-i18n="label_empcode_html" data-i18n-html="1"></label>
          <input type="text" id="signup-orgcode" data-i18n-ph="ph_empcode" autocomplete="off" style="text-transform:uppercase" />
        </div>` : `
        <div class="field">
          <label for="signup-orgname" data-i18n="label_shop"></label>
          <input type="text" id="signup-orgname" name="organization" data-i18n-ph="ph_shop" autocomplete="organization" />
        </div>`}
        <button class="btn-primary${qgi ? ' qgi-btn' : ''}" id="btn-signup" type="submit" data-i18n="btn_signup"></button>
      </form>
      <div class="error-msg" id="signup-error" role="alert"></div>
      <div class="signup-note" data-i18n="${qgi ? 'signup_note_qgi_html' : 'signup_note'}"${qgi ? ' data-i18n-html="1"' : ''}></div>
    </div>`;
  }

  function renderForm(mode, keepState = false) {
    const prev = keepState ? collectValues() : {};
    const prevTab = currentTab;
    QGI = (mode === 'qgi');
    document.getElementById('app-card').innerHTML = formHTML(QGI);
    for (const id of Object.keys(prev)) {
      const el = document.getElementById(id);
      if (el) el.value = prev[id];
    }
    // Tab clicks are handled by the delegated listener in the classic
    // script, which calls window.switchTab — overridden below to the
    // module's stateful version once the module is loaded.
    document.getElementById('login-form').addEventListener('submit', doLogin);
    document.getElementById('signup-form').addEventListener('submit', doSignup);
    const forgot = document.getElementById('forgot-link');
    if (forgot) forgot.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });
    window.nivApplyLang();
    switchTab(prevTab);
  }

  // Override the pre-boot global: the classic script's delegated tab clicks
  // keep working, now routed through the module's stateful switchTab.
  window.switchTab = function (tab) {
    window.__nivelatoTab = tab;
    switchTab(tab);
  };

  function showGeoNotice() {
    geoNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('geo-note')) return;
    const note = document.createElement('div');
    note.id = 'geo-note';
    note.className = 'geo-note';
    note.textContent = window.nivT('geo_note');
    card.prepend(note);
  }

  // PR company-use notice: QGC gray theme. In Puerto Rico only QGC employees
  // may use Nivelato as a company; everyone else gets the free Play Store app.
  function showPrNotice() {
    prNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('pr-note')) return;
    const t = window.nivT;
    const note = document.createElement('div');
    note.id = 'pr-note';
    note.setAttribute('role', 'alert');
    note.style.cssText = 'background:#3a3a3e;border:1px solid #55555c;border-radius:12px;padding:14px;margin-bottom:20px;color:#f2f1ec;font-size:13px;line-height:1.6';
    note.innerHTML = '<img src="./qgc-logo.jpg" alt="Quality Glazing Contractors" style="display:block;max-width:180px;border-radius:8px;margin-bottom:10px">'
      + t('pr_note_1')
      + t('pr_note_2')
      + '<a href="https://play.google.com/store/apps/details?id=com.nivelato.app" style="font-weight:700;color:#ffffff;text-decoration:underline">' + t('pr_note_link') + '</a>.';
    card.prepend(note);
  }

  // settings.html redirects here with ?missingProfile=1 when the signed-in
  // account has no users/{uid} doc — surface it instead of failing silently.
  function showMissingProfileNotice() {
    profileNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('profile-note')) return;
    const note = document.createElement('div');
    note.id = 'profile-note';
    note.className = 'geo-note';
    note.setAttribute('role', 'alert');
    note.textContent = window.nivT('profile_note');
    card.prepend(note);
  }

  // Re-render the visible notices in the new language (renderForm wipes them).
  function refreshNotices() {
    for (const id of ['pr-note', 'geo-note', 'profile-note']) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
    if (prNoticeOn) showPrNotice();
    if (geoNoticeOn) showGeoNotice();
    if (profileNoticeOn) showMissingProfileNotice();
  }

  // Called by the classic script's setLang after applyLang: re-render every
  // dynamic surface (form, notices, save-login prompt, pending screen).
  window.__nivelatoOnLangChange = function () {
    if (pendingShown) { showPendingApproval(); return; }
    if (savePromptShown) { showSaveLoginPrompt(); return; }
    renderForm(QGI ? 'qgi' : 'external', true);
    refreshNotices();
  };

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('form-login').style.display  = tab === 'login'  ? '' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
    const tl = document.getElementById('tab-login');
    const ts = document.getElementById('tab-signup');
    tl.classList.toggle('active', tab === 'login');
    ts.classList.toggle('active', tab === 'signup');
    tl.setAttribute('aria-selected', tab === 'login' ? 'true' : 'false');
    ts.setAttribute('aria-selected', tab === 'signup' ? 'true' : 'false');
  }

  function showPendingApproval() {
    pendingShown = true;
    const t = window.nivT;
    document.body.innerHTML = '<button type="button" id="lang-toggle" class="lang-toggle"></button>'
      + '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;font-family:Inter,sans-serif;gap:16px;padding:32px;text-align:center"><div style="font-size:48px">⏳</div><h2>' + t('pending_title') + '</h2><p style="color:#a7a7b3;max-width:320px">' + t('pending_body') + '</p><button id="btn-logout" class="btn-primary" style="max-width:240px">' + t('pending_logout') + '</button></div>';
    window.nivApplyLang();
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try { await signOut(auth); } catch (_) { /* already signed out */ }
      window.location.href = 'login.html';
    });
  }

  // ---- Cross-origin SSO handoff ----
  // This page lives on login.nivelatolabs.com; the app lives on
  // app.nivelatolabs.com (and dashboard.nivelatolabs.com). Firebase Auth
  // sessions are origin-scoped, so after a successful sign-in here we mint
  // a short-lived custom token for the same uid and hand it to the app's
  // sso.html, which signs in there and lands on `next`.
  const APP_ORIGIN = 'https://app.nivelatolabs.com';
  const SSO_ORIGINS = [APP_ORIGIN, 'https://dashboard.nivelatolabs.com'];
  function sanitizeNext(n) {
    if (typeof n !== 'string' || !(n = n.trim())) return null;
    if (n.charAt(0) === '/') {
      if (n.charAt(1) === '/' || /[\s\\]/.test(n)) return null;
      return n;
    }
    try {
      const u = new URL(n);
      if (u.protocol !== 'https:') return null;
      if (SSO_ORIGINS.indexOf(u.origin) === -1) return null;
      return u.toString();
    } catch (_) { return null; }
  }
  // Returns true when the handoff navigation started, false when minting
  // the token failed (caller shows the form error; the user stays put).
  async function ssoHandoff(defaultNext) {
    const next = sanitizeNext(new URLSearchParams(window.location.search).get('next')) || defaultNext;
    if (window.location.origin === APP_ORIGIN) {
      window.location.href = next;
      return true;
    }
    try {
      const { data } = await httpsCallable(centralFunctions, 'mintSsoToken')({});
      const token = data && data.customToken;
      if (!token) throw new Error('empty-token');
      window.location.href = APP_ORIGIN + '/sso.html?ctoken=' + encodeURIComponent(token)
        + '&next=' + encodeURIComponent(next);
      return true;
    } catch (e) {
      console.error('[Nivelato] SSO handoff failed:', (e && e.code) || e);
      return false;
    }
  }
  function ssoFailed(errEl) {
    errEl.textContent = window.nivT('sso_failed');
    errEl.classList.add('visible');
  }

  async function postAuthRedirect() {
    // flowGate → claims → verdict routing, then SSO handoff to the app.
    const gate = await ensureFlowClaims();
    if (gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
    const userDoc = await getDoc(doc(db, 'users', auth.currentUser.uid));
    const role = userDoc.data()?.role;
    const dest = (role === 'owner' || role === 'cotizador') ? '/dashboard.html' : '/index.html';
    if (await ssoHandoff(dest)) return;
    // Token mint failed (e.g. functions not deployed yet): stay on the form.
    ssoFailed(document.getElementById('login-error'));
    const btn = document.getElementById('btn-login');
    if (btn) { btn.disabled = false; btn.textContent = window.nivT('btn_login'); }
    authBusy = false;
  }

  async function doLogin(e) {
    e.preventDefault();
    authBusy = true;
    const t = window.nivT;
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = t('btn_login_busy');
    errEl.classList.remove('visible');
    try {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
      showSaveLoginPrompt();
    } catch(err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = t('btn_login');
      authBusy = false;
    }
  }

  // Post-login: "save login on this device?" — local persistence keeps the
  // session across restarts; session persistence drops it when the tab closes.
  function showSaveLoginPrompt() {
    savePromptShown = true;
    const t = window.nivT;
    const card = document.getElementById('app-card');
    card.innerHTML = '<button type="button" id="lang-toggle" class="lang-toggle"></button>'
      + '<h1 class="logo">Nivelato<span class="adot">.</span></h1>'
      + '<div class="tagline">' + t('save_title') + '</div>'
      + '<p style="color:#a7a7b3;font-size:14px;line-height:1.6;margin:0 0 24px">' + t('save_q') + '</p>'
      + '<button class="btn-primary" id="btn-save-yes" type="button">' + t('save_yes') + '</button>'
      + '<button class="btn-primary" id="btn-save-no" type="button" style="background:transparent;border:1px solid #2c2c31;color:#f2f1ec;margin-top:10px">' + t('save_no') + '</button>'
      + '<div class="error-msg" id="login-error" role="alert"></div>';
    window.nivApplyLang();
    document.getElementById('btn-save-yes').addEventListener('click', () => finishLoginWithPersistence(browserLocalPersistence));
    document.getElementById('btn-save-no').addEventListener('click', () => finishLoginWithPersistence(browserSessionPersistence));
  }

  async function finishLoginWithPersistence(persistence) {
    try {
      await setPersistence(auth, persistence);
    } catch (_) { /* best effort; default persistence still applies */ }
    await postAuthRedirect();
  }

  async function doSignup(e) {
    e.preventDefault();
    authBusy = true;
    const t = window.nivT;
    const btn = document.getElementById('btn-signup');
    const errEl = document.getElementById('signup-error');
    btn.disabled = true;
    btn.textContent = t('btn_signup_busy');
    errEl.classList.remove('visible');
    try {
      const name  = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass  = document.getElementById('signup-pass').value;
      if (!name) throw { code: 'missing-name' };

      if (QGI) {
        // ---- QGI employee join: invite code → Daniel's approval queue ----
        const joinCode = document.getElementById('signup-orgcode').value.trim().toUpperCase();
        if (!joinCode) throw { code: 'missing-code' };
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        // Auth is live, so the mid-signup org read is allowed by the rules.
        const orgSnap = await getDoc(doc(db, 'orgs', joinCode));
        if (!orgSnap.exists() || orgSnap.data().flow !== 'qgi') {
          await cred.user.delete();
          throw { code: 'invalid-code' };
        }
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, role: 'medidor', orgId: joinCode,
          disabled: true, geoStatus: 'pending',
          createdAt: serverTimestamp()
        });
        await maybeSendWelcome(email, name, cred.user.uid);
        const gate = await ensureFlowClaims();
        if (gate.ok && routeAfterGate(gate.verdict, gate.reason)) return;
        showPendingApproval();
        return;
      }

      // ---- External: request company access (no self-service signup) ----
      // Creates the auth account disabled; an owner approves and assigns the org.
      const orgName = document.getElementById('signup-orgname').value.trim();
      if (!orgName) throw { code: 'missing-orgname' };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      try {
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, role: 'medidor',
          disabled: true, geoStatus: 'pending',
          requestedOrg: orgName,
          homeRegion: country || 'unknown',
          createdAt: serverTimestamp()
        });
      } catch(fsErr) {
        console.error('Firestore write failed:', fsErr.code, fsErr.message);
        alert(t('fs_fail') + fsErr.code + t('fs_fail_uid') + cred.user.uid + t('fs_fail_rules'));
        await ssoHandoff('/dashboard.html');
        return;
      }
      await maybeSendWelcome(email, name, cred.user.uid);
      showPendingApproval();
      return;
    } catch(err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = t('btn_signup');
      authBusy = false;
    }
  }

  function friendlyError(code) {
    const t = window.nivT;
    const map = {
      'auth/invalid-email':          t('err_invalid_email'),
      'auth/user-not-found':         t('err_user_not_found'),
      'auth/wrong-password':         t('err_wrong_password'),
      'auth/invalid-credential':     t('err_invalid_credential'),
      'auth/missing-password':       t('err_missing_password'),
      'auth/missing-email':          t('err_missing_email'),
      'auth/email-already-in-use':   t('err_email_in_use'),
      'auth/weak-password':          t('err_weak_password'),
      'auth/too-many-requests':      t('err_too_many'),
      'missing-name':                t('err_missing_name'),
      'missing-orgname':             t('err_missing_orgname'),
      'missing-code':                t('err_missing_code'),
      'invalid-code':                t('err_invalid_code'),
    };
    return map[code] || `Error: ${code}`;
  }

  // ---- Init: hydrate the static form. NO network is awaited here. ----
  // Use synchronously-available signals (Cloudflare-injected country,
  // device timezone) for the initial mode so PR users don't see a
  // generic→QGC flash when the background geo resolves.
  var _tzIsPR = false;
  try { _tzIsPR = Intl.DateTimeFormat().resolvedOptions().timeZone === 'America/Puerto_Rico'; } catch (_) {}
  var _injectedCc = (typeof window.NIVELATO_COUNTRY === 'string' && window.NIVELATO_COUNTRY) || null;
  var _initialCc = _injectedCc || (_tzIsPR ? 'PR' : null);
  renderForm(flowFromCookie() || flowModeForCountry(_initialCc), true);
  if (_initialCc === 'PR') showPrNotice();
  if (new URLSearchParams(location.search).get('missingProfile') === '1') showMissingProfileNotice();

  // (a) Already signed in? Send them to the app. Ignores the initial
  // null-fire while the persisted session restores, and stays out of the
  // way of in-flight login/signup submits and the pending-approval screen.
  onAuthStateChanged(auth, (user) => {
    if (authInitDone || authBusy || pendingShown) return;
    if (user) { authInitDone = true; postAuthRedirect(); }
  });

  // ---- Background geo (post-paint): swap the flow UI only if it differs.
  // Hard 7s cap so a hung lookup can never stall the page; on failure the

  // Country: prefer the Cloudflare-injected header (reliable, no API call);

    ? Promise.resolve(injectedCc)
    : Promise.race([
        detectCountry(),
        new Promise((resolve) => setTimeout(() => resolve(null), 7000)),

  countryPromise.then((cc) => {
    country = cc;
    var effectivePR = (country === 'PR') || tzIsPR;
    var effectiveCountry = effectivePR ? 'PR' : country;
    const mode = flowFromCookie() || flowModeForCountry(effectiveCountry);
    if (mode !== (QGI ? 'qgi' : 'external')) renderForm(mode, true);
    if (country === null && !flowFromCookie() && !tzIsPR) showGeoNotice();
    if (effectivePR) showPrNotice();
