<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Nivelato - Iniciar sesión</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
    :root{
      --bg:#0b0b0e; --bg2:#121216; --card:#16161c; --line:#232329;
      --ink:#f2f1ec; --muted:#a7a7b3; --dim:#6d6d78;
      --amber:#f5a524; --amber2:#ffcf5c;
      --red:#ff8787; --green:#69db7c; --green-deep:#2b8a3e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    /* amber radial glow, same language as the homepage hero */
    body::before {
      content: "";
      position: fixed;
      top: -140px;
      right: -140px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(245,165,36,.13), transparent 65%);
      pointer-events: none;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .logo .adot { color: var(--amber); }
    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .exclusivity-note {
      font-size: 12px;
      color: var(--green);
      background: rgba(105,219,124,.07);
      border: 1px solid rgba(105,219,124,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .geo-note {
      font-size: 12px;
      color: var(--amber2);
      background: rgba(245,165,36,.07);
      border: 1px solid rgba(245,165,36,.32);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .geo-note a { color: var(--amber2); }
    .geo-note button { color: inherit; }
    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      /* button reset — tabs are real <button>s for keyboard access */
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit;
    }
    .tab:hover { color: var(--muted); }
    .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
    .tab.active.qgi-tab { color: var(--green); border-bottom-color: var(--green); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input::placeholder { color: var(--dim); }
    .field input:focus { border-color: var(--amber); }
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--ink);
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--amber);
      color: #141414;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-primary:hover { background: var(--amber2); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { background: #3a3a42; color: var(--dim); cursor: not-allowed; }
    .btn-primary.qgi-btn { background: var(--green-deep); color: #fff; }
    .btn-primary.qgi-btn:hover { background: #237a36; }
    .btn-primary.qgi-btn:disabled { background: #3a3a42; color: var(--dim); }
    .forgot-link { font-size: 13px; color: var(--amber2); text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    .error-msg {
      background: rgba(255,135,135,.08);
      border: 1px solid rgba(255,135,135,.35);
      color: var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      line-height: 1.5;
    }
    .error-msg.visible { display: block; }
    .niv-spinner {
      width: 32px; height: 32px; margin: 32px auto;
      border: 3px solid var(--line); border-top-color: var(--amber);
      border-radius: 50%; animation: niv-spin 0.8s linear infinite;
    }
    @keyframes niv-spin { to { transform: rotate(360deg); } }
    body.qgc-theme .niv-spinner { border-color: #55555c; border-top-color: #b9b9c2; }
    .signup-note {
      font-size: 12px;
      color: var(--dim);
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }
    .travel-body {
      font-size: 14px;
      color: var(--dim);
      line-height: 1.6;
      margin: 0 0 20px;
      text-align: center;
    }
    .lang-toggle {
      display: block;
      width: fit-content;
      margin: 0 0 12px auto;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
    }
    .lang-toggle:hover { color: var(--ink); border-color: var(--dim); }
    .lang-toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    /* Header-row pill: the language toggle lives in the panel header
       (accounts title row / company-head), right-aligned in-flow. */
    .accounts-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .accounts-head .accounts-title { margin-bottom: 0; }
    .accounts-head .lang-toggle, .company-head .lang-toggle { margin: 0 0 0 auto; flex: none; }
    /* ---- Password-only re-auth view ---- */
    .reauth-acct {
      display: flex; align-items: center; gap: 12px;
      border: 1px solid #2c2c31; border-radius: 14px; padding: 12px 14px;
      margin-bottom: 18px; background: #1a1a1e;
    }
    .reauth-acct .account-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: #2c2c31; color: #f2f1ec;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; flex: none;
    }
    .reauth-acct .account-meta { display: flex; flex-direction: column; min-width: 0; }
    .reauth-acct .account-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reauth-acct .account-email { font-size: 12px; color: #a7a7b3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-link {
      display: block; width: 100%; background: none; border: 0; cursor: pointer;
      color: #1b9aaa; font-size: 13px; font-family: inherit; margin-top: 14px; padding: 8px;
    }
    /* ---- Dev options (hidden panel, Giulia only) ---- */
    #dev-badge {
      position: fixed; top: 12px; left: 12px; z-index: 9990; display: none;
      background: #1a1a1e; border: 1px solid #55555c; color: #f2f1ec;
      border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer; font-family: inherit;
    }
    #dev-overlay {
      position: fixed; inset: 0; z-index: 9999; display: none;
      background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
      padding: 20px;
    }
    #dev-overlay.open { display: flex; }
    .dev-modal {
      background: #141416; border: 1px solid #2c2c31; border-radius: 20px;
      padding: 28px; max-width: 460px; width: 100%; max-height: 88vh; overflow-y: auto;
      color: #f2f1ec;
    }
    .dev-modal h2 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    .dev-hint { font-size: 12px; color: #a7a7b3; line-height: 1.6; margin-bottom: 20px; }
    .dev-card {
      border: 1px solid #2c2c31; border-radius: 16px; padding: 20px; margin-bottom: 12px;
      background: #1a1a1e;
    }
    .dev-card-title { font-size: 17px; font-weight: 600; line-height: 1.45; margin-bottom: 6px; }
    .dev-card-sub { font-size: 12px; color: #a7a7b3; margin-bottom: 16px; }
    .dev-btn {
      display: block; width: 100%; padding: 13px; border-radius: 999px; font-size: 14px;
      font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 10px;
      background: transparent; border: 1px solid #55555c; color: #f2f1ec;
    }
    .dev-btn.primary { background: #1b9aaa; border-color: #1b9aaa; color: #fff; }
    .dev-btn:disabled { opacity: 0.45; cursor: default; }
    .dev-err { font-size: 12px; color: #ff8787; min-height: 16px; margin-top: 4px; }
    .dev-sec-btn {
      display: block; width: 100%; padding: 15px; border-radius: 14px; font-size: 15px;
      font-weight: 500; font-family: inherit; cursor: pointer; margin-bottom: 10px;
      background: #1a1a1e; border: 1px solid #3a3a40; color: #f2f1ec;
    }
    .dev-sec-btn .soon {
      display: block; font-size: 11px; color: #6c6c76; font-weight: 400; margin-top: 2px;
    }
    .dev-sec-body { border: 1px solid #2c2c31; border-radius: 14px; padding: 16px; margin: -2px 0 12px; background: #101012; }
    .dev-sec-body .dev-desc { font-size: 12px; color: #a7a7b3; margin-bottom: 12px; line-height: 1.5; }
    .dev-geo-opt {
      display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px;
      background: transparent; border: 1px solid #3a3a40; color: #f2f1ec; font-size: 13px;
      font-family: inherit; cursor: pointer; margin-bottom: 8px;
    }
    .dev-geo-opt.active { border-color: #1b9aaa; color: #7de3f0; }
    .dev-geo-custom { display: flex; gap: 8px; margin-top: 4px; }
    .dev-geo-custom input {
      flex: 1; background: #1a1a1e; border: 1px solid #3a3a40; border-radius: 10px;
      color: #f2f1ec; padding: 11px 14px; font-size: 13px; font-family: inherit;
      text-transform: uppercase;
    }
    .dev-kv { font-size: 12px; line-height: 1.9; color: #c9c9d4; word-break: break-all; }
    .dev-kv b { color: #f2f1ec; font-weight: 600; }
    .dev-doc-item {
      display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 1px solid #2c2c31; color: #7de3f0; font-size: 12px;
      font-family: ui-monospace, monospace; cursor: pointer; margin-bottom: 6px;
      word-break: break-all;
    }
    .dev-pre {
      background: #0c0c0e; border: 1px solid #2c2c31; border-radius: 8px; padding: 12px;
      font-size: 11px; line-height: 1.6; color: #c9c9d4; overflow-x: auto;
      font-family: ui-monospace, monospace; white-space: pre-wrap; word-break: break-all;
      max-height: 300px; overflow-y: auto; margin: 8px 0;
    }
    .dev-fn-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 4px; border-bottom: 1px solid #222228; font-size: 12px;
    }
    .dev-fn-row:last-child { border-bottom: 0; }
    .dev-fn-name { color: #f2f1ec; font-family: ui-monospace, monospace; }
    .dev-fn-type { color: #6c6c76; font-size: 11px; }
    #dev-hold-zone {
      position: fixed; top: 0; right: 0; width: 64px; height: 64px; z-index: 9000;
      background: transparent; touch-action: none;
    }
    /* ---- QGC "depressing gray" theme ----
       Applied to <body> whenever QGI mode is active. Everything goes gray:
       page, card, tabs, inputs, buttons. The QGC logo is stretched
       fullscreen behind it all (aspect ratio intentionally distorted). */
    body.qgc-theme { background: #2a2a2e; }
    body.qgc-theme::before {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./qgc-logo.jpg');
      background-repeat: no-repeat;
      background-size: 100% 100%;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    body.qgc-theme::after {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 20, 22, 0.55);
      pointer-events: none;
      z-index: 0;
    }
    body.qgc-theme .card {
      background: #3a3a3e;
      border-color: #55555c;
      padding: 24px 26px;
      /* never push a page-level scrollbar: scroll inside the card instead */
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
    }
    body.qgc-theme .logo { color: #f2f1ec; }
    body.qgc-theme .logo .adot { color: #8e8e99; }
    body.qgc-theme .tagline { color: #b9b9c2; margin-bottom: 18px; }
    body.qgc-theme .tab-row { border-bottom-color: #55555c; margin-bottom: 18px; }
    body.qgc-theme .tab { color: #8e8e99; }
    body.qgc-theme .tab:hover { color: #b9b9c2; }
    body.qgc-theme .tab.active,
    body.qgc-theme .tab.active.qgi-tab { color: #e8e8ec; border-bottom-color: #8e8e99; }
    body.qgc-theme .field label { color: #b9b9c2; }
    body.qgc-theme .field input {
      background: #2a2a2e;
      border-color: #55555c;
      color: #f2f1ec;
    }
    body.qgc-theme .field input::placeholder { color: #6d6d78; }
    body.qgc-theme .field input:focus { border-color: #8e8e99; }
    body.qgc-theme .field input:-webkit-autofill {
      -webkit-text-fill-color: #f2f1ec;
      -webkit-box-shadow: 0 0 0 1000px #2a2a2e inset;
    }
    body.qgc-theme .btn-primary,
    body.qgc-theme .btn-primary.qgi-btn { background: #63636b; color: #f2f1ec; }
    body.qgc-theme .btn-primary:hover,
    body.qgc-theme .btn-primary.qgi-btn:hover { background: #75757e; }
    body.qgc-theme .btn-primary:disabled,
    body.qgc-theme .btn-primary.qgi-btn:disabled { background: #2a2a2e; color: #6d6d78; }
    body.qgc-theme .forgot-link { color: #b9b9c2; }
    body.qgc-theme .exclusivity-note {
      color: #d8d8de;
      background: rgba(255,255,255,.05);
      border-color: #55555c;
    }
    body.qgc-theme .geo-note {
      color: #d8d8de;
      background: rgba(255,255,255,.05);
      border-color: #55555c;
    }
    body.qgc-theme .geo-note a,
    body.qgc-theme .geo-note button { color: #e8e8ec; }
    body.qgc-theme .signup-note { color: #8e8e99; }
    body.qgc-theme .travel-body { color: #a7a7b3; }
    body.qgc-theme .lang-toggle { border-color: #55555c; color: #b9b9c2; }
    body.qgc-theme .lang-toggle:hover { color: #f2f1ec; border-color: #8e8e99; }
    body.qgc-theme .lang-toggle:focus-visible { outline-color: #8e8e99; }
    body.qgc-theme .error-msg {
      background: rgba(255,255,255,.05);
      border-color: #77777f;
      color: #f2f1ec;
    }
    /* ---- Split layout: brand panel + accounts/form panel (mockup) ---- */
    .card.split-card { max-width: 780px; }
    .split { display: flex; gap: 24px; align-items: stretch; }
    .brand-panel {
      flex: 0 0 280px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 24px;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
    }
    .brand-panel .logo { font-size: 32px; }
    .brand-panel .tagline { margin-bottom: 0; }
    .brand-logo-box {
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .main-panel { flex: 1; min-width: 0; }
    .accounts-section { margin-bottom: 20px; }
    .accounts-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 12px;
    }
    .account-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 16px 10px 10px;
      margin-bottom: 10px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: border-color 0.15s;
    }
    .account-pill:last-child { margin-bottom: 0; }
    .account-pill:hover { border-color: var(--dim); }
    .account-pill:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .account-add {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 16px 10px 10px;
      margin-bottom: 0;
      background: transparent;
      border: 1px dashed var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--dim);
      text-align: left;
      transition: border-color 0.15s, color 0.15s;
    }
    .account-add:hover { border-color: var(--dim); color: var(--ink); }
    .account-add:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .account-add-icon {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      color: var(--dim);
    }
    .account-add:hover .account-add-icon { border-color: var(--dim); color: var(--ink); }
    .account-avatar {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--line);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }
    .account-avatar-logo { overflow: hidden; background: #fff; }
    .account-avatar-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qgc-only-notice {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink);
      margin: 14px 0 18px;
    }
    .account-meta { min-width: 0; display: flex; flex-direction: column; }
    .account-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-kind {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 680px) {
      .split { flex-direction: column; }
      .brand-panel { flex: none; }
      .brand-logo-box { aspect-ratio: 16 / 8; }
    }
    /* QGC gray theme for the split layout */
    body.qgc-theme .brand-panel { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .brand-logo-box { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .accounts-title { color: #b9b9c2; }
    body.qgc-theme .account-pill { background: #2a2a2e; border-color: #55555c; }
    body.qgc-theme .account-pill:hover { border-color: #8e8e99; }
    body.qgc-theme .account-pill:focus-visible { outline-color: #8e8e99; }
    body.qgc-theme .account-avatar { background: #55555c; color: #f2f1ec; }
    body.qgc-theme .account-add { border-color: #55555c; color: #b9b9c2; }
    body.qgc-theme .account-add:hover { border-color: #8e8e99; color: #f2f1ec; }
    body.qgc-theme .account-add:focus-visible { outline-color: #8e8e99; }
    body.qgc-theme .account-add-icon { border-color: #55555c; color: #b9b9c2; }
    body.qgc-theme .account-add:hover .account-add-icon { border-color: #8e8e99; color: #f2f1ec; }
    body.qgc-theme .account-name { color: #f2f1ec; }
    body.qgc-theme .account-kind { color: #b9b9c2; }
    body.qgc-theme .qgc-only-notice { color: #f2f1ec; }
    /* Company-branded signin view */

      var el = e.target && e.target.closest ? e.target.closest('#lang-toggle') : null;
      if (el) {
        e.preventDefault();
        setLang(lang === 'es' ? 'en' : 'es');
        return;
      }
    });

    // Apply the stored/device language to the static HTML immediately.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyLang);
    } else {
      applyLang();
    }
  })();
</script>

<script type="module">
  import { auth, db, centralFunctions, defaultFirebaseConfig } from './firebase-config.js';
  import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithCustomToken,
    getAuth
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import {
    doc, setDoc, getDoc, serverTimestamp, Timestamp, getFirestore,
    collection, getDocs, query, limit
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
  import { httpsCallable, getFunctions } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
  import { detectCountry, flowModeForCountry, ensureFlowClaims, routeAfterGate } from './geo.js';

  console.log('[Nivelato] Cargando backend... imports listos, inicializando');

  // Correo de bienvenida: la app lo pide explícito tras el signup para que
  // Restablecer contraseña: primero el flujo propio (remitente
  // noreply@nivelatolabs.com); si la cuenta vive en un backend propio,
  // el servidor central no la conoce y caemos al correo default de Firebase.
  async function doForgotPassword() {
    const t = window.nivT;
    const email = prompt(t('forgot_prompt'));
    if (!email || !email.trim()) return;
    try {
      await httpsCallable(centralFunctions, 'requestPasswordReset')({ email: email.trim() });
      alert(t('forgot_sent'));
    } catch (err) {
      if (err.code === 'functions/not-found') {
        try {
          await sendPasswordResetEmail(auth, email.trim());
          alert(t('forgot_sent'));
        } catch (e2) {
          alert(t('forgot_failed') + friendlyError(e2.code));
        }
      } else {
        alert(t('forgot_failed') + (err.message || t('forgot_unknown')));
      }
    }
  }

  window.__nivelatoBooted = true;
  console.log('[Nivelato] Cargando backend... Firebase listo');
  console.log('[Nivelato] Backend listo');
  // If the watchdog banner fired on a slow connection but we booted anyway,
  // remove it — the page is fully functional now.
  var bw = document.getElementById('boot-warn');
  if (bw) bw.remove();

  // ---- Geo-gated UI (spec §6) ----
  // "are you in puerto rico?" — the page needs to know. it ALWAYS needs to know.
  // The default form is static HTML above, so geo NEVER gates first paint.
  // Geo resolves in the background after paint; if the real flow differs from
  // what's rendered, the UI is swapped then. Enforcement stays server-side
  // in the flowGate callable — the client lookup is routing-only, so
  // render-first is safe. Unknown geo → external (§6.3).
  // Web login QGC mode is enabled: PR visitors get the company domain
  // selector and QGC flows per the company login redesign (Oct 2026).
  // Enforcement stays server-side in the flowGate callable.
  const WEB_LOGIN_GENERIC = false;
  function flowFromCookie() {
    if (WEB_LOGIN_GENERIC) return 'external';
    const m = document.cookie.match(/(?:^|;\s*)nl_flow=(qgi|external)/);
    return m ? m[1] : null;
  }

  // QGC device trust: once a device signs in successfully in QGC mode, it is
  // remembered in localStorage. On later visits the flag forces QGC mode
  // directly, skipping geo-detection entirely (covers iCloud Private Relay
  // and VPN cases where geo fails but the device already proved it is QGC).
  // Device-level trust: never cleared on sign-out, only on storage clear.
  const QGC_AUTHED_KEY = 'nivelato_qgc_authed';
  function qgcAuthed() {
    try { return localStorage.getItem(QGC_AUTHED_KEY) === '1'; } catch (_) { return false; }
  }
  function markQgcAuthed() {
    try { localStorage.setItem(QGC_AUTHED_KEY, '1'); } catch (_) { /* ignore */ }
  }

  // Travel grant: a QGC-trusted device outside PR can get 30 days of QGC
  // mode via an email verification link. The grant is a localStorage
  // timestamp; page load enables QGC mode when the device is trusted AND
  // (the grant is still in the future OR geo says PR). Being back in PR
  // makes the grant redundant, so it never needs explicit clearing.
  const QGC_TRAVEL_KEY = 'nivelato_qgc_travel_until';
  function qgcTravelValid() {
    try { return parseInt(localStorage.getItem(QGC_TRAVEL_KEY) || '0', 10) > Date.now(); }
    catch (_) { return false; }
  }
  function storeTravelGrant(validUntilMs) {
    try { localStorage.setItem(QGC_TRAVEL_KEY, String(validUntilMs)); } catch (_) { /* ignore */ }
  }

  // ---- "Cuentas usadas" (used-accounts picker, mockup) ----
  // the lineup of everyone who's ever typed a password here. no snitching.
  // Successful logins are remembered in localStorage (email + display name
  // + kind). Tapping a pill pre-fills the email and focuses the password
  // field; a QGC account also forces QGC mode. Most-recent-first, capped.
  const USED_ACCOUNTS_KEY = 'nivelato_used_accounts';
  const MAX_USED_ACCOUNTS = 5;
  function getUsedAccounts() {
    try {
      const raw = localStorage.getItem(USED_ACCOUNTS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (a) { return a && a.email; }) : [];
    } catch (_) { return []; }
  }
  function saveUsedAccount(email, displayName, kind) {
    try {
      const norm = String(email || '').trim().toLowerCase();
      if (!norm) return;
      const rest = getUsedAccounts().filter(function (a) {
        return String(a.email || '').toLowerCase() !== norm;
      });
      rest.unshift({ email: norm, displayName: String(displayName || '').trim(), kind: kind || 'personal', ts: Date.now() });
      localStorage.setItem(USED_ACCOUNTS_KEY, JSON.stringify(rest.slice(0, MAX_USED_ACCOUNTS)));
    } catch (_) { /* ignore */ }
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function initialsOf(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }
  function accountKindLabel(kind) {
    const t = window.nivT;
    if (kind === 'qgc') return t('account_kind_qgc');
    if (kind === 'trabajo') return t('account_kind_work');
    return t('account_kind_personal');
  }
  function accountsSectionHTML() {
    const addBtn = '<button type="button" class="account-add" data-add-account">'
      + '<span class="account-add-icon" aria-hidden="true">+</span>'
      + '<span data-i18n="add_another_account"></span></button>';
    if (QGI) {
      // QGC mode: approved-company pills under "Entrar con...". COMPANIES is
      // the approval list: only entries here are rendered. Empty = hide.
      const ids = Object.keys(COMPANIES);
      if (!ids.length) return '';
      const pills = ids.map(function (id) {
        const c = COMPANIES[id];
        return '<button type="button" class="account-pill" data-company-pill="' + escapeHtml(id) + '">'
          + '<span class="account-avatar account-avatar-logo"><img src="' + escapeHtml(c.logo) + '" alt="' + escapeHtml(c.name) + '" /></span>'
          + '<span class="account-meta">'
          + '<span class="account-name">' + escapeHtml(c.name) + '</span>'
          + '</span></button>';
      }).join('');
      return '<div class="accounts-section" id="accounts-section">'
        + '<div class="accounts-head"><div class="accounts-title" data-i18n="signin_with"></div>'
        + '<button type="button" id="lang-toggle" class="lang-toggle"></button></div>'
        + '<div id="accounts-list">' + pills + addBtn + '</div></div>';
    }
    const accounts = getUsedAccounts();
    const pills = accounts.map(function (a, i) {
      const label = a.displayName || a.email;
      return '<button type="button" class="account-pill" data-acct-index="' + i + '">'
        + '<span class="account-avatar">' + escapeHtml(initialsOf(label)) + '</span>'
        + '<span class="account-meta">'
        + '<span class="account-name">' + escapeHtml(label) + '</span>'
        + '<span class="account-kind">' + escapeHtml(accountKindLabel(a.kind)) + '</span>'
        + '</span></button>';
    }).join('');
    return '<div class="accounts-section" id="accounts-section">'
      + '<div class="accounts-head"><div class="accounts-title" data-i18n="used_accounts"></div>'
      + '<button type="button" id="lang-toggle" class="lang-toggle"></button></div>'
      + '<div id="accounts-list"' + (accounts.length ? '' : ' style="display:none"') + '>' + pills + addBtn + '</div></div>';
  }
  function onAccountPillClick(e) {
    const coPill = e.target && e.target.closest ? e.target.closest('[data-company-pill]') : null;
    if (coPill) {
      // Approved-company pill: open that company's branded signin screen.
      const id = coPill.getAttribute('data-company-pill');
      if (id && COMPANIES[id]) showCompanyUI(id);
      return;
    }
    const addBtn = e.target && e.target.closest ? e.target.closest('[data-add-account]') : null;
    if (addBtn) {
      showAddAccountUI();
      return;
    }
    const pill = e.target && e.target.closest ? e.target.closest('.account-pill') : null;
    if (!pill) return;
    const accounts = getUsedAccounts();
    const acct = accounts[parseInt(pill.getAttribute('data-acct-index'), 10)];
    if (!acct || !acct.email) return;
    // A QGC account forces QGC mode (upgrade only, never downgrade):
    // QGC mode opens directly on the domain selector.
    if (acct.kind === 'qgc' && !QGI) { enterQgiDomainSelector(); return; }
    // Password-only re-auth: the account is fixed, only the password is asked.
    reauthShown = acct;
    navigateTo('reauth');
  }

  let QGI = false;        // currently rendered flow
  let country = null;     // resolved async; null until geo settles
  let pendingShown = false;
  let authInitDone = false;
  let authBusy = false;   // a login/signup submit is in flight
  let savePromptShown = false;  // the "save login?" prompt replaced the card
  let prNoticeOn = false, geoNoticeOn = false, profileNoticeOn = false;

  const VALUE_IDS = ['login-email', 'login-pass'];
  function collectValues() {
    const v = {};
    for (const id of VALUE_IDS) {
      const el = document.getElementById(id);
      if (el) v[id] = el.value;
    }
    return v;
  }

  function formHTML(qgi) {
    const logoSrc = qgi ? './qgc-logo.jpg' : './icon-192.png';
    const logoAlt = qgi ? 'Quality Glass' : 'Nivelato';
    return `
    <div class="split">
      <div class="brand-panel">
        ${qgi
          ? `<h1 class="logo">Nivelato<span class="adot">.</span></h1>
        <div class="tagline" data-i18n="tagline_qgc_brand"></div>
        <div class="qgc-only-notice" data-i18n="qgc_only_msg"></div>`
          : `<h1 class="logo">Nivelato<span class="adot">.</span></h1>
        <div class="tagline" data-i18n="tagline"></div>`}
        <div class="brand-logo-box"><img src="${logoSrc}" alt="${logoAlt}" /></div>
      </div>
      <div class="main-panel">
        ${accountsSectionHTML() || '<div class="accounts-head"><button type="button" id="lang-toggle" class="lang-toggle"></button></div>'}
        ${qgi ? `<div class="exclusivity-note" data-i18n="exclusivity_note_html" data-i18n-html="1"></div>` : ''}

    <div id="form-login">
      <form id="login-form" autocomplete="on" onsubmit="return false">
        <div class="field">
          <label for="login-email" data-i18n="label_email"></label>
          <input type="email" id="login-email" name="email" data-i18n-ph="ph_email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-pass" data-i18n="label_password"></label>
          <input type="password" id="login-pass" name="password" data-i18n-ph="ph_password" autocomplete="current-password" />
        </div>
        <button class="btn-primary${qgi ? ' qgi-btn' : ''}" id="btn-login" type="submit" data-i18n="btn_login"></button>
      </form>
      <div style="text-align:center;margin-top:10px;"><a href="#" id="forgot-link" class="forgot-link" data-i18n="forgot"></a></div>
      <div class="error-msg" id="login-error" role="alert"></div>
    </div>
      </div>
    </div>`;
  }

  function renderForm(mode, keepState = false) {
    const prev = keepState ? collectValues() : {};
    QGI = (mode === 'qgi');
    document.body.classList.toggle('qgc-theme', QGI);
    const _tc = document.querySelector('meta[name="theme-color"]');
    if (_tc) _tc.setAttribute('content', QGI ? '#2a2a2e' : '#0b0b0e');
    document.getElementById('app-card').innerHTML = formHTML(QGI);
    for (const id of Object.keys(prev)) {
      const el = document.getElementById(id);
      if (el) el.value = prev[id];
    }
    document.getElementById('login-form').addEventListener('submit', doLogin);
    const acctList = document.getElementById('accounts-list');
    if (acctList) acctList.addEventListener('click', onAccountPillClick);
    const forgot = document.getElementById('forgot-link');
    if (forgot) forgot.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });
    window.nivApplyLang();
  }

  function showGeoNotice() {
    geoNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('geo-note')) return;
    const note = document.createElement('div');
    note.id = 'geo-note';
    note.className = 'geo-note';
    note.textContent = window.nivT('geo_note');
    card.prepend(note);
  }

  // PR company-use notice: QGC gray theme. In Puerto Rico only QGC employees
  // may use Nivelato as a company; everyone else gets the free Play Store app.
  function showPrNotice() {
    prNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('pr-note')) return;
    const t = window.nivT;
    const note = document.createElement('div');
    note.id = 'pr-note';
    note.setAttribute('role', 'alert');
    note.style.cssText = 'background:#3a3a3e;border:1px solid #55555c;border-radius:12px;padding:10px 12px;margin-bottom:14px;color:#f2f1ec;font-size:12px;line-height:1.55';
    note.innerHTML = t('pr_note_1')
      + t('pr_note_2')
      + '<a href="https://play.google.com/store/apps/details?id=com.nivelato.app" style="font-weight:700;color:#ffffff;text-decoration:underline">' + t('pr_note_link') + '</a>.';
    card.prepend(note);
  }

  // settings.html redirects here with ?missingProfile=1 when the signed-in
  // account has no users/{uid} doc — surface it instead of failing silently.
  function showMissingProfileNotice() {
    profileNoticeOn = true;
    const card = document.getElementById('app-card');
    if (!card || document.getElementById('profile-note')) return;
    const note = document.createElement('div');
    note.id = 'profile-note';
    note.className = 'geo-note';
    note.setAttribute('role', 'alert');
    note.textContent = window.nivT('profile_note');
    card.prepend(note);
  }

  // Re-render the visible notices in the new language (renderForm wipes them).
  function refreshNotices() {
    for (const id of ['pr-note', 'geo-note', 'profile-note']) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
    if (prNoticeOn) showPrNotice();
    if (geoNoticeOn) showGeoNotice();
    if (profileNoticeOn) showMissingProfileNotice();
  }

  // Called by the classic script's setLang after applyLang: re-render every
  // dynamic surface (form, notices, save-login prompt, pending screen).
  window.__nivelatoOnLangChange = function () {
    // Every branch rebuilds #app-card (wiping the notice elements), so
    // re-render the notices in the new language on ALL paths, not just the
    // main form fallthrough.
    if (savePromptShown) { showSaveLoginPrompt(); refreshNotices(); return; }
    if (travelShown) { renderTravelUI(); refreshNotices(); return; }
    if (addAccountShown) { renderAddAccountUI(); refreshNotices(); return; }
    if (cantAddShown) { renderCantAddUI(); refreshNotices(); return; }
    if (companyShown) { renderCompanyUI(); refreshNotices(); return; }
    if (companySelectShown) { renderCompanySelectUI(); refreshNotices(); return; }
    renderForm(QGI ? 'qgi' : 'external', true);
    refreshNotices();
  };

  // ---- Language preference persistence (users/{uid}.language) ----
  // The login page keeps its own i18n in localStorage; when the user is
  // signed in, the choice is also written to the DB so it follows them
  // across devices, and the DB value wins on later sign-ins.
  window.__nivelatoSaveLangDb = async function (l) {
    try {
      if (!auth.currentUser) return false;
      if (l !== 'es' && l !== 'en') return false;
      await setDoc(doc(db, 'users', auth.currentUser.uid), { language: l }, { merge: true });
      try { localStorage.setItem('nl_lang_db', '1'); } catch (_) { /* ignore */ }
      return true;
    } catch (_) { return false; }
  };

  // ---- Dev options (hidden panel, Giulia only) ----
  // if you're reading this and you're not giulia: hi. this isn't for you. :)
  // Ctrl+Alt+D: open (Google gate on first unlock per browser); if the panel
  //   is open, revert all dev settings and close.
  // Ctrl+Alt+Shift+H: hide the panel (settings kept).
  // Settings persist in localStorage (nl_dev_*). Regional flags override the
  // detected country for geo-gated UI testing.
  var DEV_GEO_KEY = 'nl_dev_geo';
  var DEV_UNLOCK_KEY = 'nl_dev_unlocked';
  function devGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
  function devSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* ignore */ } }
  function devDel(k) { try { localStorage.removeItem(k); } catch (_) { /* ignore */ } }

  function devEnsureDom() {
    if (document.getElementById('dev-overlay')) return;
    var badge = document.createElement('button');
    badge.id = 'dev-badge';
    badge.type = 'button';
    badge.textContent = '!! DEV !!';
    badge.addEventListener('click', devToggle);
    document.body.appendChild(badge);
    var ov = document.createElement('div');
    ov.id = 'dev-overlay';
    ov.innerHTML =
      '<div class="dev-modal" role="dialog" aria-label="Dev options">'
      + '<h2>Dev options</h2>'
      + '<div class="dev-hint">Press Ctrl+Alt+D to revert all changes and close or Ctrl+Alt+Shift+H to hide.<br>Settings will persist inside the browser level. Some settings may change the backend data.</div>'
      + '<div id="dev-gate">'
      + '<div class="dev-card">'
      + '<div class="dev-card-title">Sign in with Google to an account enrolled in closed-testing to continue</div>'
      + '<div class="dev-card-sub">For added security this step is required</div>'
      + '<button class="dev-btn" id="dev-google-btn" type="button">Sign in with Google</button>'
      + '<button class="dev-btn primary" id="dev-signin-btn" type="button">Sign in</button>'
      + '<div class="dev-err" id="dev-gate-err"></div>'
      + '</div>'
      + '</div>'
      + '<div id="dev-sections" style="display:none">'
      + '<button class="dev-sec-btn" id="devsec-regional-btn" type="button">Regional flags</button>'
      + '<div class="dev-sec-body" id="devsec-regional" style="display:none">'
      + '<div class="dev-desc">Override the detected country for geo-gated UI (PR banner, QGC mode). Applies on reload.</div>'
      + '<div id="dev-geo-opts"></div>'
      + '<div class="dev-geo-custom"><input id="dev-geo-custom" maxlength="2" placeholder="Custom (e.g. CA)" aria-label="Custom country code" /><button class="dev-btn" id="dev-geo-apply" type="button" style="width:auto;margin:0;padding:11px 18px;">Set</button></div>'
      + '</div>'

  async function devGoogleGate() {
    var errEl = document.getElementById('dev-gate-err');

      if (!_devApp) {
        try { _devApp = initializeApp(defaultFirebaseConfig, 'nivelato-dev-gate'); }
        catch (_) { _devApp = getApp('nivelato-dev-gate'); }
        _devAuth = getAuth(_devApp);

      var cred = await signInWithPopup(_devAuth, new GoogleAuthProvider());
      var email = (cred.user && cred.user.email ? cred.user.email : '').toLowerCase();
      if (!email) throw new Error('no-email');
      var devDb = getFirestore(_devApp);
      var snap = await getDoc(doc(devDb, 'devAllowlist', email));
      if (!snap.exists()) {
        await signOut(_devAuth).catch(function () {});
        errEl.textContent = 'This account is not enrolled in closed testing.';
        return;

      // Keep the dev-gate Google session: the Backend ping reuses it, and the
      // login page's own auth session is untouched (separate app instance).
      devSet(DEV_UNLOCK_KEY, '1');
      devShowBadge(true);
      devShowSections();

      var code = (e && e.code) || '';
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;

      errEl.textContent = 'Sign-in failed' + (code ? ' (' + code + ')' : '') + '. Try again.';

  // ---- Cross-origin SSO handoff ----
  // the login page lives here, the app lives over there,
  // and this is the diplomatic pouch between them. do not shake.
  // This page lives on login.nivelatolabs.com; the app lives on
  // app.nivelatolabs.com (and dashboard.nivelatolabs.com). Firebase Auth
  // sessions are origin-scoped, so after a successful sign-in here we mint
  // a short-lived custom token for the same uid and hand it to the app's
  // sso.html, which signs in there and lands on `next`.
  const APP_ORIGIN = 'https://app.nivelatolabs.com';
  const SSO_ORIGINS = [APP_ORIGIN, 'https://dashboard.nivelatolabs.com'];
  function sanitizeNext(n) {
    if (typeof n !== 'string' || !(n = n.trim())) return null;
    if (n.charAt(0) === '/') {
      if (n.charAt(1) === '/' || /[\s\\]/.test(n)) return null;
      return n;
    }
    try {
      const u = new URL(n);
      if (u.protocol !== 'https:') return null;
      if (SSO_ORIGINS.indexOf(u.origin) === -1) return null;
      return u.toString();
    } catch (_) { return null; }
  }
  // Returns true when the handoff navigation started, false when minting
  // the token failed (caller shows the form error; the user stays put).
  // lastSsoError carries the failure reason for the visible diagnostic.
  let lastSsoError = null;
  async function ssoHandoff(defaultNext) {
    const next = sanitizeNext(new URLSearchParams(window.location.search).get('next')) || defaultNext;
    if (window.location.origin === APP_ORIGIN) {
      window.location.href = next;
      return true;
    }
    try {
      // centralFunctions is bound to a separate Firebase app instance
      // ('nivelato-central'), so httpsCallable can never see the signed-in
      // user on the default app and never attaches the Authorization header
      // (→ 401 "Sign in first."). Call the callable endpoint directly with
      // an explicit ID token instead.
      const idToken = auth.currentUser ? await auth.currentUser.getIdToken(true) : null;
      if (!idToken) throw new Error('no-id-token');
      const resp = await fetch('https://us-central1-nivelato-app.cloudfunctions.net/mintSsoToken', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
        body: JSON.stringify({ data: {} })
      });
      const text = await resp.text();
      let body = null;
      try { body = JSON.parse(text); } catch (_) { /* non-JSON body */ }
      const token = body && body.result && body.result.customToken;
      if (!token) throw new Error('no-custom-token s' + resp.status + ' ' + text.slice(0, 160));
      window.location.href = APP_ORIGIN + '/sso.html?ctoken=' + encodeURIComponent(token)
        + '&next=' + encodeURIComponent(next);
      return true;
    } catch (e) {
      console.error('[Nivelato] SSO handoff failed:', (e && e.code) || e);
      lastSsoError = (e && (e.code || e.message)) || String(e);
      return false;
    }
  }
  function ssoFailed(errEl) {
    if (!errEl) {
      // The main form's error element may not exist in company/travel views.
      // Fall back to any visible error container.
      errEl = document.querySelector('.error-msg');
    }
    if (!errEl) return;
    // TEMP-DIAG: surface the failure reason visibly until the SSO 401 saga is resolved.
    const diag = lastSsoError ? ' [dbg:' + lastSsoError + ']' : '';
    errEl.textContent = window.nivT('sso_failed') + diag;
    errEl.classList.add('visible');
  }

  async function postAuthRedirect() {
    // flowGate → claims → verdict routing, then SSO handoff to the app.
    const gate = await ensureFlowClaims();
    if (gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
    const userDoc = await getDoc(doc(db, 'users', auth.currentUser.uid));
    const role = userDoc.data()?.role;
    // Adopt the DB-saved language (it wins over localStorage once it exists).
    const dbLang = userDoc.data()?.language;
    if ((dbLang === 'es' || dbLang === 'en') && window.__nivelatoAdoptDbLang) {
      try { window.__nivelatoAdoptDbLang(dbLang); } catch (_) { /* ignore */ }
    }
    const dest = (role === 'owner' || role === 'cotizador') ? '/dashboard.html' : '/index.html';
    if (await ssoHandoff(dest)) return;
    // Token mint failed (e.g. functions not deployed yet): stay on the form.
    ssoFailed(document.getElementById('login-error'));
    const btn = document.getElementById('btn-login');
    if (btn) { btn.disabled = false; btn.textContent = window.nivT('btn_login'); }
    authBusy = false;
  }

  async function doLogin(e) {
    e.preventDefault();
    authBusy = true;
    const t = window.nivT;
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = t('btn_login_busy');
    errEl.classList.remove('visible');
    try {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
      // QGC device trust: this device proved it is QGC. Remember it so
      // later visits skip geo-detection and go straight to QGC mode.
      if (QGI) markQgcAuthed();
      // Remember this account for the "Cuentas usadas" picker.
      try {
        const _dn = (auth.currentUser && auth.currentUser.displayName) || '';
        saveUsedAccount(email, _dn, QGI ? 'qgc' : 'personal');
      } catch (_) { /* ignore */ }
      showSaveLoginPrompt();
    } catch(err) {
      errEl.textContent = friendlyError(err.code);
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = t('btn_login');
      authBusy = false;
    }
  }

  function friendlyError(code) {
    const t = window.nivT;
    const map = {
      'auth/invalid-email':          t('err_invalid_email'),
      'auth/user-not-found':         t('err_user_not_found'),
      'auth/wrong-password':         t('err_wrong_password'),
      'auth/invalid-credential':     t('err_invalid_credential'),
      'auth/missing-password':       t('err_missing_password'),
      'auth/missing-email':          t('err_missing_email'),
      'auth/email-already-in-use':   t('err_email_in_use'),
      'auth/weak-password':          t('err_weak_password'),
      'auth/too-many-requests':      t('err_too_many'),
      'missing-name':                t('err_missing_name'),
      'missing-orgname':             t('err_missing_orgname'),
      'missing-code':                t('err_missing_code'),
      'invalid-code':                t('err_invalid_code'),
    };

  // ---- Company proximity (nearest-first selector) ----
  // User coords come from the same IP-geo provider the page already trusts
  // (ipapi.co/json); fetched lazily once, only when the selector opens.
  // No coords = approval-list (config) order.
  let userCoords = null;
  let userCoordsFetched = false;
  function ensureUserCoords() {
    if (userCoordsFetched || userCoords) return;
    userCoordsFetched = true;
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && isFinite(+j.latitude) && isFinite(+j.longitude)) {
          userCoords = { lat: +j.latitude, lng: +j.longitude };
          if (companySelectShown) renderCompanySelectUI(); // re-sort nearest-first
        }
      })
      .catch(function () { /* keep config order */ });
  }
  function haversineKm(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
      + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180)
      * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function sortedCompanies() {
    const list = Object.keys(COMPANIES).map(function (id) {
      const c = {};
      for (const k in COMPANIES[id]) c[k] = COMPANIES[id][k];
      c.id = id;
      return c;
    });
    if (!userCoords) return list;
    list.sort(function (x, y) {
      const xl = x.location, yl = y.location;
      if (xl && yl) return haversineKm(userCoords, xl) - haversineKm(userCoords, yl);
      if (xl) return -1;
      if (yl) return 1;
      return 0;
    });
    return list;
  }

  // ---- Webhook-driven custom company signin ----
  //
  // ARCHITECTURE (Giulia's rule): the Nivelato account ALWAYS stands as the
  // identity, even with custom company steps. The webhook adds verification
  // steps; it does NOT replace authentication. It must return a Firebase
  // custom token for the user's Nivelato account.
  //
  // How a company integrates (hand this to the company dev):
  // 1. We provision the approved company a Firebase Admin SDK service account
  //    (or a Nivelato backend endpoint that mints on their behalf). With it
  //    they mint Firebase custom tokens for their users' Nivelato accounts:
  //    admin.auth().createCustomToken(nivelatoUid).
  // 2. They implement two HTTPS endpoints (one URL may handle both):
  //
  //    SPEC (handshake): POST { company: "<id>", lang: "es"|"en", mode: "spec" }
  //    returns, e.g.:
  //    {
  //      "steps": [
  //        { "id": "email", "type": "email", "label": "Email" },
  //        { "id": "password", "type": "password", "label": "Password" },
  //        { "id": "employee_id", "type": "text", "label": "Employee ID",
  //          "placeholder": "QGC-1234", "required": true }
  //      ],
  //      "baseAuth": "nivelato",
  //      "submit": { "url": "https://company.com/api/verify", "method": "POST" },
  //      "notice": "Optional extra notice text for this signin."
  //    }
  //    Supported step types: "email", "password", "text", "tel". Unknown
  //    types are ignored with a console warning. All labels, placeholders
  //    and notices come from the webhook; we do not localize custom fields.
  //    "baseAuth": "nivelato" (optional) means: run our standard Firebase
  //    email/password FIRST, then render these steps (e.g. a 2FA code on top
  //    of email/password). Omit it when the company verifies fully on their
  //    side (SAML/IdP handshake, employee-ID lookup, ...).
  //
  //    SUBMIT: POST { company, lang, uid, fields: { stepId: value } }
  //      - uid is the Firebase uid when baseAuth ran first, else null.
  //    returns { "ok": true, "customToken": "<firebase-custom-token>" }
  //    or      { "ok": false, "error": "human-readable message" }.
  //
  // 3. The login page calls signInWithCustomToken(customToken). The resulting
  //    Firebase user IS the Nivelato account: same users/{uid} doc, same
  //    isQGC checks, same everything downstream. The webhook NEVER creates a
  //    session by itself: no token, no signin.
  //
  // Failure semantics: the spec fetch times out after 8s, fails, or returns
  // an invalid spec -> we fall back to the standard email/password form (a
  // down webhook never hard-blocks signin). A failed submit shows the error
  // inline; if baseAuth already signed the user in, we sign them back out so
  // a failed extra step cannot leave a half-verified session behind.
  var companySpecCache = {}; // companyId -> validated spec, or null when the fetch failed
  var COMPANY_SPEC_TIMEOUT_MS = 8000;
  var COMPANY_STEP_TYPES = { email: 'email', password: 'password', text: 'text', tel: 'tel' };

  function fetchCompanySigninSpec(companyId) {
    const company = COMPANIES[companyId];
    if (!company || !company.signinWebhook) return Promise.resolve(null);
    const lang = (window.nivGetLang && window.nivGetLang()) || 'es';
    let timer = null;
    let ctrl = null;
    try { ctrl = new AbortController(); } catch (_) { ctrl = null; }
    const fetchOpts = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: companyId, lang: lang, mode: 'spec' })
    };
    if (ctrl) {
      fetchOpts.signal = ctrl.signal;
      timer = setTimeout(function () { try { ctrl.abort(); } catch (_) {} }, COMPANY_SPEC_TIMEOUT_MS);
    }
    const done = function () { if (timer) clearTimeout(timer); };
    return fetch(company.signinWebhook, fetchOpts).then(function (r) {
      done();
      if (!r.ok) return null;
      return r.json().catch(function () { return null; });
    }).then(function (spec) {
      return isValidCompanySpec(spec) ? spec : null;
    }).catch(function () { done(); return null; });
  }

  function isValidCompanySpec(spec) {
    if (!spec || typeof spec !== 'object' || Array.isArray(spec)) return false;
    if (!Array.isArray(spec.steps)) return false;
    if (!spec.submit || typeof spec.submit !== 'object' || typeof spec.submit.url !== 'string' || !spec.submit.url) return false;
    const kept = [];
    for (let i = 0; i < spec.steps.length; i++) {
      const s = spec.steps[i];
      if (!s || typeof s !== 'object' || typeof s.id !== 'string' || !s.id) continue;
      if (!COMPANY_STEP_TYPES[s.type]) { try { console.warn('[nivelato] unknown company step type ignored:', s.type); } catch (_) {} continue; }
      kept.push(s);
    }
    if (!kept.length) return false;
    spec.steps = kept;
    return true;
  }

  // Outside-PR detection for the company travel notice. Uses the same geo
  // signal that drives QGC mode: PR timezone counts as inside PR; otherwise
  // the resolved country (Cloudflare-injected or background lookup) decides.
  // Returns true when resolved as outside PR, false when inside, null while
  // geo is still unresolved (the notice stays hidden until then).
  function outsidePRState() {
    if (_tzIsPR) return false;
    const cc = (country != null) ? country : _injectedCc;
    if (cc == null) return null;
    return cc !== 'PR';
  }

    el.style.display = show ? '' : 'none';
  }

  // Decides which form goes in the area: webhook spec (cached or fetched),
  // falling back to the standard email/password form when there is no
  // webhook or the spec fetch failed. Never throws; never blocks signin.
  function renderCompanyFormArea() {
    const area = document.getElementById('company-form-area');
    const company = companyShown && COMPANIES[companyShown];
    if (!area || !company) return;
    const id = companyShown;
    if (company.signinWebhook && companySpecCache[id] === undefined) {
      area.innerHTML = '<div class="niv-spinner" role="status" aria-label="loading"></div>';
      fetchCompanySigninSpec(id).then(function (spec) {
        companySpecCache[id] = spec; // null on failure -> standard form fallback
        if (companyShown === id && document.getElementById('company-form-area')) renderCompanyFormArea();
      });
      return;
    }
    const spec = (company.signinWebhook && companySpecCache[id]) || null;
    if (spec && spec.baseAuth === 'nivelato') {
      // Extra steps on top of email/password: standard form first; a
      // successful password signin flows into the webhook's extra steps.
      renderStandardCompanyForm(area, company, spec);
    } else if (spec) {
      renderCustomCompanyForm(area, company, spec, null);
    } else {
      renderStandardCompanyForm(area, company, null);
    }

  // Webhook-defined steps, rendered in order. All labels come from the spec
  // (never localized here); every string is escaped, never raw innerHTML.
  function renderCustomCompanyForm(area, company, spec, baseUser) {
    const qgi = QGI;
    const signinLabel = companyText(company, 'signinButton');
    let html = '';
    if (spec.notice) html += '<div class="company-inquiry">' + escapeHtml(String(spec.notice)) + '</div>';
    html += '<form id="company-form" autocomplete="on" onsubmit="return false">';
    spec.steps.forEach(function (s) {

      const inputType = COMPANY_STEP_TYPES[s.type] || 'text';
      html += '<div class="field">'
        + '<label for="' + escapeHtml(fid) + '">' + escapeHtml(String(s.label || s.id)) + '</label>'
        + '<input type="' + inputType + '" id="' + escapeHtml(fid) + '"'
        + ' placeholder="' + escapeHtml(String(s.placeholder || '')) + '"'
        + (s.required ? ' required aria-required="true"' : '')
        + ' data-step-id="' + escapeHtml(String(s.id)) + '" />'
        + '</div>';
    });
    html += '<button class="btn-primary' + (qgi ? ' qgi-btn' : '') + '" id="btn-company" type="submit">' + escapeHtml(signinLabel) + '</button>'
      + '<div class="error-msg" id="company-error" role="alert"></div>'
      + '</form>';
    area.innerHTML = html;
    document.getElementById('company-form').addEventListener('submit', function (e) { doCompanyCustomSubmit(e, spec, baseUser); });
    const first = area.querySelector('input');
    if (first) first.focus();
  }

  // Outside-PR company signin: the Nivelato account is established, then the
  // user requests the travel link instead of going straight to the dashboard.
  // The 30-day window in the notice is the travel grant duration: the emailed
  // link redeems into a 30-day grant (see storeTravelGrant / qgcTravelValid).
  async function routeCompanyTravelFlow(user) {
    try {
      const email = (user && user.email) || '';
      const _dn = (user && user.displayName) || '';
      saveUsedAccount(email, _dn, QGI ? 'qgc' : 'personal');
    } catch (_) { /* ignore */ }
    authBusy = false;
    companyShown = null;
    showTravelUI();
  }

  // True when a company signin should detour through the travel link flow:
  // geo resolved outside PR, the company didn't opt out, and the device
  // doesn't already hold a valid travel grant.
  function companyNeedsTravel(company) {
    return !!company && company.travelNotice !== false
      && outsidePRState() === true && !qgcTravelValid();
  }

  // Company signin submit: email/password, then the shared QGC post-signin path
  // (isQGC check, cant-add error for non-QGC in QGC mode, save-login prompt).
  // With pendingSpec (baseAuth 'nivelato'), success flows into the webhook's
  // extra steps instead of finishing here.
  async function doCompanySubmit(e, pendingSpec) {
    if (e) e.preventDefault();
    if (authBusy) return;
    authBusy = true;
    const company = companyShown && COMPANIES[companyShown];
    const btnLabel = company ? companyText(company, 'signinButton') : window.nivT('btn_login');
    const btn = document.getElementById('btn-company');
    const errEl = document.getElementById('company-error');
    if (errEl) errEl.classList.remove('visible');
    if (btn) { btn.disabled = true; }
    try {
      const email = (document.getElementById('company-email').value || '').trim();
      const pass = (document.getElementById('company-pass').value || '') || '';
      if (!email || email.indexOf('@') < 0) { throw { code: 'auth/missing-email' }; }
      if (!pass) { throw { code: 'auth/missing-password' }; }
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      if (pendingSpec) {
        // baseAuth mode: Nivelato identity established; now the webhook's extra steps.
        authBusy = false;
        const area = document.getElementById('company-form-area');
        if (area && company) renderCustomCompanyForm(area, company, pendingSpec, cred.user);
        return;
      }
      if (companyNeedsTravel(company)) {
        await routeCompanyTravelFlow(cred.user);
        return;
      }
      companyShown = null;
      await finishAddAccountSignIn(cred.user);
    } catch (err) {
      companyError(friendlyError(err && err.code));
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
      authBusy = false;
    }
  }

  // Webhook custom-step submit: POST the collected fields; the webhook must
  // answer with a Firebase custom token for the user's Nivelato account.
  async function doCompanyCustomSubmit(e, spec, baseUser) {
    if (e) e.preventDefault();
    if (authBusy) return;
    authBusy = true;
    const t = window.nivT;
    const companyId = companyShown;
    const company = companyId && COMPANIES[companyId];
    const btnLabel = company ? companyText(company, 'signinButton') : t('btn_login');
    const btn = document.getElementById('btn-company');
    const errEl = document.getElementById('company-error');
    if (errEl) errEl.classList.remove('visible');
    if (btn) { btn.disabled = true; }
    const fail = async function (msg) {
      // A failed extra step must not leave a half-verified session behind.
      try { await signOut(auth); } catch (_) { /* ignore */ }
      companyError(msg);
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
      authBusy = false;
    };
    try {
      if (!company || !spec || !spec.submit || !spec.submit.url) throw new Error('bad-spec');
      const fields = {};
      for (let i = 0; i < spec.steps.length; i++) {
        const s = spec.steps[i];
        const el = document.querySelector('[data-step-id="' + String(s.id).replace(/"/g, '') + '"]');
        const val = ((el && el.value) || '').trim();
        if (s.required && !val) { await fail(t('field_required')); return; }
        fields[s.id] = val;
      }
      const uid = (baseUser && baseUser.uid) || (auth.currentUser && auth.currentUser.uid) || null;
      const lang = (window.nivGetLang && window.nivGetLang()) || 'es';
      const r = await fetch(spec.submit.url, {
        method: (spec.submit.method || 'POST').toUpperCase(),
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: companyId, lang: lang, uid: uid, fields: fields })
      });
      if (!r.ok) throw new Error('submit-failed');
      const res = await r.json().catch(function () { return null; });
      if (!res || res.ok !== true || typeof res.customToken !== 'string' || !res.customToken) {
        await fail((res && res.error) ? String(res.error) : friendlyError('auth/webhook-verify-failed'));
        return;
      }
      const cred = await signInWithCustomToken(auth, res.customToken);
      if (companyNeedsTravel(company)) {
        await routeCompanyTravelFlow(cred.user);
        return;
      }
      companyShown = null;
      await finishAddAccountSignIn(cred.user);
    } catch (err) {
      await fail(friendlyError(err && err.code));
    }
  }

  function companyError(msg) {
    const errEl = document.getElementById('company-error');
    if (errEl) { errEl.textContent = msg; errEl.classList.add('visible'); }
  }

  async function doSendTravelLink(e) {
    if (e) e.preventDefault();
    const t = window.nivT;
    const btn = document.getElementById('btn-travel-send');
    const errEl = document.getElementById('travel-error');
    const email = ((document.getElementById('travel-email') || {}).value || '').trim();
    if (errEl) errEl.classList.remove('visible');
    if (!email || email.indexOf('@') < 0 || email.indexOf('.') < 0) {
      if (errEl) { errEl.textContent = t('travel_err_email'); errEl.classList.add('visible'); }
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = t('travel_sending'); }
    try {
      await sendTravelVerificationEmail(email);
      travelSent = true;
      renderTravelUI();
    } catch (err) {
      const code = err && err.code;
      if (errEl) {
        errEl.textContent = code === 'not-implemented' ? t('travel_err_notimpl') : t('travel_err_send');
        errEl.classList.add('visible');
      }
      if (btn) { btn.disabled = false; btn.textContent = t('travel_send'); }
    }
  }

  // ---- Init: hydrate the static form. NO network is awaited here. ----
  // the page paints before it thinks. like all of us.
  // Use synchronously-available signals (Cloudflare-injected country,
  // device timezone) for the initial mode so PR users don't see a
  // generic→QGC flash when the background geo resolves.
  var _tzIsPR = false;
  try {
    var _tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
    // GMT-4 covers PR (America/Puerto_Rico), Manaus, and other AST zones.
    // getTimezoneOffset returns minutes west of GMT, so GMT-4 = 240.
    _tzIsPR = (_tzName === 'America/Puerto_Rico') || (new Date().getTimezoneOffset() === 240);
  } catch (_) {}
  // DEV override (Regional flags): force a country for testing geo-gated UI.
  // Set via the hidden dev options panel (Ctrl+Alt+D); stored in localStorage.
  // the page thinks it's wherever giulia says it is. the page is wrong. lovingly.
  var _devGeo = null;
  try { _devGeo = localStorage.getItem('nl_dev_geo') || null; } catch (_) { /* ignore */ }
  if (_devGeo && !/^[A-Za-z]{2}$/.test(_devGeo)) _devGeo = null;
  if (_devGeo) _devGeo = _devGeo.toUpperCase();
  var _injectedCc = _devGeo || (typeof window.NIVELATO_COUNTRY === 'string' && window.NIVELATO_COUNTRY) || null;
  var _initialCc = _injectedCc || (_tzIsPR ? 'PR' : null);
  // Travel verification link (?travel_verify=<token>): redeemed below.
  var _travelToken = null;
  try { _travelToken = new URLSearchParams(location.search).get('travel_verify'); } catch (_) {}
  // Company deep link (/company/XXXXXX): open that company's signin screen
  // directly. The worker serves login.html for /company/* paths.
  var _deepLinkCompany = null;
  try {
    var _m = location.pathname.match(/^\/company\/([A-Za-z0-9_-]+)\/?$/);
    if (_m) _deepLinkCompany = _m[1].toLowerCase();
  } catch (_) {}
  // QGC device trust is checked FIRST, before any geo signal.
  // - trusted + valid travel grant: straight to QGC mode, no geo at all.
  // - trusted + sync signals say PR: QGC mode (background geo refines).
  // - trusted + Cloudflare definitively says not-PR: travel verification UI.
  // - trusted + geo unknown from sync signals: trust the device (QGC mode),
  //   background geo refines (covers iCloud Private Relay / VPN).
  // - not trusted: normal geo-gated flow.
  var _trusted = qgcAuthed();
  var _travelValid = qgcTravelValid();
  var _syncPR = (_injectedCc === 'PR') || _tzIsPR;
  var _syncNotPR = !!_injectedCc && _injectedCc !== 'PR';
  var _initialMode;
  if (_trusted && _travelValid) _initialMode = 'qgi';
  else if (_trusted && _syncPR) _initialMode = 'qgi';
  else if (_trusted && _syncNotPR) _initialMode = 'travel';
  else if (_trusted) _initialMode = 'qgi';
  else _initialMode = flowFromCookie() || flowModeForCountry(_initialCc);
  // Company deep link takes precedence: open the company's signin screen
  // directly, regardless of geo mode. The dev panel (UI section) can force a
  // company the same way via localStorage (nl_dev_company).
  var _devCompany = null;
  try { _devCompany = localStorage.getItem('nl_dev_company') || null; } catch (_) { /* ignore */ }
  var _forceCompany = (_devCompany && COMPANIES[_devCompany]) ? _devCompany
    : (_deepLinkCompany && COMPANIES[_deepLinkCompany] ? _deepLinkCompany : null);
  if (_forceCompany) {
    showCompanyUI(_forceCompany);
  } else if (_initialMode === 'travel') {
    showTravelUI();
    // Seed the history entry for the login view stack: the first back press
    // from a sub-view returns to main instead of leaving the page.
    try { history.replaceState({ nivelatoView: 'main' }, ''); } catch (_) { /* ignore */ }
    currentView = 'main';
  } else if (_initialMode === 'qgi') {
    // QGC mode opens directly on the domain selector (it is the root view).
    enterQgiDomainSelector();
  } else {
    renderForm(_initialMode, true);
    // Seed the history entry for the login view stack: the first back press
    // from a sub-view returns to main instead of leaving the page.
    try { history.replaceState({ nivelatoView: 'main' }, ''); } catch (_) { /* ignore */ }
    currentView = 'main';
  }
  if (_initialCc === 'PR') showPrNotice();
  if (new URLSearchParams(location.search).get('missingProfile') === '1') showMissingProfileNotice();

  // Redeem a travel verification link in the background. On success the
  // device gets device trust + a 30-day travel grant and lands in QGC mode
  // (the token is stripped from the URL). On failure, an invalid/expired
  // notice is surfaced if the travel screen is showing.
  if (_travelToken) {
    redeemTravelVerification(_travelToken).then(function (res) {
      if (res && res.validUntil) {
        markQgcAuthed();
        storeTravelGrant(res.validUntil);
        travelShown = false;
        travelSent = false;
        try {
          var _u = new URL(location.href);
          _u.searchParams.delete('travel_verify');
          history.replaceState({ nivelatoView: 'company-select' }, '', _u.toString());
        } catch (_) {}
        renderForm('qgi', true);
        renderView('company-select');
        currentView = 'company-select';
        if (_initialCc === 'PR') showPrNotice();
      }
    }).catch(function () {
      if (travelShown) { travelLinkError = true; renderTravelUI(); }
    });
  }

  // (a) Already signed in? Send them to the app. Ignores the initial
  // null-fire while the persisted session restores, and stays out of the
  // way of in-flight login/signup submits and the pending-approval screen.
  onAuthStateChanged(auth, (user) => {
    if (authInitDone || authBusy || pendingShown) return;
    if (user) { authInitDone = true; postAuthRedirect(); }
  });

  // ---- Background geo (post-paint): swap the flow UI only if it differs.
  // the page guessed where you are. now it checks for real. don't move.
  // Hard 7s cap so a hung lookup can never stall the page; on failure the
  // already-visible form stays, with a non-blocking notice. ----
  // Country: prefer the Cloudflare-injected header (reliable, no API call);
  // fall back to the IP lookup for direct GitHub Pages visits.
  // (Timezone fallback already computed above as _tzIsPR.)
  // Trusted devices with a valid travel grant skip geo entirely. Trusted
  // devices without one still run geo: a definitive not-PR surfaces the
  // travel verification UI, and a return to PR restores QGC mode (which
  // supersedes any travel state).
  if (!(_trusted && _travelValid)) {
  var injectedCc = _injectedCc;
  var tzIsPR = _tzIsPR;
  var trustedDev = _trusted;
  var countryPromise = injectedCc
    ? Promise.resolve(injectedCc)
    : Promise.race([
        detectCountry(),
        new Promise((resolve) => setTimeout(() => resolve(null), 7000)),
      ]);
  countryPromise.then((cc) => {
    country = cc;
    // The company signin screen stays up when geo settles; just flip its
    // outside-PR travel notice without wiping the form.
    if (companyShown) updateCompanyTravelNotice();
    var effectivePR = (cc === 'PR') || tzIsPR;
    if (trustedDev) {
      // A travel grant acquired after boot (e.g. via link redeem) supersedes geo.
      if (qgcTravelValid()) return;
      // Transient add-account / cant-add / company / company-select views: never interrupt them.
      if (addAccountShown || cantAddShown || companyShown || companySelectShown || reauthShown) return;
      if (effectivePR) {
        travelShown = false;
        travelSent = false;
        if (!QGI) enterQgiDomainSelector();
        showPrNotice();
      } else if (cc && cc !== 'PR') {
        if (!travelShown && !pendingShown && !savePromptShown && !authBusy) showTravelUI();
      }
      // cc null: geo inconclusive, device trust stands as rendered.
      return;
    }
    var effectiveCountry = effectivePR ? 'PR' : cc;
    const mode = flowFromCookie() || flowModeForCountry(effectiveCountry);
    // Don't yank the user out of the transient add-account / cant-add / company / company-select
    // views when background geo settles.
    if (addAccountShown || cantAddShown || companyShown || companySelectShown || reauthShown) return;
    if (mode !== (QGI ? 'qgi' : 'external')) {
      if (mode === 'qgi') enterQgiDomainSelector();
      else renderForm(mode, true);
    }
    if (cc === null && !flowFromCookie() && !tzIsPR) showGeoNotice();
    if (effectivePR) showPrNotice();
  });
  }
</script>
</body>
</html>
