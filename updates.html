<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0b0e" />
<title>Nivelato - Updates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0b0e;
    --card: #16161c;
    --line: #232329;
    --line-soft: #1c1c21;
    --text: #f2f1ec;
    --muted: #a7a7b3;
    --faint: #6d6d75;
    --amber: #f5a524;
    --amber-dark: #cf8a1a;
    --amber-dim: rgba(245, 165, 36, 0.12);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .shell { display: flex; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 300px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #0d0d10;
  }
  .org-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 6px 18px;
  }
  .org-avatar {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    letter-spacing: 1px;
  }
  .org-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  .org-version-link {
    background: none;
    border: none;
    padding: 0;
    margin-top: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--amber);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .org-version-link:hover { color: #ffb84d; }
  .nav-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    text-align: center;
    text-decoration: none;
  }
  .nav-btn.soon { color: var(--muted); cursor: default; }
  .nav-btn .soon-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--faint);
    border: 1px solid var(--line-soft);
    border-radius: 9999px;
    padding: 1px 7px;
  }
  .nav-btn.active {
    border-color: var(--line);
    background: var(--card);
    cursor: default;
  }
  .nav-btn.active .nav-label { font-weight: 700; }
  .nav-btn.active .nav-sub {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .nav-btn.active .dot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
  }
  .nav-btn.active .dot.on { background: var(--amber); border-color: var(--amber); }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 32px;
    gap: 24px;
  }
  .update-card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .mini-logo {
    width: 76px;
    height: 96px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .card-title .adot { color: var(--amber); }
  .dl-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .dl-label { font-size: 14px; color: var(--text); white-space: nowrap; }
  .progress-track {
    flex: 1;
    height: 14px;
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    background: var(--bg);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--amber);
    border-radius: 9999px;
    transition: width 0.5s ease;
  }
  .progress-step { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 20px; }
  .notes-box {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .notes-box p { margin: 0 0 12px; }
  .notes-box p:last-child { margin-bottom: 0; }
  .notes-box .change-item { margin-bottom: 8px; }
  .notes-box .change-ver {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--amber);
    border: 1px solid var(--line);
    border-radius: 9999px;
    padding: 1px 10px;
    margin-right: 8px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    min-height: 50px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary {
    background: var(--amber);
    color: #1a1206;
    border: 1.5px solid var(--amber);
  }
  .btn-primary:hover:not(:disabled) { background: #ffb84d; border-color: #ffb84d; }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover:not(:disabled) { border-color: var(--amber); background: var(--amber-dim); }
  .caption {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 0;
    line-height: 1.5;
  }
  .note-owner {
    text-align: center;
    font-size: 13px;
    color: var(--faint);
    margin: 14px 0 0;
  }

  /* other options */
  .other-options {
    width: 100%;
    max-width: 720px;
  }
  .other-options h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0 0 12px 4px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    padding: 12px 24px 12px 12px;
    margin-bottom: 10px;
  }
  .opt-row:last-child { margin-bottom: 0; }
  .opt-img {
    width: 52px;
    height: 52px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    background: var(--bg);
  }
  .opt-label { font-size: 15px; font-weight: 600; }
  .opt-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .opt-row.future { opacity: 0.6; }

  /* tonight */
  .tonight-text {
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin: 6px 0 24px;
  }
  .online-list { list-style: none; padding: 0; margin: 10px 0 0; }
  .online-list li { font-size: 14px; color: var(--muted); padding: 4px 0; }
  .online-list li .you { color: var(--text); }

  /* up to date */
  .uptodate { text-align: center; padding: 48px 20px; }
  .uptodate .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1.5px solid var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--amber);
  }
  .uptodate h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .uptodate p { font-size: 14px; color: var(--muted); margin: 0; }

  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 40px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
  }

  /* version detail popover */
  .ver-pop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .ver-pop-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    max-width: 420px;
    width: 100%;
  }
  .ver-pop-card h3 { margin: 0 0 12px; font-size: 18px; }
  .ver-pop-card p { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 0 0 20px; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 20px 16px; }
    .update-card { padding: 24px 20px; }
    .card-top { gap: 14px; margin-bottom: 16px; }
    .mini-logo { width: 60px; height: 78px; font-size: 22px; }
  }
</style>
<link rel="stylesheet" href="./qgc-theme.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Company navigation">
    <div class="org-head">
      <div class="org-avatar" id="org-avatar">--</div>
      <div>
        <div class="org-name" id="org-name">Loading...</div>
        <button class="org-version-link" id="org-version" type="button">Nivelato</button>
      </div>
    </div>
    <a class="nav-btn" href="/company/users"><span class="nav-label">Users</span></a>
    <button class="nav-btn soon" disabled type="button">Projects<span class="soon-badge">soon</span></button>
    <button class="nav-btn soon" disabled type="button">Billing<span class="soon-badge">soon</span></button>
    <button class="nav-btn active" type="button" aria-current="page">
      <span class="nav-label">Updates</span>
      <span class="nav-sub" id="updates-sub">Checking...</span>
      <span class="dot" id="updates-dot"></span>
    </button>
  </aside>
  <main class="main">
    <div class="update-card" id="update-card">
      <div class="state-loading" id="loading-state">Loading update status...</div>
    </div>
    <div class="other-options" id="other-options" style="display:none">
      <h3>Other options</h3>
      <div id="other-options-list"></div>
    </div>
  </main>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, updateDoc, onSnapshot, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
import { startPresence, getOnlineUsers } from './presence.js';

// ---------------------------------------------------------------------------
// UI version heuristics (mirrors webapp/ui-version.js).
// The tag (e.g. v1.1.1-darkmode-qgc) is INTERNAL ONLY and never rendered.
// Only user-friendly labels like "Nivelato 1.1" reach the DOM.
// ---------------------------------------------------------------------------
function parseUiTag(tag) {
  const m = String(tag || '').trim().match(/^v([^-]+)-([^-]+)-(.+)$/);
  if (!m) return null;
  return { semver: m[1], theme: m[2], orgId: m[3] };
}
function compareSemver(a, b) {
  const pa = String(a || '').split('.'), pb = String(b || '').split('.');
  for (let i = 0; i < 3; i++) {
    const x = Number(pa[i]) || 0, y = Number(pb[i]) || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}
// Friendly label: "1.1.1" -> "Nivelato 1.1" (major.minor, no patch, no tag).
function friendlyVersion(semver) {
  const parts = String(semver || '').split('.');
  const mm = parts.length >= 2 ? parts[0] + '.' + parts[1] : String(semver || '');
  return 'Nivelato ' + mm;
}
function getUpdatesForUser(currentTag, latestInfo) {
  const latestSemver = latestInfo && latestInfo.latestSemver;
  const changelog = (latestInfo && latestInfo.changelog) || {};
  const empty = { hasUpdate: false, fromSemver: null, toSemver: latestSemver || null, changes: [] };
  if (!latestSemver) return empty;
  const parsed = parseUiTag(currentTag);
  if (!parsed) return { hasUpdate: false, fromSemver: null, toSemver: latestSemver, changes: [] };
  if (compareSemver(latestSemver, parsed.semver) <= 0) {
    empty.fromSemver = parsed.semver;
    return empty;
  }
  const versions = Object.keys(changelog)
    .filter((v) => compareSemver(v, parsed.semver) > 0 && compareSemver(v, latestSemver) <= 0)
    .sort(compareSemver)
    .reverse();
  const changes = [];
  versions.forEach((v) => {
    (Array.isArray(changelog[v]) ? changelog[v] : []).forEach((e) => {
      changes.push({ version: v, text: String(e) });
    });
  });
  return { hasUpdate: true, fromSemver: parsed.semver, toSemver: latestSemver, changes };
}

// Escape ALL user-controlled strings before innerHTML (stored XSS).
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const card = document.getElementById('update-card');
const otherBox = document.getElementById('other-options');
const otherList = document.getElementById('other-options-list');

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;
let latestInfo = null;   // config/ui_versions
let orgTagDoc = null;    // config/ui_versions/orgs/{orgId}
let updateState = null;  // getUpdatesForUser() result
let applying = false;
let unsubOrg = null;
let onlineRefreshTimer = null;

const isOwner = () => currentUserData && currentUserData.role === 'owner';

function initialsOf(name) {
  const words = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return 'QG';
  const first = words[0][0] || '';
  const second = words.length > 1 ? (words[1][0] || '') : (words[0][1] || '');
  return (first + second).toUpperCase();
}

function currentSemver() {
  const parsed = parseUiTag(orgTagDoc && orgTagDoc.tag);
  return parsed ? parsed.semver : null;
}

function pendingScheduled() {
  return !!(orgData && orgData.pendingUpdate);
}

function renderSidebar() {
  const name = orgData && orgData.name ? orgData.name : 'Company';
  document.getElementById('org-avatar').textContent = initialsOf(name);
  document.getElementById('org-name').textContent = name;
  const sem = currentSemver();
  document.getElementById('org-version').textContent = sem ? 'Nivelato v' + sem : 'Nivelato';
  const pending = (updateState && updateState.hasUpdate) || pendingScheduled();
  document.getElementById('updates-sub').textContent = pending ? 'New version available' : 'Up to date';
  document.getElementById('updates-dot').classList.toggle('on', !!pending);
}

function render() {
  renderSidebar();
  if (applying) return;
  if (pendingScheduled()) return renderScheduled();
  if (updateState && updateState.hasUpdate) return renderAvailable();
  return renderUpToDate();
}

function ownerButtons(html) {
  return isOwner()
    ? html
    : '<p class="note-owner">Only org owners can apply updates. Ask an owner to update.</p>';
}

function changeListHtml(changes) {
  if (!changes || !changes.length) {
    return '<p>This update includes improvements and fixes.</p>';
  }
  return changes.map((c) =>
    '<p class="change-item"><span class="change-ver">v' + escapeHtml(c.version) +
    '</span>' + escapeHtml(c.text) + '</p>'
  ).join('');
}

// ---- state (a): update available ----
function renderAvailable() {
  const to = updateState.toSemver;
  const title = friendlyVersion(to);
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N<span class="adot" style="color:var(--amber)">.</span></div>
      <h1 class="card-title">${escapeHtml(title)}</h1>
    </div>
    <div class="notes-box">${changeListHtml(updateState.changes)}</div>
    ${ownerButtons(`
      <button class="btn btn-primary" id="btn-update-now">Update Now</button>
      <button class="btn btn-outline" id="btn-update-tonight">Update Tonight</button>
      <p class="caption">Selecting &quot;Update Tonight&quot; will update once all users have exited the app.</p>
    `)}
  `;
  const btnNow = document.getElementById('btn-update-now');
  const btnTonight = document.getElementById('btn-update-tonight');
  if (btnNow) btnNow.addEventListener('click', onUpdateNow);
  if (btnTonight) btnTonight.addEventListener('click', onUpdateTonight);
  renderOtherOptions();
}

// ---- other options: extra versions newer than current, beyond the latest ----
function renderOtherOptions() {
  const latest = latestInfo || {};
  const changelog = latest.changelog || {};
  const sem = currentSemver();
  const extra = Object.keys(changelog)
    .filter((v) => sem && compareSemver(v, sem) > 0 && compareSemver(v, updateState.toSemver) > 0)
    .sort(compareSemver);
  if (!extra.length) {
    // Mockup shows a "Nivelato 2" future row; show it as a coming-soon placeholder
    // only when the changelog hints at a next major line.
    otherBox.style.display = 'none';
    return;
  }
  otherBox.style.display = '';
  otherList.innerHTML = extra.map((v) => `
    <div class="opt-row future">
      <div class="opt-img">N</div>
      <div>
        <div class="opt-label">${escapeHtml(friendlyVersion(v))}</div>
        <div class="opt-sub">Available after updating to ${escapeHtml(friendlyVersion(updateState.toSemver))}</div>
      </div>
    </div>
  `).join('');
}

// ---- state (b): applying / downloading ----
function renderApplying(stepLabel, pct) {
  const title = updateState ? friendlyVersion(updateState.toSemver) : 'Nivelato';
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N<span style="color:var(--amber)">.</span></div>
      <h1 class="card-title">${escapeHtml(title)}</h1>
    </div>
    <div class="dl-row">
      <span class="dl-label">Downloading (${pct}%)</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="progress-step">${escapeHtml(stepLabel || 'Starting...')}</div>
    <div class="notes-box">${changeListHtml(updateState ? updateState.changes : [])}</div>
    ${isOwner() ? '<button class="btn btn-outline" id="btn-cancel">Cancel update</button>' : ''}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
}

async function onUpdateNow() {
  if (!isOwner()) return;
  const to = updateState ? updateState.toSemver : '';
  if (!confirm('Apply update to v' + to + ' now? This may take a few minutes.')) return;
  applying = true;
  renderApplying('Downloading update package...', 5);
  try {
    const functions = getFunctions(undefined, 'us-central1');
    const applyCompanyUpdate = httpsCallable(functions, 'applyCompanyUpdate');
    const result = await applyCompanyUpdate({ targetSemver: to });
    const steps = (result && result.data && Array.isArray(result.data.steps))
      ? result.data.steps.map(String)
      : ['Applying update'];
    for (let i = 0; i < steps.length; i++) {
      if (!applying) return;
      const pct = Math.round(((i + 1) / steps.length) * 100);
      renderApplying(steps[i], pct);
      const b = document.getElementById('btn-cancel');
      if (b) b.addEventListener('click', onCancelUpdate);
      await new Promise((r) => setTimeout(r, 650));
    }
    renderApplying('Finishing up...', 100);
    await new Promise((r) => setTimeout(r, 600));
  } catch (e) {
    card.innerHTML = `<div class="state-error">The update failed: ${escapeHtml(e.message || 'unknown error')}. Please try again.</div>`;
    await new Promise((r) => setTimeout(r, 2500));
  }
  applying = false;
  await refreshVersionDocs();
  render();
}

// ---- state (c): scheduled for tonight ----
function renderScheduled() {
  const pend = orgData.pendingUpdate || {};
  const ver = pend.version || (updateState ? updateState.toSemver : '');
  const title = ver ? friendlyVersion(ver) : 'Nivelato';
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N<span style="color:var(--amber)">.</span></div>
      <h1 class="card-title">${escapeHtml(title)}</h1>
    </div>
    <div class="dl-row">
      <span class="dl-label">Update scheduled</span>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
    </div>
    <div class="tonight-text">
      <span id="tonight-line">Checking who is still online...</span>
      <ul class="online-list" id="online-list"></ul>
    </div>
    ${ownerButtons('<button class="btn btn-outline" id="btn-cancel">Cancel update</button>')}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
  refreshOnlineList();
  if (onlineRefreshTimer) clearInterval(onlineRefreshTimer);
  onlineRefreshTimer = setInterval(refreshOnlineList, 30000);
}

async function refreshOnlineList() {
  const line = document.getElementById('tonight-line');
  const list = document.getElementById('online-list');
  if (!line || !list) return;
  try {
    const users = await getOnlineUsers(orgId);
    const n = users.length;
    if (n === 0) {
      line.textContent = 'No users are online, so the update will start soon.';
      list.innerHTML = '';
      return;
    }
    line.textContent = n + (n === 1 ? ' user is' : ' users are') +
      ' still online. The update starts once everyone has exited the app:';
    list.innerHTML = users.map((u) => {
      const name = escapeHtml(u.name || 'Unknown user');
      const role = escapeHtml(u.role || '');
      const you = u.isSelf ? ' <span class="you">(you)</span>' : '';
      return `<li>- ${name}${role ? ' (' + role + ')' : ''}${you}</li>`;
    }).join('');
  } catch (e) {
    line.textContent = 'Could not load the list of online users.';
  }
}

// ---- state (d): up to date ----
function renderUpToDate() {
  const sem = currentSemver();
  card.innerHTML = `
    <div class="uptodate">
      <div class="check">&#10003;</div>
      <h2>You&apos;re on the latest version.</h2>
      <p>${sem ? escapeHtml('Nivelato v' + sem) : 'Nivelato'}</p>
    </div>
  `;
  otherBox.style.display = 'none';
}

async function onUpdateTonight() {
  if (!isOwner()) return;
  const to = updateState ? updateState.toSemver : '';
  try {
    await updateDoc(doc(db, 'orgs', orgId), {
      pendingUpdate: { version: to, scheduledBy: currentUser.uid, scheduledAt: serverTimestamp() }
    });
  } catch (e) {
    alert('Could not schedule the update: ' + (e.message || 'unknown error'));
  }
}

async function onCancelUpdate() {
  if (!isOwner()) return;
  try {
    await updateDoc(doc(db, 'orgs', orgId), { pendingUpdate: deleteField() });
  } catch (e) {
    alert('Could not cancel the update: ' + (e.message || 'unknown error'));
  }
  applying = false;
}

async function refreshVersionDocs() {
  try {
    const latestSnap = await getDoc(doc(db, 'config', 'ui_versions'));
    latestInfo = latestSnap.exists() ? latestSnap.data() : null;
    const tagSnap = await getDoc(doc(db, 'config', 'ui_versions', 'orgs', orgId));
    orgTagDoc = tagSnap.exists() ? tagSnap.data() : null;
    updateState = getUpdatesForUser(orgTagDoc && orgTagDoc.tag, latestInfo);
  } catch (e) {
    console.warn('[Nivelato] could not read ui_versions:', e.message);
  }
}

// ---- version detail popover (underlined version link) ----
document.getElementById('org-version').addEventListener('click', () => {
  const sem = currentSemver();
  const pop = document.createElement('div');
  pop.className = 'ver-pop';
  pop.innerHTML = `
    <div class="ver-pop-card">
      <h3>Version details</h3>
      <p>${sem
        ? 'This company is running <b>' + escapeHtml('Nivelato v' + sem) + '</b>.' +
          (latestInfo && latestInfo.latestSemver && compareSemver(latestInfo.latestSemver, sem) > 0
            ? ' A newer release (<b>' + escapeHtml('Nivelato v' + latestInfo.latestSemver) + '</b>) is available in Updates.'
            : ' This is the latest release.')
        : 'Version information is not available yet.'}</p>
      <button class="btn btn-outline" id="ver-pop-close">Close</button>
    </div>
  `;
  // NOTE: internal tag is intentionally never shown here.
  document.body.appendChild(pop);
  document.getElementById('ver-pop-close').addEventListener('click', () => pop.remove());
  pop.addEventListener('click', (e) => { if (e.target === pop) pop.remove(); });
});

// ---- auth + data ----
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href);
    return;
  }
  currentUser = user;

  // Backup theme pass: in case the fast path or doc-based check could not run.
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) {
    alert('We could not find your user profile. Please sign in again to repair it.');
    window.location.href = 'login.html?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  orgId = currentUserData.orgId;

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  await refreshVersionDocs();

  if (unsubOrg) unsubOrg();
  unsubOrg = onSnapshot(doc(db, 'orgs', orgId),
    (snap) => {
      orgData = snap.exists() ? snap.data() : {};
      if (!applying) render();
      else renderSidebar();
    },
    (e) => {
      card.innerHTML = `<div class="state-error">Could not load company data: ${escapeHtml(e.message || 'unknown error')}</div>`;
    });
});
</script>
