<!DOCTYPE html>
<html lang="es">
<head>
<base href="/" />
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="manifest.json" />
<title>Nivelato - Actualizaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0f;
    --card: #101013;
    --line: #2a2a2e;
    --line-soft: #1f1f23;
    --text: #f1f1f2;
    --muted: #9a9aa0;
    --faint: #6d6d74;
    --blue: #1e9df0;
    --blue-dark: #1478bd;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .shell {
    display: flex;
    min-height: 100vh;
    padding: var(--niv-inset, 30px);
    gap: var(--niv-inset, 30px);
    box-sizing: border-box;
  }
  /* ---------- sidebar: company module hosted in #chrome-sidebar ---------- */
  #chrome-sidebar { width: 300px; flex: none; height: calc(100vh - (2 * var(--niv-inset, 30px))); position: sticky; top: var(--niv-inset, 30px); }
  #chrome-sidebar .niv-shell-frame { height: 100%; }
  /* ---------- top bar: desktop only (shell rule) ---------- */
  #chrome-topbar { display: block; }
  .updates-wrap { width: 100%; max-width: 720px; }
  /* ---------- main ---------- */
  .main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 32px;
  }
  .update-card {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .mini-logo {
    width: 76px;
    height: 96px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
  }
  .card-title {
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .notes-box {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .notes-box p { margin: 0 0 12px; }
  .notes-box p:last-child { margin-bottom: 0; }
  .notes-box a { color: var(--text); text-decoration: underline; word-break: break-all; }
  .notes-more { margin-top: 4px; }
  .notes-more-btn {
    display: inline;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--text);
    text-decoration: underline;
    cursor: pointer;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    min-height: 50px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.12s, background 0.15s;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: 1.5px solid var(--blue);
  }
  .btn-primary:hover:not(:disabled) { background: #25a8f7; }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover:not(:disabled) { border-color: #3a3a40; background: #141417; }
  .caption {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 0;
    line-height: 1.5;
  }
  .note-owner {
    text-align: center;
    font-size: 13px;
    color: var(--faint);
    margin: 14px 0 0;
  }
  /* progress */
  .progress-label { font-size: 14px; color: var(--text); margin-bottom: 10px; }
  .progress-step { font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 20px; }
  .progress-track {
    height: 14px;
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    background: var(--bg);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--blue);
    border-radius: 9999px;
    transition: width 0.5s ease;
  }
  /* tonight list */
  .tonight-text {
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin: 6px 0 24px;
  }
  .online-list {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
  }
  .online-list li {
    font-size: 14px;
    color: var(--muted);
    padding: 4px 0;
  }
  .online-list li .you { color: var(--text); }
  /* up to date */
  .uptodate {
    text-align: center;
    padding: 48px 20px;
  }
  .uptodate .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--blue);
  }
  .uptodate h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .uptodate p { font-size: 14px; color: var(--muted); margin: 0; }
  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 40px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
  }
  @media (max-width: 900px) {
    /* Shell rule: the top bar does not exist on mobile. The bridge mount
       is suppressed in JS and this hides the host box as a second layer;
       mobile navigation is the sidebar module, stacked above the card. */
    #chrome-topbar { display: none !important; }
    .shell { flex-direction: column; padding: 12px; }
    #chrome-sidebar { width: 100%; height: 480px; position: static; }
    .main { padding: 20px 16px; }
    .update-card { padding: 24px 20px; border-radius: var(--radius-lg); }
    .card-top { gap: 14px; margin-bottom: 18px; }
    .mini-logo { width: 60px; height: 78px; font-size: 22px; }
  }
</style>
<link rel="stylesheet" href="./niv-dark.css" />
<link rel="stylesheet" href="./qgc-theme.css" />
</head>
<body>
<div id="chrome-topbar"></div>
<div class="shell">
  <div id="chrome-sidebar" aria-label="Navegación de la compañía"></div>
  <main class="main">
    <div class="updates-wrap">
      <a class="btn-back niv-btn-back" id="btn-back" href="/dashboard.html?view=home">&#8592; Volver</a>
      <div class="update-card" id="update-card">
        <div class="state-loading" id="loading-state">Cargando el estado de actualización...</div>
      </div>
      <div class="niv-status-line" id="update-status" role="status" aria-live="polite"></div>
    </div>
  </main>
</div>
<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, updateDoc, onSnapshot, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
import { startPresence, getOnlineUsers } from './presence.js';
import { ensureFlowClaims, routeAfterGate } from './geo.js';

// Escape ALL user-controlled strings before innerHTML interpolation (stored XSS).
// Names, roles, and update notes come from Firestore and members can set their own.
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

const card = document.getElementById('update-card');
const SECURITY_URL = 'faq.nivelatolabs.com/company/updates#about-security';

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;      // orgs/{orgId}
let latestDoc = null;    // app_updates/latest
let updateDocData = null; // app_updates/{latest version}
let applying = false;
/* Button mash guards (fix list item 6). actionInFlight covers the whole
   Update Now run (confirm, callable, progress animation); writeInFlight
   covers the Update Tonight / Cancel Firestore writes. While either is
   set, every action handler returns immediately and the visible buttons
   are disabled, so rapid presses can never start a second run, queue a
   duplicate write, or interleave two renders of the card. */
let actionInFlight = false;
let writeInFlight = false;

function setStatus(kind, text) {
  const el = document.getElementById('update-status');
  if (!el) return;
  if (!text) { el.className = 'niv-status-line'; el.textContent = ''; return; }
  el.className = 'niv-status-line ' + kind;
  el.textContent = text;
}
function setCardButtonsDisabled(disabled) {
  card.querySelectorAll('button').forEach((b) => { b.disabled = !!disabled; });
}
let unsubOrg = null;
let onlineRefreshTimer = null;

const isOwner = () => currentUserData && currentUserData.role === 'owner';

function dataVersion() {
  return (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
}

function updateAvailable() {
  if (!latestDoc || !latestDoc.version) return false;
  return dataVersion() !== String(latestDoc.version);
}

function pendingScheduled() {
  return !!(orgData && orgData.pendingUpdate);
}

/* The sidebar is the company module (modules/sidebar.html via
   NivShell.mountSidebar): it renders the org head and owns the Updates
   entry's status sub label and dot (ids updates-sub / updates-dot live
   inside the module iframe, with the same app_updates/latest vs org
   dataVersion comparison). This page no longer forks that markup. */

function render() {
  if (applying) return; // (b) owns the card while applying
  if (pendingScheduled()) return renderScheduled();
  if (updateAvailable()) return renderAvailable();
  return renderUpToDate();
}

function ownerButtons(html) {
  return isOwner() ? html : '<p class="note-owner">Only org owners can apply updates. Contact an owner to update.</p>';
}

// User-visible short description for an update descriptor: the reserved
// `description` field wins; legacy `notes` is the fallback so descriptors
// seeded before the field existed render exactly as before. The reserved
// `extendedDescription` is only revealed by the "Show more" toggle in
// renderAvailable. `internalNotes` is internal-only and is never read here.
function visibleDescription(u) {
  const d = String((u && u.description) || '').trim();
  if (d) return d;
  return String((u && u.notes) || '');
}

// ---- state (a): update available ----
function renderAvailable() {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(visibleDescription(u) || 'This update includes new features and improvements.');
  const extended = escapeHtml(String(u.extendedDescription || '').trim());
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="notes-box">
      <p>${notes}</p>
      ${extended ? `
      <div class="notes-more" id="notes-more" hidden><p>${extended}</p></div>
      <p><button type="button" class="notes-more-btn" id="btn-show-more">Show more</button></p>` : ''}
      <p>For information about the security of updates see <a href="https://${SECURITY_URL}" target="_blank" rel="noopener">${SECURITY_URL}</a>.</p>
    </div>
    ${ownerButtons(`
      <button class="btn btn-primary" id="btn-update-now">Update Now</button>
      <button class="btn btn-outline" id="btn-update-tonight">Update Tonight</button>
      <p class="caption">Selecting "Update Tonight" will update once all users have exited the app.</p>
    `)}
  `;
  const btnNow = document.getElementById('btn-update-now');
  const btnTonight = document.getElementById('btn-update-tonight');
  if (btnNow) btnNow.addEventListener('click', onUpdateNow);
  if (btnTonight) btnTonight.addEventListener('click', onUpdateTonight);
  const btnMore = document.getElementById('btn-show-more');
  const notesMore = document.getElementById('notes-more');
  if (btnMore && notesMore) {
    btnMore.addEventListener('click', () => {
      const opening = notesMore.hidden;
      notesMore.hidden = !opening;
      btnMore.textContent = opening ? 'Show less' : 'Show more';
    });
  }
}

// ---- state (b): applying ----
function renderApplying(stepLabel, pct) {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(visibleDescription(u));
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="progress-label">Applying update (${pct}%)</div>
    <div class="progress-step">${escapeHtml(stepLabel || 'Starting...')}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${notes ? `<div class="notes-box"><p>${notes}</p></div>` : ''}
    ${isOwner() ? '<button class="btn btn-outline" id="btn-cancel">Cancel update</button>' : ''}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
}

async function onUpdateNow() {
  if (actionInFlight || applying) return; // re-entry guard: one run only
  if (!isOwner()) return;
  const version = (latestDoc && latestDoc.version) || '';
  if (!confirm('Apply update to v' + version + ' now? The backend will be updated and this may take a few minutes.')) return;
  actionInFlight = true;
  applying = true;
  setStatus('warn', 'Applying update...');
  renderApplying('Starting...', 0);
  try {
    const functions = getFunctions(undefined, 'us-central1');
    const applyCompanyUpdate = httpsCallable(functions, 'applyCompanyUpdate');
    const result = await applyCompanyUpdate({});
    const steps = (result && result.data && Array.isArray(result.data.steps))
      ? result.data.steps.map(String)
      : ['Applying update'];
    for (let i = 0; i < steps.length; i++) {
      if (!applying) break; // cancelled locally; the callable may still finish server side
      const pct = Math.round(((i + 1) / steps.length) * 100);
      renderApplying(steps[i], pct);
      await new Promise((r) => setTimeout(r, 650));
    }
    if (applying) {
      renderApplying('Finishing up...', 100);
      await new Promise((r) => setTimeout(r, 600));
    }
  } catch (e) {
    // Non fatal: the failure lands in the status line under the card and
    // the page re-renders its normal state below. Never a dead card.
    setStatus('err', 'The update failed: ' + (e.message || 'unknown error') + '. Please try again.');
  } finally {
    applying = false;
    actionInFlight = false;
  }
  // refresh org data (dataVersion should now equal latest)
  try {
    const snap = await getDoc(doc(db, 'orgs', orgId));
    orgData = snap.data() || {};
  } catch (_) { /* render with what we have */ }
  render();
}

// ---- state (c): scheduled for tonight ----
function renderScheduled() {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(visibleDescription(u));
  const pend = orgData.pendingUpdate || {};
  const scheduledVer = escapeHtml(pend.version || version);
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="progress-label">Update v${scheduledVer} scheduled</div>
    ${notes ? `<div class="notes-box"><p>${notes}</p></div>` : ''}
    <div class="tonight-text">
      <span id="tonight-line">Checking who is still online...</span>
      <ul class="online-list" id="online-list"></ul>
    </div>
    ${ownerButtons('<button class="btn btn-outline" id="btn-cancel">Cancel update</button>')}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
  refreshOnlineList();
  if (onlineRefreshTimer) clearInterval(onlineRefreshTimer);
  onlineRefreshTimer = setInterval(refreshOnlineList, 30000);
}

async function refreshOnlineList() {
  const line = document.getElementById('tonight-line');
  const list = document.getElementById('online-list');
  if (!line || !list) return;
  try {
    const users = await getOnlineUsers(orgId);
    const n = users.length;
    if (n === 0) {
      line.textContent = 'Updating tonight. No users are online, so the update will start soon.';
      list.innerHTML = '';
      return;
    }
    line.textContent = 'Updating tonight. ' + n + (n === 1 ? ' user is' : ' users are') +
      ' still online, so the update will not start until those users leave:';
    list.innerHTML = users.map((u) => {
      const name = escapeHtml(u.name || 'Unknown user');
      const role = escapeHtml(u.role || '');
      const you = u.isSelf ? ' <span class="you">(you)</span>' : '';
      return `<li>- ${name}${role ? ' (' + role + ')' : ''}${you}</li>`;
    }).join('');
  } catch (e) {
    line.textContent = 'Updating tonight. Could not load the list of online users.';
  }
}

// ---- state (d): up to date ----
function renderUpToDate() {
  card.innerHTML = `
    <div class="uptodate">
      <div class="check">&#10003;</div>
      <h2>You&apos;re on the latest version.</h2>
      <p>Nivelato v${escapeHtml(dataVersion())}</p>
    </div>
  `;
}

async function onUpdateTonight() {
  if (actionInFlight || applying || writeInFlight) return; // re-entry guard
  if (!isOwner()) return;
  const version = String((latestDoc && latestDoc.version) || '');
  writeInFlight = true;
  setCardButtonsDisabled(true);
  setStatus('warn', 'Scheduling update...');
  try {
    await updateDoc(doc(db, 'orgs', orgId), {
      pendingUpdate: { version, scheduledBy: currentUser.uid, scheduledAt: serverTimestamp() }
    });
    setStatus('', '');
  } catch (e) {
    // Non fatal: status line, and render() in finally restores live buttons.
    setStatus('err', 'Could not schedule the update: ' + (e.message || 'unknown error'));
  } finally {
    writeInFlight = false;
    render(); // scheduled state if the write landed (snapshot echo also renders)
  }
}

async function onCancelUpdate() {
  if (!isOwner()) return;
  if (applying) {
    // The callable may still be running server side; stop animating and
    // go back to the normal states. The in-flight Update Now run sees
    // applying === false and winds down without touching the card again.
    applying = false;
  }
  if (writeInFlight) return; // re-entry guard for the delete write itself
  writeInFlight = true;
  setCardButtonsDisabled(true);
  setStatus('warn', 'Cancelling update...');
  try {
    await updateDoc(doc(db, 'orgs', orgId), { pendingUpdate: deleteField() });
    setStatus('', '');
  } catch (e) {
    setStatus('err', 'Could not cancel the update: ' + (e.message || 'unknown error'));
  } finally {
    writeInFlight = false;
    if (!actionInFlight) render();
  }
}

// Programmatic hooks for the headless mash test: the same handlers the
// buttons call, plus the busy flags, so a test can fire them repeatedly
// and assert a single execution.
window.__nivUpdates = {
  onUpdateNow, onUpdateTonight, onCancelUpdate,
  isBusy: () => actionInFlight || writeInFlight || applying
};

// ---- auth + data ----
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  // Mint flow claims: rules require them for org data reads.
  // Route to geo-blocked on fresh block/review verdicts (same as login.html).
  try {
    const gate = await ensureFlowClaims();
    if (gate && gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
  } catch (_) { /* fails soft */ }
  currentUser = user;
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) {
    alert('We could not find your user profile. Please sign in again to repair it.');
    window.location.href = 'login.html?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  orgId = currentUserData.orgId;

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  // latest + update doc (public read)
  try {
    const latestSnap = await getDoc(doc(db, 'app_updates', 'latest'));
    latestDoc = latestSnap.exists() ? latestSnap.data() : null;
    if (latestDoc && latestDoc.version) {
      const updSnap = await getDoc(doc(db, 'app_updates', String(latestDoc.version)));
      updateDocData = updSnap.exists() ? updSnap.data() : null;
    }
  } catch (e) {
    console.warn('[Nivelato] could not read app_updates:', e.message);
  }

  // live org doc so scheduling/cancel/apply reflect for everyone
  if (unsubOrg) unsubOrg();
  unsubOrg = onSnapshot(doc(db, 'orgs', orgId),
    (snap) => {
      orgData = snap.exists() ? snap.data() : {};
      if (!applying) render();
    },
    (e) => {
      card.innerHTML = `<div class="state-error">Could not load company data: ${escapeHtml(e.message || 'unknown error')}</div>`;
    });
});
</script>
<script src="./niv-settings.js"></script>
<script src="./modules/shell-bridge.js"></script>
<script src="./nav-referrer.js"></script>
<script>
  /* Shell mounts (module platform, see modules/README.md).
     Sidebar: the company module replaces this page's old forked sidebar
     markup; active entry is Updates. Top bar: SHELL RULE, desktop only:
     at <=900px the bridge mount is suppressed here and the host box is
     hidden in CSS, and the topbar module self-suppresses too; mobile
     navigation is the sidebar. Language starts from the NivSettings
     chain; the page module re-points both handles when the user level
     language resolves and on later niv:lang changes. */
  (function () {
    var lang = 'es';
    try { if (window.NivSettings) lang = window.NivSettings.getLang(); } catch (e) { /* default es */ }
    var onNav = function (href) {
      /* Referrer capture for JS driven navigation into Account settings,
         the nivSaveSettingsReferrer hook nav-referrer.js exposes. */
      try {
        var path = new URL(href, window.location.origin).pathname;
        if (path === '/account/settings' && window.nivSaveSettingsReferrer) window.nivSaveSettingsReferrer();
      } catch (e) { /* ignore */ }
    };
    try {
      window.__nivSidebar = window.NivShell.mountSidebar('#chrome-sidebar', {
        target: 'company', active: 'updates', lang: lang, onNav: onNav
      });
    } catch (e) { /* shell bridge unavailable: the card still works */ }
    try {
      if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
        window.__nivTopbar = window.NivShell.mountTopbar('#chrome-topbar', { active: 'home', lang: lang });
      }
    } catch (e) { /* ignore */ }

    /* Referrer-aware Back, same semantics nav-referrer.js applies on the
       account settings page: an allowlisted same origin referrer wins,
       the /dashboard.html?view=home fallback in the markup otherwise.
       (nav-referrer.js itself only consumes its saved referrer on
       /account/settings, so this page mirrors its allowlist against
       document.referrer without touching the one-shot saved key, which
       belongs to the account settings visit.) */
    var ALLOWED = ['/', '/dashboard.html', '/company/users', '/company/settings', '/company/updates', '/photo.html'];
    try {
      if (document.referrer) {
        var u = new URL(document.referrer, window.location.origin);
        if (u.origin === window.location.origin && ALLOWED.indexOf(u.pathname) !== -1 &&
            u.pathname + u.search !== window.location.pathname + window.location.search) {
          var btn = document.getElementById('btn-back');
          if (btn) btn.setAttribute('href', u.pathname + u.search);
        }
      }
    } catch (e) { /* keep the fallback href */ }
  })();
</script>
<script src="./press-yaoi.js"></script>
</body>
