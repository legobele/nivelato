<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="manifest.json" />
<title>Nivelato - Updates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0f;
    --card: #101013;
    --line: #2a2a2e;
    --line-soft: #1f1f23;
    --text: #f1f1f2;
    --muted: #9a9aa0;
    --faint: #6d6d74;
    --blue: #1e9df0;
    --blue-dark: #1478bd;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .shell {
    display: flex;
    min-height: 100vh;
  }
  /* ---------- sidebar ---------- */
  .sidebar {
    width: 300px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #0b0b0d;
  }
  .org-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 6px 16px;
  }
  .org-avatar {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    letter-spacing: 1px;
  }
  .org-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .org-version {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .nav-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    text-align: center;
    text-decoration: none;
  }
  .nav-btn.soon { color: var(--muted); }
  .nav-btn .soon-badge {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--faint);
    border: 1px solid var(--line-soft);
    border-radius: 9999px;
    padding: 1px 7px;
  }
  .nav-btn.active {
    border-color: var(--line);
    background: var(--card);
    cursor: default;
  }
  .nav-btn.active .nav-label { font-weight: 700; }
  .nav-btn.active .nav-sub {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .nav-btn.active .dot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
  }
  .nav-btn.active .dot.on { background: var(--blue); border-color: var(--blue); }
  /* ---------- main ---------- */
  .main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 32px;
  }
  .update-card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .mini-logo {
    width: 76px;
    height: 96px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
  }
  .card-title {
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .notes-box {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .notes-box p { margin: 0 0 12px; }
  .notes-box p:last-child { margin-bottom: 0; }
  .notes-box a { color: var(--text); text-decoration: underline; word-break: break-all; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    min-height: 50px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.12s, background 0.15s;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: 1.5px solid var(--blue);
  }
  .btn-primary:hover:not(:disabled) { background: #25a8f7; }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover:not(:disabled) { border-color: #3a3a40; background: #141417; }
  .caption {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 0;
    line-height: 1.5;
  }
  .note-owner {
    text-align: center;
    font-size: 13px;
    color: var(--faint);
    margin: 14px 0 0;
  }
  /* progress */
  .progress-label { font-size: 14px; color: var(--text); margin-bottom: 10px; }
  .progress-step { font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 20px; }
  .progress-track {
    height: 14px;
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    background: var(--bg);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--blue);
    border-radius: 9999px;
    transition: width 0.5s ease;
  }
  /* tonight list */
  .tonight-text {
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin: 6px 0 24px;
  }
  .online-list {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
  }
  .online-list li {
    font-size: 14px;
    color: var(--muted);
    padding: 4px 0;
  }
  .online-list li .you { color: var(--text); }
  /* up to date */
  .uptodate {
    text-align: center;
    padding: 48px 20px;
  }
  .uptodate .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--blue);
  }
  .uptodate h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .uptodate p { font-size: 14px; color: var(--muted); margin: 0; }
  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 40px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
  }
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 20px 16px; }
    .update-card { padding: 24px 20px; border-radius: var(--radius-lg); }
    .card-top { gap: 14px; margin-bottom: 18px; }
    .mini-logo { width: 60px; height: 78px; font-size: 22px; }
  }
</style>
<link rel="stylesheet" href="./qgc-theme.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Company navigation">
    <div class="org-head">
      <div class="org-avatar" id="org-avatar">--</div>
      <div>
        <div class="org-name" id="org-name">Loading...</div>
        <div class="org-version" id="org-version">Nivelato</div>
      </div>
    </div>
    <a class="nav-btn" href="/company/users"><span class="nav-label">Users</span></a>
    <button class="nav-btn soon" disabled>Project management<span class="soon-badge">soon</span></button>
    <button class="nav-btn soon" disabled>Billing<span class="soon-badge">soon</span></button>
    <button class="nav-btn active" aria-current="page">
      <span class="nav-label">Updates</span>
      <span class="nav-sub" id="updates-sub">Checking...</span>
      <span class="dot" id="updates-dot"></span>
    </button>
  </aside>
  <main class="main">
    <div class="update-card" id="update-card">
      <div class="state-loading" id="loading-state">Loading update status...</div>
    </div>
  </main>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, updateDoc, onSnapshot, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
import { startPresence, getOnlineUsers } from './presence.js';
import { ensureFlowClaims } from './geo.js';

// Escape ALL user-controlled strings before innerHTML interpolation (stored XSS).
// Names, roles, and update notes come from Firestore and members can set their own.
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

const card = document.getElementById('update-card');
const SECURITY_URL = 'faq.nivelatolabs.com/company/updates#about-security';

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;      // orgs/{orgId}
let latestDoc = null;    // app_updates/latest
let updateDocData = null; // app_updates/{latest version}
let applying = false;
let unsubOrg = null;
let onlineRefreshTimer = null;

const isOwner = () => currentUserData && currentUserData.role === 'owner';

function initialsOf(name) {
  const words = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return 'QG';
  const first = words[0][0] || '';
  const second = words.length > 1 ? (words[1][0] || '') : (words[0][1] || '');
  return (first + second).toUpperCase();
}

function dataVersion() {
  return (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
}

function updateAvailable() {
  if (!latestDoc || !latestDoc.version) return false;
  return dataVersion() !== String(latestDoc.version);
}

function pendingScheduled() {
  return !!(orgData && orgData.pendingUpdate);
}

function renderSidebar() {
  const name = orgData && orgData.name ? orgData.name : 'Company';
  document.getElementById('org-avatar').textContent = initialsOf(name);
  document.getElementById('org-name').textContent = name;
  document.getElementById('org-version').textContent = 'Nivelato v' + dataVersion();
  const pending = updateAvailable() || pendingScheduled();
  document.getElementById('updates-sub').textContent = pending ? 'New version available' : 'Up to date';
  document.getElementById('updates-dot').classList.toggle('on', pending);
}

function render() {
  renderSidebar();
  if (applying) return; // (b) owns the card while applying
  if (pendingScheduled()) return renderScheduled();
  if (updateAvailable()) return renderAvailable();
  return renderUpToDate();
}

function ownerButtons(html) {
  return isOwner() ? html : '<p class="note-owner">Only org owners can apply updates. Contact an owner to update.</p>';
}

// ---- state (a): update available ----
function renderAvailable() {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(u.notes || 'This update includes new features and improvements.');
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="notes-box">
      <p>${notes}</p>
      <p>For information about the security of updates see <a href="https://${SECURITY_URL}" target="_blank" rel="noopener">${SECURITY_URL}</a>.</p>
    </div>
    ${ownerButtons(`
      <button class="btn btn-primary" id="btn-update-now">Update Now</button>
      <button class="btn btn-outline" id="btn-update-tonight">Update Tonight</button>
      <p class="caption">Selecting "Update Tonight" will update once all users have exited the app.</p>
    `)}
  `;
  const btnNow = document.getElementById('btn-update-now');
  const btnTonight = document.getElementById('btn-update-tonight');
  if (btnNow) btnNow.addEventListener('click', onUpdateNow);
  if (btnTonight) btnTonight.addEventListener('click', onUpdateTonight);
}

// ---- state (b): applying ----
function renderApplying(stepLabel, pct) {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(u.notes || '');
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="progress-label">Applying update (${pct}%)</div>
    <div class="progress-step">${escapeHtml(stepLabel || 'Starting...')}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${notes ? `<div class="notes-box"><p>${notes}</p></div>` : ''}
    ${isOwner() ? '<button class="btn btn-outline" id="btn-cancel">Cancel update</button>' : ''}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
}

async function onUpdateNow() {
  if (!isOwner()) return;
  const version = (latestDoc && latestDoc.version) || '';
  if (!confirm('Apply update to v' + version + ' now? The backend will be updated and this may take a few minutes.')) return;
  applying = true;
  renderApplying('Starting...', 0);
  const btnCancel = document.getElementById('btn-cancel');
  if (btnCancel) btnCancel.addEventListener('click', onCancelUpdate);
  try {
    const functions = getFunctions(undefined, 'us-central1');
    const applyCompanyUpdate = httpsCallable(functions, 'applyCompanyUpdate');
    const result = await applyCompanyUpdate({});
    const steps = (result && result.data && Array.isArray(result.data.steps))
      ? result.data.steps.map(String)
      : ['Applying update'];
    for (let i = 0; i < steps.length; i++) {
      if (!applying) return; // cancelled
      const pct = Math.round(((i + 1) / steps.length) * 100);
      renderApplying(steps[i], pct);
      const b = document.getElementById('btn-cancel');
      if (b) b.addEventListener('click', onCancelUpdate);
      await new Promise((r) => setTimeout(r, 650));
    }
    renderApplying('Finishing up...', 100);
    await new Promise((r) => setTimeout(r, 600));
  } catch (e) {
    card.innerHTML = `<div class="state-error">The update failed: ${escapeHtml(e.message || 'unknown error')}. Please try again.</div>`;
    await new Promise((r) => setTimeout(r, 2500));
  }
  applying = false;
  // refresh org data (dataVersion should now equal latest)
  try {
    const snap = await getDoc(doc(db, 'orgs', orgId));
    orgData = snap.data() || {};
  } catch (_) { /* render with what we have */ }
  render();
}

// ---- state (c): scheduled for tonight ----
function renderScheduled() {
  const u = updateDocData || {};
  const version = escapeHtml(u.version || (latestDoc && latestDoc.version) || '');
  const title = escapeHtml(u.title || ('Nivelato v' + version));
  const notes = escapeHtml(u.notes || '');
  const pend = orgData.pendingUpdate || {};
  const scheduledVer = escapeHtml(pend.version || version);
  card.innerHTML = `
    <div class="card-top">
      <div class="mini-logo">N</div>
      <h1 class="card-title">${title}</h1>
    </div>
    <div class="progress-label">Update v${scheduledVer} scheduled</div>
    ${notes ? `<div class="notes-box"><p>${notes}</p></div>` : ''}
    <div class="tonight-text">
      <span id="tonight-line">Checking who is still online...</span>
      <ul class="online-list" id="online-list"></ul>
    </div>
    ${ownerButtons('<button class="btn btn-outline" id="btn-cancel">Cancel update</button>')}
  `;
  const btn = document.getElementById('btn-cancel');
  if (btn) btn.addEventListener('click', onCancelUpdate);
  refreshOnlineList();
  if (onlineRefreshTimer) clearInterval(onlineRefreshTimer);
  onlineRefreshTimer = setInterval(refreshOnlineList, 30000);
}

async function refreshOnlineList() {
  const line = document.getElementById('tonight-line');
  const list = document.getElementById('online-list');
  if (!line || !list) return;
  try {
    const users = await getOnlineUsers(orgId);
    const n = users.length;
    if (n === 0) {
      line.textContent = 'Updating tonight. No users are online, so the update will start soon.';
      list.innerHTML = '';
      return;
    }
    line.textContent = 'Updating tonight. ' + n + (n === 1 ? ' user is' : ' users are') +
      ' still online, so the update will not start until those users leave:';
    list.innerHTML = users.map((u) => {
      const name = escapeHtml(u.name || 'Unknown user');
      const role = escapeHtml(u.role || '');
      const you = u.isSelf ? ' <span class="you">(you)</span>' : '';
      return `<li>- ${name}${role ? ' (' + role + ')' : ''}${you}</li>`;
    }).join('');
  } catch (e) {
    line.textContent = 'Updating tonight. Could not load the list of online users.';
  }
}

// ---- state (d): up to date ----
function renderUpToDate() {
  card.innerHTML = `
    <div class="uptodate">
      <div class="check">&#10003;</div>
      <h2>You&apos;re on the latest version.</h2>
      <p>Nivelato v${escapeHtml(dataVersion())}</p>
    </div>
  `;
}

async function onUpdateTonight() {
  if (!isOwner()) return;
  const version = String((latestDoc && latestDoc.version) || '');
  try {
    await updateDoc(doc(db, 'orgs', orgId), {
      pendingUpdate: { version, scheduledBy: currentUser.uid, scheduledAt: serverTimestamp() }
    });
  } catch (e) {
    alert('Could not schedule the update: ' + (e.message || 'unknown error'));
  }
}

async function onCancelUpdate() {
  if (!isOwner()) return;
  try {
    await updateDoc(doc(db, 'orgs', orgId), { pendingUpdate: deleteField() });
  } catch (e) {
    alert('Could not cancel the update: ' + (e.message || 'unknown error'));
  }
  if (applying) {
    // The callable may still be running server-side; stop animating and go back to (a).
    applying = false;
  }
}

// ---- auth + data ----
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  // Mint flow claims: rules require them for org data reads.
  try { await ensureFlowClaims(); } catch (_) { /* fails soft */ }
  currentUser = user;
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }

  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) {
    alert('We could not find your user profile. Please sign in again to repair it.');
    window.location.href = 'login.html?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  orgId = currentUserData.orgId;

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  // latest + update doc (public read)
  try {
    const latestSnap = await getDoc(doc(db, 'app_updates', 'latest'));
    latestDoc = latestSnap.exists() ? latestSnap.data() : null;
    if (latestDoc && latestDoc.version) {
      const updSnap = await getDoc(doc(db, 'app_updates', String(latestDoc.version)));
      updateDocData = updSnap.exists() ? updSnap.data() : null;
    }
  } catch (e) {
    console.warn('[Nivelato] could not read app_updates:', e.message);
  }

  // live org doc so scheduling/cancel/apply reflect for everyone
  if (unsubOrg) unsubOrg();
  unsubOrg = onSnapshot(doc(db, 'orgs', orgId),
    (snap) => {
      orgData = snap.exists() ? snap.data() : {};
      if (!applying) render();
      else renderSidebar();
    },
    (e) => {
      card.innerHTML = `<div class="state-error">Could not load company data: ${escapeHtml(e.message || 'unknown error')}</div>`;
    });
});
</script>
</body>
</html>
