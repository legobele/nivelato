<!DOCTYPE html>
<html lang="es">
<head>
<base href="/" />
<meta charset="UTF-8" />
<script src="./company-theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Nivelato - Actualizaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0f;
    --card: #101013;
    --line: #2a2a2e;
    --line-soft: #1f1f23;
    --text: #f1f1f2;
    --muted: #9a9aa0;
    --faint: #6d6d74;
    --blue: #1e9df0;
    --blue-dark: #1478bd;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .shell {
    display: flex;
    min-height: 100vh;
    padding: var(--niv-inset, 30px);
    gap: var(--niv-inset, 30px);
    box-sizing: border-box;
  }
  /* ---------- sidebar: company module hosted in #chrome-sidebar ---------- */
  #chrome-sidebar { width: 300px; flex: none; height: calc(100vh - (2 * var(--niv-inset, 30px))); position: sticky; top: var(--niv-inset, 30px); }
  #chrome-sidebar .niv-shell-frame { height: 100%; }
  /* ---------- top bar: desktop only (shell rule) ---------- */
  #chrome-topbar { display: block; }
  .updates-wrap { width: 100%; max-width: 720px; }
  /* ---------- main ---------- */
  .main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 32px;
  }
  .update-card {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .mini-logo {
    width: 76px;
    height: 96px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
  }
  .card-title {
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .notes-box {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .notes-box p { margin: 0 0 12px; }
  .notes-box p:last-child { margin-bottom: 0; }
  .notes-box a { color: var(--text); text-decoration: underline; word-break: break-all; }
  .notes-more { margin-top: 4px; }
  .notes-more-btn {
    display: inline;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--text);
    text-decoration: underline;
    cursor: pointer;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    min-height: 50px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.12s, background 0.15s;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: 1.5px solid var(--blue);
  }
  .btn-primary:hover:not(:disabled) { background: #25a8f7; }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover:not(:disabled) { border-color: #3a3a40; background: #141417; }
  .caption {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 0;
    line-height: 1.5;
  }
  .note-owner {
    text-align: center;
    font-size: 13px;
    color: var(--faint);
    margin: 14px 0 0;
  }
  /* channel picker + automatic updates */
  .pref-section {
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .pref-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .pref-desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .chan-pills { display: flex; gap: 10px; }
  .chan-pill {
    flex: 1;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
  }
  .chan-pill.active {
    border-color: var(--blue);
    color: var(--text);
    background: rgba(30, 157, 240, 0.12);
    cursor: default;
  }
  .chan-pill:disabled { opacity: 0.55; cursor: default; }
  .pref-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pref-row + .pref-row { margin-top: 12px; }
  .pref-label { font-size: 14px; font-weight: 600; }
  .pref-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .switch {
    position: relative; width: 46px; height: 26px; flex: none;
    appearance: none; -webkit-appearance: none;
    background: var(--line); border-radius: 999px; cursor: pointer;
    transition: background 0.15s; margin: 0;
  }
  .switch:checked { background: var(--blue); }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: left 0.15s;
  }
  .switch:checked::after { left: 23px; }
  .cadence-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .cadence-opt {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text); cursor: pointer;
    padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1.5px solid transparent;
  }
  .cadence-opt:hover { background: #141417; }
  .cadence-opt input { accent-color: var(--blue); }
  .pref-note { font-size: 12px; color: var(--faint); margin-top: 10px; line-height: 1.5; }
  /* download phase readout */
  .dl-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 20px;
  }
  .dl-rate { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  /* progress */
  .progress-label { font-size: 14px; color: var(--text); margin-bottom: 10px; }
  .progress-step { font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 20px; }
  .progress-track {
    height: 14px;
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    background: var(--bg);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--blue);
    border-radius: 9999px;
    transition: width 0.5s ease;
  }
  /* tonight list */
  .tonight-text {
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin: 6px 0 24px;
  }
  .online-list {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
  }
  .online-list li {
    font-size: 14px;
    color: var(--muted);
    padding: 4px 0;
  }
  .online-list li .you { color: var(--text); }
  /* up to date */
  .uptodate {
    text-align: center;
    padding: 48px 20px;
  }
  .uptodate .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--blue);
  }
  .uptodate h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .uptodate p { font-size: 14px; color: var(--muted); margin: 0; }
  .state-loading { text-align: center; color: var(--faint); font-size: 14px; padding: 40px 0; }
  .state-error {
    border: 1.5px solid #5c2121;
    background: #1c0f0f;
    color: #f0a3a3;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
  }
  .niv-mobile-nav-toggle { display: none; }
  @media (max-width: 900px) {
    /* Shell rule: the top bar does not exist on mobile. The bridge mount
       is suppressed in JS and this hides the host box as a second layer. */
    #chrome-topbar { display: none !important; }
    .shell { flex-direction: column; padding: 12px; }
    /* M49/m36: compact mobile nav. The sidebar no longer stacks as a
       480px card above the card; it hides behind the hamburger bar and
       opens on tap (module scrolls internally at a viewport height). */
    .niv-mobile-nav-toggle {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 48px; padding: 12px 16px;
      background: var(--card); color: var(--text);
      border: 1.5px solid var(--line); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      box-sizing: border-box; text-align: left;
    }
    #chrome-sidebar { display: none; width: 100%; height: min(560px, calc(100dvh - 140px)); position: static; }
    body.niv-nav-open #chrome-sidebar { display: block; }
    .main { padding: 20px 16px; }
    .update-card { padding: 24px 20px; border-radius: var(--radius-lg); }
    .card-top { gap: 14px; margin-bottom: 18px; }
    .mini-logo { width: 60px; height: 78px; font-size: 22px; }
  }
</style>
<link rel="stylesheet" href="./niv-dark.css" />
<link rel="stylesheet" href="./qgc-theme.css" />
</head>
<body>
<div id="chrome-topbar"></div>
<div class="shell">
  <button type="button" class="niv-mobile-nav-toggle" id="niv-mobile-nav-toggle" aria-expanded="false" aria-controls="chrome-sidebar"><span aria-hidden="true">&#9776;</span><span id="niv-mobile-nav-toggle-label">Navegación</span></button>
  <div id="chrome-sidebar" aria-label="Navegación de la compañía"></div>
  <main class="main">
    <div class="updates-wrap">
      <a class="btn-back niv-btn-back" id="btn-back" href="/dashboard.html?view=home">&#8592; Volver</a>
      <div class="update-card" id="update-card">
        <div class="state-loading" id="loading-state">Cargando el estado de actualización...</div>
      </div>
      <div class="niv-status-line" id="update-status" role="status" aria-live="polite"></div>
    </div>
  </main>
</div>
<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import {
  getDoc, doc, updateDoc, onSnapshot, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-functions.js";
import { startPresence, getOnlineUsers } from './presence.js';
import { ensureFlowClaims, routeAfterGate } from './geo.js';

// Escape ALL user-controlled strings before innerHTML interpolation (stored XSS).
// Names, roles, and update notes come from Firestore and members can set their own.
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

const card = document.getElementById('update-card');

/* User level localization (fix list item 5). Every page string ships in a
   complete ES/EN pair here and renders in currentLang, which resolves at
   USER level in the auth flow: NivUser.resolveLang(uid) (users/{uid}.language
   wins; the NivSettings chain is its fallback). Company language is never
   consulted for an existing user; it only seeds new users at signup.
   Before auth resolves, the NivSettings chain language is the interim.
   Language changes re-render without reload: NivSettings.setLang fires
   the niv:lang document event (the established sibling pattern), and the
   shell handles are re-pointed with setLang. */
const STRINGS = {
  es: {
    docTitle: 'Nivelato - Actualizaciones',
    mobileNav: 'Navegación',
    back: 'Volver',
    sidebarAria: 'Navegación de la compañía',
    loading: 'Cargando el estado de actualización...',
    ownerOnly: 'Solo los dueños de la organización pueden aplicar actualizaciones. Contacta a un dueño para actualizar.',
    defaultNotes: 'Esta actualización incluye funciones nuevas y mejoras.',
    securityText: 'Para información sobre la seguridad de las actualizaciones, consulta',
    showMore: 'Mostrar más',
    showLess: 'Mostrar menos',
    updateNow: 'Actualizar ahora',
    updateTonight: 'Actualizar esta noche',
    tonightCaption: 'Al seleccionar "Actualizar esta noche", la actualización se aplicará cuando todos los usuarios hayan salido de la app.',
    confirmNow: (v) => '¿Aplicar la actualización a la v' + v + ' ahora? El servidor se actualizará y puede tardar unos minutos.',
    applyingPct: (pct) => 'Aplicando actualización (' + pct + '%)',
    starting: 'Comenzando...',
    applyingFallback: 'Aplicando actualización',
    finishing: 'Terminando...',
    cancelUpdate: 'Cancelar actualización',
    busyNow: 'Aplicando actualización...',
    busyTonight: 'Programando actualización...',
    busyCancel: 'Cancelando actualización...',
    unknownError: 'error desconocido',
    updateFailed: (msg) => 'La actualización falló: ' + msg + '. Inténtalo de nuevo.',
    scheduleFailed: (msg) => 'No se pudo programar la actualización: ' + msg,
    cancelFailed: (msg) => 'No se pudo cancelar la actualización: ' + msg,
    scheduledTitle: (v) => 'Actualización v' + v + ' programada',
    checkingOnline: 'Comprobando quién sigue en línea...',
    tonightNone: 'Se actualizará esta noche. No hay usuarios en línea, así que la actualización empezará pronto.',
    tonightSome: (n) => 'Se actualizará esta noche. ' + n + (n === 1 ? ' usuario sigue' : ' usuarios siguen') + ' en línea, así que la actualización no empezará hasta que esos usuarios salgan:',
    tonightLoadFail: 'Se actualizará esta noche. No se pudo cargar la lista de usuarios en línea.',
    unknownUser: 'Usuario desconocido',
    you: 'tú',
    upToDateTitle: 'Estás en la versión más reciente.',
    missingProfile: 'No encontramos tu perfil de usuario. Vuelve a iniciar sesión para repararlo.',
    orgLoadFailed: (msg) => 'No se pudieron cargar los datos de la compañía: ' + msg,
    channelTitle: 'Canal de actualización',
    channelDesc: 'El canal determina qué versiones recibe tu taller. Beta recibe las funciones nuevas antes; Estable solo recibe versiones probadas.',
    channelStable: 'Estable',
    channelBeta: 'Beta',
    channelChange: 'Cambiar canal',
    channelChanging: 'Cambiando canal...',
    channelChanged: (c) => 'Canal cambiado a ' + (c === 'beta' ? 'Beta' : 'Estable') + '.',
    channelChangeFailed: (msg) => 'No se pudo cambiar el canal: ' + msg,
    channelEnrollRequired: 'La empresa debe inscribirse en la beta antes de adoptar el canal beta.',
    channelNoBetaVersion: 'Todavía no hay una versión beta publicada.',
    channelInvalid: 'El canal debe ser Estable o Beta.',
    autoUpdateTitle: 'Actualizaciones automáticas',
    autoUpdateDesc: 'Cuando hay una actualización disponible, aplicarla sin pedir confirmación.',
    autoUpdateOn: 'Activadas',
    autoUpdateOff: 'Desactivadas',
    autoUpdateWhen: 'Cuándo aplicarlas',
    autoUpdateImmediate: 'En cuanto esté disponible',
    autoUpdateTonight: 'Esta noche (cuando nadie esté en línea)',
    downloading: (done, total) => 'Descargando actualización (' + done + ' de ' + total + ')',
    downloadRate: (rate) => rate + '/s',
    installing: 'Instalando...',
    downloadComplete: 'Descarga completa'
  },
  en: {
    docTitle: 'Nivelato - Updates',
    mobileNav: 'Navigation',
    back: 'Back',
    sidebarAria: 'Company navigation',
    loading: 'Loading update status...',
    ownerOnly: 'Only org owners can apply updates. Contact an owner to update.',
    defaultNotes: 'This update includes new features and improvements.',
    securityText: 'For information about the security of updates see',
    showMore: 'Show more',
    showLess: 'Show less',
    updateNow: 'Update Now',
    updateTonight: 'Update Tonight',
    tonightCaption: 'Selecting "Update Tonight" will update once all users have exited the app.',
    confirmNow: (v) => 'Apply update to v' + v + ' now? The backend will be updated and this may take a few minutes.',
    applyingPct: (pct) => 'Applying update (' + pct + '%)',
    starting: 'Starting...',
    applyingFallback: 'Applying update',
    finishing: 'Finishing up...',
    cancelUpdate: 'Cancel update',
    busyNow: 'Applying update...',
    busyTonight: 'Scheduling update...',
    busyCancel: 'Cancelling update...',
    unknownError: 'unknown error',
    updateFailed: (msg) => 'The update failed: ' + msg + '. Please try again.',
    scheduleFailed: (msg) => 'Could not schedule the update: ' + msg,
    cancelFailed: (msg) => 'Could not cancel the update: ' + msg,
    scheduledTitle: (v) => 'Update v' + v + ' scheduled',
    checkingOnline: 'Checking who is still online...',
    tonightNone: 'Updating tonight. No users are online, so the update will start soon.',
    tonightSome: (n) => 'Updating tonight. ' + n + (n === 1 ? ' user is' : ' users are') + ' still online, so the update will not start until those users leave:',
    tonightLoadFail: 'Updating tonight. Could not load the list of online users.',
    unknownUser: 'Unknown user',
    you: 'you',
    upToDateTitle: "You're on the latest version.",
    missingProfile: 'We could not find your user profile. Please sign in again to repair it.',
    orgLoadFailed: (msg) => 'Could not load company data: ' + msg,
    channelTitle: 'Update channel',
    channelDesc: 'The channel decides which versions your workshop receives. Beta gets new features first; Stable only gets tested releases.',
    channelStable: 'Stable',
    channelBeta: 'Beta',
    channelChange: 'Change channel',
    channelChanging: 'Changing channel...',
    channelChanged: (c) => 'Channel changed to ' + (c === 'beta' ? 'Beta' : 'Stable') + '.',
    channelChangeFailed: (msg) => 'Could not change the channel: ' + msg,
    channelEnrollRequired: 'The company must enroll in the beta before adopting the beta channel.',
    channelNoBetaVersion: 'No beta version has been published yet.',
    channelInvalid: 'The channel must be Stable or Beta.',
    autoUpdateTitle: 'Automatic updates',
    autoUpdateDesc: 'When an update is available, apply it without asking for confirmation.',
    autoUpdateOn: 'On',
    autoUpdateOff: 'Off',
    autoUpdateWhen: 'When to apply them',
    autoUpdateImmediate: 'As soon as available',
    autoUpdateTonight: 'Tonight (when nobody is online)',
    downloading: (done, total) => 'Downloading update (' + done + ' of ' + total + ')',
    downloadRate: (rate) => rate + '/s',
    installing: 'Installing...',
    downloadComplete: 'Download complete'
  }
};
let currentLang = 'es';
try { if (window.NivSettings) currentLang = window.NivSettings.getLang(); } catch (_) { /* product default es */ }
const t = (key, ...args) => {
  const table = STRINGS[currentLang] || STRINGS.es;
  const v = (key in table) ? table[key] : STRINGS.es[key];
  return typeof v === 'function' ? v(...args) : v;
};
let dataReady = false;
function applyLang(lang) {
  if (lang === 'es' || lang === 'en') currentLang = lang;
  try { document.documentElement.setAttribute('lang', currentLang); } catch (_) { /* ignore */ }
  document.title = t('docTitle');
  const back = document.getElementById('btn-back');
  if (back) back.textContent = '\u2190 ' + t('back');
  const side = document.getElementById('chrome-sidebar');
  if (side) side.setAttribute('aria-label', t('sidebarAria'));
  const navToggle = document.getElementById('niv-mobile-nav-toggle-label');
  if (navToggle) navToggle.textContent = t('mobileNav');
  const loading = document.getElementById('loading-state');
  if (loading) loading.textContent = t('loading');
  try { if (window.__nivSidebar) window.__nivSidebar.setLang(currentLang); } catch (_) { /* ignore */ }
  try { if (window.__nivTopbar) window.__nivTopbar.setLang(currentLang); } catch (_) { /* ignore */ }
}
document.addEventListener('niv:lang', (e) => {
  const l = e && e.detail && e.detail.lang;
  if (l !== 'es' && l !== 'en') return;
  applyLang(l);
  /* m9: re-render with whatever data state exists, not only after
     dataReady. Before data lands orgData is null and applyLang above
     has already re-localized the loading state in place. */
  if (orgData) render();
});
applyLang(currentLang);
const SECURITY_URL = 'faq.nivelatolabs.com/company/updates#about-security';

let currentUser = null;
let currentUserData = null;
let orgId = null;
let orgData = null;      // orgs/{orgId}
let channelDoc = null;   // app_updates/beta-latest | app_updates/backend (channel aware)
let updateDocData = null; // app_updates/{version} descriptor (beta) or null (stable uses the backend doc itself)
let applying = false;
let lastPointerChannel = null; // channel the pointer was last loaded for
/* Button mash guards (fix list item 6). actionInFlight covers the whole
   Update Now run (confirm, callable, progress animation); writeInFlight
   covers the Update Tonight / Cancel Firestore writes. While either is
   set, every action handler returns immediately and the visible buttons
   are disabled, so rapid presses can never start a second run, queue a
   duplicate write, or interleave two renders of the card. */
let actionInFlight = false;
let writeInFlight = false;
/* M6: the last channel status survives render(). render() rebuilds the
   card innerHTML (including a fresh #channel-status), so the message is
   kept here and re-emitted by renderChannelSection on every render. */
let channelStatus = { kind: '', text: '' };
/* m7: channel switch in flight. Snapshot re-renders must not re-enable
   the pills mid-flight, and a second switch cannot start. */
let channelChangeInFlight = false;

function setStatus(kind, text) {
  const el = document.getElementById('update-status');
  if (!el) return;
  if (!text) { el.className = 'niv-status-line'; el.textContent = ''; return; }
  el.className = 'niv-status-line ' + kind;
  el.textContent = text;
}
function setCardButtonsDisabled(disabled) {
  card.querySelectorAll('button').forEach((b) => { b.disabled = !!disabled; });
}
let unsubOrg = null;
let onlineRefreshTimer = null;

const isOwner = () => currentUserData && currentUserData.role === 'owner';

function dataVersion() {
  return (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
}

/* Update channel (v1.1): the org's channel decides which registry
   projection this page reads. beta -> app_updates/beta-latest,
   stable -> app_updates/backend (the stable stamp; the legacy
   app_updates/latest pointer is stale and is not a display source).
   The header version line (sidebar module) resolves from the same
   registry, so changing the channel re-resolves it too. */
function orgChannel() {
  return (orgData && orgData.updateChannel === 'beta') ? 'beta' : 'stable';
}
function pointerVersion() {
  if (!channelDoc) return null;
  const v = channelDoc.version || channelDoc.friendlyVersion;
  return v ? String(v) : null;
}

function updateAvailable() {
  const pv = pointerVersion();
  if (!pv) return false;
  return dataVersion() !== pv;
}

function pendingScheduled() {
  return !!(orgData && orgData.pendingUpdate);
}

function render() {
  if (applying) return; // (b) owns the card while applying
  if (pendingScheduled()) return renderScheduled();
  if (updateAvailable()) return renderAvailable();
  return renderUpToDate();
}

function ownerButtons(html) {
  return isOwner() ? html : '<p class="note-owner">' + escapeHtml(t('ownerOnly')) + '</p>';
}

/* ---- v1.1: update channel picker ----
   The org's channel (orgs/{orgId}.updateChannel) decides which registry
   projection the update content comes from. Owners change it through the
   setOrgUpdateChannel callable (server enforces beta enrollment for the
   beta channel); everyone else sees the current channel read-only.
   After a change the pointer is re-read and the card re-renders, so the
   update content follows the chosen channel; the header version line
   (sidebar module, registry-live) picks the new channel up on its own. */
function renderChannelSection() {
  const ch = orgChannel();
  const canChange = isOwner() && !channelChangeInFlight;
  return `
    <div class="pref-section" id="channel-section">
      <div class="pref-title">${escapeHtml(t('channelTitle'))}</div>
      <p class="pref-desc">${escapeHtml(t('channelDesc'))}</p>
      <div class="chan-pills" role="group" aria-label="${escapeHtml(t('channelTitle'))}">
        <button type="button" class="chan-pill${ch === 'stable' ? ' active' : ''}" data-channel="stable"${ch === 'stable' || !canChange ? ' disabled' : ''}>${escapeHtml(t('channelStable'))}</button>
        <button type="button" class="chan-pill${ch === 'beta' ? ' active' : ''}" data-channel="beta"${ch === 'beta' || !canChange ? ' disabled' : ''}>${escapeHtml(t('channelBeta'))}</button>
      </div>
      ${!canChange ? '<p class="pref-note">' + escapeHtml(t('ownerOnly')) + '</p>' : ''}
      <div class="niv-status-line${channelStatus.kind ? ' ' + channelStatus.kind : ''}" id="channel-status">${escapeHtml(channelStatus.text)}</div>
    </div>
  `;
}
function wireChannelSection() {
  const pills = card.querySelectorAll('#channel-section .chan-pill[data-channel]');
  pills.forEach((pill) => {
    pill.addEventListener('click', () => onChannelChange(pill.getAttribute('data-channel'), pill));
  });
}
async function onChannelChange(channel, pill) {
  if (channelChangeInFlight) return; // m7: no overlapping switches
  if (!isOwner() || channel === orgChannel()) return;
  if (channel !== 'stable' && channel !== 'beta') return;
  channelChangeInFlight = true;
  const setCStatus = (kind, text) => {
    channelStatus = { kind: kind || '', text: text || '' };
    const statusEl = document.getElementById('channel-status');
    if (!statusEl) return;
    statusEl.className = 'niv-status-line' + (kind ? ' ' + kind : '');
    statusEl.textContent = text || '';
  };
  card.querySelectorAll('#channel-section .chan-pill').forEach((p) => { p.disabled = true; });
  setCStatus('warn', t('channelChanging'));
  try {
    const functions = getFunctions(undefined, 'us-central1');
    const setChannel = httpsCallable(functions, 'setOrgUpdateChannel');
    await setChannel({ channel });
    // Re-read the org doc (the channel write) and the channel pointer,
    // then re-render so the update content follows the new channel.
    // loadChannelPointer is module scope (M5 hoist), so this resolves.
    const snap = await getDoc(doc(db, 'orgs', orgId));
    if (snap.exists()) orgData = snap.data() || orgData;
    await loadChannelPointer();
    setCStatus('ok', t('channelChanged', channel));
    dataReady = true;
    render();
  } catch (e) {
    // m8: the callable's error text is Spanish server copy. Map known
    // server messages to this page's localized strings and never leak
    // raw Spanish into an EN failure message.
    setCStatus('err', t('channelChangeFailed', localizeChannelError(e)));
    // Re-sync the active pill (the change did not land).
    render();
  } finally {
    channelChangeInFlight = false;
    // A render while in flight kept the pills disabled via
    // renderChannelSection; re-render once so they reflect reality.
    if (orgData) render();
  }
}
/* Map setOrgUpdateChannel server errors to localized page strings. */
function localizeChannelError(e) {
  const raw = (e && e.message) || '';
  if (/inscrib|enroll/i.test(raw)) return t('channelEnrollRequired');
  if (/versión beta publicada|beta version/i.test(raw)) return t('channelNoBetaVersion');
  if (/channel debe ser|canal debe ser/i.test(raw)) return t('channelInvalid');
  if (currentLang === 'en' && /[áéíóúñ¿¡]|\b(debe|todavía|empresa|versión|canal)\b/i.test(raw)) {
    return t('unknownError');
  }
  return raw || t('unknownError');
}

/* v1.1: realistic download phase. The old progress was a flat 650ms per
   install step; this drives the bar like a real download first:
   - total 48.6 MB, ticks every 110-160ms with variable chunk sizes
   - throughput starts fast and decelerates as the remainder shrinks
     (rate proportional to the remaining fraction), with per-tick jitter
   - the bar is monotonic (never moves backward) and caps at 92% while
     downloading, so it never hangs visibly at 99%
   - the install steps then carry 92% -> 100%, landing exactly on 100%
     when the last step completes
   - the byte counter and MB/s readout stay consistent with the bar */
const DL_TOTAL_MB = 48.6;
const DL_CAP_PCT = 92;
function fmtMB(v) {
  return (Math.round(v * 10) / 10).toFixed(1) + ' MB';
}
function setBar(pct) {
  const fill = document.getElementById('progress-fill');
  if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  const track = card.querySelector('.progress-track[role="progressbar"]');
  if (track) track.setAttribute('aria-valuenow', String(Math.round(Math.max(0, Math.min(100, pct)))));
  const label = card.querySelector('.progress-label');
  if (label) label.textContent = t('applyingPct', Math.round(Math.max(0, Math.min(100, pct))));
}
async function runDownloadPhase(cancelled) {
  const meta = document.getElementById('dl-meta');
  const bytesEl = document.getElementById('dl-bytes');
  const rateEl = document.getElementById('dl-rate');
  if (meta) meta.hidden = false;
  let downloaded = 0;
  let emaRate = 0; // MB/s, exponential moving average for a stable readout
  let last = performance.now();
  // Target ~9-12s of download: base rate tuned so the cap is reached
  // in that window under the deceleration curve.
  const BASE_RATE = 9.5; // MB/s at 0%
  while (downloaded < DL_TOTAL_MB) {
    if (cancelled()) return false;
    const now = performance.now();
    const dt = Math.max(0.05, (now - last) / 1000);
    last = now;
    const remainingFrac = 1 - (downloaded / DL_TOTAL_MB);
    // Decelerating tail: rate falls with the remaining fraction, plus
    // a floor so it always makes progress; jitter for variable chunks.
    const jitter = 0.55 + Math.random() * 0.9;
    const rate = Math.max(0.6, BASE_RATE * Math.pow(remainingFrac, 0.7) * jitter);
    const chunk = Math.min(rate * dt, DL_TOTAL_MB - downloaded);
    downloaded += chunk;
    emaRate = emaRate === 0 ? rate : emaRate * 0.7 + rate * 0.3;
    const pct = (downloaded / DL_TOTAL_MB) * DL_CAP_PCT;
    setBar(pct);
    const stepEl = card.querySelector('.progress-step');
    if (stepEl) stepEl.textContent = t('downloading', fmtMB(downloaded), fmtMB(DL_TOTAL_MB));
    if (bytesEl) bytesEl.textContent = fmtMB(downloaded) + ' / ' + fmtMB(DL_TOTAL_MB);
    if (rateEl) rateEl.textContent = t('downloadRate', emaRate.toFixed(1) + ' MB');
    await new Promise((r) => setTimeout(r, 110 + Math.random() * 50));
  }
  if (bytesEl) bytesEl.textContent = fmtMB(DL_TOTAL_MB) + ' / ' + fmtMB(DL_TOTAL_MB);
  const stepEl = card.querySelector('.progress-step');
  if (stepEl) stepEl.textContent = t('downloadComplete');
  await new Promise((r) => setTimeout(r, 350));
  return true;
}

async function onUpdateNow() {
  if (actionInFlight || applying) return; // re-entry guard: one run only
  if (!isOwner()) return;
  const version = pointerVersion() || '';
  if (!confirm(t('confirmNow', version))) return;
  actionInFlight = true;
  applying = true;
  setStatus('warn', t('busyNow'));
  renderApplying(t('starting'), 0);
  const cancelled = () => !applying;
  try {
    // Phase 1: realistic download (0 -> 92%). Phase 2 below carries the
    // install steps 92 -> 100% so the bar lands exactly on 100% when
    // the last step completes.
    const dlOk = await runDownloadPhase(cancelled);
    if (!dlOk || !applying) return; // cancelled during download
    const functions = getFunctions(undefined, 'us-central1');
    const applyCompanyUpdate = httpsCallable(functions, 'applyCompanyUpdate');
    const result = await applyCompanyUpdate({});
    const steps = (result && result.data && Array.isArray(result.data.steps))
      ? result.data.steps.map(String)
      : [t('applyingFallback')];
    const stepEl = () => card.querySelector('.progress-step');
    for (let i = 0; i < steps.length; i++) {
      if (!applying) break; // cancelled locally; the callable may still finish server side
      const pct = DL_CAP_PCT + Math.round(((i + 1) / steps.length) * (100 - DL_CAP_PCT));
      setBar(pct);
      if (stepEl()) stepEl().textContent = t('installing') + ' ' + steps[i];
      await new Promise((r) => setTimeout(r, 650));
    }
    if (applying) {
      setBar(100);
      renderApplying(t('finishing'), 100);
      await new Promise((r) => setTimeout(r, 600));
    }
  } catch (e) {
    // Non fatal: the failure lands in the status line under the card and
    // the page re-renders its normal state below. Never a dead card.
    setStatus('err', t('updateFailed', e.message || t('unknownError')));
  } finally {
    applying = false;
    actionInFlight = false;
  }
  // refresh org data (dataVersion should now equal latest)
  try {
    const snap = await getDoc(doc(db, 'orgs', orgId));
    orgData = snap.data() || {};
  } catch (_) { /* render with what we have */ }
  render();
}

async function refreshOnlineList() {

async function onUpdateTonight() {
  if (actionInFlight || applying || writeInFlight) return; // re-entry guard
  if (!isOwner()) return;
  const version = pointerVersion() || '';
  writeInFlight = true;
  setCardButtonsDisabled(true);
  setStatus('warn', t('busyTonight'));
  try {
    await updateDoc(doc(db, 'orgs', orgId), {
      pendingUpdate: { version, scheduledBy: currentUser.uid, scheduledAt: serverTimestamp() }
    });
    setStatus('', '');
  } catch (e) {
    // Non fatal: status line, and render() in finally restores live buttons.
    setStatus('err', t('scheduleFailed', e.message || t('unknownError')));
  } finally {
    writeInFlight = false;
    render(); // scheduled state if the write landed (snapshot echo also renders)
  }
}

async function onCancelUpdate() {
  if (!isOwner()) return;
  if (applying) {
    // The callable may still be running server side; stop animating and
    // go back to the normal states. The in-flight Update Now run sees
    // applying === false and winds down without touching the card again.
    applying = false;
  }
  if (writeInFlight) return; // re-entry guard for the delete write itself
  writeInFlight = true;
  setCardButtonsDisabled(true);
  setStatus('warn', t('busyCancel'));
  try {
    await updateDoc(doc(db, 'orgs', orgId), { pendingUpdate: deleteField() });
    setStatus('', '');
  } catch (e) {
    setStatus('err', t('cancelFailed', e.message || t('unknownError')));
  } finally {
    writeInFlight = false;
    if (!actionInFlight) render();
  }
}

// Programmatic hooks for the headless mash test: the same handlers the
// buttons call, plus the busy flags, so a test can fire them repeatedly
// and assert a single execution. v1.1 additions expose the channel and
// download-phase pieces for the headless verification run.
window.__nivUpdates = {
  onUpdateNow, onUpdateTonight, onCancelUpdate,
  isBusy: () => actionInFlight || writeInFlight || applying,
  orgChannel, pointerVersion, updateAvailable,
  autoUpdateOn, autoUpdateCadence,
  runDownloadPhase, setBar, DL_TOTAL_MB, DL_CAP_PCT,
  onChannelChange,
  _setOrgDataForTest: (d) => { orgData = d; },
  _setChannelDocForTest: (d) => { channelDoc = d; updateDocData = null; lastPointerChannel = orgChannel(); },
  _renderForTest: () => render()
};

// Channel pointer + update descriptor (public read, channel aware).
// Loaded/refreshes from the org snapshot below so the channel is known.
// beta -> app_updates/beta-latest (has `version` -> descriptor doc);
// stable -> app_updates/backend (the stable stamp; friendlyVersion).
// The legacy app_updates/latest pointer is stale and is never read.
async function loadChannelPointer() {
  const ch = orgChannel();
  const path = ch === 'beta' ? 'beta-latest' : 'backend';
  try {
    const snap = await getDoc(doc(db, 'app_updates', path));
    channelDoc = snap.exists() ? snap.data() : null;
    updateDocData = null;
    const ver = channelDoc && channelDoc.version ? String(channelDoc.version) : null;
    if (ver) {
      try {
        const updSnap = await getDoc(doc(db, 'app_updates', ver));
        updateDocData = updSnap.exists() ? updSnap.data() : null;
      } catch (_) { /* descriptor optional */ }
    }
  } catch (e) {
    console.warn('[Nivelato] could not read app_updates/' + path + ':', e.message);
    channelDoc = null;
    updateDocData = null;
  }
  lastPointerChannel = ch;
}

// ---- auth + data ----
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'https://login.nivelatolabs.com/?next=' + encodeURIComponent(window.location.href); return; }
  // Mint flow claims: rules require them for org data reads.
  // Route to geo-blocked on fresh block/review verdicts (same as login.html).
  try {
    const gate = await ensureFlowClaims();
    if (gate && gate.ok && !gate.cached && routeAfterGate(gate.verdict, gate.reason)) return;
  } catch (_) { /* fails soft */ }
  currentUser = user;
  if (window.applyCompanyThemeFromAuth) { try { window.applyCompanyThemeFromAuth(auth); } catch (_) {} }
  // User level language (item 5): resolveLang(uid) reads users/{uid}.language
  // first, then the NivSettings chain; applyResolvedLang stamps the device
  // surfaces. Company language is never consulted for an existing user.
  try {
    const nivUser = await import('./niv-user.js');
    const lang = await nivUser.resolveLang(user.uid);
    nivUser.applyResolvedLang(lang);
    applyLang(lang);
  } catch (_) { /* keep the interim NivSettings chain language */ }

  const userSnap = await getDoc(doc(db, 'users', user.uid));
  if (!userSnap.exists()) {
    alert(t('missingProfile'));
    window.location.href = 'login.html?missingProfile=1';
    return;
  }
  if (window.applyCompanyTheme) { try { window.applyCompanyTheme(userSnap.data()); } catch (_) {} }
  currentUserData = userSnap.data();
  orgId = currentUserData.orgId;

  try { await startPresence(user.uid); } catch (e) {
    console.warn('[Nivelato] presence start failed:', e.message);
  }

  // live org doc so scheduling/cancel/apply/channel reflect for everyone
  if (unsubOrg) unsubOrg();
  unsubOrg = onSnapshot(doc(db, 'orgs', orgId),
    async (snap) => {
      dataReady = true;
      orgData = snap.exists() ? snap.data() : {};
      if (orgChannel() !== lastPointerChannel) await loadChannelPointer();
      if (!applying) render();
    },
    (e) => {
      card.innerHTML = `<div class="state-error">${escapeHtml(t('orgLoadFailed', e.message || t('unknownError')))}</div>`;
    });
});
</script>
<script src="./niv-settings.js"></script>
<script src="./modules/shell-bridge.js"></script>
<script src="./nav-referrer.js"></script>
<script>
  /* Shell mounts (module platform, see modules/README.md).
     Sidebar: the company module replaces this page's old forked sidebar
     markup; active entry is Updates. Top bar: SHELL RULE, desktop only:
     at <=900px the bridge mount is suppressed here and the host box is
     hidden in CSS, and the topbar module self-suppresses too; mobile
     navigation is the sidebar. Language starts from the NivSettings
     chain; the page module re-points both handles when the user level
     language resolves and on later niv:lang changes. */
  (function () {
    var lang = 'es';
    try { if (window.NivSettings) lang = window.NivSettings.getLang(); } catch (e) { /* default es */ }
    var onNav = function (href) {
      /* Referrer capture for JS driven navigation into Account settings,
         the nivSaveSettingsReferrer hook nav-referrer.js exposes. */
      try {
        var path = new URL(href, window.location.origin).pathname;
        if (path === '/account/settings' && window.nivSaveSettingsReferrer) window.nivSaveSettingsReferrer();
      } catch (e) { /* ignore */ }
    };
    try {
      window.__nivSidebar = window.NivShell.mountSidebar('#chrome-sidebar', {
        target: 'company', active: 'updates', lang: lang, onNav: onNav
      });
    } catch (e) { /* shell bridge unavailable: the card still works */ }
    try {
      if (window.matchMedia && window.matchMedia('(min-width: 901px)').matches) {
        window.__nivTopbar = window.NivShell.mountTopbar('#chrome-topbar', { active: 'home', lang: lang, context: 'settings' });
      }
    } catch (e) { /* ignore */ }

    /* Referrer-aware Back: owned by nav-referrer.js (loaded above), which
       consumes document.referrer for this page under its /company/updates
       entry (allowlist, never self by path + search). No saved key is
       touched here: the settings keys belong to the settings visits.
       The fallback href in the markup stands otherwise. */
  })();
</script>

<script>
  /* M49: compact mobile nav toggle (see the <=900px CSS in this page).
     Desktop never shows the button; on mobile it expands/collapses the
     settings sidebar host. */
  (function () {
    var btn = document.getElementById('niv-mobile-nav-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var open = document.body.classList.toggle('niv-nav-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
