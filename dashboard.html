<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nivelato — Dashboard</title>
  <script>console.log('nivelato v1.1.0 — mobile dashboard')</script>
  <script type="module" src="firebase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
<canvas id="drawing-canvas" style="display:none;width:340px;height:420px"></canvas>

<header>
  <div class="header-logo">Nivelato</div>
  <div class="header-right">
    <div class="org-badge" id="org-name-badge">…</div>
    <button id="btn-new-measure" onclick="window.location.href='index.html'" style="display:none;background:#1971c2;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">+ Nueva medida</button>
    <div class="account-menu-wrap">
      <button class="account-btn" id="account-btn" onclick="toggleAccountMenu()">👤 <span id="user-name">Cargando…</span></button>
      <div class="account-dropdown" id="account-dropdown">
        <div class="account-dropdown-item" onclick="doLogout()">🔒 Cerrar sesión</div>
      </div>
    </div>
  </div>
</header>

<main>
  <h1>Historial de medidas</h1>
  <div class="subtitle" id="dash-subtitle">Cargando…</div>
  <div id="join-code-section" style="display:none; background:#e8f0fe; border-radius:12px; padding:14px 20px; margin:16px 0 8px; align-items:center; gap:16px; flex-wrap:wrap;">
    <span style="font-size:11px; font-weight:600; color:#888; letter-spacing:0.05em;">CÓDIGO DEL TALLER:</span>
    <span id="join-code-display" style="font-size:24px; font-weight:700; color:#1a73e8; letter-spacing:0.15em; font-family:monospace; margin-left:8px;">——</span>
    <button onclick="copyJoinCode()" id="copy-btn" style="margin-left:auto; background:#1a73e8; color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer;">📋 Copiar</button>
    <span style="font-size:11px; color:#888; width:100%; margin-top:2px;">Dáselo a tus empleados para que se registren en Nivelato</span>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-today">0</div><div class="stat-label">Hoy</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-warn">0</div><div class="stat-label">Advertencias</div></div>
  </div>

  <div class="filter-bar">
    <button class="filter-chip" id="filter-date-chip" onclick="openFilterSheet('date')">📅 Fecha</button>
    <button class="filter-chip" id="filter-installer-chip" onclick="openFilterSheet('installer')">👤 Técnico</button>
    <button class="filter-chip" id="filter-customer-chip" onclick="openFilterSheet('customer')">🏢 Cliente</button>
    <button class="filter-chip" id="filter-group-chip" onclick="openFilterSheet('group')">📂 Agrupar</button>
    <button class="filter-chip" id="filter-sort-chip" onclick="openFilterSheet('sort')">🔃 Ordenar</button>
  </div>

  <div id="job-list"></div>
</main>

<!-- DESKTOP MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modal-title">Detalle</div>
    <div class="modal-inner">
      <div class="modal-details">
        <div id="modal-body"></div>
        <button class="btn-delete" id="modal-delete-btn" onclick="deleteCurrentJob()">🗑 Eliminar medida</button>
        <button class="btn-close" onclick="closeModal()">Cerrar</button>
      </div>
      <div class="modal-canvas-wrap">
        <canvas id="modal-canvas" width="340" height="420"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- MOILE BOTTOM SHEET MODAL -->
<div class="mobile-modal-overlay" id="mobile-modal-overlay" onclick="closeMobileModal(event)">
  <div class="mobile-modal" id="mobile-modal">
    <div class="mobile-modal-handle" onclick="toggleMobileModal()">
      <div class="drag-bar"></div>
    </div>
    <div class="mobile-modal-title" id="mobile-modal-title">Detalle</div>
    <div class="mobile-modal-tabs">
      <button class="mobile-tab active" onclick="switchMobileTab('details')" id="tab-details">Detalles</button>
      <button class="mobile-tab" onclick="switchMobileTab('graph')" id="tab-graph">Gráfica</button>
    </div>
    <div class="mobile-modal-body">
      <div class="mobile-tab-content active" id="content-details">
        <div id="mobile-modal-body"></div>
        <button class="btn-delete" onclick="deleteCurrentJob()">🗑 Eliminar medida</button>
      </div>
      <div class="mobile-tab-content" id="content-graph">
        <canvas id="mobile-modal-canvas" width="340" height="420"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- FILTER BOTTOM SHEET -->
<div class="filter-sheet-overlay" id="filter-sheet-overlay" onclick="closeFilterSheet(event)">
  <div class="filter-sheet" id="filter-sheet">
    <div class="filter-sheet-handle"><div class="drag-bar"></div></div>
    <div class="filter-sheet-title" id="filter-sheet-title">Filtrar</div>
    <div class="filter-sheet-body" id="filter-sheet-body"></div>
    <button class="btn-primary" style="margin-top:16px;width:100%;" onclick="applyFilterSelection()">Aplicar</button>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
