<head>

<link rel="stylesheet" href="/niv-dark.css" />
<style>
  /* Module chrome: the iframe document is exactly one floating card.
     The host owns placement and inset; the card fills the iframe box. */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--niv-bg);
    color: var(--niv-text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .niv-mod-side {
    height: 100%;
    max-height: 100%;
    overflow: hidden; /* scrolling lives in .niv-mod-scroll, not the card */
  }
  /* Internal scroll region (company target at fixed height). Thin
     scrollbar treatment matching the topbar tab strip in niv-dark.css
     consumers (scrollbar-width plus a themed webkit thumb). */
  .niv-mod-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--niv-border) transparent;
  }
  .niv-mod-scroll::-webkit-scrollbar { width: 8px; }
  .niv-mod-scroll::-webkit-scrollbar-thumb {
    background: var(--niv-surface-2);
    border: 1px solid var(--niv-border-soft);
    border-radius: 999px;
  }
  .niv-mod-scroll::-webkit-scrollbar-track { background: transparent; }
  /* User target: the card is content sized and the host iframe grows via
     niv:resize, so no inner scrollbar is wanted there. */
  body[data-target="user"] .niv-mod-scroll { overflow-y: visible; }

  /* Nav icons: the dashboard panel treatment. The tile takes a theme
     token (currentColor on the wrapper), the glyph sits dim on it, and
     the active item flips the tile to the accent token with a white
     glyph. No per item hardcoded colors. */
  .mod-ico {
    display: inline-flex;
    width: 24px; height: 24px;
    vertical-align: -7px;
    margin-right: 9px;
    color: var(--niv-surface-2);
    flex: none;
  }
  .mod-ico svg { width: 24px; height: 24px; display: block; }
  .mod-ico .tile { fill: currentColor; }
  .mod-ico .glyph { fill: var(--niv-text-dim); transition: fill 0.15s; }
  .niv-nav-btn:hover .mod-ico { color: var(--niv-surface); }
  .niv-nav-btn.active .mod-ico { color: var(--niv-accent); }
  .niv-nav-btn.active .mod-ico .glyph { fill: #fff; }
  .mod-nav-label { display: inline; }

  /* Panel list sections (Proyectos, Clientes, Medidas): same component
     classes as the dashboard floating panel in niv-dark.css, plus the
     per section collapse rules and chevron that today live only in
     dashboard.html inline CSS. Present at every viewport width: no
     media query hides or reorders them. */
  .niv-mod-lists { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
  #side-shell .niv-mod-lists { margin-top: 16px; margin-bottom: 0; }
  .niv-panel-sec-title { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .niv-sec-chev {
    margin-left: auto; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--niv-border-soft);
    background: transparent; color: var(--niv-text-dim);
    font-size: 12px; line-height: 1; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    transition: transform 0.18s;
  }
  .niv-sec-chev:hover { color: var(--niv-text); }
  .niv-panel-sec.sec-collapsed .niv-sec-chev { transform: rotate(-90deg); }
  .niv-panel-sec.sec-collapsed .niv-sec-body { display: none; }
  .niv-snav-projects-body { display: none; }
  .niv-snav-projects-body.open { display: block; }

  /* Compact density (niv-compact-sidebar cookie or storage key = 1):
     same card, tighter rhythm. The dashboard shell keeps its own rail
     behavior; inside this module compact only densifies the card. */
  body.niv-mod-compact .niv-mod-side { padding: 18px 12px; gap: 8px; }
  body.niv-mod-compact .niv-nav-btn { padding: 10px 12px; }
  body.niv-mod-compact .niv-nav { gap: 8px; }
  body.niv-mod-compact .niv-nav-group { gap: 8px; }


  /* Drag and drop (niv-drag.js host layer): measure rows are drag
     sources, project rows and the drag only new project box are drop
     zones. Highlight state is painted here on host command
     (niv:draghover); geometry is reported to the host, which owns the
     pointer, the ghost and the write. */
  .niv-panel-item[data-measure-id] { cursor: grab; touch-action: none; }
  .niv-panel-item.niv-drag-src { opacity: 0.45; }
  .niv-panel-item.niv-drag-hover, .niv-drag-new.niv-drag-hover {
    background: var(--niv-surface-2);
    outline: 2px solid var(--niv-accent);
    outline-offset: -2px;
  }
  .niv-drag-new {
    display: none;
    align-items: center; justify-content: center; gap: 6px;
    margin-top: 6px; padding: 10px 12px;
    border: 1.5px dashed var(--niv-border);
    border-radius: 10px;
    color: var(--niv-text-dim);
    font-size: 13px; font-weight: 600;
    text-align: center;
  }
  body.niv-drag-active .niv-drag-new { display: flex; }

  /* Row context menus (v1.1): the "..." affordance is a real button
     opening a small menu with per-row actions. */
  .dots {
    flex: none;
    background: transparent;
    border: none;
    color: var(--niv-text-dim, #a7a7ad);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .dots:hover { background: var(--niv-surface-2, #1e1e22); color: var(--niv-text, #f5f5f7); }
  .row-menu {
    position: fixed;
    z-index: 1000;
    min-width: 180px;
    background: var(--niv-surface, #17171a);
    border: 1px solid var(--niv-border, rgba(255,255,255,0.28));
    border-radius: 12px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.5);
    padding: 6px;
  }
  .row-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--niv-text, #f5f5f7);
    font-size: 13px;
    font-family: inherit;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .row-menu-item:hover { background: var(--niv-surface-2, #1e1e22); }
  .row-menu-item.danger { color: #f87171; }
  .row-menu-item.danger:hover { background: rgba(229,72,77,0.12); }

  [hidden] { display: none !important; }
</style>

<script>
/* Early target guard (classic script, runs before the module script):
   in the markup above, the company aside is the only one NOT marked
   hidden, so any failure of the main module script before its
   visibility toggles run (a stale SW-substituted document, a blocked
   import) left the FULL workspace sidebar on screen in whatever page
   embedded the module, including the account settings page invoking
   it with target=user (incident 2026-10-12). Remove the non-selected
   asides from the DOM right here, before anything else can fail: in
   the user (settings) context the workspace asides then do not exist
   at all, and no later code or stylesheet can surface them. */
(function () {
  var t = new URLSearchParams(window.location.search).get('target');
  var target = (t === 'user' || t === 'shell') ? t : 'company';
  window.__nivSidebarTarget = target;
  document.body.setAttribute('data-target', target);
  var keep = target === 'user' ? 'side-user' : (target === 'shell' ? 'side-shell' : 'side-company');
  ['side-company', 'side-shell', 'side-user'].forEach(function (id) {
    if (id === keep) return;
    var el = document.getElementById(id);
    if (el) el.remove();
  });
})();
</script>
<script type="module">
/* modules/sidebar.html: settings tier sidebar module.
   Contract: see modules/README.md. Messages are { niv: 1, type, ... }
   and origins are validated against location.origin on both sides.
   Demo mode (?demo=1) never imports Firebase: it renders placeholder
   data only, so QA can screenshot the chrome without auth. */

function readKey(name) {
  /* Settings keys live in Domain=.nivelatolabs.com cookies; the same key
     in localStorage is the on origin fallback the older pages wrote. */
  try {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    if (m) return decodeURIComponent(m[1]);
  } catch (_) { /* cookies unavailable */ }
  try { return window.localStorage.getItem(name); } catch (_) { return null; }
}

/* ---------------- messaging ---------------- */
function post(msg) {
  if (window.parent === window) return;
  try { window.parent.postMessage(Object.assign({ niv: 1 }, msg), window.location.origin); } catch (_) { /* no host */ }
}

let resizeQueued = false;
function reportHeight() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    const card = document.querySelector('.niv-mod-side:not([hidden])');
    if (!card) return;
    /* Measure uncapped content height so an auto sizing host learns the
       true height even while the card is capped at a fixed height. */
    const prevMax = card.style.maxHeight;
    const prevHeight = card.style.height;
    card.style.maxHeight = 'none';
    card.style.height = 'auto';
    const h = Math.ceil(card.scrollHeight);
    card.style.maxHeight = prevMax;
    card.style.height = prevHeight;
    if (h > 0) post({ type: 'niv:resize', height: h });
  });
}

/* ---------------- active state ---------------- */
const NAV_KEYS_BY_PATH = {
  '/company/users': 'users',
  '/users': 'users',
  '/company/settings': 'settings',
  '/company/updates': 'updates',
  '/account/settings': 'account'
};
function keyFromValue(v) {
  if (!v) return null;
  const s = String(v);
  if (NAV_KEYS_BY_PATH[s]) return NAV_KEYS_BY_PATH[s];
  if (['users', 'settings', 'updates', 'billing', 'account', 'home', 'projects', 'notifications'].includes(s)) return s;
  try {
    const u = new URL(s, window.location.origin);
    return NAV_KEYS_BY_PATH[u.pathname] || null;
  } catch (_) { return null; }
}
/* One label, two destinations by target (IA rule): data-nav-key
   "users" is /company/users in the company aside and /users in the
   shell aside; the key marks the label, the aside owns the href. */
function setActiveCompany(key) {
  if (!key) return;
  activeKey = key;
  document.querySelectorAll('#side-company [data-nav-key], #side-shell [data-nav-key]').forEach((el) => {
    const on = el.getAttribute('data-nav-key') === key;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}
function setActiveSection(section) {
  if (!section) return;
  document.querySelectorAll('#side-user [data-section]').forEach((el) => {
    const on = el.getAttribute('data-section') === section;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
}
function inferActiveFromParent() {
  try {
    if (window.parent !== window) {
      const purl = new URL(window.parent.location.href);
      if (purl.pathname === '/dashboard.html' || purl.pathname === '/dashboard') {
        const view = purl.searchParams.get('view');
        if (['home', 'projects', 'notifications', 'users'].includes(view)) return view;
        return 'home';
      }
      return keyFromValue(purl.pathname);
    }
  } catch (_) { /* cross origin host: no inference */ }
  try {
    if (document.referrer) return keyFromValue(new URL(document.referrer).pathname);
  } catch (_) { /* no referrer */ }
  return null;
}

/* ---------------- clicks ---------------- */
/* Delegated: manager gated anchors do not exist in the DOM until the
   permission gate clones them in, so per element binding would miss
   them. */
let activeKey = null;
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('#side-company a[data-nav-key], #side-shell a[data-nav-key]');
  if (!a) return;
  post({ type: 'niv:nav', href: a.getAttribute('href') });
  /* Embedded: the host owns top frame navigation per the contract, so
     suppress the anchor default to avoid a double navigation. Standalone
     (or a no JS host): target=_top performs the navigation. */
  if (window.parent !== window) ev.preventDefault();
});
document.querySelectorAll('#side-user [data-section]').forEach((btn) => {
  btn.addEventListener('click', () => {

/* ---------------- init from host ---------------- */
window.addEventListener('message', (ev) => {
  if (ev.origin !== window.location.origin) return;
  const d = ev.data;
  if (!d || d.niv !== 1 || d.type !== 'niv:init') return;
  if (d.lang === 'es' || d.lang === 'en') { lang = d.lang; applyLang(); }
  if (TARGET === 'company' || TARGET === 'shell') {
    const key = keyFromValue(d.active);
    if (key) setActiveCompany(key);
  } else if (d.section) {
    setActiveSection(d.section);
  } else if (d.active) {
    setActiveSection(d.active);
  }
  reportHeight();
});

/* ---------------- company data ---------------- */
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function initialsOf(name) {
  const words = String(name || '').trim().split(/[\s._-]+/).filter(Boolean);
  if (!words.length) return '--';
  const first = words[0][0] || '';
  const second = words.length > 1 ? (words[1][0] || '') : (words[0][1] || '');
  return (first + second).toUpperCase();
}
let orgData = null;
const dataVersion = () => (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
/* Header version display: the version REGISTRY wins, never the org
   doc and never a hardcoded string. app_updates is public-read
   (SUPPORT_SURFACES.md section 3); the projection follows the org's
   update channel: beta orgs read app_updates/beta-latest, everyone
   else reads app_updates/backend when it carries a stable stamp (the
   same doc the new flow's testing watermark reads). The legacy
   app_updates/latest pointer predates the registry and its bare
   version field is stale (still the Oct 5 value), so it is
   deliberately NOT a display source. When the registry cannot be
   read, the header falls back to the repo VERSION value below (keep
   it in sync with the repo-root VERSION file). The org doc's
   dataVersion keeps its own job: it is the org's update-check state
   for the Updates dot, not a display string. */
const FALLBACK_VERSION = '1.1.0'; /* mirrors repo-root VERSION */
let displayVersion = null;
function paintVersion() {
  if (!orgData && !displayVersion) return; /* skeleton keeps its plain label until something real resolves */
  const v = displayVersion || dataVersion();
  document.querySelectorAll('.js-org-version').forEach((el) => { el.textContent = 'Nivelato v' + v; });
}
async function resolveRegistryVersion(db, fs, channel) {
  try {
    if (channel === 'beta') {
      const s = await fs.getDoc(fs.doc(db, 'app_updates', 'beta-latest'));
      if (s.exists()) {
        const d = s.data() || {};
        const v = d.friendlyVersion || d.version;
        if (v) return String(v);
      }
      return null;
    }
    const s = await fs.getDoc(fs.doc(db, 'app_updates', 'backend'));
    if (s.exists()) {
      const d = s.data() || {};
      if ((!d.channel || d.channel === 'stable') && d.friendlyVersion) return String(d.friendlyVersion);
    }
  } catch (_) { /* registry unreachable: the caller falls back */ }
  return null;
}
let versionKickStarted = false;
function kickVersionResolution(db, fs) {
  if (versionKickStarted) return;
  versionKickStarted = true;
  const channel = orgData && orgData.updateChannel ? String(orgData.updateChannel) : 'stable';
  resolveRegistryVersion(db, fs, channel).then((v) => {
    displayVersion = v || FALLBACK_VERSION;
    paintVersion();
  });
}
function renderCompanyHead() {
  const name = orgData && orgData.name ? orgData.name : L('companyFallback');
  document.querySelectorAll('.js-org-avatar').forEach((el) => { el.textContent = initialsOf(name); });
  document.querySelectorAll('.js-org-name').forEach((el) => {
    el.textContent = name;

  });

}

  const sub = document.getElementById('updates-sub');
  const dot = document.getElementById('updates-dot');
  if (!sub || !dot) return;
  sub.setAttribute('data-state', state);
  if (state === 'pending') { sub.textContent = L('newVersion'); dot.classList.add('on'); }
  else if (state === 'current') { sub.textContent = L('upToDate'); dot.classList.remove('on'); }
  else if (state === 'unknown') { sub.textContent = ''; dot.classList.remove('on'); }

}

/* ---------------- manager gate ----------------
   Manager only doors (Usuarios, Ajustes de la compañía, Updates) are
   cloned out of their templates ONLY when the gate passes. The gate is
   the pages own permission source: makePermChecker from
   /permissions.js run on the signed in users/{uid} doc (role plus
   explicit permissions, owner auto grant, exactly the _can semantics
   users.html and company/settings.html use). When the user doc cannot
   be read, the flowGate claims role (claims.role on the ID token) is
   the fallback source. When neither source resolves, the doors stay
   unrendered: fail closed. */
let managerRendered = false;
function renderManagerEntries() {
  if (managerRendered) return;
  managerRendered = true;
  document.querySelectorAll('template[data-manager-gate]').forEach((tpl) => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    tpl.replaceWith(node);
  });
  const sub = document.getElementById('updates-sub');
  if (sub) { sub.setAttribute('data-state', 'checking'); sub.textContent = L('checking'); }
  applyLang();
  if (activeKey) setActiveCompany(activeKey);
  reportHeight();
}

/* ---------------- panel list sections ----------------
   Proyectos, Clientes, Medidas in the dashboard panel order. Each
   section collapses individually (title or chevron), with state in the
   same localStorage record the dashboard uses ('niv-panel-sections',
   keyed by data-seckey). Proyectos additionally keeps the dashboard
   projects body semantics: #niv-snav-projects-body is .open exactly
   when its section is not collapsed. */
function initSections() {
  if (TARGET === 'user') return;
  let saved = {};
  try { saved = JSON.parse(window.localStorage.getItem('niv-panel-sections') || '{}'); } catch (_) {}
  document.querySelectorAll('.niv-mod-lists .niv-panel-sec').forEach((sec) => {
    const key = sec.getAttribute('data-seckey');
    const title = sec.querySelector('.niv-panel-sec-title');
    const chev = sec.querySelector('[data-chev]');
    const sync = () => {
      const collapsed = sec.classList.contains('sec-collapsed');
      if (key === 'projects') {
        const body = sec.querySelector('.niv-snav-projects-body');
        if (body) body.classList.toggle('open', !collapsed);
      }
      if (chev) {
        chev.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        chev.setAttribute('aria-label', L(collapsed ? 'expandSection' : 'collapseSection'));
      }
    };
    if (saved[key]) sec.classList.add('sec-collapsed');
    sync();
    const toggle = () => {
      sec.classList.toggle('sec-collapsed');
      saved[key] = sec.classList.contains('sec-collapsed');
      try { window.localStorage.setItem('niv-panel-sections', JSON.stringify(saved)); } catch (_) {}
      sync();
      reportHeight();
    };
    if (chev) chev.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    if (title) title.addEventListener('click', (e) => {
      if (e.target.closest('[data-chev]')) return;
      toggle();
    });
  });
}

/* ---------------- row context menus (v1.1) ----------------
   The "..." on each list row opens a real menu. Actions:
   - project: Open (host navigates), Rename (Firestore), Delete (confirm + Firestore)
   - customer: View details (host), New measurement (host)
   - measure: View (host), Delete (confirm + Firestore)
   Open/View go to the host via niv:row-open; the module falls back to a
   dashboard view navigation when embedded without a row-action handler.
   Rename/Delete run as Firestore writes from the module (rules enforce
   permissions; failures surface in the menu). */
let _rowMenuEl = null;
let _modDb = null, _modFs = null, _modOrgId = null;
function closeRowMenu() {
  if (_rowMenuEl && _rowMenuEl.parentNode) _rowMenuEl.parentNode.removeChild(_rowMenuEl);
  _rowMenuEl = null;
  document.removeEventListener('pointerdown', _rowMenuOutside, true);
}
function _rowMenuOutside(ev) {
  if (_rowMenuEl && !_rowMenuEl.contains(ev.target)) closeRowMenu();
}
function rowMenuOptions(kind) {
  if (kind === 'project') {
    return [
      { action: 'open', label: L('menuOpen'), danger: false },
      { action: 'rename', label: L('menuRename'), danger: false },
      { action: 'delete', label: L('menuDelete'), danger: true }
    ];
  }
  if (kind === 'customer') {
    return [
      { action: 'view', label: L('menuView'), danger: false },
      { action: 'new-measure', label: L('menuNewMeasure'), danger: false }
    ];
  }
  return [
    { action: 'view', label: L('menuView'), danger: false },
    { action: 'delete', label: L('menuDelete'), danger: true }
  ];
}
function openRowMenu(btn, kind, id, label) {
  closeRowMenu();
  const menu = document.createElement('div');
  menu.className = 'row-menu';
  menu.setAttribute('role', 'menu');
  rowMenuOptions(kind).forEach((opt) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'row-menu-item' + (opt.danger ? ' danger' : '');
    item.textContent = opt.label;
    item.setAttribute('role', 'menuitem');
    item.addEventListener('click', (ev) => {
      ev.stopPropagation();
      closeRowMenu();
      runRowAction(kind, opt.action, id, label);
    });
    menu.appendChild(item);
  });
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();
  const mw = 200;
  menu.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.right - mw)) + 'px';
  menu.style.top = Math.min(window.innerHeight - 160, r.bottom + 4) + 'px';
  _rowMenuEl = menu;
  document.addEventListener('pointerdown', _rowMenuOutside, true);
}
async function runRowAction(kind, action, id, label) {
  if (action === 'open' || action === 'view' || action === 'new-measure') {
    // Host-first: the shell owns the views. Fallback navigations below
    // are the sane defaults when no host handles the message.
    post({ type: 'niv:row-open', kind, action, id: id || null, label: label || '' });
    return;
  }
  if (!_modDb || !_modFs || !_modOrgId) return;
  const fs = _modFs, db = _modDb, orgId = _modOrgId;
  try {
    if (action === 'rename') {
      const next = window.prompt(L('renamePrompt', label), label);
      if (next === null) return;
      const name = String(next).trim();
      if (!name || name === label) return;
      if (kind === 'project' && id) {
        await fs.updateDoc(fs.doc(db, 'orgs', orgId, 'projects', id), { name });
      } else if (kind === 'measure' && id) {
        await fs.updateDoc(fs.doc(db, 'orgs', orgId, 'jobs', id), { project: name });
      } else {
        return;
      }
      if (window._modReloadLists) window._modReloadLists();
    } else if (action === 'delete') {
      if (!window.confirm(L('deleteConfirm', label))) return;
      if (kind === 'project' && id) {
        await fs.deleteDoc(fs.doc(db, 'orgs', orgId, 'projects', id));
      } else if (kind === 'measure' && id) {
        await fs.deleteDoc(fs.doc(db, 'orgs', orgId, 'jobs', id));
      } else {
        return;
      }
      if (window._modReloadLists) window._modReloadLists();
    }
  } catch (e) {
    window.alert(L(action === 'rename' ? 'renameFailed' : 'deleteFailed'));
  }
}
document.addEventListener('click', (ev) => {
  const btn = ev.target && ev.target.closest ? ev.target.closest('.niv-panel-item .dots') : null;
  if (!btn) return;
  ev.stopPropagation();
  ev.preventDefault();
  const row = btn.closest('.niv-panel-item');
  if (!row) return;
  const kind = row.getAttribute('data-kind') || 'project';
  const id = row.getAttribute('data-project-id') || row.getAttribute('data-measure-id') || null;
  const label = row.getAttribute('data-label') || '';
  openRowMenu(btn, kind, id, label);
});
/* Same data sources as the dashboard panel: orgs/{orgId}/projects for
   the projects list, orgs/{orgId}/jobs (newest first) feeding the
   unique customers list (max 5) and the recent measures list (max 5).
   List rows are display only in this module: no project or measure
   deep link exists at base, so opening items stays with the shell. */
async function loadLists(db, fs, orgId) {
  if (!orgId) return;
  _modDb = db; _modFs = fs; _modOrgId = orgId;
  window._modReloadLists = () => loadLists(db, fs, orgId);
  let projects = [];
  let jobs = [];
  try {
    const snap = await fs.getDocs(fs.collection(db, 'orgs', orgId, 'projects'));
    projects = snap.docs.map((d) => ({ id: d.id, name: (d.data() && d.data().name) || L('projectFallback') }));
  } catch (_) { /* empty state stays */ }
  try {
    const q = fs.query(fs.collection(db, 'orgs', orgId, 'jobs'), fs.orderBy('createdAt', 'desc'));
    const snap = await fs.getDocs(q);
    jobs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (_) { /* empty states stay */ }
  const customers = [...new Set(jobs.map((j) => j.customer).filter(Boolean))].slice(0, 5);
  const measures = jobs.slice(0, 5).map((j) => ({
    id: j.id,
    label: j.customer || j.project || L('measureFallback'),
    photo: !!j.annotatedPhoto
  }));
  renderLists({ projects, customers, measures });
}

function applyDemo() {
  if (TARGET === 'company' || TARGET === 'shell') {
    /* Placeholder org on the external flow, with a pending update, so a
       single screenshot exercises the head, the Billing entry, the live
       sub label and the dot. The demo persona is a manager, so the
       manager gate renders its doors in demo mode. */
    if (TARGET === 'company') renderManagerEntries();
    orgData = { name: L('demoCompany'), dataVersion: '1.0', flow: 'external' };
    renderCompanyHead();
    if (TARGET === 'company') {
      showBilling();
      setUpdatesState('pending');
      setActiveCompany(params.get('active') || 'users');
    } else {
      setActiveCompany(params.get('active') || 'home');
    }
    demoListsOn = true;
    renderDemoLists();
  } else {
    setActiveSection(params.get('section') || 'cuenta');
  }
  reportHeight();
}

/* Neutral skeleton head: signed out, Firebase unreachable, or auth
   still unresolved after the boot grace period. A later auth
   resolution re renders the head with real data. */
let authResolved = false;
function showSkeletonHead() {
  document.querySelectorAll('.js-org-name').forEach((el) => {
    el.textContent = 'Nivelato';
    el.removeAttribute('data-state');
  });
  document.querySelectorAll('.js-org-avatar').forEach((el) => { el.textContent = 'N'; });
  reportHeight();
}

async function initFirebase() {
  const [{ auth, db }, authMod, fsMod] = await Promise.all([
    import('/firebase-config.js'),
    import('https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js')
  ]);
  const { onAuthStateChanged } = authMod;
  const { getDoc, doc } = fsMod;
  onAuthStateChanged(auth, async (user) => {
    authResolved = true;
    if (!user) {
      /* No signed in user: static skeleton only, no redirect, no error.
         The registry is public-read, so the header version still
         resolves (stable channel default) instead of going stale. */
      kickVersionResolution(db, fsMod);
      showSkeletonHead();
      return;
    }
    /* Flow signals, strongest first. Billing renders ONLY on a proven
       external flow: any qgi signal wins, and an undetermined flow hides
       Billing (fail closed for QGI). */
    let claimsFlow = null;
    let claimsRole = null;
    let userData = null;
    try {
      const res = await user.getIdTokenResult();
      claimsFlow = res && res.claims && res.claims.flow ? String(res.claims.flow) : null;
      claimsRole = res && res.claims && res.claims.role ? String(res.claims.role) : null;
    } catch (_) { /* claims unreadable: other signals may still resolve */ }
    try {
      /* Best effort claim minting, same as the sibling pages, so org
         reads gated on flow claims can succeed. Fails soft. */
      const geo = await import('/geo.js');
      await geo.ensureFlowClaims();
      const res2 = await user.getIdTokenResult();
      if (res2 && res2.claims && res2.claims.flow) claimsFlow = String(res2.claims.flow);
      if (res2 && res2.claims && res2.claims.role) claimsRole = String(res2.claims.role);
    } catch (_) { /* geo helper unavailable: continue with what we have */ }
    try {
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      userData = userSnap.exists() ? userSnap.data() : null;
    } catch (_) { /* skeleton stays */ }
    const orgId = userData && userData.orgId;
    if (orgId) {
      try {
        const orgSnap = await getDoc(doc(db, 'orgs', orgId));
        orgData = orgSnap.exists() ? orgSnap.data() : {};
      } catch (_) { orgData = orgData || {}; }
    }
    if (TARGET === 'company' || TARGET === 'shell') {
      renderCompanyHead();
      kickVersionResolution(db, fsMod);
      loadLists(db, fsMod, orgId);
    }
    if (TARGET === 'company') {
      /* Permission gate (see renderManagerEntries): the user doc is the
         primary source, claims.role the fallback, unknown stays shut. */
      let canManage = false;
      try {
        const permsMod = await import('/permissions.js');
        const src = userData || (claimsRole ? { role: claimsRole } : null);
        if (src) canManage = permsMod.makePermChecker(src)('userManagement') === true;
      } catch (_) { canManage = false; }
      if (canManage) renderManagerEntries();
      const qgiSignal = claimsFlow === 'qgi'
        || (orgData && orgData.flow === 'qgi')
        || (userData && (userData.isQGC === true || userData.company === 'qgc'))
        || (orgData && orgData.flow === undefined && orgId === 'NJBBG5');
      const externalSignal = claimsFlow === 'external' || (orgData && orgData.flow === 'external');
      if (!qgiSignal && externalSignal) showBilling();
      /* Updates sub label and dot: same reads and semantics as
         users.html renderUpdatesDot (app_updates/latest vs the org
         dataVersion, default 0.9). Manager gated, like the entry. */
      if (canManage) {
        try {
          const latestSnap = await getDoc(doc(db, 'app_updates', 'latest'));
          const latest = latestSnap.exists() ? latestSnap.data() : null;
          const pending = !!(latest && latest.version && dataVersion() !== String(latest.version));
          setUpdatesState(pending ? 'pending' : 'current');
        } catch (_) {
          setUpdatesState('unknown');
        }
      }
    }
    reportHeight();
  });
}


/* ---------------- drag and drop (host layer: niv-drag.js) ----------------
   This module never tracks the pointer itself: HTML5 drag does not cross
   iframes and Pointer Events inside the module would die at the iframe
   edge. Instead the module is the geometry and paint side of the locked
   contract (see modules/README.md, Drag and drop messages):
   - pointerdown on a Medidas row posts niv:dragstart {measureId, label};
     the host raises a shield over this iframe and owns the gesture.
   - niv:dragactive {on} reveals the drag only "Nuevo proyecto" zone.
   - niv:dropzones-request gets a niv:dropzones reply with project zone
     rects (module coordinates) and the scroll region rect; the module
     re-reports on scroll and on a 150ms cadence while a drag is active.
   - niv:draghover {zoneId|null} paints the highlight (a project id or
     'new'); niv:dragscroll {dy} scrolls the region by dy pixels.
   - Escape inside the module while a drag is active posts
     niv:dragcancel, because the keydown never reaches the host. */
let dragActiveMod = false;
let dzTimer = null;
let dzScrollQueued = false;
function visibleAside() { return document.querySelector('.niv-mod-side:not([hidden])'); }
function rectOf(el) {
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { x: r.x, y: r.y, width: r.width, height: r.height };
}
function reportDropZones() {
  if (!dragActiveMod) return;
  const aside = visibleAside();
  if (!aside) return;
  const zones = [];
  aside.querySelectorAll('[data-project-id]').forEach((el) => {
    const span = el.querySelector('span');
    zones.push({ id: el.getAttribute('data-project-id'), name: span ? span.textContent.trim() : '', rect: rectOf(el) });
  });
  const nz = aside.querySelector('[data-new-zone]');
  if (nz && !nz.hidden && nz.offsetParent !== null) zones.push({ id: 'new', name: L('newProject'), rect: rectOf(nz) });
  const scroller = aside.querySelector('.niv-mod-scroll');
  post({ type: 'niv:dropzones', zones: zones, scrollRegion: rectOf(scroller) });
}
function reportDropZonesSoon() {
  if (dzScrollQueued) return;
  dzScrollQueued = true;
  setTimeout(() => { dzScrollQueued = false; reportDropZones(); }, 100);
}
function paintDragHover(zoneId) {
  const aside = visibleAside();
  if (!aside) return;
  aside.querySelectorAll('.niv-drag-hover').forEach((el) => el.classList.remove('niv-drag-hover'));
  if (!zoneId) return;
  const el = zoneId === 'new'
    ? aside.querySelector('[data-new-zone]')
    : aside.querySelector('[data-project-id="' + CSS.escape(zoneId) + '"]');
  if (el) el.classList.add('niv-drag-hover');
}
function setDragActive(on) {
  dragActiveMod = !!on;
  document.body.classList.toggle('niv-drag-active', dragActiveMod);
  document.querySelectorAll('[data-new-zone]').forEach((z) => { z.hidden = !dragActiveMod; });
  if (dragActiveMod) {
    reportDropZones();
    if (dzTimer) clearInterval(dzTimer);
    dzTimer = setInterval(reportDropZones, 150);
  } else {
    if (dzTimer) { clearInterval(dzTimer); dzTimer = null; }
    paintDragHover(null);
    document.querySelectorAll('.niv-drag-src').forEach((el) => el.classList.remove('niv-drag-src'));
  }
  /* No reportHeight here: its uncapped measurement would reset the
     scroll region's scrollTop mid flow. Zone geometry is reported
     through niv:dropzones while a drag is active. */
}
/* A gesture that starts inside this iframe keeps its pointer events
   in this document (the iframe holds the pointer for the gesture), so
   the host shield never sees the moves. While a measure press is in
   flight the module therefore forwards its own pointermove and
   pointerup to the host in module coordinates; the host converts with
   the iframe rect and drives the drag from there. */
let srcPressed = false;
document.addEventListener('pointerdown', (ev) => {
  if (TARGET === 'user') return;
  const row = ev.target.closest ? ev.target.closest('[data-measure-id]') : null;
  if (!row) return;
  srcPressed = true;
  row.classList.add('niv-drag-src');
  post({ type: 'niv:dragstart', measureId: row.getAttribute('data-measure-id'), label: row.getAttribute('data-measure-label') || row.textContent.trim() });
});
document.addEventListener('pointermove', (ev) => {
  if (!srcPressed) return;
  post({ type: 'niv:dragmove', x: ev.clientX, y: ev.clientY });
});
document.addEventListener('pointerup', (ev) => {
  if (srcPressed) {
    srcPressed = false;
    post({ type: 'niv:dragup', x: ev.clientX, y: ev.clientY });
  }
  if (!dragActiveMod) document.querySelectorAll('.niv-drag-src').forEach((el) => el.classList.remove('niv-drag-src'));
});
document.addEventListener('pointercancel', () => {
  if (srcPressed) { srcPressed = false; post({ type: 'niv:dragcancel' }); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && dragActiveMod) post({ type: 'niv:dragcancel' });
});
document.querySelectorAll('.niv-mod-scroll').forEach((sc) => {
  sc.addEventListener('scroll', () => { if (dragActiveMod) reportDropZonesSoon(); }, { passive: true });
});
window.addEventListener('message', (ev) => {
  if (ev.origin !== window.location.origin) return;
  const d = ev.data;
  if (!d || d.niv !== 1) return;
  if (d.type === 'niv:dragactive') setDragActive(d.on === true);
  else if (d.type === 'niv:dropzones-request') reportDropZones();
  else if (d.type === 'niv:draghover') paintDragHover(d.zoneId || null);
  else if (d.type === 'niv:dragscroll') {
    const aside = visibleAside();
    const sc = aside && aside.querySelector('.niv-mod-scroll');
    if (sc && typeof d.dy === 'number' && isFinite(d.dy)) { sc.scrollTop += d.dy; reportDropZonesSoon(); }
  }
});

/* ---------------- boot ---------------- */
document.querySelectorAll('.js-org-name').forEach((el) => el.setAttribute('data-state', 'loading'));
/* updates-sub lives inside the manager gate template until the gate
   passes; its checking state is stamped when it is cloned in. */
applyLang();
initSections();
if (TARGET === 'company' || TARGET === 'shell') {
  setActiveCompany(keyFromValue(params.get('active')) || inferActiveFromParent());
} else {
  setActiveSection(params.get('section') || 'cuenta');
}
post({ type: 'niv:ready', target: TARGET });
reportHeight();
window.addEventListener('resize', reportHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight).catch(() => {});
const card = document.querySelector('.niv-mod-side:not([hidden])');
if (card && window.ResizeObserver) new ResizeObserver(reportHeight).observe(card);

if (DEMO) {
  applyDemo();
} else if (TARGET === 'company' || TARGET === 'shell') {
  initFirebase().catch(() => { showSkeletonHead(); });
  /* If the Firebase imports hang (offline, CDN blocked), the loading
     text must not stick forever: fall back to the neutral skeleton. */
  setTimeout(() => { if (!authResolved) showSkeletonHead(); }, 8000);
}
/* The user target never needs Firebase: it is pure in page navigation. */

/* QA handle: lets a headless harness exercise the registry resolver
   with stubbed Firestore reads (the module's live path needs a
   signed in org session, which a harness does not have). */
window.NivSidebarModule = { resolveRegistryVersion: resolveRegistryVersion, FALLBACK_VERSION: FALLBACK_VERSION };
</script>
</body>
