<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0e0e10" />
<link rel="icon" href="/icon-192.png" />
<title>Nivelato - Sidebar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/niv-dark.css" />
<style>
  /* Module chrome: the iframe document is exactly one floating card.
     The host owns placement and inset; the card fills the iframe box. */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--niv-bg);
    color: var(--niv-text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .niv-mod-side {
    height: 100%;
    max-height: 100%;
    overflow: hidden; /* scrolling lives in .niv-mod-scroll, not the card */
  }
  /* Internal scroll region (company target at fixed height). Thin
     scrollbar treatment matching the topbar tab strip in niv-dark.css
     consumers (scrollbar-width plus a themed webkit thumb). */
  .niv-mod-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--niv-border) transparent;
  }
  .niv-mod-scroll::-webkit-scrollbar { width: 8px; }
  .niv-mod-scroll::-webkit-scrollbar-thumb {
    background: var(--niv-surface-2);
    border: 1px solid var(--niv-border-soft);
    border-radius: 999px;
  }
  .niv-mod-scroll::-webkit-scrollbar-track { background: transparent; }
  /* User target: the card is content sized and the host iframe grows via
     niv:resize, so no inner scrollbar is wanted there. */
  body[data-target="user"] .niv-mod-scroll { overflow-y: visible; }

  /* Nav icons: the dashboard panel treatment. The tile takes a theme
     token (currentColor on the wrapper), the glyph sits dim on it, and
     the active item flips the tile to the accent token with a white
     glyph. No per item hardcoded colors. */
  .mod-ico {
    display: inline-flex;
    width: 24px; height: 24px;
    vertical-align: -7px;
    margin-right: 9px;
    color: var(--niv-surface-2);
    flex: none;
  }
  .mod-ico svg { width: 24px; height: 24px; display: block; }
  .mod-ico .tile { fill: currentColor; }
  .mod-ico .glyph { fill: var(--niv-text-dim); transition: fill 0.15s; }
  .niv-nav-btn:hover .mod-ico { color: var(--niv-surface); }
  .niv-nav-btn.active .mod-ico { color: var(--niv-accent); }
  .niv-nav-btn.active .mod-ico .glyph { fill: #fff; }
  .mod-nav-label { display: inline; }

  /* Panel list sections (Proyectos, Clientes, Medidas): same component
     classes as the dashboard floating panel in niv-dark.css, plus the
     per section collapse rules and chevron that today live only in
     dashboard.html inline CSS. Present at every viewport width: no
     media query hides or reorders them. */
  .niv-mod-lists { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
  .niv-panel-sec-title { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .niv-sec-chev {
    margin-left: auto; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--niv-border-soft);
    background: transparent; color: var(--niv-text-dim);
    font-size: 12px; line-height: 1; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    transition: transform 0.18s;
  }
  .niv-sec-chev:hover { color: var(--niv-text); }
  .niv-panel-sec.sec-collapsed .niv-sec-chev { transform: rotate(-90deg); }
  .niv-panel-sec.sec-collapsed .niv-sec-body { display: none; }
  #niv-snav-projects-body { display: none; }
  #niv-snav-projects-body.open { display: block; }

  /* Compact density (niv-compact-sidebar cookie or storage key = 1):
     same card, tighter rhythm. The dashboard shell keeps its own rail
     behavior; inside this module compact only densifies the card. */
  body.niv-mod-compact .niv-mod-side { padding: 18px 12px; gap: 8px; }
  body.niv-mod-compact .niv-nav-btn { padding: 10px 12px; }
  body.niv-mod-compact .niv-nav { gap: 8px; }
  body.niv-mod-compact .niv-nav-group { gap: 8px; }

  [hidden] { display: none !important; }
</style>
</head>
<body data-target="company">

  <!-- ======================= target=company ======================= -->
  <aside class="niv-side niv-mod-side" id="side-company" aria-label="Company navigation">
    <div class="niv-side-head">
      <div class="niv-company-avatar" id="org-avatar">--</div>
      <div>
        <div class="niv-company-name" id="org-name">Loading...</div>
        <div class="niv-company-ver" id="org-version">Nivelato</div>
      </div>
    </div>
    <div class="niv-mod-scroll" id="company-scroll">
      <!-- Panel list sections, in the dashboard panel order:
           Proyectos (expandable), then Clientes, then Medidas. -->
      <div class="niv-mod-lists" id="mod-lists">
        <div class="niv-panel-sec" data-seckey="projects">
          <div class="niv-panel-sec-title"><span data-i18n="secProjects">Proyectos</span><button class="niv-sec-chev" type="button" data-chev aria-label="Colapsar sección">▾</button></div>
          <div id="niv-snav-projects-body" class="open"><div id="niv-panel-projects"><div class="niv-panel-empty" data-i18n="emptyProjects">Sin proyectos</div></div></div>
        </div>
        <div class="niv-panel-sec" data-seckey="customers">
          <div class="niv-panel-sec-title"><span data-i18n="secCustomers">Clientes</span><button class="niv-sec-chev" type="button" data-chev aria-label="Colapsar sección">▾</button></div>
          <div class="niv-sec-body" id="niv-panel-customers"><div class="niv-panel-empty" data-i18n="emptyCustomers">Sin clientes</div></div>
        </div>

          <div class="niv-panel-sec-title"><span data-i18n="secMeasures">Medidas</span><button class="niv-sec-chev" type="button" data-chev aria-label="Colapsar sección">▾</button></div>
          <div class="niv-sec-body" id="niv-panel-measures"><div class="niv-panel-empty" data-i18n="emptyMeasures">Sin medidas</div></div>
        </div>
      </div>
      <nav class="niv-nav" aria-label="Settings">
        <div class="niv-nav-group">
          <div class="niv-nav-group-title" data-i18n="groupCompany">Compañía</div>
          <!-- Manager only doors (Usuarios, Ajustes de la compañía,
               Updates) live in templates: they are NOT rendered at all
               until the in module permission gate passes. See README. -->
          <template data-manager-gate="users"><a class="niv-nav-btn" href="/company/users" target="_top" data-nav-key="users"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M9.2 6.1a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4zM3.9 18.7c.7-3.1 2.8-4.7 5.3-4.7s4.6 1.6 5.3 4.7zM16.6 7.6a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zM15.9 14.3c2.1.3 3.7 1.8 4.3 4.4h-4.5c.35-1.6.42-3.05.2-4.4z"/></svg></span><span class="mod-nav-label" data-i18n="users">Usuarios</span></a></template>
          <template data-manager-gate="settings"><a class="niv-nav-btn" href="/company/settings" target="_top" data-nav-key="settings"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><rect class="glyph" x="4.6" y="6.1" width="14.8" height="1.9" rx="0.95"/><rect class="glyph" x="4.6" y="11.05" width="14.8" height="1.9" rx="0.95"/><rect class="glyph" x="4.6" y="16" width="14.8" height="1.9" rx="0.95"/><circle class="glyph" cx="9" cy="7.05" r="2.1"/><circle class="glyph" cx="15" cy="12" r="2.1"/><circle class="glyph" cx="8" cy="16.95" r="2.1"/></svg></span><span class="mod-nav-label" data-i18n="companySettings">Ajustes de la compañía</span></a></template>
          <template data-manager-gate="updates"><a class="niv-nav-btn" href="/company/updates" target="_top" data-nav-key="updates" id="nav-updates"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M11 4.8h2v7.4l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4L11 12.2zM5.4 17.4h13.2v1.9H5.4z"/></svg></span><span class="mod-nav-label" data-i18n="updates">Updates</span><span class="nav-sub" id="updates-sub">Comprobando...</span><span class="dot" id="updates-dot"></span></a></template>
          <span id="billing-slot" hidden><button class="niv-nav-btn soon" type="button" disabled id="nav-billing"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" fill-rule="evenodd" d="M4.9 6.9A1.9 1.9 0 0 1 6.8 5h10.4a1.9 1.9 0 0 1 1.9 1.9v10.2a1.9 1.9 0 0 1-1.9 1.9H6.8a1.9 1.9 0 0 1-1.9-1.9zm1.9 2v6.2h10.4V8.9z"/></svg></span><span class="mod-nav-label" data-i18n="billing">Billing</span><span class="soon-badge" data-i18n="soon">soon</span></button></span>
        </div>
        <div class="niv-nav-group">
          <div class="niv-nav-group-title" data-i18n="groupAccount">Cuenta</div>
          <a class="niv-nav-btn" href="/account/settings" target="_top" data-nav-key="account"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M12 6.2a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8zM5 19.2c.8-3.4 3.6-5.2 7-5.2s6.2 1.8 7 5.2z"/></svg></span><span class="mod-nav-label" data-i18n="myAccount">Mi cuenta</span></a>
        </div>
      </nav>
    </div>
  </aside>

  <!-- ======================= target=user ======================= -->
  <aside class="niv-side niv-mod-side" id="side-user" aria-label="Account settings" hidden>
    <div class="niv-mod-scroll" id="user-scroll">
      <nav class="niv-nav" aria-label="Account settings">
        <div class="niv-nav-group">
          <div class="niv-nav-group-title" data-i18n="groupAccountSettings">Mi cuenta</div>
          <button class="niv-nav-btn mod-section-btn" type="button" data-section="cuenta"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M12 6.2a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8zM5 19.2c.8-3.4 3.6-5.2 7-5.2s6.2 1.8 7 5.2z"/></svg></span><span class="mod-nav-label" data-i18n="secCuenta">Cuenta</span></button>
          <button class="niv-nav-btn mod-section-btn" type="button" data-section="notificaciones"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M12 4.2a5.3 5.3 0 0 0-5.3 5.3v3L5.2 15.5a.75.75 0 0 0 .67 1.1h12.26a.75.75 0 0 0 .67-1.1l-1.5-3v-3A5.3 5.3 0 0 0 12 4.2zM10.1 18.6a1.9 1.9 0 0 0 3.8 0z"/></svg></span><span class="mod-nav-label" data-i18n="secNotificaciones">Notificaciones</span></button>
          <button class="niv-nav-btn mod-section-btn" type="button" data-section="interfaz"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><rect class="glyph" x="4.6" y="6.1" width="14.8" height="1.9" rx="0.95"/><rect class="glyph" x="4.6" y="11.05" width="14.8" height="1.9" rx="0.95"/><rect class="glyph" x="4.6" y="16" width="14.8" height="1.9" rx="0.95"/><circle class="glyph" cx="9" cy="7.05" r="2.1"/><circle class="glyph" cx="15" cy="12" r="2.1"/><circle class="glyph" cx="8" cy="16.95" r="2.1"/></svg></span><span class="mod-nav-label" data-i18n="secInterfaz">Interfaz</span></button>
          <button class="niv-nav-btn mod-section-btn" type="button" data-section="seguridad"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M8.2 10.2V7.6a3.8 3.8 0 0 1 7.6 0v2.6h.6a1.9 1.9 0 0 1 1.9 1.9v5.6a1.9 1.9 0 0 1-1.9 1.9H7.6a1.9 1.9 0 0 1-1.9-1.9v-5.6a1.9 1.9 0 0 1 1.9-1.9zm1.9 0h3.8V7.6a1.9 1.9 0 1 0-3.8 0zm1.9 2.5a1.7 1.7 0 0 0-.9 3.1v1.4h1.8v-1.4a1.7 1.7 0 0 0-.9-3.1z"/></svg></span><span class="mod-nav-label" data-i18n="secSeguridad">Seguridad</span></button>
          <button class="niv-nav-btn mod-section-btn" type="button" data-section="datos-privacidad"><span class="mod-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect class="tile" width="24" height="24" rx="6"/><path class="glyph" d="M12 3.8l7 2.6v5.4c0 4.3-2.9 7.2-7 8.4-4.1-1.2-7-4.1-7-8.4V6.4z"/></svg></span><span class="mod-nav-label" data-i18n="secDatos">Datos y privacidad</span></button>
        </div>
      </nav>
    </div>
  </aside>

<script type="module">
/* modules/sidebar.html: settings tier sidebar module.
   Contract: see modules/README.md. Messages are { niv: 1, type, ... }
   and origins are validated against location.origin on both sides.
   Demo mode (?demo=1) never imports Firebase: it renders placeholder
   data only, so QA can screenshot the chrome without auth. */
const params = new URLSearchParams(window.location.search);
const TARGET = params.get('target') === 'user' ? 'user' : 'company';
const DEMO = params.get('demo') === '1';

const STRINGS = {
  es: {
    title: 'Nivelato - Ajustes',
    groupCompany: 'Compañía', groupAccount: 'Cuenta', groupAccountSettings: 'Mi cuenta',
    users: 'Usuarios', companySettings: 'Ajustes de la compañía', updates: 'Updates',
    billing: 'Billing', soon: 'soon', myAccount: 'Mi cuenta',
    loading: 'Cargando...', companyFallback: 'Compañía',
    checking: 'Comprobando...', newVersion: 'Nueva versión disponible', upToDate: 'Actualizado',
    secCuenta: 'Cuenta', secNotificaciones: 'Notificaciones', secInterfaz: 'Interfaz',
    secSeguridad: 'Seguridad', secDatos: 'Datos y privacidad',
    secProjects: 'Proyectos', secCustomers: 'Clientes', secMeasures: 'Medidas',
    emptyProjects: 'Sin proyectos', emptyCustomers: 'Sin clientes', emptyMeasures: 'Sin medidas',
    collapseSection: 'Colapsar sección', expandSection: 'Expandir sección',
    measureFallback: 'Medida', projectFallback: 'Proyecto',
    demoCompany: 'Compañía de ejemplo',
    demoProject: 'Proyecto de ejemplo', demoCustomer: 'Cliente de ejemplo', demoMeasure: 'Medida de ejemplo',
    ariaCompany: 'Navegación de la compañía', ariaSettings: 'Ajustes', ariaAccountSettings: 'Ajustes de la cuenta'
  },
  en: {
    title: 'Nivelato - Settings',
    groupCompany: 'Company', groupAccount: 'Account', groupAccountSettings: 'My account',
    users: 'Users', companySettings: 'Company settings', updates: 'Updates',
    billing: 'Billing', soon: 'soon', myAccount: 'My account',
    loading: 'Loading...', companyFallback: 'Company',
    checking: 'Checking...', newVersion: 'New version available', upToDate: 'Up to date',
    secCuenta: 'Account', secNotificaciones: 'Notifications', secInterfaz: 'Interface',
    secSeguridad: 'Security', secDatos: 'Data and privacy',
    secProjects: 'Projects', secCustomers: 'Customers', secMeasures: 'Measurements',
    emptyProjects: 'No projects', emptyCustomers: 'No customers', emptyMeasures: 'No measurements',
    collapseSection: 'Collapse section', expandSection: 'Expand section',
    measureFallback: 'Measurement', projectFallback: 'Project',
    demoCompany: 'Example Company',
    demoProject: 'Example project', demoCustomer: 'Example customer', demoMeasure: 'Example measurement',
    ariaCompany: 'Company navigation', ariaSettings: 'Settings', ariaAccountSettings: 'Account settings'
  }
};

function readKey(name) {
  /* Settings keys live in Domain=.nivelatolabs.com cookies; the same key
     in localStorage is the on origin fallback the older pages wrote. */
  try {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    if (m) return decodeURIComponent(m[1]);
  } catch (_) { /* cookies unavailable */ }
  try { return window.localStorage.getItem(name); } catch (_) { return null; }
}

let lang = (() => {
  const q = params.get('lang');
  if (q === 'es' || q === 'en') return q;
  return readKey('nivelato-login-lang') === 'en' ? 'en' : 'es';
})();
const L = (key) => (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.es[key] || key;

if (readKey('niv-compact-sidebar') === '1') document.body.classList.add('niv-mod-compact');
document.body.setAttribute('data-target', TARGET);
document.getElementById('side-company').hidden = TARGET !== 'company';
document.getElementById('side-user').hidden = TARGET !== 'user';

function applyLang() {
  document.documentElement.lang = lang;
  document.title = L('title');
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const k = el.getAttribute('data-i18n');
    if (STRINGS.es[k] !== undefined) el.textContent = L(k);
  });
  const sideCo = document.getElementById('side-company');
  if (sideCo) sideCo.setAttribute('aria-label', L('ariaCompany'));
  const sideUser = document.getElementById('side-user');
  if (sideUser) sideUser.setAttribute('aria-label', L('ariaAccountSettings'));
  const coNav = document.querySelector('#side-company .niv-nav');
  if (coNav) coNav.setAttribute('aria-label', L('ariaSettings'));
  const userNav = document.querySelector('#side-user .niv-nav');
  if (userNav) userNav.setAttribute('aria-label', L('ariaAccountSettings'));
  document.querySelectorAll('[data-chev]').forEach((chev) => {
    const sec = chev.closest('.niv-panel-sec');
    const collapsed = !!(sec && sec.classList.contains('sec-collapsed'));
    chev.setAttribute('aria-label', L(collapsed ? 'expandSection' : 'collapseSection'));
    chev.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  });
  if (typeof lastLists !== 'undefined' && lastLists) renderLists(lastLists);
  if (typeof demoListsOn !== 'undefined' && demoListsOn) renderDemoLists();
  const nameEl = document.getElementById('org-name');
  if (nameEl && nameEl.getAttribute('data-state') === 'loading') nameEl.textContent = L('loading');
  const sub = document.getElementById('updates-sub');
  if (sub && sub.getAttribute('data-state') === 'checking') sub.textContent = L('checking');
  if (sub && sub.getAttribute('data-state') === 'pending') sub.textContent = L('newVersion');
  if (sub && sub.getAttribute('data-state') === 'current') sub.textContent = L('upToDate');
}

/* ---------------- messaging ---------------- */
function post(msg) {
  if (window.parent === window) return;
  try { window.parent.postMessage(Object.assign({ niv: 1 }, msg), window.location.origin); } catch (_) { /* no host */ }
}

let resizeQueued = false;
function reportHeight() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    const card = document.querySelector('.niv-mod-side:not([hidden])');
    if (!card) return;
    /* Measure uncapped content height so an auto sizing host learns the
       true height even while the card is capped at a fixed height. */
    const prevMax = card.style.maxHeight;
    const prevHeight = card.style.height;
    card.style.maxHeight = 'none';
    card.style.height = 'auto';
    const h = Math.ceil(card.scrollHeight);
    card.style.maxHeight = prevMax;
    card.style.height = prevHeight;
    if (h > 0) post({ type: 'niv:resize', height: h });
  });
}

/* ---------------- active state ---------------- */
const NAV_KEYS_BY_PATH = {
  '/company/users': 'users',
  '/company/settings': 'settings',
  '/company/updates': 'updates',
  '/account/settings': 'account'
};
function keyFromValue(v) {
  if (!v) return null;
  const s = String(v);
  if (NAV_KEYS_BY_PATH[s]) return NAV_KEYS_BY_PATH[s];
  if (['users', 'settings', 'updates', 'billing', 'account'].includes(s)) return s;
  try {
    const u = new URL(s, window.location.origin);
    return NAV_KEYS_BY_PATH[u.pathname] || null;
  } catch (_) { return null; }
}
function setActiveCompany(key) {
  if (!key) return;
  activeKey = key;
  document.querySelectorAll('#side-company [data-nav-key]').forEach((el) => {
    const on = el.getAttribute('data-nav-key') === key;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}
function setActiveSection(section) {
  if (!section) return;
  document.querySelectorAll('#side-user [data-section]').forEach((el) => {
    const on = el.getAttribute('data-section') === section;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
}
function inferActiveFromParent() {
  try {
    if (window.parent !== window) return keyFromValue(window.parent.location.pathname);
  } catch (_) { /* cross origin host: no inference */ }
  try {
    if (document.referrer) return keyFromValue(new URL(document.referrer).pathname);
  } catch (_) { /* no referrer */ }
  return null;
}

/* ---------------- clicks ---------------- */
/* Delegated: manager gated anchors do not exist in the DOM until the
   permission gate clones them in, so per element binding would miss
   them. */
let activeKey = null;
document.getElementById('side-company').addEventListener('click', (ev) => {
  const a = ev.target.closest('a[data-nav-key]');
  if (!a) return;
  post({ type: 'niv:nav', href: a.getAttribute('href') });
  /* Embedded: the host owns top frame navigation per the contract, so
     suppress the anchor default to avoid a double navigation. Standalone
     (or a no JS host): target=_top performs the navigation. */
  if (window.parent !== window) ev.preventDefault();
});
document.querySelectorAll('#side-user [data-section]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const section = btn.getAttribute('data-section');
    setActiveSection(section);
    post({ type: 'niv:section', section });
  });
});

/* ---------------- init from host ---------------- */
window.addEventListener('message', (ev) => {
  if (ev.origin !== window.location.origin) return;
  const d = ev.data;
  if (!d || d.niv !== 1 || d.type !== 'niv:init') return;
  if (d.lang === 'es' || d.lang === 'en') { lang = d.lang; applyLang(); }
  if (TARGET === 'company') {
    const key = keyFromValue(d.active);
    if (key) setActiveCompany(key);
  } else if (d.section) {
    setActiveSection(d.section);
  } else if (d.active) {
    setActiveSection(d.active);
  }
  reportHeight();
});

/* ---------------- company data ---------------- */
const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function initialsOf(name) {
  const words = String(name || '').trim().split(/[\s._-]+/).filter(Boolean);
  if (!words.length) return '--';
  const first = words[0][0] || '';
  const second = words.length > 1 ? (words[1][0] || '') : (words[0][1] || '');
  return (first + second).toUpperCase();
}
let orgData = null;
const dataVersion = () => (orgData && orgData.dataVersion) ? String(orgData.dataVersion) : '0.9';
function renderCompanyHead() {
  const name = orgData && orgData.name ? orgData.name : L('companyFallback');
  const avatar = document.getElementById('org-avatar');
  const nameEl = document.getElementById('org-name');
  avatar.textContent = initialsOf(name);
  nameEl.textContent = name;
  nameEl.removeAttribute('data-state');
  document.getElementById('org-version').textContent = 'Nivelato v' + dataVersion();
}
function setUpdatesState(state) {
  const sub = document.getElementById('updates-sub');
  const dot = document.getElementById('updates-dot');
  if (!sub || !dot) return;
  sub.setAttribute('data-state', state);
  if (state === 'pending') { sub.textContent = L('newVersion'); dot.classList.add('on'); }
  else if (state === 'current') { sub.textContent = L('upToDate'); dot.classList.remove('on'); }
  else if (state === 'unknown') { sub.textContent = ''; dot.classList.remove('on'); }
  reportHeight();
}
function showBilling() {
  const slot = document.getElementById('billing-slot');
  if (slot) slot.hidden = false;
  reportHeight();
}

/* ---------------- manager gate ----------------
   Manager only doors (Usuarios, Ajustes de la compañía, Updates) are
   cloned out of their templates ONLY when the gate passes. The gate is
   the pages own permission source: makePermChecker from
   /permissions.js run on the signed in users/{uid} doc (role plus
   explicit permissions, owner auto grant, exactly the _can semantics
   users.html and company/settings.html use). When the user doc cannot
   be read, the flowGate claims role (claims.role on the ID token) is
   the fallback source. When neither source resolves, the doors stay
   unrendered: fail closed. */
let managerRendered = false;
function renderManagerEntries() {
  if (managerRendered) return;
  managerRendered = true;
  document.querySelectorAll('template[data-manager-gate]').forEach((tpl) => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    tpl.replaceWith(node);
  });
  const sub = document.getElementById('updates-sub');
  if (sub) { sub.setAttribute('data-state', 'checking'); sub.textContent = L('checking'); }
  applyLang();
  if (activeKey) setActiveCompany(activeKey);
  reportHeight();
}

/* ---------------- panel list sections ----------------
   Proyectos, Clientes, Medidas in the dashboard panel order. Each
   section collapses individually (title or chevron), with state in the
   same localStorage record the dashboard uses ('niv-panel-sections',
   keyed by data-seckey). Proyectos additionally keeps the dashboard
   projects body semantics: #niv-snav-projects-body is .open exactly
   when its section is not collapsed. */
function initSections() {
  if (TARGET !== 'company') return;
  let saved = {};
  try { saved = JSON.parse(window.localStorage.getItem('niv-panel-sections') || '{}'); } catch (_) {}
  document.querySelectorAll('#mod-lists .niv-panel-sec').forEach((sec) => {
    const key = sec.getAttribute('data-seckey');
    const title = sec.querySelector('.niv-panel-sec-title');
    const chev = sec.querySelector('[data-chev]');
    const sync = () => {
      const collapsed = sec.classList.contains('sec-collapsed');
      if (key === 'projects') {
        const body = document.getElementById('niv-snav-projects-body');
        if (body) body.classList.toggle('open', !collapsed);
      }
      if (chev) {
        chev.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        chev.setAttribute('aria-label', L(collapsed ? 'expandSection' : 'collapseSection'));
      }
    };
    if (saved[key]) sec.classList.add('sec-collapsed');
    sync();
    const toggle = () => {
      sec.classList.toggle('sec-collapsed');
      saved[key] = sec.classList.contains('sec-collapsed');
      try { window.localStorage.setItem('niv-panel-sections', JSON.stringify(saved)); } catch (_) {}
      sync();
      reportHeight();
    };
    if (chev) chev.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    if (title) title.addEventListener('click', (e) => {
      if (e.target.closest('[data-chev]')) return;
      toggle();
    });
  });
}

let lastLists = null;
let demoListsOn = false;
function panelItems(names, emptyKey) {
  if (!names.length) return '<div class="niv-panel-empty">' + escapeHtml(L(emptyKey)) + '</div>';
  return names.map((n, i) =>
    '<div class="niv-panel-item' + (i === 0 ? ' first' : '') + '"><span>' + escapeHtml(n) + '</span><span class="dots">...</span></div>'
  ).join('');
}
function renderLists(data) {
  lastLists = data;
  const p = document.getElementById('niv-panel-projects');
  const c = document.getElementById('niv-panel-customers');
  const m = document.getElementById('niv-panel-measures');
  if (p) p.innerHTML = panelItems(data.projects || [], 'emptyProjects');
  if (c) c.innerHTML = panelItems(data.customers || [], 'emptyCustomers');
  if (m) m.innerHTML = panelItems((data.measures || []).map((j) => (j.label || L('measureFallback')) + (j.photo ? ' 📷' : '')), 'emptyMeasures');
  reportHeight();
}
function renderDemoLists() {
  renderLists({
    projects: [L('demoProject')],
    customers: [L('demoCustomer')],
    measures: [{ label: L('demoMeasure'), photo: false }]
  });
}
/* Same data sources as the dashboard panel: orgs/{orgId}/projects for
   the projects list, orgs/{orgId}/jobs (newest first) feeding the
   unique customers list (max 5) and the recent measures list (max 5).
   List rows are display only in this module: no project or measure
   deep link exists at base, so opening items stays with the shell. */
async function loadLists(db, fs, orgId) {
  if (!orgId) return;
  let projects = [];
  let jobs = [];
  try {
    const snap = await fs.getDocs(fs.collection(db, 'orgs', orgId, 'projects'));
    projects = snap.docs.map((d) => (d.data() && d.data().name) || L('projectFallback'));
  } catch (_) { /* empty state stays */ }
  try {
    const q = fs.query(fs.collection(db, 'orgs', orgId, 'jobs'), fs.orderBy('createdAt', 'desc'));
    const snap = await fs.getDocs(q);
    jobs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (_) { /* empty states stay */ }
  const customers = [...new Set(jobs.map((j) => j.customer).filter(Boolean))].slice(0, 5);
  const measures = jobs.slice(0, 5).map((j) => ({
    label: j.customer || j.project || L('measureFallback'),
    photo: !!j.annotatedPhoto
  }));
  renderLists({ projects, customers, measures });
}

function applyDemo() {
  if (TARGET === 'company') {
    /* Placeholder org on the external flow, with a pending update, so a
       single screenshot exercises the head, the Billing entry, the live
       sub label and the dot. The demo persona is a manager, so the
       manager gate renders its doors in demo mode. */
    renderManagerEntries();
    orgData = { name: L('demoCompany'), dataVersion: '1.0', flow: 'external' };
    renderCompanyHead();
    showBilling();
    setUpdatesState('pending');
    setActiveCompany('users');
    demoListsOn = true;
    renderDemoLists();
  } else {
    setActiveSection(params.get('section') || 'cuenta');
  }
  reportHeight();
}

/* Neutral skeleton head: signed out, Firebase unreachable, or auth
   still unresolved after the boot grace period. A later auth
   resolution re renders the head with real data. */
let authResolved = false;
function showSkeletonHead() {
  const nameEl = document.getElementById('org-name');
  if (nameEl) {
    nameEl.textContent = 'Nivelato';
    nameEl.removeAttribute('data-state');
  }
  const avatar = document.getElementById('org-avatar');
  if (avatar) avatar.textContent = 'N';
  reportHeight();
}

async function initFirebase() {
  const [{ auth, db }, authMod, fsMod] = await Promise.all([
    import('/firebase-config.js'),
    import('https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js')
  ]);
  const { onAuthStateChanged } = authMod;
  const { getDoc, doc } = fsMod;
  onAuthStateChanged(auth, async (user) => {
    authResolved = true;
    if (!user) {
      /* No signed in user: static skeleton only, no redirect, no error. */
      showSkeletonHead();
      return;
    }
    /* Flow signals, strongest first. Billing renders ONLY on a proven
       external flow: any qgi signal wins, and an undetermined flow hides
       Billing (fail closed for QGI). */
    let claimsFlow = null;
    let claimsRole = null;
    let userData = null;
    try {
      const res = await user.getIdTokenResult();
      claimsFlow = res && res.claims && res.claims.flow ? String(res.claims.flow) : null;
      claimsRole = res && res.claims && res.claims.role ? String(res.claims.role) : null;
    } catch (_) { /* claims unreadable: other signals may still resolve */ }
    try {
      /* Best effort claim minting, same as the sibling pages, so org
         reads gated on flow claims can succeed. Fails soft. */
      const geo = await import('/geo.js');
      await geo.ensureFlowClaims();
      const res2 = await user.getIdTokenResult();
      if (res2 && res2.claims && res2.claims.flow) claimsFlow = String(res2.claims.flow);
      if (res2 && res2.claims && res2.claims.role) claimsRole = String(res2.claims.role);
    } catch (_) { /* geo helper unavailable: continue with what we have */ }
    try {
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      userData = userSnap.exists() ? userSnap.data() : null;
    } catch (_) { /* skeleton stays */ }
    const orgId = userData && userData.orgId;
    if (orgId) {
      try {
        const orgSnap = await getDoc(doc(db, 'orgs', orgId));
        orgData = orgSnap.exists() ? orgSnap.data() : {};
      } catch (_) { orgData = orgData || {}; }
    }
    if (TARGET === 'company') {
      renderCompanyHead();
      /* Permission gate (see renderManagerEntries): the user doc is the
         primary source, claims.role the fallback, unknown stays shut. */
      let canManage = false;
      try {
        const permsMod = await import('/permissions.js');
        const src = userData || (claimsRole ? { role: claimsRole } : null);
        if (src) canManage = permsMod.makePermChecker(src)('userManagement') === true;
      } catch (_) { canManage = false; }
      if (canManage) renderManagerEntries();
      loadLists(db, fsMod, orgId);
      const qgiSignal = claimsFlow === 'qgi'
        || (orgData && orgData.flow === 'qgi')
        || (userData && (userData.isQGC === true || userData.company === 'qgc'))
        || (orgData && orgData.flow === undefined && orgId === 'NJBBG5');
      const externalSignal = claimsFlow === 'external' || (orgData && orgData.flow === 'external');
      if (!qgiSignal && externalSignal) showBilling();
      /* Updates sub label and dot: same reads and semantics as
         users.html renderUpdatesDot (app_updates/latest vs the org
         dataVersion, default 0.9). Manager gated, like the entry. */
      if (canManage) {
        try {
          const latestSnap = await getDoc(doc(db, 'app_updates', 'latest'));
          const latest = latestSnap.exists() ? latestSnap.data() : null;
          const pending = !!(latest && latest.version && dataVersion() !== String(latest.version));
          setUpdatesState(pending ? 'pending' : 'current');
        } catch (_) {
          setUpdatesState('unknown');
        }
      }
    }
    reportHeight();
  });
}

/* ---------------- boot ---------------- */
document.getElementById('org-name').setAttribute('data-state', 'loading');
/* updates-sub lives inside the manager gate template until the gate
   passes; its checking state is stamped when it is cloned in. */
applyLang();
initSections();
if (TARGET === 'company') {
  setActiveCompany(keyFromValue(params.get('active')) || inferActiveFromParent());
} else {
  setActiveSection(params.get('section') || 'cuenta');
}
post({ type: 'niv:ready', target: TARGET });
reportHeight();
window.addEventListener('resize', reportHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight).catch(() => {});
const card = document.querySelector('.niv-mod-side:not([hidden])');
if (card && window.ResizeObserver) new ResizeObserver(reportHeight).observe(card);

if (DEMO) {
  applyDemo();
} else if (TARGET === 'company') {
  initFirebase().catch(() => { showSkeletonHead(); });
  /* If the Firebase imports hang (offline, CDN blocked), the loading
     text must not stick forever: fall back to the neutral skeleton. */
  setTimeout(() => { if (!authResolved) showSkeletonHead(); }, 8000);
}
/* The user target never needs Firebase: it is pure in page navigation. */
</script>
</body>
</html>
